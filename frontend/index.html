        {DATA_PAGES.includes(page) && canApprove && !narrow && (
          <DataManagement meta={meta} who={who} subTab={page} onSubTab={(t) => setPage(t)} />
        )}
        {page === "config" && canApprove && !narrow && <ConfigPage meta={meta} who={who} access={role} />}
        {page === "users" && isAdmin && !narrow && <UsersPage access={role} />}
        {page === "map" && (
          <iframe src={MAP_URL} title="Public Route Map" className="w-full h-full border-0" />
        )}
      </main>
      {narrow && <PhoneTabs groups={visible} page={page} onPick={pickPage} moreOpen={moreOpen}
                            onMore={() => setMoreOpen(o => !o)} pending={canApprove ? pending : 0} />}
      {narrow && moreOpen && <PhoneMore groups={visible} page={page} onPick={pickPage} onClose={() => setMoreOpen(false)}
                                        role={role} who={who} pending={canApprove ? pending : 0} />}
      {/* H10: the coach-mark guide for this page; renders nothing unless TENANT.demo_notice is set.
          11 Oct 2026 (the demo bar): not on the Route map, whose embedded map runs its own guide (its strip under
          its bar, its dots, its tour). That was two "New here?" strips on one screen, and the app's guide there
          shared the map's localStorage key (wayscope_guide_map). */}
      {/* 14 Oct 2026: not over the big screen either — a TV on a wall has nobody to take a tour */}
      {/* 14 Oct 2026 (D9): not over a desk page's card on a phone (its steps point at controls that are not there) */}
      {page !== "map" && !phoneDesk && !(page === "dashboard" && wallOn) && <Guide page={page} groups={visible} phone={narrow} />}
    </div>
  );
}

// One vehicle <option>. Pulled out of Matrix so the planning group and the legacy
// group render identically — two copies of this markup would drift, and the disabled
// rule is the part that must not.
//
// Anything outside the material category's own list stays VISIBLE but disabled rather
// than vanishing, so a wrong saved value is obvious instead of silently swapped. The
// currently-selected vehicle is never disabled, or a line saved before a category's
// vehicle list changed could not be re-saved.
function vehOption(v, suggested, current){
  const fits = suggested.includes(v);
  // value = the canonical id, ALWAYS. Only the text follows the language toggle, and a
  // slot that fell back to the id is marked so a fallback is not mistaken for a
  // translation. 11 Oct 2026: English is the default now, and an id IS a name in English
  // (and in the European slot, whose strings were ids) — so only another language's
  // fallback is marked; until then English fallbacks were starred and European ones not.
  return <option key={v} value={v} disabled={!fits && v !== current}
    style={{ color: fits ? undefined : "#cbd5e1" }}>
    {vehLabel(v)}{vehIsFallback(v) && !["en", "eu"].includes(VEH.lang) ? " *" : ""}{fits ? "" : " · not used for this material"}
  </option>;
}

// ================================================================= Matrix
function Matrix({ meta, who, editTarget, vehLang, access, initialCost, initialTarget }){
  const { routes, materials, vehicles, units, months, factors,
          material_categories = {}, seasonal_restrictions = [],
          disciplines = [], work_sections = [], planning_vehicles = [] } = meta;

  // The planning vehicles (the country's lead list, else the document's own — in the
  // seed the six UK haulage trade names since 11 Oct 2026) lead every picker; the rest
  // stay below them. Kept as two lists rather than a re-ordered `vehicles`,
  // because every saved forecast and every baked route names a vehicle by string and
  // the full set has to remain complete. Defaults to empty, so an older /api/meta that
  // does not send planning_vehicles renders exactly the pre-2026-09-01 single list.
  const legacyVehicles = useMemo(
    () => vehicles.filter(v => !planning_vehicles.includes(v)), [vehicles, planning_vehicles]);

  const GUESS_TO_CAT = { "soil":"Earthworks / soil", "sand":"Small aggregate", "gravel":"Small aggregate",
    "limestone - rockfill":"Large aggregate / ballast", "limestone (shale aggregate)":"Small aggregate",
    "imported goods":"General / imported" };

  // ---- origin -> destination -> route reference ----
  const origins = useMemo(() => [...new Set(routes.map(r => r.origin).filter(Boolean))].sort(), [routes]);
  const [origin, setOrigin] = useState(origins[0] || "");
  const destsForOrigin = useMemo(
    () => [...new Set(routes.filter(r => r.origin === origin).map(r => r.dest).filter(Boolean))].sort(),
    [routes, origin]);
  const [dest, setDest] = useState("");
  useEffect(() => { if(!destsForOrigin.includes(dest)) setDest(destsForOrigin[0] || ""); }, [origin]);
  const matchingRoutes = useMemo(
    () => routes.filter(r => r.origin === origin && r.dest === dest), [routes, origin, dest]);
  const [routeId, setRouteId] = useState("");
  useEffect(() => { if(!matchingRoutes.some(r => r.route_id === routeId)) setRouteId(matchingRoutes[0]?.route_id || ""); }, [origin, dest]);
  const route = routes.find(r => r.route_id === routeId);

  // apply an "edit this submission" request from the Forecasts page
  useEffect(() => {
    if(!editTarget || !editTarget.routeId) return;
    const r = routes.find(x => x.route_id === editTarget.routeId);
    if(!r) return;
    setOrigin(r.origin || "");
    setDest(r.dest || "");
    setRouteId(editTarget.routeId);
    // Forecasts groups a line across every year it covers, so it hands back a
    // span. `year` is the first year and `toYear` the last; an older caller that sends
    // only `year` still opens that one year, which is what it used to do.
    if(editTarget.year){ setFromYear(editTarget.year); setToYear(editTarget.toYear || editTarget.year); }
    // carry the line keys across, or "Edit" would reopen the route on a different
    // discipline and the month cells would load from the wrong line
    if(editTarget.discipline !== undefined) setDiscipline(editTarget.discipline || "");
    if(editTarget.sectionId !== undefined) setSectionId(editTarget.sectionId || "");
  }, [editTarget]);

  // ---- material category + free-text detail ----
  const [material, setMaterial] = useState(materials[0] || "");
  const [description, setDescription] = useState("");
  const cat = material_categories[material] || {};
  const suggestedVehicles = (cat.vehicles && cat.vehicles.length) ? cat.vehicles : vehicles;
  const volumeOk = cat.volume_convertible !== false;
  // 15 Oct 2026: a category may name the only units its lines are typed in (steel: tonnes only); none = all three
  const catUnits = (Array.isArray(cat.units) && cat.units.length) ? cat.units : null;

  // ---- discipline + work section ----
  // Both belong on the LINE, not on the route or the location. A lorry of track ballast
  // delivering into a substructure section is still superstructure traffic; and sections
  // overlap, so a station can sit in a point section, a band and a corridor-wide row at once and no single
  // section can be inferred from the destination.
  const [discipline, setDiscipline] = useState("");
  const [sectionId, setSectionId] = useState("");
  // Task F: which team this line belongs to. Locked to the caller's team for a team code;
  // a planner must pick one — empty until they do, NEVER silently the first. Written on the
  // line and it is what decides who can see it afterwards.
  const iptLocked = !!(access && access.ipt_locked);
  const iptRequired = !!(access && access.ipt_required && !access.demo);
  const [ipt, setIpt] = useState((access && access.ipt) || "");
  const [siblings, setSiblings] = useState([]);   // other lines already on this route
  const [caution, setCaution] = useState(null);   // returned by the save

  // ---- vehicle (exactly one per line) ----
  // 29 Sep 2026 first look (GB demo): the material categories then listed the EU type-
  // approval entries FIRST (they left the seed on 11 Oct 2026), so the form defaulted to
  // a vehicle the tenant hides — and the picker then showed it as "current". A hidden
  // vehicle is never a default: take the first one the tenant shows; a saved line's own
  // value is still kept (vehShown keeps `current`).
  const firstShown = (list) => (list || []).find(v => !HIDDEN_VEHICLES.includes(v)) || (list || [])[0] || "";
  const [vehicle, setVehicle] = useState(firstShown(vehicles));
  const [unit, setUnit] = useState(units[0] || "m3");

  // ---- year RANGE, not a single year ----------------------------------------
  // One save now covers From year..To year. Nothing about the stored shape changed:
  // the UNIQUE key is still (tenant_id, route_id, month_index, discipline, section_id),
  // there is no `year` column, and MONTH_COUNT is still 60. month_index has always been
  // absolute — 1 = Jan of start_year — and /api/forecasts?route_id= has always returned
  // every month of it. Only the form was ever limited to twelve cells.
  //
  // Default is the CURRENT calendar year alone, falling back to the first year the
  // backend offers if today is outside the horizon (which it will be from 2031).
  const yearsAvail = months.years || [];
  const defaultYear = useMemo(() => {
    const now = new Date().getFullYear();
    return yearsAvail.includes(now) ? now : (yearsAvail[0] || months.start_year);
  }, [yearsAvail, months.start_year]);
  const [fromYear, setFromYear] = useState(defaultYear);
  const [toYear, setToYear] = useState(defaultYear);
  // to >= from, always. Enforced here as well as by the To dropdown only offering
  // years at or after From, because editTarget can set either one directly.
  useEffect(() => { setToYear(t => (t < fromYear ? fromYear : t)); }, [fromYear]);

  const yearsInRange = useMemo(() => {
    const out = [];
    for(let y = fromYear; y <= Math.max(fromYear, toYear); y++) out.push(y);
    return out;
  }, [fromYear, toYear]);

  // The absolute month_index window this form is editing. Everything — load, save,
  // totals, clear — is scoped to it, so narrowing the range cannot touch months
  // outside it and widening it cannot invent them.
  const mLo = (fromYear - months.start_year) * 12 + 1;
  const mHi = (Math.max(fromYear, toYear) - months.start_year) * 12 + 12;

  // vals is keyed by ABSOLUTE month_index now, not 1..12. With more than one year on
  // screen a relative key collides across years — Jan 2026 and Jan 2027 are both "1".
  const [vals, setVals] = useState({});
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);
  // 11 Sep pm: the price while you type. POST /api/costing/preview with the cells in
  // range, debounced, priced by the SAME functions the saved line will be priced with
  // (costlines.preview). Read-only; a failure blanks the strip and nothing else.
  // `initialCost` is for the render harness (no effect runs there).
  const [cost, setCost] = useState(initialCost || null);
  const [costErr, setCostErr] = useState("");
  // 11 Oct 2026: the scheme's carbon target, read once when the page opens (GET /api/carbon/target).
  // The carbon of the cells comes with the price (the preview's `carbon` block); nothing is
  // worked out here. A failure just leaves the line out.
  const [ct, setCt] = useState(initialTarget || null);
  useEffect(() => {
    if(initialTarget) return;
    let live = true;
    fetch(`${API}/carbon/target`).then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(j => { if(live) setCt(j); }).catch(() => {});
    return () => { live = false; };
  }, []);

  // default the category from the route's material guess when the route resolves.
  // /api/meta now normalises material_guess to a factors.json category server-side, so
  // the value usually arrives already correct; the lookup stays for anything that does not.
  useEffect(() => {
    if(!route) return;
    const raw = (route.material_guess || "").trim();
    if(materials.includes(raw)){ setMaterial(raw); return; }
    const c = GUESS_TO_CAT[raw.toLowerCase()];
    if(c && materials.includes(c)) setMaterial(c);
  }, [routeId]);

  // category change -> sensible default unit + primary vehicle
  useEffect(() => {
    setUnit(u => ((u === "m3" && !volumeOk) || (catUnits && !catUnits.includes(u))) ? (cat.default_unit || (catUnits || ["t"])[0]) : u);
    setVehicle(v => suggestedVehicles.includes(v) ? v : (firstShown(suggestedVehicles) || v));
  }, [material]);

  // Material categories the chosen discipline actually moves. Advisory, not enforced --
  // the discipline-to-category join is many-to-many and deliberately permissive, and a
  // real delivery that does not fit the seed should be recordable, not blocked.
  const disciplineCats = useMemo(() => {
    const d = (disciplines || []).find(x => x.id === discipline);
    return (d && d.materials) ? d.materials : null;
  }, [discipline, disciplines]);
  const materialFitsDiscipline = !discipline || !disciplineCats
    || disciplineCats.includes(material);

  // when the destination has a default section recorded, offer it as a starting point.
  // It is a pre-fill and nothing more: sections overlap, so the destination cannot know
  // which one a given delivery is for.
  useEffect(() => {
    if(!route || sectionId) return;
    const d = (routes || []).find(r => r.route_id === routeId);
    if(d && d.default_section_id) setSectionId(d.default_section_id);
  }, [routeId]);

  // load saved cells for route+year
  useEffect(() => {
    let live = true;
    if(!routeId){ setVals({}); return; }
    // scoped to this route — this reloads on every route, year, discipline AND section
    // change, and it used to pull the whole forecasts table each time
    fetch(`${API}/forecasts?route_id=${encodeURIComponent(routeId)}`).then(r => r.json()).then(rows => {
      if(!live) return;
      // a route can now carry several lines in the same months, so the cells loaded are
      // the ones for THIS discipline and section, not every row on the route — and
      // every month inside the year RANGE, not one year's twelve
      const mine = rows.filter(x => x.route_id === routeId
        && (x.discipline || "") === discipline
        && (x.section_id || "") === sectionId
        && x.month_index >= mLo && x.month_index <= mHi);
      const next = {};
      mine.forEach(x => { next[x.month_index] = String(x.quantity); });
      setVals(next);
      const first = mine[0];
      if(first){
        if(first.ipt && !iptLocked) setIpt(first.ipt);
        if(first.unit) setUnit(first.unit);
        if(first.material_type && materials.includes(first.material_type)) setMaterial(first.material_type);
        if(first.vehicle_type) setVehicle(first.vehicle_type);
        setDescription(first.material_description || "");
      }
      // other lines already on this route, so a submitter can see them before adding one more
      setSiblings(rows
        .filter(x => x.route_id === routeId
          && !((x.discipline || "") === discipline && (x.section_id || "") === sectionId))
        .reduce((acc, x) => {
          const k = `${x.discipline || ""}|${x.section_id || ""}`;
          if(!acc.some(a => a.k === k)) acc.push({
            k, discipline: x.discipline || "", section_id: x.section_id || "",
            vehicle: x.vehicle_type, submitted_by: x.submitted_by,
          });
          return acc;
        }, []));
    }).catch(() => {});
    return () => { live = false; };
  }, [routeId, fromYear, toYear, discipline, sectionId]);

  const setMonth = (mi, v) => setVals(s => ({ ...s, [mi]: v }));

  // Only the cells inside the current window count. vals is replaced wholesale by the
  // load effect whenever the range moves, so a stale key should never survive — but
  // every total, the save and the seasonal check filter anyway, because a stale key
  // outside the range would be counted in a figure and then not written by the save.
  const inRange = useMemo(
    () => Object.entries(vals)
      .map(([mi, q]) => [+mi, q])
      .filter(([mi]) => mi >= mLo && mi <= mHi),
    [vals, mLo, mHi]);

  const cellsKey = JSON.stringify(inRange.filter(([, q]) => +q > 0));
  useEffect(() => {
    if(initialCost) return;
    if(!routeId || !vehicle || !inRange.some(([, q]) => +q > 0)){ setCost(null); return; }
    let live = true;
    const t = setTimeout(() => {
      fetch(`${API}/costing/preview`, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ route_id: routeId, vehicle_type: vehicle, material_type: material, unit,
                               cells: inRange.filter(([, q]) => +q > 0).map(([mi, q]) => ({ month_index: mi, quantity: +q })) }) })
        .then(r => r.ok ? r.json() : Promise.reject(r.status))
        .then(j => { if(live){ setCost(j); setCostErr(""); } })
        .catch(e => { if(live){ setCost(null); setCostErr(`Couldn't price these cells (${e}).`); } });
    }, 400);
    return () => { live = false; clearTimeout(t); };
  }, [routeId, vehicle, material, unit, cellsKey]);
  const costCell = useMemo(() => { const m = {}; ((cost && cost.cells) || []).forEach(c => m[c.month_index] = c); return m; }, [cost]);

  // One vehicle per line since Phase 2. A load split across two vehicle types is two
  // lines now, which the widened forecasts key makes storable. The old blended payload
  // averaged two haul cycles that are not close -- an Artic Flatbed turns round in 45
  // minutes against a Tipper's 24 -- and hid that inside a single number.
  const effPayload = payload(factors, vehicle);
  const allowedUnits = units.filter(u => (u !== "m3" || volumeOk) && (!catUnits || catUnits.includes(u)));

  // Totals run across the WHOLE range, not one year — the brief's requirement and the
  // only reading that makes sense once a save can cover 2026-2027.
  const totalUnit = inRange.reduce((a, [, q]) => a + (+q || 0), 0);
  const totalT = inRange.reduce((a, [, q]) => a + toTonnes(q, unit, material, vehicle, factors), 0);
  const totalVeh = totalT / (effPayload || 1);

  // Daily rates. A year total tells you nothing about whether a site gate can cope;
  // the peak month divided by working days is the number that sizes the fleet.
  const perDay = useMemo(() => {
    const wd = (factors.planning && factors.planning.working_days_per_month) || 22;
    // Still per WORKING month, and now over the whole range — the average is across
    // the months actually entered, not across every month the range spans. A range of
    // 2026-2030 with three months filled in must not report a twelfth of the traffic.
    //
    // 2026-09-02, §3 of the feedback: six figures, all per working day, all across the
    // selected year range, all over months-with-qty:
    //   vehicles/day  = vehicle-loads (tonnes ÷ payload)   avg and peak month
    //   trips/day     = the same figure. On ONE line with ONE vehicle a trip IS a
    //                   vehicle-load, whatever unit the line was typed in — t and m³
    //                   both convert via the payload, exactly as the brief says. The
    //                   two only diverge on the dashboard, where lines mix vehicles.
    //   material/day  = the typed quantity in the CHOSEN unit, avg and peak month
    const months = inRange.filter(([, q]) => +q > 0);
    if(!months.length || wd <= 0) return { avgT:0, peakT:0, avgVeh:0, peakVeh:0,
      avgTrips:0, peakTrips:0, avgQty:0, peakQty:0, months:0, wd };
    const monthlyT = months.map(([, q]) => toTonnes(q, unit, material, vehicle, factors));
    const monthlyQ = months.map(([, q]) => +q);
    const sum = (a) => a.reduce((x, y) => x + y, 0);
    const avgT = (sum(monthlyT) / months.length) / wd;
    const peakT = Math.max(...monthlyT) / wd;
    const p = effPayload || 1;
    const avgVeh = avgT / p, peakVeh = peakT / p;
    return { avgT, peakT, avgVeh, peakVeh,
      avgTrips: avgVeh, peakTrips: peakVeh,
      avgQty: (sum(monthlyQ) / months.length) / wd, peakQty: Math.max(...monthlyQ) / wd,
      months: months.length, wd };
  }, [inRange, unit, material, vehicle, factors, effPayload]);

  const warnings = useMemo(() => {
    // seasonal_restrictions.months are CALENDAR months 1-12. month_index is absolute,
    // so it has to be folded back — ((mi - 1) % 12) + 1. Reading an absolute index as
    // a calendar month would put Jan 2027 (13) outside every window silently.
    const entered = new Set(inRange.filter(([, q]) => +q > 0).map(([mi]) => ((mi - 1) % 12) + 1));
    return (seasonal_restrictions || [])
      .filter(w => (w.months || []).some(m => entered.has(m)))
      .map(w => {
        const rv = w.restricted_vehicles || [];
        return (rv.length === 0 || rv.includes(vehicle)) ? w.message : null;
      })
      .filter(Boolean);
  }, [inRange, vehicle, seasonal_restrictions]);

  const rangeLabel = fromYear === toYear ? String(fromYear) : `${fromYear}–${toYear}`;

  // ⭐ 2026-09-03 — how many MOVEMENTS one VEHICLE can make per day on THIS route, for
  // THIS vehicle: the baked HERE cycle (laden out, unload, empty back, load), from
  // /api/routes/{id}/analysis — the same figure the dashboard and the map use, so the
  // three surfaces cannot disagree. null = not baked for this vehicle, and the strip
  // then says "not baked" rather than a fleet size.
  const [tripsPerVehicleDay, setTpv] = useState(null);
  useEffect(() => {
    let live = true;
    setTpv(null);
    if(!routeId || !vehicle) return;
    fetch(`${API}/routes/${encodeURIComponent(routeId)}/analysis?profile=${encodeURIComponent(vehicle)}`)
      .then(r => r.ok ? r.json() : null)
      .then(j => {
        if(!live || !j) return;
        const row = (j.rows || []).find(x => x.alt_index === 0 && x.profile === vehicle);
        setTpv(row && row.trips_per_day > 0 ? row.trips_per_day : null);
      }).catch(() => {});
    return () => { live = false; };
  }, [routeId, vehicle]);
  // vehicles needed = movements/day ÷ movements one vehicle can make, rounded UP
  const fleetOf = (movesPerDay) => (tripsPerVehicleDay > 0 ? Math.ceil(movesPerDay / tripsPerVehicleDay) : null);

  const save = () => {
    if(!routeId){ setMsg({ ok: false, text: "Pick an origin and destination that map to a route first." }); return; }
    if(iptRequired && !ipt){ setMsg({ ok: false, text: `Pick which ${TEAM().toLowerCase()} this line belongs to before saving.` }); return; }
    setBusy(true); setMsg(null); setCaution(null);
    // ONE POST for the whole range. The backend upserts a cell with a quantity and
    // DELETES one at zero, both on the full widened key, so an emptied month inside
    // the range is cleared and a month outside the range is never mentioned and
    // therefore never touched. Narrowing the range cannot delete another year.
    const cells = [];
    for(let mi = mLo; mi <= mHi; mi++) cells.push({ month_index: mi, quantity: +vals[mi] || 0 });
    fetch(`${API}/forecasts/bulk`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        route_id: routeId, discipline, section_id: sectionId,
        material_type: material, material_description: description || null,
        vehicle_type: vehicle, submitted_by: who || null,
        unit, cells, status: "Pending",
        // the server forces this to the caller's IPT for an IPT code regardless
        ipt: (iptLocked ? access.ipt : ipt) || null,
      }),
    })
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(j => {
        setMsg({ ok: true, text: `Saved ${rangeLabel} forecast for ${routeId}${discipline ? ` · ${discipline}` : ""}. Sent for approval.` });
        // not an error — two disciplines on one route is the case the taxonomy exists
        // for — but two people filling this in separately can double-count the same
        // lorries without ever seeing each other's line
        setCaution(j && j.caution ? j.caution : null);
      })
      .catch(e => setMsg({ ok: false, text: `Couldn't save (${e}). Try again.` }))
      .finally(() => setBusy(false));
  };
  // Clears only what is on screen. With a range open, wiping vals outright would also
  // discard nothing visible — but the name mattered when it said "year", and a future
  // caller that keeps out-of-range keys would silently lose them.
  const clearRange = () => setVals(s => {
    const next = { ...s };
    for(let mi = mLo; mi <= mHi; mi++) delete next[mi];
    return next;
  });

  return (
    <div className="max-w-7xl mx-auto p-5">
      <PageHeader title="Submit forecast"
        subtitle="Choose where the material moves from and to — the route reference fills in automatically. One vehicle per line; a split across two vehicles is two lines." />

      <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-4">
        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
          <Field label="Origin">
            <select value={origin} onChange={e => setOrigin(e.target.value)} className={selCls}>
              {origins.map(o => <option key={o}>{o}</option>)}
            </select>
          </Field>
          <Field label="Destination">
            <select value={dest} onChange={e => setDest(e.target.value)} className={selCls}>
              {destsForOrigin.map(d => <option key={d}>{d}</option>)}
            </select>
          </Field>
          <Field label="Route reference">
            {matchingRoutes.length > 1 ? (
              <select value={routeId} onChange={e => setRouteId(e.target.value)} className={selCls}>
                {matchingRoutes.map(r => <option key={r.route_id} value={r.route_id}>{r.route_id}{r.ipt ? ` · ${teamText(r.ipt)}` : ""}</option>)}
              </select>
            ) : (
              <div className="px-3 py-2 rounded-lg bg-slate-50 border border-slate-200 text-sm font-medium text-slate-700 truncate">
                {routeId || <span className="text-slate-400">No route for this pair</span>}
              </div>
            )}
          </Field>
        </div>
        {route ? (
          <p className="text-xs text-slate-400 -mt-1">
            {teamText(route.ipt) || "—"}
            {route.distance_km != null
              ? <> · {fmtDist(route.distance_km, 1)} {DU()} one-way{route.distance_profile ? ` (${vehShort(route.distance_profile)})` : ""}</>
              : <span style={{color:"var(--red)"}}> · not routed yet, so no distance</span>}
          </p>
        ) : null}

        {/* Discipline and section sit on the LINE. Ballast to a substructure section is
            still superstructure traffic, and sections overlap, so neither can be derived
            from the route or the destination. */}
        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
          <Field label={iptRequired ? `${TEAM()} (required)` : TEAM()}>
            {iptLocked ? (
              <div className="px-3 py-2 rounded-lg bg-slate-50 border border-slate-200 text-sm font-medium text-slate-700"
                title={`Your access code is for this ${TEAM().toLowerCase()}. Every line you save belongs to it.`}>
                {teamName(access.ipt)} <span className="text-slate-400 font-normal">· your {TEAM().toLowerCase()}</span>
              </div>
            ) : (
              <select value={ipt} onChange={e => setIpt(e.target.value)} className={selCls}>
                <option value="">— pick a {TEAM().toLowerCase()} —</option>
                {((access && access.ipts) || Object.keys(TEAM_LABELS)).map(i => (
                  <option key={i} value={i}>{teamName(i)}</option>
                ))}
              </select>
            )}
          </Field>
          <Field label="Discipline">
            <select value={discipline} onChange={e => setDiscipline(e.target.value)} className={selCls}>
              <option value="">— unassigned —</option>
              {disciplines.map(d => <option key={d.id} value={d.id}>{d.label}</option>)}
            </select>
          </Field>
          <Field label="Work section">
            {work_sections.length ? (
              <select value={sectionId} onChange={e => setSectionId(e.target.value)} className={selCls}>
                <option value="">— unassigned —</option>
                {work_sections.map(s => (
                  <option key={s.section_id} value={s.section_id}>
                    {s.section_id}{s.name ? ` · ${s.name}` : ""}
                  </option>
                ))}
              </select>
            ) : (
              <div className="px-3 py-2 rounded-lg bg-slate-50 border border-slate-200 text-sm text-slate-400 truncate"
                title="Work sections are not seeded yet — their key space is still being settled against the scope document">
                Not configured yet
              </div>
            )}
          </Field>
        </div>

        {!materialFitsDiscipline && (
          <div className="rounded-lg border border-amber-300 bg-amber-50 p-2.5 text-xs text-amber-800">
            {material} isn't a material normally moved by {discipline}. That may well be
            right — this is advisory, not a rule — but check it is the discipline you meant.
          </div>
        )}

        {siblings.length > 0 && (
          <div className="rounded-lg border border-slate-200 bg-slate-50 p-2.5 text-xs text-slate-600">
            <span className="font-semibold">This route already carries {siblings.length} other forecast line{siblings.length > 1 ? "s" : ""}:</span>{" "}
            {siblings.map(s => `${s.discipline || "unassigned"}${s.section_id ? " / " + s.section_id : ""}${s.submitted_by ? " (" + teamText(s.submitted_by) + ")" : ""}`).join(" · ")}.
            {" "}Different disciplines on one route are expected — just make sure you aren't counting the same lorries twice.
          </div>
        )}

        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <Field label="Material category">
            <select value={material} onChange={e => setMaterial(e.target.value)} className={selCls}>
              {materials.map(m => <option key={m}>{m}</option>)}
            </select>
          </Field>
          <Field label="Material description (optional)">
            <input value={description} onChange={e => setDescription(e.target.value)}
              placeholder="e.g. MOT Type 1 sub-base" className={selCls} />
          </Field>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <Field label="Vehicle">
            {/* Restricted to the vehicles this material category is actually carried in.
                factors.json has carried that list all along — it was only being used to
                pick a DEFAULT, while the dropdown still offered every vehicle, so an
                Artic Flatbed could be chosen for aggregates. Anything outside the list
                stays visible but disabled rather than vanishing, so a wrong saved value
                is obvious instead of silently swapped. */}
            <select value={vehicle} onChange={e => setVehicle(e.target.value)} className={selCls}>
              {planning_vehicles.length > 0 && (
                <optgroup label="Planning vehicles">
                  {planning_vehicles.filter(v => vehShown(v, vehicle)).map(v => vehOption(v, suggestedVehicles, vehicle))}
                </optgroup>
              )}
              {planning_vehicles.length > 0 ? (
                <optgroup label="Other vehicles">
                  {legacyVehicles.filter(v => vehShown(v, vehicle)).map(v => vehOption(v, suggestedVehicles, vehicle))}
                </optgroup>
              ) : vehicles.filter(v => vehShown(v, vehicle)).map(v => vehOption(v, suggestedVehicles, vehicle))}
            </select>
          </Field>
          <Field label="Input unit">
            <select value={unit} onChange={e => setUnit(e.target.value)} className={selCls}>
              {allowedUnits.map(u => <option key={u} value={u}>{u === "m3" ? "m³" : u === "t" ? "tonnes" : "vehicles"}</option>)}
            </select>
          </Field>
        </div>

        <p className="text-[11px] text-slate-400 -mt-1">
          One vehicle per line. If a haul genuinely splits across two vehicle types, save
          it as two lines — that keeps each one's real cycle time, which a blended payload
          used to hide (an Artic Flatbed turns round in 45 minutes, a Tipper in 24).
        </p>

        {/* From year / To year. One save covers the whole range — see the save()
            comment for why widening or narrowing it cannot touch another year's
            months. The To list only offers years at or after From, so `to >= from`
            cannot be entered; the effect above enforces it for programmatic sets. */}
        <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
          <Field label="From year">
            <select value={fromYear} onChange={e => setFromYear(+e.target.value)} className={selCls}>
              {yearsAvail.map(y => <option key={y} value={y}>{y}</option>)}
            </select>
          </Field>
          <Field label="To year">
            <select value={toYear} onChange={e => setToYear(+e.target.value)} className={selCls}>
              {yearsAvail.filter(y => y >= fromYear).map(y => <option key={y} value={y}>{y}</option>)}
            </select>
          </Field>
          <div className="col-span-2 md:col-span-3 self-end text-[11px] text-slate-400 pb-2">
            {yearsInRange.length} year{yearsInRange.length === 1 ? "" : "s"} ·{" "}
            {mHi - mLo + 1} months in one save. Months left blank are cleared.
          </div>
        </div>

        {/* One labelled twelve-cell row per year in the range. The cells are keyed by
            ABSOLUTE month_index — Jan 2026 is 1 and Jan 2027 is 13 — because a
            relative 1..12 key collides between years. */}
        <div className="space-y-4">
          {yearsInRange.map(y => {
            const base = (y - months.start_year) * 12;
            return (
              <div key={y}>
                <div className="flex items-baseline gap-2 mb-1.5">
                  <span className="text-xs font-semibold text-[color:var(--navy-deep)] tabular-nums">{y}</span>
                  <span className="flex-1 border-t border-slate-100" />
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
                  {MONTHS.map((mn, i) => {
                    const mi = base + i + 1;
                    return (
                      <label key={mn} className="block">
                        <span className="block text-sm font-medium text-slate-700 mb-1">{mn}</span>
                        <input type="number" min="0" inputMode="decimal"
                          value={vals[mi] ?? ""} onChange={e => setMonth(mi, e.target.value)} placeholder="0"
                          className="mt-1 w-full border border-slate-300 rounded-lg px-2.5 py-2 outline-none focus:ring-2 focus:ring-[color:var(--blue)]" />
                        {/* the model's fair € for this cell, from the preview read — never computed here */}
                        {costCell[mi] && costCell[mi].fair && costCell[mi].fair.eur != null && (
                          <span className="block mt-0.5 text-[10px] tabular-nums" style={{ color: "var(--navy)" }} data-cell-fair="1"
                                title={`fair ${CUR()} (model): ${unitTriple(costCell[mi].fair)} · ${grp(costCell[mi].trips)} trips${(costCell[mi].fair.flags || []).includes("WINTER") ? " · winter" : ""}${(costCell[mi].fair.flags || []).includes("THAW") ? " · thaw restrictions may apply" : ""}${costCell[mi].planned && costCell[mi].planned.eur != null ? ` · ${costCell[mi].planned.source === "target" ? "target" : "quote"} ${CUR()} ${grp(costCell[mi].planned.eur)}` : ""}`}>
                            fair {CUR()} {grp(costCell[mi].fair.eur)}{(costCell[mi].fair.flags || []).includes("WINTER") ? <span className="text-slate-400"> · w</span> : null}
                          </span>)}
                      </label>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>

        {warnings.length > 0 && (
          <div className="rounded-lg border border-amber-300 bg-amber-50 p-3 text-sm text-amber-800 space-y-1">
            {warnings.map((w, i) => <div key={i}>⚠ {w}</div>)}
          </div>
        )}

        {/* The range strip. Totals first, then the six per-working-day cards the
            2026-09-02 feedback asks for: avg and peak of vehicles, trips and material.
            Per WORKING day (factors.planning.working_days_per_month), across the
            selected range, averaged over the months actually entered — a 2026-2030
            range with three months filled in must not report a twelfth of the traffic.
            Peak = the single busiest month ÷ working days; that is what sizes a fleet
            and a site gate, and a range total hides it. */}
        <div className="rounded-lg border border-slate-200 overflow-hidden text-sm">
          <div className="bg-slate-50 p-4 flex flex-wrap gap-x-8 gap-y-2 border-b border-slate-200">
            <Stat label={`${fromYear === toYear ? "Year" : "Range"} total · ${rangeLabel} (${unit === "m3" ? "m³" : unit})`}
              value={fmt(totalUnit, unit)} />
            <Stat label="≈ tonnes" value={fmt(totalT, "t")} />
            <Stat label="≈ vehicle loads" value={fmt(totalVeh, "vehicles")} tone="var(--navy)" />
            <span className="text-xs text-slate-400 self-center">
              {volumeOk ? `${density(factors, material)} t/m³ · ` : ""}
              {`${payload(factors, vehicle)} t/load · ${vehLabel(vehicle)}`}
              {` · ${perDay.wd} working days/month · ${perDay.months} month${perDay.months === 1 ? "" : "s"} with a figure`}
            </span>
          </div>
          <div className="grid grid-cols-2 md:grid-cols-6 divide-x divide-slate-200 text-white kpi-num" style={{ background: "var(--navy)" }}>
            {/* Movements = loads per working day. Vehicles needed = movements ÷ what one
                vehicle can do per day on this route (the baked cycle), rounded up. The
                second is a property of the ROUTE, which is why it reads "not baked"
                until HERE geometry exists for this vehicle. */}
            {[
              ["Avg movements / day",  fmt(perDay.avgTrips, "vehicles")],
              ["Peak movements / day", fmt(perDay.peakTrips, "vehicles")],
              ["Vehicles needed (avg)",  fleetOf(perDay.avgTrips) == null ? "not routed" : String(fleetOf(perDay.avgTrips))],
              ["Vehicles needed (peak)", fleetOf(perDay.peakTrips) == null ? "not routed" : String(fleetOf(perDay.peakTrips))],
              [`Avg ${unit === "m3" ? "m³" : unit === "t" ? "t" : "loads"} / day`,  fmt(perDay.avgQty, unit)],
              [`Peak ${unit === "m3" ? "m³" : unit === "t" ? "t" : "loads"} / day`, fmt(perDay.peakQty, unit)],
            ].map(([label, value]) => (
              <div key={label} className="px-3 py-2.5">
                <div className="text-[10px] uppercase tracking-wide">{label}</div>
                {/* 17 Oct 2026 (UI audit, decision 3): the peak values read in the strip's own text colour — the amber on the
                    strip was 1.62:1 (1.39:1 in the dark look) and the label already says Peak */}
                <div className="text-lg font-bold tabular-nums">{value}</div>
              </div>
            ))}
          </div>
          {/* 11 Sep pm: the price of what is typed — fair (the model) and planned (quote / target),
              in {CUR()} · {CUR()}/t · {CUR()}/trip · {CUR()}/km, from POST /api/costing/preview. The submitter sees
              the same figures the Look-ahead and the Dashboard will show once this is saved. */}
          <div className="px-4 py-3 bg-white border-t border-slate-200 flex flex-wrap gap-x-8 gap-y-2 items-start" data-cost-strip="1">
            {cost && cost.totals && cost.totals.fair && cost.totals.fair.eur != null ? <>
              <Stat label={`Fair ${CUR()} (model) · range`} value={`${CUR()} ` + grp(cost.totals.fair.eur)} tone="var(--navy)" />
              <Stat label={`fair ${CUR()} / t`} value={`${CUR()} ` + (+cost.totals.fair.per_t).toFixed(2)} />
              <Stat label={`fair ${CUR()} / trip`} value={cost.totals.fair.per_trip == null ? "—" : `${CUR()} ` + grp(cost.totals.fair.per_trip)} />
              <Stat label={`fair ${CUR()} / ${DU()}`} value={cost.totals.fair.per_km == null ? "—" : `${CUR()} ` + (+distRate(cost.totals.fair.per_km)).toFixed(2)} />
            </> : <Stat label={`Fair ${CUR()} (model)`} value="—" />}
            {cost && cost.totals && cost.totals.planned && cost.totals.planned.eur != null
              ? <Stat label={`Planned ${CUR()} · ${cost.totals.planned_source === "target" ? "target rate" : "route quote"}`} value={`${CUR()} ` + grp(cost.totals.planned.eur)} />
              : <Stat label={`Planned ${CUR()}`} value="rate not set" />}
            <span className="text-xs text-slate-400 self-center">
              {costErr ? <span style={{ color: "var(--red)" }}>{costErr}</span>
               : !cost ? "type a quantity to see the price"
               : cost.fair_reason === "not baked" ? <span className="text-amber-700">no fair price — this route is not routed for {vehLabel(vehicle)}; route it on Data → Routes</span>
               : cost.fair_reason === "no diesel index" ? <span className="text-amber-700">no fair price — the diesel index is unavailable (Config → Costing · fuel)</span>
               : cost.fair_reason ? `no fair price — ${cost.fair_reason}`
               : `the cost model on Config → Costing · fuel at diesel ${CUR()}${cost.index_eur_per_l != null ? (+cost.index_eur_per_l).toFixed(3) : "—"}/L${(cost.totals.fair_flags || []).includes("WINTER") ? " · winter months +fuel" : ""} · a floor for negotiation, never a quote · fair ${CUR()} under each cell`}
            </span>
            {/* 11 Oct 2026: the carbon of the cells (the server's, with its parts) and the scheme's target */}
            {cost && cost.carbon && (() => {
              const c = cost.carbon;
              const parts = [["material", c.material_t], ["transport", c.transport_t], ["waste disposal", c.disposal_t]]
                .filter(([, v]) => v != null).map(([k, v]) => `${k} ${ctT(v)}`);
              return (
                <div className="w-full ct-line" data-carbon-cells="1" title={c.basis || undefined}>
                  Carbon of these cells: <b>{ctT(c.total_t)} tCO2e</b>{parts.length ? ` (${parts.join(" · ")})` : ""}
                  {c.unrouted ? " · no route distance yet, so transport is not counted" : ""}
                </div>
              );
            })()}
            {ct && <div className="w-full ct-line" data-carbon-target={ctOk(ct) ? "set" : "none"}>{ctCellsTarget(ct)}</div>}
            {ct && ctOk(ct) && ct.status.invalid && <div className="w-full ct-note">{ct.status.invalid}</div>}
          </div>
          <div className="px-3 py-1.5 text-[10.5px] text-slate-400 bg-white">
            Movements = loads per working day ({perDay.wd}/month). Vehicles needed = movements ÷{" "}
            {tripsPerVehicleDay > 0
              ? <>the <strong>{tripsPerVehicleDay}</strong> movements one {vehLabel(vehicle)} can make per day on this route (routed cycle), rounded up.</>
              : <>what one vehicle can do per day on this route — <strong>not routed yet for {vehLabel(vehicle)}</strong>, so no fleet size can be given.</>}
          </div>
        </div>

        <div className="flex items-center gap-3">
          <button onClick={save} disabled={busy || !routeId}
            className="px-5 py-2.5 rounded-lg text-white font-semibold disabled:opacity-50 transition"
            style={{background:"var(--navy)"}}>
            {busy ? "Saving…" : "Save & send for approval"}
          </button>
          <button onClick={clearRange} className="px-4 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 text-sm">
            {fromYear === toYear ? "Clear year" : `Clear ${rangeLabel}`}
          </button>
          {msg && <span className="text-sm font-medium" style={{color: msg.ok ? "var(--ok-text)" : "var(--red)"}}>{msg.text}</span>}
        </div>

        {caution && (
          <div className="rounded-lg border border-amber-300 bg-amber-50 p-3 text-sm text-amber-800">
            <div className="font-semibold">{caution.message}</div>
            <ul className="mt-1 space-y-0.5 text-xs">
              {(caution.lines || []).map((l, i) => (
                <li key={i}>
                  {l.discipline}{l.section_id && l.section_id !== "(unassigned)" ? ` / ${l.section_id}` : ""}
                  {" — "}{l.months} month{l.months === 1 ? "" : "s"}
                  {l.submitted_by ? `, submitted by ${teamText(l.submitted_by)}` : ""}
                </li>
              ))}
            </ul>
            <div className="mt-1 text-xs">Your forecast was saved. This is a heads-up, not an error.</div>
          </div>
        )}
      </div>
    </div>
  );
}

// ================================================================= Forecasts (2.5b)
//
// My submissions and Approvals, merged into one page. One list of forecast LINES — a route, a
// discipline, a section, one vehicle, across every year it covers — already filtered on
// the server by the caller's access code (Task F), so an IPT user sees its IPT's lines
// and a planner sees everyone's. What each person can DO to a line is what differs:
//   anyone     edit (reopens it in Submit forecast), withdraw their own
//   planner    approve / reject inline, withdraw anyone's
// Grouped per line, NOT per line-and-year (a multi-year save is one submission), and
// withdraw is scoped to the months the row actually shows.
function Forecasts({ meta, who, access, onEdit, onChanged, initialCost, initialRows, initialTarget }){
  const { routes, months } = meta;
  const routeById = useMemo(() => Object.fromEntries(routes.map(r => [r.route_id, r])), [routes]);
  const canApprove = !!(access && access.can_approve);
  const [rows, setRows] = useState(initialRows || null);     // initialRows / initialCost / initialTarget: the render harness only
  const [cost, setCost] = useState(initialCost || null);       // 11 Sep: /api/costing/lines, joined per line
  const [ct, setCt] = useState(initialTarget || null);         // 11 Oct 2026: the carbon target (GET /api/carbon/target)
  const [ctErr, setCtErr] = useState(false);
  const [err, setErr] = useState(false);
  const [tick, setTick] = useState(0);
  const [busy, setBusy] = useState("");
  const [f, setF] = useState({ status: "ALL", ipt: "ALL", discipline: "ALL", mine: false, q: "" });
  const [sort, setSort] = useState({ key: "quantity", dir: "desc" });   // 10 Oct: the one visible sort
  const [unitSel, setUnitSel] = useUnits("forecasts");     // 13 Oct 2026 (W6): the Total column's Loads | Tonnes | Lorries
  const [rowOpen, rowToggle] = useRowOpen("forecasts");

  useEffect(() => {
    let live = true;
    if(!initialRows) fetch(`${API}/forecasts`).then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(rs => { if(live){ setRows(rs); setErr(false); } })
      .catch(() => setErr(true));
    // the cost of every line, from the same functions the Look-ahead and the Dashboard
    // use — its own read, so a failure here never hides the list itself
    if(!initialCost){
      fetch(`${API}/costing/lines?status=All`).then(r => r.ok ? r.json() : Promise.reject(r.status))
        .then(j => { if(live) setCost(j); }).catch(() => { if(live) setCost({ lines: [], error: true }); });
    }
    return () => { live = false; };
  }, [tick]);
  // the carbon target: its own read, again after Refresh, Approve, Reject or Withdraw (they move
  // lines between pending and approved, which is what its figures are made of)
  useEffect(() => {
    if(initialTarget) return;
    let live = true;
    fetch(`${API}/carbon/target`).then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(j => { if(live){ setCt(j); setCtErr(false); } }).catch(() => { if(live) setCtErr(true); });
    return () => { live = false; };
  }, [tick]);

  // per LINE (route · discipline · section), summed over every month the line covers:
  // planned € (route rates or the target), fair € (the model), tonnes — and the same
  // per tonne / trip / km so lines quoted in different units still compare
  const costByLine = useMemo(() => {
    const m = {};
    ((cost && cost.lines) || []).forEach(r => {
      const key = [r.route_id, r.discipline || "", r.section_id || ""].join("|");
      const e = m[key] || (m[key] = { t: 0, trips: 0, bkm: 0, planned: null, fair: null, source: null, baked: 0, n: 0, flags: new Set(), peakVeh: null, limit: null });
      e.n += 1; e.t += r.tonnes || 0; e.trips += r.trips || 0; e.bkm += (r.basis_km || 0) * (r.trips || 0); if(r.baked) e.baked += 1;
      // 13 Oct 2026 (W6): the busiest month's lorries (the Lorries unit) and the ROAD LIMIT flag for the status column
      if(r.vehicles != null) e.peakVeh = Math.max(e.peakVeh || 0, r.vehicles);
      if(r.limit && !e.limit) e.limit = r.limit;
      if(r.planned && r.planned.eur != null){ e.planned = (e.planned || 0) + r.planned.eur; e.source = r.planned.source; }
      if(r.fair && r.fair.eur != null){ e.fair = (e.fair || 0) + r.fair.eur; (r.fair.flags || []).forEach(x => e.flags.add(x)); }
    });
    const per = (eur, e) => eur == null ? null : { eur, per_t: e.t > 0 ? eur / e.t : null, per_trip: e.trips > 0 ? eur / e.trips : null, per_km: e.bkm > 0 ? eur / e.bkm : null };
    Object.values(m).forEach(e => { e.plannedU = per(e.planned, e); e.fairU = per(e.fair, e); e.flags = [...e.flags]; });
    return m;
  }, [cost]);

  const groups = useMemo(() => {
    if(!rows) return [];
    const g = {};
    rows.forEach(r => {
      const disc = r.discipline || "", sect = r.section_id || "";
      const key = [r.route_id, disc, sect].join("|");
      const e = g[key] || (g[key] = {
        key, routeId: r.route_id, discipline: disc, sectionId: sect, ipt: r.ipt || "",
        statuses: new Set(), material: r.material_type, material_description: r.material_description,
        vehicle: r.vehicle_type, unit: r.unit, submittedBy: r.submitted_by || "",
        months: 0, quantity: 0, rejectReason: null, minMonth: r.month_index, maxMonth: r.month_index,
      });
      e.statuses.add(r.status); e.months += 1; e.quantity += (+r.quantity || 0);
      e.minMonth = Math.min(e.minMonth, r.month_index); e.maxMonth = Math.max(e.maxMonth, r.month_index);
      if(r.reject_reason && !e.rejectReason) e.rejectReason = r.reject_reason;
    });
    const yearOf = (mi) => months.start_year + Math.floor((mi - 1) / 12);
    return Object.values(g).map(e => {
      const fromYear = yearOf(e.minMonth), toYear = yearOf(e.maxMonth);
      return { ...e, fromYear, toYear, yearLabel: fromYear === toYear ? String(fromYear) : `${fromYear}–${toYear}`,
        status: e.statuses.size === 1 ? [...e.statuses][0] : "Mixed" };
    }).sort((a, b) => (a.status === "Pending" ? -1 : 1) - (b.status === "Pending" ? -1 : 1)
      || (a.fromYear - b.fromYear) || a.routeId.localeCompare(b.routeId) || a.discipline.localeCompare(b.discipline));
  }, [rows, months]);

  const ipts = useMemo(() => [...new Set(groups.map(g => g.ipt).filter(Boolean))].sort(), [groups]);
  const discs = useMemo(() => [...new Set(groups.map(g => g.discipline).filter(Boolean))].sort(), [groups]);
  const shown = groups.filter(g =>
    (f.status === "ALL" || g.status === f.status)
    && (f.ipt === "ALL" || (f.ipt === "none" ? !g.ipt : g.ipt === f.ipt))
    && (f.discipline === "ALL" || g.discipline === f.discipline)
    && (!f.mine || g.submittedBy === who)
    && (!f.q || `${g.routeId} ${(routeById[g.routeId] || {}).origin || ""} ${(routeById[g.routeId] || {}).dest || ""} ${g.material || ""} ${g.submittedBy} ${teamText(g.submittedBy)}`.toLowerCase().includes(f.q.toLowerCase())));
  const counts = useMemo(() => groups.reduce((a, g) => { a[g.status] = (a[g.status] || 0) + 1; return a; }, {}), [groups]);
  // lines with any month waiting for approval (Pending or Mixed): what status.pending_t covers
  const pendingN = useMemo(() => groups.filter(g => g.statuses.has("Pending")).length, [groups]);

  const done = () => { setTick(t => t + 1); if(onChanged) onChanged(); };
  // Scoped to the LINE and to exactly the months the row shows — never 1..60.
  const withdraw = (g) => {
    const what = g.discipline ? `${g.discipline} forecast` : "forecast";
    if(!confirm(`Withdraw the ${g.yearLabel} ${what} on ${g.routeId}${g.submittedBy && g.submittedBy !== who ? ` (submitted by ${teamText(g.submittedBy)})` : ""}?\n${g.months} month${g.months === 1 ? "" : "s"} will be removed.`)) return;
    const p = new URLSearchParams({ from: String(g.minMonth), to: String(g.maxMonth),
      discipline: g.discipline || "", section_id: g.sectionId || "" });
    if(!canApprove) p.set("submitted_by", who);   // a submitter withdraws only its own
    setBusy(g.key);
    fetch(`${API}/forecasts/${encodeURIComponent(g.routeId)}?${p}`, { method: "DELETE" })
      .then(done).catch(() => {}).finally(() => setBusy(""));
  };
  // A rejection REQUIRES a reason: it is stored, shown to the submitter, and a
  // rejection without one is a dead end.
  const setStatus = (g, status) => {
    let reason = null;
    if(status === "Rejected"){
      reason = (window.prompt(`Why is ${g.routeId}${g.discipline ? " · " + g.discipline : ""} being rejected?\nThe submitter sees this, so say what needs to change.`) || "").trim();
      if(!reason){ alert("A rejection needs a reason — nothing was changed."); return; }
    }
    setBusy(g.key);
    const p = new URLSearchParams({ discipline: g.discipline || "", section_id: g.sectionId || "" });
    fetch(`${API}/routes/${encodeURIComponent(g.routeId)}/status?${p}`, {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status, reject_reason: reason }),
    }).then(done).catch(() => {}).finally(() => setBusy(""));
  };

  const exportCsv = () => {
    const cols = ["Route", "From", "To", "Years", TEAM(), "Discipline", "Section", "Material", "Description",
                  "Vehicle", "Unit", "Quantity", "Months", "Status", "Submitted by", "Rejection reason",
                  "Tonnes", "Trips", `Planned ${CUR()}`, "Planned source", `Planned ${CUR()}/t`, `Fair ${CUR()} (model)`, `Fair ${CUR()}/t`, `Fair ${CUR()}/trip`, `Fair ${CUR()}/${DU()}`];
    const esc = (v) => { const s = (v == null ? "" : String(v)); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const lines = [cols.join(",")];
    shown.forEach(g => {
      const r = routeById[g.routeId] || {};
      const c = costByLine[g.key] || {};
      const r2 = (v) => (v == null ? "" : Math.round(v * 100) / 100);
      lines.push([g.routeId, r.origin || "", r.dest || "", g.yearLabel, teamText(g.ipt), g.discipline, g.sectionId,
        g.material || "", g.material_description || "", vehLabel(g.vehicle), g.unit || "",
        Math.round(g.quantity * 10) / 10, g.months, g.status, teamText(g.submittedBy), g.rejectReason || "",
        r2(c.t), c.trips ?? "", r2(c.planned), c.source || "", r2(c.plannedU && c.plannedU.per_t),
        r2(c.fair), r2(c.fairU && c.fairU.per_t), r2(c.fairU && c.fairU.per_trip), r2(c.fairU && distRate(c.fairU.per_km))].map(esc).join(","));
    });
    const blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = `forecasts-${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  // 10 Oct 2026 — the UI pass (ui-review-1009, mockups 2, 4 and 5): one figure per column at
  // 14 px in 40 px rows, numbers right-aligned with the unit in the header, a caption, a sticky
  // header, the sort shown once, a filter row with applied-filter chips above the table, and
  // the shared empty-state family. The cost column stays (one compact cell per line, the 13 px
  // allowance) until the Routes page carries the figures. Approve is the one visible action;
  // Reject, Edit and Withdraw sit behind the row menu.
  const unitLabel = (u) => u === "m3" ? "m³" : (u || "");
  // 13 Oct 2026 (W6): the Total column shows ONE unit for every line (the switch). Tonnes: a line typed in tonnes
  // shows what was typed; any other line the tonnes its own conversion gives (the Dashboard's figure). Loads and
  // Lorries are the Dashboard's figures too. What was typed, in its own unit, is in the details.
  const qtyOf = (g) => {
    const c = costByLine[g.key];
    if(unitSel === "loads") return c ? c.trips : null;
    if(unitSel === "lorries") return c ? c.peakVeh : null;
    return g.unit === "t" ? g.quantity : (c ? c.t : null);
  };
  const sorted = [...shown].sort((a, b) => {
    const pend = (a.status === "Pending" ? -1 : 1) - (b.status === "Pending" ? -1 : 1);
    if(pend) return pend;
    const dir = sort.dir === "asc" ? 1 : -1;
    const av = sort.key === "quantity" ? qtyOf(a) : a[sort.key], bv = sort.key === "quantity" ? qtyOf(b) : b[sort.key];
    if(av == null && bv == null) return 0; if(av == null) return 1; if(bv == null) return -1;
    return (av > bv ? 1 : av < bv ? -1 : 0) * dir || a.routeId.localeCompare(b.routeId);
  });
  const sortBy = (k) => setSort(s => s.key === k ? { key: k, dir: s.dir === "asc" ? "desc" : "asc" } : { key: k, dir: k === "routeId" ? "asc" : "desc" });
  const th = (label, key, num) => (
    <th scope="col" className={(num ? "num " : "") + (key ? "sortable " : "") + (sort.key === key ? "sorted " + sort.dir : "")}
      onClick={key ? () => sortBy(key) : undefined} aria-sort={sort.key === key ? (sort.dir === "asc" ? "ascending" : "descending") : undefined}>{label}</th>
  );
  const applied = [
    f.status !== "ALL" && { k: "status", label: `Status: ${f.status}` },
    f.ipt !== "ALL" && { k: "ipt", label: `${TEAM()}: ${f.ipt === "none" ? "none set" : teamText(f.ipt)}` },
    f.discipline !== "ALL" && { k: "discipline", label: `Discipline: ${f.discipline}` },
    f.mine && { k: "mine", label: "Mine only" },
    f.q && { k: "q", label: `Search: ${f.q}` },
  ].filter(Boolean);
  const clearOne = (k) => setF(x => ({ ...x, [k]: k === "mine" ? false : k === "q" ? "" : "ALL" }));
  const clearAll = () => setF({ status: "ALL", ipt: "ALL", discipline: "ALL", mine: false, q: "" });
  const chip = (t, title) => <span className="text-[12px] font-semibold px-1.5 py-0.5 rounded-full bg-slate-100 text-slate-600" title={title}>{t}</span>;
  const sortCaption = `sorted by ${sort.key === "quantity" ? "total" : sort.key === "months" ? "months" : "route"}, ${sort.dir === "desc" ? "largest first" : "smallest first"}`;
  const qtyHead = unitSel === "loads" ? "Loads" : unitSel === "lorries" ? "Lorries" : "Tonnes";
  // the one status: what needs a person first (Rejected, a ROAD LIMIT, Pending, Mixed), else Approved; +1 when both
  // a rejection and a limit apply. The approval word itself is always in the details.
  const fcStatus = (g, c) => {
    const lim = !!(c && c.limit);
    if(g.status === "Rejected") return { word: "Rejected", tone: "bad", more: lim ? 1 : 0 };
    if(lim) return { word: "ROAD LIMIT", tone: "bad", more: 0 };
    if(g.status === "Pending") return { word: "Pending", tone: "warn", more: 0 };
    if(g.status === "Mixed") return { word: "Mixed", tone: "warn", more: 0 };
    return { word: g.status, tone: g.status === "Approved" ? "ok" : "none", more: 0 };
  };

  return (
    <div className="max-w-7xl mx-auto p-6">
      <PageHeader title="Forecasts" kicker="Plan"
        subtitle={canApprove
          ? "Every forecast line you can see, across every year it covers. Approve or reject each line here; approved lines feed the public map, the Look-ahead and the Dashboard."
          : `Your ${TEAM().toLowerCase()}'s forecast lines, across every year each one covers. Edit reopens a line in Submit forecast; a revised line goes back for approval.`}
        actions={<>
          <button onClick={() => setTick(t => t + 1)} className="btn-sec">Refresh</button>
          {shown.length > 0 && <button onClick={exportCsv} className="btn-sec">Export CSV</button>}
          {!canApprove && <button onClick={() => onEdit({})} className="btn-pri">Submit a forecast</button>}
        </>} />
      <CarbonTargetLine ct={ct} err={ctErr} pendingN={rows ? pendingN : null} />

      {err ? <EmptyState kind="error" title="Forecasts did not load" body="Wayscope did not answer in time. Nothing you typed is lost."
               action={<button onClick={() => setTick(t => t + 1)} className="btn-sec">Try again</button>} />
       : !rows ? <SkeletonTable cols={["Route", "Tonnes", "Planned", "Fair", "Status"]} rows={6} caption="Forecast lines · loading" />
       : groups.length === 0 ? (
        <EmptyState title="No forecast lines yet"
          body={canApprove ? "Nothing has been submitted that you can see. Lines appear here the moment a submitter saves one." : "Head to Submit forecast to add your first line."}
          action={!canApprove && <button onClick={() => onEdit({})} className="btn-pri">Submit a forecast</button>} />
      ) : (
        <>
          <div className="filter-row" data-guide="forecast-status">
            <input value={f.q} onChange={e => setF(x => ({ ...x, q: e.target.value }))} placeholder="Search routes, places, materials, submitters" aria-label="Search forecast lines" className="ctl w-64" />
            <select value={f.status} onChange={e => setF(x => ({ ...x, status: e.target.value }))} className="ctl" aria-label="Status">
              <option value="ALL">Status</option>
              {["Pending", "Approved", "Rejected", "Mixed"].filter(s => counts[s]).map(s => <option key={s} value={s}>{s} ({counts[s]})</option>)}
            </select>
            {ipts.length > 0 && (
              <select value={f.ipt} onChange={e => setF(x => ({ ...x, ipt: e.target.value }))} className="ctl" aria-label={TEAM()}>
                <option value="ALL">{TEAM()}</option>
                {ipts.map(i => <option key={i} value={i}>{teamText(i)}</option>)}
                {groups.some(g => !g.ipt) && <option value="none">No {TEAM().toLowerCase()} set</option>}
              </select>
            )}
            {discs.length > 0 && (
              <select value={f.discipline} onChange={e => setF(x => ({ ...x, discipline: e.target.value }))} className="ctl" aria-label="Discipline">
                <option value="ALL">Discipline</option>
                {discs.map(d => <option key={d} value={d}>{d}</option>)}
              </select>
            )}
            <label className="flex items-center gap-1.5 text-sm text-slate-600"><input type="checkbox" checked={f.mine} onChange={e => setF(x => ({ ...x, mine: e.target.checked }))} /> Mine only</label>
          </div>
          <AppliedChips chips={applied} onClear={clearOne} onClearAll={clearAll}
            count={`${shown.length} of ${groups.length} line${groups.length === 1 ? "" : "s"}`} />

          {/* 13 Oct 2026 (W6, bundle F): RowDetails. The row: the route's two ends (primary, no longer cut off), the team
              and the material (chips), the total in the unit the switch picks, planned and fair cost as two columns, one
              status. Route id, discipline, section, vehicle, months, what was typed, the per-unit prices, the reject
              reason and who submitted the line are in the details. Approve and the row menu stay. */}
          <div className="card overflow-hidden" data-rd-card="forecasts">
            <div className="rd-bar">
              <UnitSwitch value={unitSel} onChange={setUnitSel} />
              <label className="rd-sort">Sort by <select value={sort.key} onChange={e => setSort({ key: e.target.value, dir: e.target.value === "routeId" ? "asc" : "desc" })} aria-label="Sort the forecast lines by">
                <option value="quantity">Total</option><option value="months">Months</option><option value="routeId">Route</option>
              </select></label>
            </div>
            <div className="max-h-[72vh] overflow-auto rd-scroll">
              <table className="tbl rd-table" data-rd-table="forecasts">
                <caption><b>Forecast lines</b> · {sortCaption}{counts.Pending ? `, ${counts.Pending} pending approval` : ""}</caption>
                <thead>
                  <tr>
                    {th("Route", "routeId")}
                    {th(qtyHead, "quantity", true)}
                    <th scope="col" className="num">Planned ({CUR()})<InfoTip id="fc.cost" /></th>
                    <th scope="col" className="num">Fair ({CUR()})</th>
                    <th scope="col">Status</th>
                    <th scope="col" className="num"><span className="sr-only">Actions</span></th>
                  </tr>
                </thead>
                <tbody>
                  {sorted.map(g => {
                    const r = routeById[g.routeId] || {};
                    const own = g.submittedBy === who;
                    const c = costByLine[g.key];
                    const st = fcStatus(g, c);
                    const q = qtyOf(g);
                    const noTeam = `No ${TEAM().toLowerCase()} on this line: only planners can see it until one is set. Edit and re-save it from Submit forecast.`;
                    return (
                      <RowDetails key={g.key} rowKey={"fc-" + g.key} isOpen={rowOpen(g.key)} onToggle={() => rowToggle(g.key)} colSpan={6}
                        label={`Details for ${g.routeId}${g.discipline ? ", " + g.discipline : ""}`}
                        rowProps={{ "data-fc-line": g.key }}
                        summary={<>{r.origin || "—"} → {r.dest || "—"}</>}
                        chips={[g.ipt ? teamText(g.ipt) : `No ${TEAM().toLowerCase()}`, g.material || null]}
                        cells={<>
                          <td className="num" data-label={qtyHead}>{q == null ? (cost ? <span className="text-slate-500">—</span> : <span className="text-slate-500">…</span>)
                            : grp(q)}</td>
                          <td className="num" data-label={`Planned ${CUR()}`} data-cost-cell="1">{!cost ? <span className="text-slate-500">…</span> : !c ? <span className="text-slate-500">—</span>
                            : c.planned == null ? <span className="text-slate-500">rate not set</span>
                            : <>{CUR()} {grp(c.planned)}{c.source === "target" && <span className="ml-1 text-[12px] font-medium px-1.5 rounded-full bg-slate-100 text-slate-600">target</span>}</>}</td>
                          <td className="num" data-label={`Fair ${CUR()}`} style={{ color: "var(--chart-4)" }}>{!cost ? <span className="text-slate-500">…</span> : (!c || c.fair == null) ? <span className="text-slate-500">—</span> : <>{CUR()} {grp(c.fair)}</>}</td>
                          <td className="rd-status" data-label="Status"><RowStatus word={st.word} tone={st.tone} more={st.more} /></td>
                          <td className="num whitespace-nowrap rd-actions">
                            {canApprove && g.status !== "Approved" && (
                              <button disabled={busy === g.key} onClick={() => setStatus(g, "Approved")} className="btn-pri btn-sm mr-1">Approve</button>
                            )}
                            <details className="row-menu">
                              <summary aria-label={`More actions for ${g.routeId}`} title="More actions">⋯</summary>
                              <div className="row-menu-list">
                                {canApprove && g.status !== "Rejected" && (
                                  <button disabled={busy === g.key} onClick={() => setStatus(g, "Rejected")} style={{ color: "var(--red)" }}>Reject…</button>
                                )}
                                <button onClick={() => onEdit({ routeId: g.routeId, year: g.fromYear, toYear: g.toYear, discipline: g.discipline, sectionId: g.sectionId })}>Edit in Submit forecast</button>
                                {(own || canApprove) && (
                                  <button disabled={busy === g.key} onClick={() => withdraw(g)} style={{ color: "var(--red)" }}>Withdraw…</button>
                                )}
                                <div className="row-menu-note">Submitted by {teamText(g.submittedBy) || "—"}{own ? " (you)" : ""}, {g.yearLabel}</div>
                              </div>
                            </details>
                          </td>
                        </>}>
                        <RdItem t="Route">{g.routeId}</RdItem>
                        <RdItem t="Discipline">{g.discipline || null}</RdItem>
                        <RdItem t="Section">{g.sectionId || null}</RdItem>
                        <RdItem t={TEAM()} wide={!g.ipt}>{g.ipt ? teamText(g.ipt) : noTeam}</RdItem>
                        <RdItem t="Material">{g.material || "—"}</RdItem>
                        <RdItem t="Description">{g.material_description || null}</RdItem>
                        <RdItem t="Vehicle">{vehLabel(g.vehicle)}</RdItem>
                        <RdItem t="Vehicle, full name">{g.vehicle && vehShort(g.vehicle) !== vehLabel(g.vehicle) ? vehLabel(g.vehicle) : null}</RdItem>
                        <RdItem t="Months">{`${g.months}, ${g.yearLabel}`}</RdItem>
                        <RdItem t="Typed">{`${fmt(g.quantity, g.unit)} ${unitLabel(g.unit)}`}</RdItem>
                        <RdItem t="Tonnes">{c ? grp(c.t) : null}</RdItem>
                        <RdItem t="Loads (loaded trips)">{c ? grp(c.trips) : null}</RdItem>
                        <RdItem t="Lorries, busiest month">{c ? (c.peakVeh == null ? "Needs the route worked out" : String(c.peakVeh)) : null}</RdItem>
                        <RdItem t={`Planned ${CUR()}`}>{!c ? null : c.planned == null ? "No rate on the route, no target on Config" : `${CUR()} ${grp(c.planned)}, ${c.source === "target" ? "the target rate from Config" : "the rates typed on the route"}`}</RdItem>
                        <RdItem t="Planned, per unit">{c && c.plannedU ? unitList(c.plannedU) : null}</RdItem>
                        <RdItem t={`Fair ${CUR()} (model)`}>{!c ? null : c.fair == null ? (c.baked < c.n ? "Not routed yet for this vehicle, so no distance and no fair price" : "No diesel index") : `${CUR()} ${grp(c.fair)}${fairWords(c.flags) ? ", " + fairWords(c.flags) : ""}`}</RdItem>
                        <RdItem t="Fair, per unit">{c && c.fairU ? unitList(c.fairU) : null}</RdItem>
                        <RdItem t="Approval">{g.status}</RdItem>
                        <RdItem t="Reason for rejecting" wide bad>{g.rejectReason || null}</RdItem>
                        <RdItem t="Submitted by">{`${teamText(g.submittedBy) || "—"}${own ? " (you)" : ""}`}</RdItem>
                        <RdItem t="ROAD LIMIT" wide bad>{c && c.limit ? `${c.limit.text}${c.limit.checked_at ? `. Checked ${ctWhen(c.limit.checked_at)}.` : ""}` : null}</RdItem>
                      </RowDetails>
                    );
                  })}
                  {sorted.length === 0 && <tr><td colSpan="6" className="!p-0 !h-auto"><EmptyState kind="nomatch" title="No lines match these filters" body={applied.map(a => a.label).join(", ")} action={<button onClick={clearAll} className="btn-sec">Clear filters</button>} /></td></tr>}
                </tbody>
              </table>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

// ================================================================= Config (2.5b)
//
// The editable copy of factors.json. Once the config row exists, THIS is what every
// payload, density and cycle time reads; the file is only the seed. Four tabs of
// form-backed editing plus a raw JSON tab for everything the forms do not cover
// (routing dimensions, notes). Save sends the WHOLE document; the server
// validates it and refuses with the list of problems rather than storing a bad one.
// ---- 10 Sep evening: the Costing tab — the TARGET rates and the fuel widget ----------
// The target rates are the Planned € for every route that has no rate of its own: typed
// once here, never seeded, saved with the admin token because one number moves every
// unpriced line. Saved on their own endpoint, not inside the factors document, so the
// Save button above (which sends the whole factors doc) does not carry them.
function CostingTab({ who, access, token, setToken, doc, upd, fileDoc }){
  const [data, setData] = useState(null);
  const [draft, setDraft] = useState({});
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);
  const load = () => fetch(`${API}/costing`).then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => { setData(j); setDraft({}); })
    .catch(e => setMsg({ ok: false, text: `Couldn't load the costing settings (${e}).` }));
  useEffect(() => { load(); }, []);
  const tg = (data && data.target) || {};
  const save = async () => {
    const body = { updated_by: who || null };
    let bad = null;
    ["rate_eur_per_load", "rate_eur_per_t", "rate_eur_per_km"].forEach(k => {
      if(draft[k] === undefined) return;
      if(draft[k] === ""){ body[k] = null; return; }
      const n = numOr(draft[k], null); if(n === null){ bad = k; } else body[k] = (k === "rate_eur_per_km" ? +(+distInRate(n)).toFixed(6) : n);
    });
    if(bad){ setMsg({ ok: false, text: "A target rate must be a number." }); return; }
    try { localStorage.setItem("modus_admin_token", token); } catch(e){}
    setBusy(true); setMsg(null);
    const qs = token ? `?token=${encodeURIComponent(token)}` : "";
    try {
      const r = await fetch(`${API}/admin/costing/target${qs}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if(!r.ok) throw new Error((await r.text()).slice(0, 300).replace(/^\{"detail":"|"\}$/g, ""));
      setData(await r.json()); setDraft({});
      setMsg({ ok: true, text: "Saved. Every route without a rate of its own now prices at the target, marked \"target\" on the Look-ahead." });
    } catch(e){ setMsg({ ok: false, text: "Not saved — " + e.message }); }
    setBusy(false);
  };
  const inp = "ctl ctl-sm w-full tabular-nums";
  const dirty = ["rate_eur_per_load", "rate_eur_per_t", "rate_eur_per_km"].some(k => draft[k] !== undefined);
  return (
    <div className="px-6 pb-6 space-y-6">
      {msg && <div className="rounded-lg border p-2.5 text-sm" style={{ borderColor: msg.ok ? "var(--green)" : "var(--red)", color: msg.ok ? "var(--ok-text)" : "var(--red)" }}>{msg.text}</div>}
      <div>
        <div className="text-[15px] font-semibold text-slate-800">Target rate — the planned price where a route has no rate</div>
        <p className="text-[13px] text-slate-500 mt-0.5 mb-3 max-w-3xl">Summed like the route rates ({CUR()} per load + {CUR()} per tonne + {CUR()} per {DU()} on the route's distance basis). Used ONLY for routes with no rate typed on the route form; a route with any rate of its own is priced from that alone. Every figure it produces is marked "target" on the Look-ahead and the exports. Typed, never seeded. Admin token to save.</p>
        {!data ? <div className="text-slate-400 text-sm">Loading…</div> : (
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3 max-w-3xl items-end">
            {[["rate_eur_per_load", `${CUR()} per load`], ["rate_eur_per_t", `${CUR()} per tonne`], ["rate_eur_per_km", `${CUR()} per ${DU()}`]].map(([k, l]) => (
              <label key={k} className="block">
                <span className="block text-sm font-medium text-slate-700 mb-1">{l}</span>
                {/* the per-distance rate is shown and typed in the tenant's unit; stored per km */}
                <input className={inp + " mt-1"} inputMode="decimal" placeholder="—" value={draft[k] ?? (tg[k] == null ? "" : (k === "rate_eur_per_km" ? +(+distRate(tg[k])).toFixed(4) : tg[k]))} onChange={e => setDraft(d => ({ ...d, [k]: e.target.value }))} />
              </label>
            ))}
            <button onClick={save} disabled={busy || !dirty} className="btn-pri" title="Saved on its own: the page's Save button does not save the target rate">{busy ? "Saving…" : "Save target rate"}</button>
          </div>
        )}
      </div>
      <div>
        <div className="text-[15px] font-semibold text-slate-800 mb-1">Diesel index and fuel surcharge (BAF)</div>
        <FuelWidget mode="config" who={who} access={access} initial={data && data.summary} onChanged={load} />
      </div>
      <FairPriceSection doc={doc} upd={upd} fileDoc={fileDoc} summary={data && data.summary && data.summary.fair} />
    </div>
  );
}

// ---- 10 Sep night: the fair-price model's coefficients -------------------------------
// Seeded from factors.json's `fair_price` block (public benchmarks, each with its source in
// the file) by the human's decision; edited HERE inside the factors document, so the page's
// Save button (admin token) carries them. A config row saved before the block existed has
// no fair_price: the server prices from the file's block until this is saved once, and the
// inputs below show the file's values until the first edit copies the block in.
// a function, not a constant: CUR() and DU() are the tenant's and land with /api/meta
const FAIR_FIELDS_FOR = () => [["driver_eur_per_h", `Driver ${CUR()} / h`, "public benchmark — see the file for the source"],
                     ["vehicle_standing_eur_per_h", `Vehicle standing ${CUR()} / h`, `ASSUMPTION — from the vehicle price in the file, 7 years, insurance, road charge`],
                     ["running_eur_per_km", `Running ${CUR()} / ${DU()}`, "ASSUMPTION — tyres, maintenance, repairs"],
                     ["margin_pct", "Margin %", "ASSUMPTION"]];
// 14 Oct 2026 (HU7): factors.json carries a set per country (fair_price_by_country, GB today). The file's
// set for the tenant's country is the one shown, copied and offered; every other tenant gets fair_price.
const FAIR_COUNTRY_NAMES = { GB: "Great Britain", EE: "Estonia" };
const fairCanon = (o) => JSON.stringify(o, (k, v) => (k.startsWith("_") ? undefined
  : (v && typeof v === "object" && !Array.isArray(v) ? Object.keys(v).sort().reduce((a, kk) => (a[kk] = v[kk], a), {}) : v)));
function FairPriceSection({ doc, upd, fileDoc, summary }){
  const cc = (((doc && doc.tenant) || {}).country || "").toUpperCase() || null;
  const countryFp = (cc && fileDoc && (fileDoc.fair_price_by_country || {})[cc]) || null;
  const fileFp = countryFp || (fileDoc && fileDoc.fair_price) || {};
  const fp = (doc && doc.fair_price) || fileFp;
  // the live block differs from the country's set in the file (numbers only, sources ignored): offer the set
  const offerCountry = !!(countryFp && doc && doc.fair_price && fairCanon(doc.fair_price) !== fairCanon(countryFp));
  const countryName = FAIR_COUNTRY_NAMES[cc] || cc;
  const cons = fp.consumption || {};
  const season = fp.season || {};
  const inp = "ctl ctl-sm w-full tabular-nums";
  const num = (v) => (v === "" || v == null ? null : (isNaN(+v) ? v : +v));
  // the first edit copies the whole seeded block into the document, sources included
  const set = (fn) => upd && upd(d => { if(!d.fair_price) d.fair_price = JSON.parse(JSON.stringify(fileFp)); fn(d.fair_price); });
  const monthsBox = (k, label) => (
    <label className="block">
      <span className="block text-sm font-medium text-slate-700 mb-1">{label}</span>
      <div className="flex flex-wrap gap-1 mt-1">
        {MONTHS.map((m, mi) => (

              </div>
            </details>
            <button onClick={downloadSummary} disabled={pdfBusy} className="btn-sec mt-3">{pdfBusy ? "Making the summary…" : "Download the summary (PDF)"}</button>
            {pdfErr && <p className="text-sm mt-2" role="alert" style={{ color: "var(--red)" }}>{pdfErr}</p>}
          </div>
        </CarbonStep>

        {/* ---------------- 6. carbon target ---------------- */}
        <CarbonStep n={6} data-guide="carbon-target">
          <p className="text-sm text-slate-600 mt-2">Once set, the target shows on the Dashboard, Forecasts and Submit forecast.</p>
          {!tLoaded ? (tErr ? null : <p className="text-sm text-slate-400 mt-3">Loading the carbon target…</p>) : ctHere ? (
            <div className="mt-3 space-y-1 text-sm text-slate-700" data-target-mode={T.mode}>
              <p className="text-base font-semibold text-slate-800 tabular-nums">{ctTargetLine(tg)}</p>
              <p className={hint}>Set by {T.updated_by || "a name not given"}{ctWhen(T.updated_at) ? `, ${ctWhen(T.updated_at)}` : ""}</p>
              <p className="tabular-nums mt-2">{p6[0]}</p>
              {S.invalid
                ? <p className="text-amber-700">{S.invalid}</p>
                : <p className="tabular-nums">{p6[1]}</p>}
              {team && <p className={hint}>{ctScopeNote(tg)}</p>}
              {S.pending_t > 0.0005 && <p className="tabular-nums">Lines waiting for approval would add {t1(S.pending_t)} tCO2e.</p>}
              {/* the decisions are listed to a scheme code only, as on the Dashboard (a team code's read keeps only words that name no route) */}
              {!team && (T.lever_words || []).length > 0 && (
                <>
                  <p className="font-medium text-slate-800 mt-2">The agreed decisions</p>
                  <ul className="list-disc pl-5 space-y-1">{T.lever_words.map(w => <li key={w}>{w}</li>)}</ul>
                </>
              )}
            </div>
          ) : (
            <p className="text-sm text-slate-700 mt-3">{CT_NONE}</p>
          )}
          {canSet ? (
            <div className="mt-4">
              <span className={lab} id="carbon-mode-l">Hold the target as</span>
              <div role="group" aria-labelledby="carbon-mode-l" className="inline-flex flex-wrap rounded-md border border-slate-300 overflow-hidden">
                {CARBON_TARGET_MODES.map(([k, w]) => (
                  <button key={k} type="button" aria-pressed={mode === k} disabled={tBusy} onClick={() => pickMode(k)}
                    className="text-sm font-semibold px-3 py-1.5"
                    style={mode === k ? { background: "var(--ink)", color: "var(--bg)" } : { background: "var(--surface)", color: "var(--ink)" }}>{mode === k ? "✓ " : ""}{w}</button>
                ))}
              </div>
              <p className={hint + " mt-1"}>{mode === "pct" ? "A % follows the approved plan as lines are approved." : "A cap stays the same as lines are approved."}{T ? " Switching it changes the saved target; you are asked first." : ""}</p>
              <div className="mt-3 flex flex-wrap items-center gap-3">
                {/* wraps on a phone: .btn-pri is nowrap, and the step card is about 230 px wide at 375 */}
                <button type="button" className="btn-pri" style={{ whiteSpace: "normal" }} disabled={!!setWhy || tBusy} onClick={setTarget}>Set as the scheme's carbon target</button>
                {T && <button type="button" className="btn-sec" disabled={tBusy} onClick={openAgreed}>Open the agreed decisions</button>}
                {T && <button type="button" className="btn-sec" disabled={tBusy} onClick={clearTarget}>Clear the target</button>}
              </div>
              {setWhy && <p className={hint + " mt-1"}>{setWhy}</p>}
            </div>
          ) : (
            <p className="text-sm text-slate-600 mt-3">Your planner sets the scheme's carbon target.</p>
          )}
          {tErr && <p className="text-sm mt-2" role="alert" style={{ color: "var(--red)" }}>{tErr}</p>}
          {!tLoaded && tErr && <button type="button" className="btn-sec mt-2" disabled={tBusy} onClick={() => targetCall("GET", null, null)}>Try again</button>}
          {tMsg && <p className="text-sm text-slate-700 mt-2" role="status">{tMsg}</p>}
        </CarbonStep>
      </ol>

      {(A || err) && (
        <div className="sticky bottom-0 z-10 mt-4" data-sticky-foot="">
          <div className="bg-white border border-slate-200 rounded-lg px-4 py-2 text-sm text-slate-700 shadow-sm flex flex-wrap items-center gap-x-3 gap-y-1">
            {err
              ? <span role="alert" style={{ color: "var(--red)" }}>Not updated: {err}</span>
              : <span className="tabular-nums">Result: <b>{t1(A.totals.total_t)} tCO2e</b>, {A.delta_t != null && Math.abs(A.delta_t) > 0.0005 ? `${moved(A.delta_t)} (${pct(A.delta_pct)})` : "no change"}</span>}
            {busy && <span className="text-slate-400">updating…</span>}
            <button type="button" className="link-btn" onClick={toResult}>See step 5</button>
          </div>
        </div>
      )}

      <details className="dash-more mt-5">
        <summary>About these figures</summary>
        <div className="space-y-5 pt-3">
          <section>
            <h3 className={h3}>Factors used: source, year and status ({(data.factors || []).length})</h3>
            <p className={hint + " mt-1"}>Verified: matches the published row · Derived: worked out from published rows · Assumption: typed or estimated</p>
            <ul className="mt-2 space-y-2 text-sm">
              {(data.factors || []).map(f => (
                <li key={f.key} title={prov(f)} className="flex flex-wrap items-baseline gap-x-2">
                  <Chip s={f.status} /><span className="font-semibold text-slate-800">{f.label}</span>
                  <span className="text-slate-600 tabular-nums">{f.value != null ? (Array.isArray(f.value) ? f.value.join("–") : f.value) : f.kg_per_km != null ? f.kg_per_km : (f.kg_co2e_per_t ? Object.entries(f.kg_co2e_per_t).filter(([, v]) => v != null).map(([k, v]) => `${k.replace("_", "-")} ${v}`).join(" · ") : "")} {f.unit || (f.kg_co2e_per_t ? "kgCO2e per tonne" : "")}</span>
                  <span className="text-slate-500">{f.source || "no source"} · {f.year || "year not given"}{ids(f)}</span>
                </li>
              ))}
            </ul>
          </section>
          <section>
            <h3 className={h3}>Known limits</h3>
            <ul className="list-disc pl-5 mt-2 text-sm text-slate-600 space-y-1">{(data.limits || []).map(l => <li key={l}>{l}</li>)}</ul>
          </section>
          <section data-guide="carbon-planned">
            <h3 className={h3}>Not built yet</h3>
            <ul className="list-disc pl-5 mt-2 text-sm text-slate-600 space-y-1">{(data.planned || []).map(p => <li key={p}>{p}</li>)}</ul>
            <p className={hint + " mt-2"}>No figures are shown for these until each exists.</p>
          </section>
          <section data-guide="carbon-using">
            <h3 className={h3}>Who acts on these results</h3>
            <ol className="grid md:grid-cols-3 gap-4 mt-2 text-sm">
              {CARBON_STEPS.map((s, i) => <li key={s.who}><span className="font-semibold text-slate-800">{i + 1}. {s.who}</span><span className="block text-slate-600">{s.what}</span></li>)}
            </ol>
            <p className={hint + " mt-2"}>These figures compare options before work starts; they are not a record of what was delivered.</p>
          </section>
        </div>
      </details>
    </div>
  );
}

// ================================================================= Look-ahead v2 (2026-09-09)
// One tab, three views — Account · Commit · Horizon — over ONE read, /api/lookahead.
// The brief (claude/lookahead-brief-0909.md) wins on the rules; the four signed mocks
// (artifacts/lookahead_mock_*.png) win on the chrome. Where they disagree (C18) the
// mock's button bar, per-line spread button and single clash rail were chosen.
//
// Nothing about WHICH week is the commit week is decided in the browser: the server's
// commit_week is the bucket that contains today, and `bucket=next` asks for the one
// after it — the Thursday process, where next week's plan is confirmed for next week's
// deliveries. The browser only chooses which of the two to look at.
// 10 Sep: weeks are CALENDAR weeks (Mon–Sun; a week belongs to the month holding its
// Thursday), so a month has four or five. The server says how many (horizon.weeks_in_month)
// and what dates each covers (horizon.week_spans) — nothing here assumes four.
const weekNosOf = (horizon, m) => { const n = ((horizon && horizon.weeks_in_month) || {})[String(m)] || 4; return Array.from({ length: n }, (_, i) => i + 1); };
const weekSpanLbl = (horizon, m, w) => {
  const sp = ((horizon && horizon.week_spans) || {})[`${m}|${w}`];
  if(!sp) return "";
  const a = new Date(sp.from + "T00:00:00"), b = new Date(sp.to + "T00:00:00");
  return `${a.getDate()} ${MONTHS[a.getMonth()]} – ${b.getDate()} ${MONTHS[b.getMonth()]}`;
};
const wkKey = (r) => `${r.route_id}|${r.discipline || ""}|${r.section_id || ""}|${r.month_index}|${r.week_index}`;
const lineKeyOf = (r) => `${r.route_id}|${r.discipline || ""}|${r.section_id || ""}|${r.month_index}`;
const wkBody = (r) => ({ route_id: r.route_id, month_index: r.month_index,
                         discipline: r.discipline || "", section_id: r.section_id || "",
                         week_index: r.week_index });
const numOr = (v, d) => (v === "" || v == null || isNaN(+v)) ? d : +v;
// thousands with a thin space, the way the mocks print them: 4 200 t · 86 400
const grp = (n, d) => (n == null || isNaN(+n)) ? "—"
  : (+n).toLocaleString("en-US", { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }).replace(/,/g, " ");
const eurFmt = (n) => (n == null) ? "rate not set" : `${CUR()} ` + grp(n);
const unitLbl = (u) => u === "m3" ? "m³" : (u || "");
// Palette C — one colour per team slot. The demo package paints its map bands with the
// same hexes so a team reads the same colour in the tables and on the map; a tenant's own
// package may choose other band colours (they must stay clear of the route colours).
const IPT_PALETTE_C = { IPT1: "#4C1D95", IPT2: "#155E75", IPT3: "#57534E",
                        IPT4: "#92400E", IPT5: "#831843", IPT6: "#0F766E" };
const iptKey = (s) => String(s || "").replace(/\s+/g, "").toUpperCase();
// The label for a team id ("IPT3"): the tenant's own label from /api/meta's ipts when
// known, else "<team word> 3". Ids stay IPTn internally (label-only decision, G2).
const TEAM_LABELS = {};
const teamName = (id) => TEAM_LABELS[iptKey(id)] || `${TEAM()} ${String(id || "").replace(/^IPT\s*/i, "")}`;
// A team VALUE as a person reads it: every team id inside it ("IPT3", "IPT3 / IPT6")
// becomes the tenant's label; any other text is left alone. Every place that shows a
// team value goes through this or teamName() — ids never reach the screen (G2).
const teamText = (v) => (v == null || v === "") ? v
  : String(v).replace(/\bipt\s*[-_ ]?\s*([1-6])\b/gi, (m, n) => teamName("IPT" + n));
const dayName = (iso) => ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][new Date(iso + "T00:00:00").getDay()];
const dayNum = (iso) => parseInt(iso.slice(8, 10), 10);
const isWeekend = (iso) => { const d = new Date(iso + "T00:00:00").getDay(); return d === 0 || d === 6; };
const longDate = (iso) => { const d = new Date(iso + "T00:00:00"); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const spanLabel = (a, b) => {
  if(!a || !b) return "";
  const da = new Date(a + "T00:00:00"), db = new Date(b + "T00:00:00");
  return da.getMonth() === db.getMonth()
    ? `${da.getDate()}–${db.getDate()} ${MONTHS[da.getMonth()]} ${da.getFullYear()}`
    : `${da.getDate()} ${MONTHS[da.getMonth()]} – ${db.getDate()} ${MONTHS[db.getMonth()]} ${db.getFullYear()}`;
};


function IptPill({ ipt }){
  const k = iptKey(ipt);
  if(!k) return <span className="text-xs text-slate-500">no {TEAM().toLowerCase()}</span>;
  return <span className="text-xs font-semibold px-1.5 py-0.5 rounded-full text-white"
    style={{ background: IPT_PALETTE_C[k] || "#64748B" }} title={k}>{teamName(k)}</span>;
}
function WsPill({ ws }){
  if(!ws) return null;
  return <span className="text-xs font-semibold px-1.5 py-0.5 rounded-full"
    style={{ background: "var(--navy-soft)", color: "var(--navy)" }}>{ws}</span>;
}
function LaKpi({ value, caption, tone }){
  // a long value steps its size down before it would be cut off ("£1.43…" read as a price)
  const len = String(value == null ? "" : value).length;
  return (
    <div className="card px-4 py-3 min-w-0" title={String(value == null ? "" : value)}>
      <div className={"font-semibold tabular-nums truncate leading-8 " + (len > 12 ? "text-sm" : len > 9 ? "text-base" : len > 7 ? "text-lg" : "text-2xl")}
        style={{ color: tone === "red" ? "var(--red)" : "var(--navy-deep)" }}>{value}</div>
      <div className="text-[13px] text-slate-500 mt-0.5 leading-tight">{caption}</div>
    </div>
  );
}
// ---- 14 Oct 2026 (bundle G, W17): the committed week at each gate --------------------------------------
// The page's own read carries it (lookahead.page → gates_week, from gate_arrivals.week_by_day): each gate's planned
// arrivals a day — every team's lorries, from the grid's own day trips — against what it can check in (its open minutes
// ÷ the check-in minutes a lorry; 0 on a day it is closed). The SERVER decides each day's status (gate_hours.py): gold
// "Queue likely" at 85 % or more, red "Over gate capacity" past it — always a word and an icon too, never colour alone.
// The browser draws; it divides nothing. The same days raise GATE_OVER / GATE_NEAR on the clash rail. Flags, never blocks.
const GW_SHOW = 6;
function gwCfg(g, labels){
  const C1 = tok("--chart-1", "#E8590C"), RED = tok("--red", "#DC2626"), GOLD = tok("--gold", "#D97706"), NONE = tok("--chart-none", "#A8A29E"), INK = tok("--ink", "#1E293B");
  const ds = [{ type: "bar", label: "Planned arrivals", data: g.days.map(d => d.arrivals), order: 2, borderWidth: 0, borderRadius: 3,
    backgroundColor: g.days.map(d => d.flag === "red" ? RED : d.flag === "amber" ? GOLD : (g.capacity_per_day == null ? NONE : C1)) }];
  if(g.capacity_per_day != null){
    ds.push({ type: "line", label: "What it can check in", data: g.days.map(d => d.capacity), borderColor: INK, borderWidth: 2, pointRadius: 0, stepped: "middle", order: 1 });
    ds.push({ type: "line", label: `${GA_NEAR} %: queue likely`, data: g.days.map(d => d.open ? g.near_per_day : 0), borderColor: GOLD, borderWidth: 1.5, borderDash: [4, 3], pointRadius: 0, stepped: "middle", order: 1 });
  }
  return { type: "bar", data: { labels, datasets: ds },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 11 } } },
      tooltip: { callbacks: { label: (it) => it.datasetIndex === 0 ? `${grp(g.days[it.dataIndex].arrivals)} lorries planned${g.days[it.dataIndex].pct != null ? ` · ${g.days[it.dataIndex].pct} %` : ""}` : `${it.dataset.label}: ${grp(it.parsed.y)}` } } },
      scales: { x: { grid: { display: false } }, y: { title: { display: true, text: "lorries a day" } } } } };
}
function GatesWeek({ gw }){
  if(!gw || !(gw.gates || []).length) return null;
  const gs = gw.gates;
  const nRed = gs.filter(g => g.flag === "red").length, nAmber = gs.filter(g => g.flag === "amber").length;
  const shown = gs.slice(0, GW_SHOW), rest = gs.slice(GW_SHOW);
  return (
    <section className="card p-4 mb-3" data-gates-week="1" data-guide="lookahead-gates" aria-label="Gates this week">
      <div className="ct-row">
        <h3 className="ct-h">Gates this week<InfoTip id="la.gates" /></h3>
        <span className="clp-head" style={nRed ? { color: "var(--red)" } : undefined} data-gw-head="1">
          {nRed ? `${nRed} gate${nRed === 1 ? "" : "s"} over capacity on a day this week` : nAmber ? `${nAmber} gate${nAmber === 1 ? "" : "s"} near capacity: queue likely` : "Every gate within its capacity this week"}
        </span>
      </div>
      <div className="gw-grid">
        {shown.map(g => (
          <div key={g.gate_id} className="gw-gate" data-gw-gate={g.gate_id} data-gw-flag={g.flag || "none"}>
            <div className="text-sm font-semibold text-slate-700">{g.location_name}<span className="text-slate-400 font-normal"> · {g.gate_name}</span></div>
            <div className="clp-note">{g.capacity_per_day == null ? "No check-in time typed: nothing is compared."
              : `Can check in ${grp(g.capacity_per_day)} a day (${g.open_basis === "gate" ? `open ${g.open_hours}${g.peak_minutes ? `, less ${g.peak_minutes} min of peak bands` : ""}` : "the shift"} ÷ ${+g.check_in_minutes} min a lorry)${g.closed_days ? `, ${g.closed_days}` : ""}.`}</div>
            <ChartCanvas config={gwCfg(g, gw.days)} />
            <div className="gw-days">
              {g.days.filter(d => d.flag).map(d => (
                <span key={d.date} className="gw-day" data-gw-day={d.date}><RowStatus word={`${d.day}: ${d.status_word}${d.pct != null ? ` (${d.pct} %)` : d.open ? "" : " (closed)"}`} tone={d.flag === "red" ? "bad" : "warn"} /></span>
              ))}
            </div>
          </div>
        ))}
      </div>
      {rest.length > 0 && <div className="clp-note" data-gw-rest="1">{rest.length} more gate{rest.length === 1 ? "" : "s"}: {rest.map(g => `${g.location_name}, ${g.gate_name}${g.status_word ? ` (${g.status_word})` : ""}`).join("; ")}.</div>}
      <div className="ct-note">{gw.limit} The days are this page's own: the month spread over its calendar weeks, rounded up a day, so a day can be busier than the Dashboard's month average.</div>
    </section>
  );
}
// the status pill column between the line and the days — sparse by design
// the clash rail's names for each code — the same words as the user guide's §10.1
const RAIL_LABEL = { SHORTAGE: "SHORTAGE", DAYS_NE_WEEK: "DAYS ≠ WEEK", STOCKPILE_OVER: "STOCKPILE OVER",
                     ROUTE_CAP: "ROUTE CAP", IPT_SHARE: "SHARE", RESTRICTION: "RESTRICTION",
                     LIMIT: "ROAD LIMIT", UNBAKED: "NOT ROUTED", PARENT_CHANGED: "PARENT CHANGED",
                     // 14 Oct 2026 (bundle G, W17)
                     GATE_OVER: "GATE OVER CAPACITY", GATE_NEAR: "GATE NEAR CAPACITY" };
// H1 (29 Sep 2026): a RESTRICTION flag carries the provider's own word — "TARK TEE" for an
// Estonian tenant, "ROADWORKS" (National Highways planned closures) for a British one.
const flagWord = (f, table) => (f && f.code === "RESTRICTION" && f.label) ? f.label : ((table || RAIL_LABEL)[f.code] || f.code);
// the grid's short words for each flag (the rail spells some out longer: RAIL_LABEL)
const LINE_FLAG_LABEL = { UNBAKED: "NOT ROUTED", IPT_SHARE: "SHARE", ROUTE_CAP: "CAP", DAYS_NE_WEEK: "DAYS ≠ WEEK",
                  STOCKPILE_OVER: "STOCKPILE OVER", RESTRICTION: "RESTRICTION", LIMIT: "ROAD LIMIT", SHORTAGE: "SHORT", PARENT_CHANGED: "MONTH CHANGED",
                  GATE_OVER: "GATE OVER", GATE_NEAR: "GATE NEAR" };
// 13 Oct 2026 (W6): the Look-ahead row's ONE status. The flags, most serious first (a lorry over a road limit
// before anything else: decision 1), win over the week's state; with no flag, the week's state. `more` counts the
// other kinds of flag; every flag's sentence is in the details. (Replaces LineFlags' column of words and the
// StatusChip column: one status a row.)
const LA_FLAG_RANK = { LIMIT: 0, RESTRICTION: 1, SHORTAGE: 2, ROUTE_CAP: 3, STOCKPILE_OVER: 4, IPT_SHARE: 5, DAYS_NE_WEEK: 6, PARENT_CHANGED: 7, UNBAKED: 8,
                       GATE_OVER: 3.5, GATE_NEAR: 7.5 };   // 14 Oct 2026 (W17): over beside the route cap, near with the warnings
const laRank = (code) => (code in LA_FLAG_RANK ? LA_FLAG_RANK[code] : 99);
const laSorted = (flags) => [...(flags || [])].sort((a, b) => laRank(a.code) - laRank(b.code));
// the rail's colours: NOT ROUTED, a road restriction and a gate near capacity in amber, every other flag red
const laTone = (code) => (code === "UNBAKED" || code === "RESTRICTION" || code === "GATE_NEAR") ? "warn" : "bad";
// the details' flag lines: one per kind of flag, most serious first, each distinct sentence once, team ids in
// the team's words (teamText, as the rail does)
function laFlagGroups(flags){
  const out = [];
  laSorted(flags).forEach(f => {
    let g = out.find(x => x.code === f.code);
    if(!g){ g = { code: f.code, word: flagWord(f, LINE_FLAG_LABEL), tone: laTone(f.code), texts: [] }; out.push(g); }
    const t = teamText(f.text || "") || "—";
    if(!g.texts.includes(t)) g.texts.push(t);
  });
  return out;
}
function laStatus(flags, w){
  const codes = Array.from(new Set(laSorted(flags).map(f => f.code)));
  if(codes.length){
    const f = (flags || []).find(x => x.code === codes[0]);
    return { word: flagWord(f, LINE_FLAG_LABEL), tone: laTone(codes[0]), more: codes.length - 1 };
  }
  if(w && w.parent_changed) return { word: "MONTH CHANGED", tone: "bad", more: 0 };
  const s = w && w.status;
  return s === "confirmed" ? { word: "Confirmed", tone: "ok", more: 0 } : s === "edited" ? { word: "Edited", tone: "warn", more: 0 }
    : { word: s === "derived" ? "Derived" : (s || "—"), tone: "none", more: 0 };
}
// the week's state in words, for the details (the old status column's titles)
const laWeekWords = (s) => s === "confirmed" ? "Confirmed: reopen it to change the plan"
  : s === "edited" ? "Edited, not confirmed yet" : s === "derived" ? "Derived from the month, not confirmed yet" : (s || "—");

// ---- 10 Sep evening: the fuel-price widget — ONE component, THREE mounts --------------
// Account (top of the strip), Commit (the KPI strip, right of t·km) and Config (under the
// rates). It reads /api/fuel-index — the STORED EU Weekly Oil Bulletin diesel row plus the
// tenant's fuel settings — never the feed itself; the server refreshes in the background
// when the row is older than 12 h and this polls `refresh` while it runs. Two numbers,
// deliberately: the INDEX (public, weekly, what BAF is computed from) and the YARD price
// (typed, what the haulier pays, for a later cost-plus slice). The feed never writes the
// yard; the yard never changes the index. Nothing is seeded — no share, no base, no price.
// `initial` is the page's own `costing` block, so a mount inside the Look-ahead paints at
// once from the page read and the widget's fetch only refines it.
const fuelDate = (iso) => iso ? longDate(String(iso).slice(0, 10)) : "—";
const costingToData = (c) => !c ? null : ({
  fuel: c.fuel || {}, summary: c,
  index: { eur_per_l: c.index_eur_per_l, bulletin_date: c.index_bulletin_date, source: c.index_source,
           stale: c.index_eur_per_l == null, refresh: null, attribution: "EU Weekly Oil Bulletin via EuroOilWatch" } });
function FuelWidget({ who, access, mode, initial, onChanged }){
  // mode: "compact" (Commit KPI card) · "strip" (Account, one row) · "config" (everything)
  const [fetched, setFetched] = useState(null);
  const [draft, setDraft] = useState({});
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [token, setToken] = useState(() => { try { return localStorage.getItem("modus_admin_token") || ""; } catch(e){ return ""; } });
  const canType = !!(access && access.can_approve);
  const load = (lazy) => fetch(`${API}/fuel-index?lazy=${lazy ? 1 : 0}`).then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => { setFetched(j); return j; })
    .catch(e => { setErr(`Couldn't read the fuel index (${e}).`); return null; });
  useEffect(() => {
    let live = true, timer = null;
    const poll = (j) => {
      if(!live || !j) return;
      const rf = j.index && j.index.refresh;
      if(rf && rf.running){ timer = setTimeout(() => load(false).then(poll), 3000); }
      else if(rf && rf.finished_at && onChanged && j.__polled){ onChanged(); }
    };
    load(true).then(j => { if(j && j.index && j.index.refresh && j.index.refresh.running){ j.__polled = true; } poll(j); });
    return () => { live = false; if(timer) clearTimeout(timer); };
  }, []);
  const data = fetched || costingToData(initial);
  const idx = (data && data.index) || {};
  const fuelS = (data && data.fuel) || {};
  const sum = (data && data.summary) || {};
  const rf = idx.refresh || {};
  const put = async (path, body, method, admin) => {
    setBusy(true); setErr("");
    try {
      if(admin){ try { localStorage.setItem("modus_admin_token", token); } catch(e){} }
      const qs = admin && token ? `?token=${encodeURIComponent(token)}` : "";
      const r = await fetch(`${API}${path}${qs}`, { method: method || "PUT", headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
      if(!r.ok) throw new Error((await r.text()).slice(0, 200).replace(/^\{"detail":"|"\}$/g, ""));
      const j = await r.json(); setFetched(j); setDraft({});
      if(onChanged) onChanged();
    } catch(e){ setErr(String(e.message || e)); }
    setBusy(false);
  };
  const saveSetting = (k) => {
    if(draft[k] === undefined) return;
    const v = draft[k] === "" ? null : numOr(draft[k], null);
    if(draft[k] !== "" && v === null){ setErr(`${k === "share_pct" ? "Fuel share" : "Yard price"} must be a number.`); return; }
    put("/fuel-index/settings", { [k]: v, updated_by: who || null });
  };
  const hasIndex = idx.eur_per_l != null;
  const price = hasIndex ? `${CUR()}${(+idx.eur_per_l).toFixed(3)} / L` : null;
  // H1 (29 Sep 2026): no fallback to Estonia. The index country is the tenant's own
  // (or the one typed on Config); "--" means the tenant has no country — typed only.
  const rawCountry = fuelS.country || (idx.country || "") || TENANT.country || "--";
  const noCountry = rawCountry === "--" || !!idx.no_country;
  const country = noCountry ? "no country" : rawCountry;
  const exVat = hasIndex && idx.ex_vat_per_l != null ? `${CUR()}${(+idx.ex_vat_per_l).toFixed(3)} / L ex-VAT` : null;
  const bafTxt = sum.baf_pct != null
    ? `BAF ${sum.baf_pct >= 0 ? "+" : ""}${(sum.baf_pct * 100).toFixed(2)} % of quote`
    : sum.baf_reason === "no base" ? "BAF: set a base on Confirm week"
    : sum.baf_reason === "no share" ? "BAF: type a fuel share"
    : "BAF: no index";
  const baseTxt = fuelS.baf_base_eur_per_l != null ? `base ${CUR()}${(+fuelS.baf_base_eur_per_l).toFixed(3)} · ${fuelDate(fuelS.baf_base_bulletin_date)}` : "no base locked";
  const staleChip = hasIndex && idx.stale ? <span className="ml-1 text-xs font-semibold px-1.5 py-0.5 rounded-full" style={{ color: "var(--warn-text)", background: "rgba(217,119,6,.10)" }} title="The last good published price is older than 8 days">stale</span> : null;
  const inputCls = "border border-slate-300 rounded px-1.5 py-0.5 text-xs text-right tabular-nums w-20";
  const setting = (k, label, placeholder, title) => (
    <label className="inline-flex items-center gap-1 text-xs text-slate-600" title={title}>
      <span>{label}</span>
      {canType ? (
        <input className={inputCls} inputMode="decimal" placeholder={placeholder}
          value={draft[k] ?? (fuelS[k] ?? "")}
          onChange={e => setDraft(d => ({ ...d, [k]: e.target.value }))}
          onBlur={() => saveSetting(k)} disabled={busy} />
      ) : <span className="tabular-nums">{fuelS[k] ?? "—"}</span>}
    </label>
  );
  // The series the index belongs to — the provider the API names (the EU bulletin for
  // EU-27, DESNZ weekly road fuel prices for GB), or a typed national figure where there
  // is none (Norway…) and for a tenant with no country. Nothing here names a country.
  const prov = idx.provider || (idx.auto_available ? TENANT.fuel_provider : null);
  const autoIdx = idx.auto_available != null ? !!idx.auto_available : !!TENANT.fuel_index_auto;
  const provTitle = prov ? `${prov.label} — ${prov.series || ""}${prov.unit ? ` (${prov.unit})` : ""}` : "";
  const attribution = <span className="text-xs text-slate-500"
    title={!autoIdx ? (noCountry ? "no country set on Config → Tenant — the index is typed by an admin" : "no automatic diesel series for this country — typed by an admin on Config")
                    : (idx.source === "manual" ? `typed by an admin on Config (the automatic series is ${provTitle})` : provTitle)}>
    {!autoIdx ? "typed index · " + (noCountry ? "no country set" : "no automatic series for " + country)
              : (idx.source === "manual" ? "typed index" : (prov ? prov.label : "automatic index"))}
    {exVat ? <span className="ml-1" title="the published pump price includes VAT; this is the same figure with VAT removed">· {exVat}</span> : null}</span>;

  if(mode === "compact"){
    return (
      <div className="bg-white rounded-xl border border-slate-200 px-4 py-3 min-w-0" data-fuel-widget="compact" title={hasIndex ? String(price) : ""}>
        <div className="text-lg leading-8 font-bold tabular-nums truncate" style={{ color: "var(--navy-deep)" }}>
          {hasIndex ? price : <span className="text-base text-amber-700">Index unavailable</span>}{staleChip}
        </div>
        <div className="text-xs uppercase tracking-wide text-slate-500 mt-0.5">
          diesel {country} · {hasIndex ? `${autoIdx && idx.source !== "manual" ? "published" : "typed"} ${fuelDate(idx.bulletin_date)}` : "type a price on Config"}{rf.running ? " · updating…" : ""}
        </div>
        <div className="text-xs text-slate-500 mt-0.5" title={bafTxt}>{bafTxt}</div>
      </div>
    );
  }
  return (
    <div className={"rounded-xl border border-slate-200 bg-white " + (mode === "config" ? "p-4" : "px-4 py-2.5 mb-3")} data-fuel-widget={mode || "strip"}>
      <div className="flex flex-wrap items-center gap-x-4 gap-y-1.5">
        <div className="flex items-baseline gap-2 min-w-0">
          <span className="text-xs uppercase tracking-wide text-slate-500">Diesel {country}</span>
          {hasIndex ? <span className="text-lg font-bold tabular-nums" style={{ color: "var(--navy-deep)" }}>{price}</span>
                    : <span className="text-sm font-semibold text-amber-700">Index unavailable — {canType ? "type a price" : "not set"}</span>}
          {staleChip}
          <span className="text-xs text-slate-500">{hasIndex ? `${autoIdx && idx.source !== "manual" ? "published" : "typed"} ${fuelDate(idx.bulletin_date)}` : (idx.last_error ? `feed: ${String(idx.last_error).slice(0, 60)}` : "")}</span>
          {rf.running && <span className="text-xs text-slate-500">updating…</span>}
          {!rf.running && idx.last_error && hasIndex && <span className="text-xs" style={{ color: "var(--red)" }} title={idx.last_error}>· last fetch failed {String(idx.last_attempt_at || "").replace("T", " ").slice(0, 16)}; the stored bulletin stands</span>}
        </div>
        {setting("yard_eur_per_l", `Yard ${CUR()}/L`, "—", "What the haulier actually pays at the yard. Optional; for cost-plus later. Never replaces the published index.")}
        {setting("share_pct", "Fuel share %", "—", "Fuel's share of the haulage price, 0–100. Empty = no BAF line.")}
        <span className="text-xs font-semibold tabular-nums" style={{ color: sum.baf_pct != null ? "var(--navy)" : "var(--muted)" }} title={baseTxt}>{bafTxt}</span>
        <span className="text-xs text-slate-500">{baseTxt}</span>
        <span className="ml-auto">{attribution}</span>
      </div>
      {mode === "config" && (
        <div className="mt-3 pt-3 border-t border-slate-100 flex flex-wrap items-center gap-x-4 gap-y-2 text-xs text-slate-600">
          <span className="text-xs uppercase tracking-wide text-slate-500">Admin</span>
          <input value={token} onChange={e => setToken(e.target.value)} placeholder="Admin token" className="border border-slate-200 rounded px-2 py-0.5 text-xs w-32" />
          {autoIdx && <button onClick={() => put("/admin/fuel-index/refresh?sync=1", null, "POST", true)} disabled={busy || rf.running}
            className="btn-sec btn-sm disabled:opacity-40">{prov && prov.key === "desnz" ? "Fetch this week's DESNZ price now" : "Fetch the bulletin now"}</button>}
          <label className="inline-flex items-center gap-1">

            <input type="date" className="border border-slate-300 rounded px-1.5 py-0.5 text-xs" value={draft.manual_date ?? ""} onChange={e => setDraft(d => ({ ...d, manual_date: e.target.value }))} />
            <button onClick={() => put("/admin/fuel-index/manual", { eur_per_l: numOr(draft.manual_eur, null), bulletin_date: draft.manual_date || "", updated_by: who || null }, "PUT", true)}
              disabled={busy || !draft.manual_eur || !draft.manual_date}
              className="btn-sec btn-sm disabled:opacity-40"
              title="When the feed is down: writes the same index row, marked 'typed'. It is the INDEX, not the yard price.">Use this index</button>
          </label>
          <button onClick={() => { if(confirm("Clear the locked BAF base? The next Confirm week will lock a fresh one from the index of that day.")) put(`/admin/fuel-index/reset-base?updated_by=${encodeURIComponent(who || "")}`, null, "POST", true); }}
            disabled={busy || fuelS.baf_base_eur_per_l == null}
            className="btn-sec btn-sm disabled:opacity-40" style={{ borderColor: "var(--red)", color: "var(--red)" }}>Reset the BAF base</button>
          <span className="w-full text-xs text-slate-500">The base is locked by the first Confirm week that finds an index and no base; later confirms never move it. BAF = (index ÷ base − 1) × fuel share, applied as a second figure beside every quote — the quote itself is never replaced. One base per tenant, not per haulier.</span>
        </div>
      )}
      {err && <div className="text-xs mt-1" style={{ color: "var(--red)" }}>{err}</div>}
    </div>
  );
}

// `initialPage` / `initialView` exist for the render harness only — useEffect does not run
// under renderToStaticMarkup, so without them the populated views could never be rendered
// in a test. The app never passes them.
function LookAhead({ meta, who, access, initialPage, initialView }){
  const { months } = meta;
  const [view, setView] = useState(() => { if(initialView) return initialView; try { return localStorage.getItem("modus_la_view") || "commit"; } catch(e){ return "commit"; } });
  const [bucket, setBucket] = useState("commit");        // 'commit' = the week containing today · 'next' = the Thursday process
  const [page, setPage] = useState(initialPage || null);
  const [err, setErr] = useState("");
  const [tick, setTick] = useState(0);
  const [busy, setBusy] = useState("");
  const [editing, setEditing] = useState(null);   // 10 Oct: the one day cell that is an input (mockup 3)
  const [draft, setDraft] = useState({});                // key -> unsaved input
  const [laOpen, laToggle] = useRowOpen("lookahead");    // 13 Oct 2026 (W6): line key -> details open, for the session
  const [unitSel, setUnitSel] = useUnits("lookahead");     // the grid's Loads | Tonnes | Lorries
  const [railOpen, setRailOpen] = useState(false);
  const [confirming, setConfirming] = useState(false);   // the whole-week flag dialog
  const [flags, setFlags] = useState({ weather: "", wetness: "", traffic: "", other: "" });
  const pick = (v) => { setView(v); try { localStorage.setItem("modus_la_view", v); } catch(e){} };

  // Road restrictions (Tark Tee for EE, National Highways closures for GB — H1) — the page
  // carries the STORED per-route check (a DB read).
  // The live check (six services + a geometry loop) froze the page on 09 Sep and took
  // 30 s+ off the path; it now runs on demand in the background, and this polls its
  // state while it runs. A route never checked is named, never shown clean.
  const [tt, setTt] = useState({ status: "unknown", refresh: null });
  const [ttPolling, setTtPolling] = useState(false);
  const refreshTarkTee = async () => {
    try {
      const r = await fetch(`${API}/forecast-weeks/restrictions/refresh`, { method: "POST" });
      if(!r.ok) throw new Error(`${r.status}`);
      setTtPolling(true);
    } catch(e){ setErr("Couldn't start the road-restriction check: " + e.message); }
  };
  useEffect(() => {
    let live = true;
    setErr("");
    fetch(`${API}/lookahead?bucket=${bucket}`)
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(j => { if(live){ setPage(j); setDraft({}); } })
      .catch(e => { if(live) setErr(`Couldn't load the look-ahead (${e}).`); });
    return () => { live = false; };
  }, [bucket, tick]);
  useEffect(() => {
    if(!ttPolling || initialPage) return;
    let live = true;
    const tickPoll = () => fetch(`${API}/forecast-weeks/restrictions?bucket=${bucket}`)
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(j => {
        if(!live) return;
        setTt({ status: j.status, refresh: j.refresh });
        if(j.refresh && j.refresh.running){ setTimeout(tickPoll, 4000); }
        else { setTtPolling(false); setTick(t => t + 1); }     // done — re-read the page, flags included
      })
      .catch(() => { if(live){ setTtPolling(false); } });
    tickPoll();
    return () => { live = false; };
  }, [ttPolling, bucket]);

  const send = (path, body, method) => {
    setBusy(path);
    return fetch(`${API}${path}`, { method: method || "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(async r => { if(!r.ok){ throw new Error((await r.text()).slice(0, 200)); } return r.json(); })
      .then((j) => { setTick(t => t + 1); setErr(""); return j; })
      .catch(e => { setErr(String(e.message || e)); return null; })
      .finally(() => setBusy(""));
  };

  const cw = (page && page.commit_week) || {};
  const commit = (page && page.commit) || { lines: [], totals: {} };
  const lines = commit.lines || [];
  const totals = commit.totals || {};
  const account = (page && page.account) || { rows: [] };
  const horizon = (page && page.horizon) || { rows: [] };
  const rail = (page && page.clashes) || { flags: [], count: 0, sources: {} };
  const ttSrc = rail.sources || {};
  const ttRunning = ttPolling || !!(ttSrc.restrictions_refresh && ttSrc.restrictions_refresh.running);
  // the provider's own words for the status line — "Road restrictions (Tark Tee)" /
  // "Road closures (National Highways)"; a tenant with no provider never sees the line
  const ttName = ttSrc.restrictions_ui_label || "Road restrictions";
  const ttShort = (ttName.includes("(") ? ttName.slice(ttName.indexOf("(") + 1, -1) : ttName);
  const today = page ? page.today : null;
  // Mon–Fri only (10 Sep, the human). The weekend days still exist at 0 in the database
  // — the sum rule and the export see them — but the grid does not show them.
  const dates = lines.length ? lines[0].days.map(d => d.day_date).filter(iso => !isWeekend(iso)) : [];
  const weekdaysOf = (line) => (line.days || []).filter(d => !isWeekend(d.day_date));
  const flagsByLine = useMemo(() => {
    const g = {};
    (rail.flags || []).forEach(f => { const k = lineKeyOf(f); (g[k] || (g[k] = [])).push(f); });
    return g;
  }, [rail]);
  const allConfirmed = lines.length > 0 && lines.every(l => l.week && l.week.status === "confirmed");
  const anyConfirmed = lines.some(l => l.week && l.week.status === "confirmed");

  // ---- writes ------------------------------------------------------------------
  const saveDay = (line, d) => {
    const k = `${lineKeyOf(line)}|${d.day_date}|p`;
    const v = draft[k];
    if(v === undefined) return;
    send("/forecast-days", { route_id: line.route_id, month_index: line.month_index,
      discipline: line.discipline || "", section_id: line.section_id || "",
      day_date: d.day_date, planned_qty: numOr(v, d.planned_qty), edited_by: who || null }, "PUT");
  };
  const saveActual = (r) => {
    const kq = wkKey(r) + "|a", kn = wkKey(r) + "|n", kc = wkKey(r) + "|c";
    if(draft[kq] === undefined && draft[kn] === undefined && draft[kc] === undefined) return;
    const v = draft[kq] !== undefined ? draft[kq] : (r.actual_qty ?? "");
    // an emptied box clears the actual back to "not reported", which is NOT zero. The
    // confirmed cost is sent ONLY when it was touched — an absent field leaves it alone.
    const body = { ...wkBody(r), actual_qty: (v === "" || v == null ? null : numOr(v, null)),
      actual_note: draft[kn] !== undefined ? draft[kn] : (r.actual_note ?? null),
      actual_by: who || null };
    if(draft[kc] !== undefined) body.actual_cost_eur = (draft[kc] === "" ? null : numOr(draft[kc], null));
    send("/forecast-weeks/actual", body, "PUT");
  };
  // 10 Sep: one stockpile's consumption for the account week. Empty = "not typed" (null),
  // not zero. The same PUT the old Horizon grid used; nothing new on the server.
  const saveConsumed = (s) => {
    const k = `stock|${s.location_id}`;
    const v = draft[k];
    if(v === undefined || !account.week) return;
    send("/stockpiles/consume", { location_id: s.location_id, month_index: account.week.month_index,
      week_index: account.week.week_index, consumed_qty: (v === "" ? null : numOr(v, null)),
      unit: s.unit, note: null, updated_by: who || null }, "PUT");
  };
  const doConfirm = async () => {
    // L6: ONE button, the whole week — every line in the bucket, the same four notes
    setConfirming(false);
    for(const l of lines){
      if(l.week && l.week.status === "confirmed") continue;
      const j = await send("/forecast-weeks/confirm", { ...wkBody(l.week), confirmed_by: who || null, ...flags });
      if(!j) break;
    }
  };
  const doReopen = async () => {
    if(!confirm("Re-open this week? Its plan becomes editable again and calibrate can reach it. Nothing is deleted.")) return;
    for(const l of lines){
      if(!(l.week && l.week.status === "confirmed")) continue;
      const j = await send("/forecast-weeks/reopen", { ...wkBody(l.week), reopened_by: who || null });
      if(!j) break;
    }
  };
  // "spread on this week": the shortage of ONE account line, carried into the commit
  // week and divided over its remaining weekdays. The only thing that writes next week.
  const doSpread = (row) => send("/forecast-weeks/calibrate", { ...wkBody(row), spread: true, by: who || null });
  const download = async (format) => {
    setBusy("export");
    try {
      const r = await fetch(`${API}/forecast-weeks/export?format=${format}&bucket=${bucket}`);
      if(!r.ok) throw new Error(`${r.status} ${(await r.text()).slice(0, 140)}`);
      const blob = await r.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `lookahead-${cw.from || "week"}.${format}`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    } catch(e){ setErr("Export failed: " + e.message); }
    setBusy("");
  };

  const fld = "w-24 border border-slate-300 rounded px-1.5 py-0.5 text-sm text-right tabular-nums outline-none focus:ring-2 focus:ring-[color:var(--blue)]";
  const pill = (id, label) => (
    <button key={id} onClick={() => pick(id)}
      className="px-4 py-2 rounded-lg text-sm font-semibold border"
      style={view === id ? { background: "var(--navy)", color: "var(--control-fg)", borderColor: "var(--navy)" }
                         : { background: "var(--surface)", color: "var(--muted)", borderColor: "var(--line)" }}>{label}</button>
  );
  const subtitle = view === "account"
    ? `Account is last week only · ${spanLabel(account.week && account.week.from, account.week && account.week.to)} · type what actually moved`
    : view === "commit"
    ? `Commit week is ${spanLabel(cw.from, cw.to)}${bucket === "next" ? " · next week, by the switch" : ""} · Mon–Fri only`
    : `Horizon is weeks, not days · ${monthLabelAbs(horizon.from_month || cw.month_index || 1, months.start_year)} + ${monthLabelAbs((horizon.to_month || (cw.month_index || 1) + 1), months.start_year)} · make-ready only`;

  return (
    <div className="max-w-[1500px] mx-auto p-5">
      <PageHeader title="Look-ahead" kicker={view === "commit" ? "Track · commit week" : view === "account" ? "Track · last week" : "Track · horizon"} subtitle={page ? subtitle : "Loading the commit week…"} />

      <div className="flex flex-wrap items-center gap-2 mb-4" data-guide="lookahead-tabs">
        {pill("account", "Account")}
        {pill("commit", bucket === "next" ? "Commit · next week" : "Commit · this week")}
        {pill("horizon", "Horizon")}
        {/* the Thursday switch: which bucket the Commit and Account views look at */}
        <span className="ml-2 inline-flex rounded-lg border border-slate-300 overflow-hidden text-xs">
          {[["commit", "this week"], ["next", "next week"]].map(([b, l]) => (
            <button key={b} onClick={() => setBucket(b)} className="px-2.5 py-1.5 font-semibold"
              title={b === "next" ? "Commit NEXT week's plan now (e.g. on a Thursday). Its days are created when you open it." : "The week that contains today"}
              style={bucket === b ? { background: "var(--navy-soft)", color: "var(--navy)" } : { color: "var(--muted)" }}>{l}</button>
          ))}
        </span>
        {view === "commit" && (
          <span className="ml-auto flex items-center gap-2">
            <button onClick={() => download("xlsx")} disabled={!!busy || !lines.length}
              className="px-4 py-2 rounded-lg text-sm font-semibold border disabled:opacity-40"
              style={{ borderColor: "var(--navy)", color: "var(--navy)", background: "var(--surface)" }}>Export XLSX</button>
            <button onClick={() => download("pdf")} disabled={!!busy || !lines.length}
              className="px-3 py-2 rounded-lg text-sm font-semibold border disabled:opacity-40"
              title="The one-page commitment sheet, grouped by origin"
              style={{ borderColor: "var(--line)", color: "var(--muted)", background: "var(--surface)" }}>PDF</button>
            {allConfirmed ? (
              <button onClick={doReopen} disabled={!!busy}
                className="px-4 py-2 rounded-lg text-sm font-semibold border disabled:opacity-40"
                style={{ borderColor: "var(--red)", color: "var(--red)", background: "var(--surface)" }}>Re-open week</button>
            ) : (
              <button onClick={() => setConfirming(true)} disabled={!!busy || !lines.length}
                className="px-4 py-2 rounded-lg text-sm font-semibold disabled:opacity-40"
                title="Whole week, every line, one act. Planned cells lock; actuals stay typeable."
                style={{ background: "var(--ok-btn)", color: "var(--ok-btn-fg)" }}>{anyConfirmed ? "Confirm remaining lines" : "Confirm week"}</button>
            )}
          </span>
        )}
      </div>

      {err && <div className="rounded-lg border p-3 text-sm mb-3"
        style={{ borderColor: "var(--red)", color: "var(--red)", background: "rgba(191,46,85,.06)" }}>{err}</div>}

      {!page ? <div className="p-8 text-center text-slate-400">Loading…</div>
      : view === "commit" ? (
        <>
          {/* KPI strip — six cards; only the shortage is coloured */}
          <div className="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-8 gap-3 mb-3">
            <LaKpi value={`${grp(totals.planned_t)} t`} caption="planned this week" />
            <LaKpi value={grp(totals.trips)} caption="trips" />
            <LaKpi value={grp(totals.vehicles_peak)} caption={"vehicles / day peak" + (totals.excludes_unbaked ? " · lines not routed yet left out" : "")} />
            <LaKpi value={grp(dist(totals.tonne_km))} caption={`${TKM()} · route basis`} />
            {/* 10 Sep evening: the diesel index, right of t·km — the same widget as Account and Config */}
            <FuelWidget mode="compact" who={who} access={access} initial={page && page.costing} onChanged={() => setTick(t => t + 1)} />
            <LaKpi value={totals.eur == null ? "—" : `${CUR()} ` + grp(totals.eur)}
              caption={totals.eur == null ? `planned ${CUR()} · no rate typed, no target set`
                : `planned ${CUR()} · ${totals.eur_lines} of ${totals.lines} lines priced${totals.eur_target_lines ? ` · ${totals.eur_target_lines} at target` : ""}${totals.eur_partial ? " · partial" : ""}${totals.eur_adj != null ? ` · + BAF ${CUR()} ${grp(totals.eur_adj)}` : ""}${totals.fair_eur != null ? ` · fair ${CUR()} ${grp(totals.fair_eur)} (model, ${totals.fair_lines} of ${totals.lines})` : ""}`} />
            <LaKpi value={account.shortfall > 0 ? `+${grp(account.shortfall)}` : "0"} tone={account.shortfall > 0 ? "red" : undefined} caption="last week shortage" />
            <LaKpi value={account.lines ? `${account.delivered} of ${account.lines} lines` : "—"} caption="last week delivered" />
          </div>

          {/* the clash rail — ONE row, flags run together, +N more */}
          {rail.count > 0 && (
            <div className="card px-4 py-3 mb-3 text-sm flex items-start gap-4 flex-wrap" data-guide="lookahead-flags">
              <span className="font-semibold shrink-0">{rail.count} flag{rail.count === 1 ? "" : "s"} this week</span>
              <span className="min-w-0 flex-1 leading-6 flex flex-wrap gap-x-4 gap-y-1">
                {(railOpen ? rail.flags : rail.flags.slice(0, 3)).map((f, i) => (
                  <span key={i} className="chip-st"><i style={{ background: laTone(f.code) === "warn" ? "var(--gold)" : "var(--red)" }} aria-hidden="true"></i><span className="font-semibold">{flagWord(f)}</span>&nbsp;{teamText(f.text)}</span>
                ))}
              </span>
              {rail.count > 3 && (
                <button onClick={() => setRailOpen(o => !o)} className="shrink-0 font-semibold hover:underline">
                  {railOpen ? "show fewer" : `+${rail.count - 3} more`}
                </button>
              )}
            </div>
          )}
          {/* H1: the line reads the provider's words from the page; a tenant with no
              provider (status "off"/"skipped" with no provider) sees nothing here. */}
          {lines.length > 0 && ttSrc.restrictions !== "skipped" && ttSrc.restrictions !== "off" && ttSrc.restrictions_provider && (
            <div className={"text-[13px] mb-3 flex flex-wrap items-center gap-2 " + (ttSrc.restrictions === "ok" ? "text-slate-500" : "text-amber-700")}>
              <span>
                {ttRunning ? `checking ${ttName.toLowerCase()} — this takes a minute; the page will refresh when it finishes…`
                 : ttSrc.restrictions === "ok" ? `${ttName}: checked ${(ttSrc.restrictions_checked_at || "").replace("T", " ").slice(0, 16)} UTC${ttSrc.restrictions_week ? ` · flags shown for the week ${ttSrc.restrictions_week[0]} → ${ttSrc.restrictions_week[1]}` : ""}`
                 : ttSrc.restrictions === "partial" ? `${ttName}: ${(ttSrc.restrictions_unchecked || []).join(", ")} not checked since the route was worked out — the rest as of ${(ttSrc.restrictions_checked_at || "").slice(0, 10)}`
                 : `${ttName}: NOT checked for these routes — that is not the same as "no restrictions".`}
              </span>
              {!ttRunning && (
                <button onClick={refreshTarkTee} className="font-semibold underline hover:no-underline">
                  {ttSrc.restrictions === "ok" ? "re-check" : "check now"}
                </button>
              )}
              {ttSrc.restrictions_refresh && ttSrc.restrictions_refresh.status === "unavailable" && !ttRunning && (
                <span style={{ color: "var(--red)" }}>· the last check could not reach {ttShort}; the stored result stands</span>
              )}
            </div>
          )}

          {lines.length === 0 ? (
            <EmptyState title={`No approved forecast line in the commit week (${spanLabel(cw.from, cw.to)}).`}
              body="Days exist only for Approved month lines. Approve a line for this month, or switch to next week." />
          ) : (
            // 13 Oct 2026 (W6, bundle F): RowDetails. The row: the route's two ends (primary), the team and the material
            // (chips), ONE status (the most serious flag, ROAD LIMIT first, else the week's state: decision 1), one figure a
            // day in the unit the switch picks, the week. Typing a day's plan is in Tonnes only (decision 2). The old second
            // line, the ▶ row's long string, every flag's sentence, the other units a day and every cell's hover title are
            // in the details row.
            <div className="card overflow-hidden" data-rd-card="lookahead">
              <div className="rd-bar">
                <UnitSwitch value={unitSel} onChange={setUnitSel} note={unitSel !== "tonnes" ? "Switch to Tonnes to type a day's plan." : null} />
              </div>
              <div className="overflow-auto rd-scroll">
                <table className="tbl compact rd-table" data-rd-table="lookahead" style={{ minWidth: `${440 + dates.length * 96}px` }}>
                  <caption><b>{unitSel === "loads" ? "Loads by day" : unitSel === "lorries" ? "Lorries needed by day" : "Planned quantity by day"}</b><InfoTip id="la.commit" /></caption>
                  <thead>
                    <tr>
                      <th className="la-stick" style={{ minWidth: 280 }}>Route</th>
                      <th>Status</th>
                      {dates.map(iso => {
                        const t = iso === today;
                        return (
                          <th key={iso} className="num" style={t ? { background: "var(--navy-soft)" } : {}}>
                            <span style={t ? { color: "var(--navy)" } : {}}>{dayName(iso)} {dayNum(iso)}{t ? ", today" : ""}</span>
                          </th>
                        );
                      })}
                      <th className="num">Week</th>
                    </tr>
                  </thead>
                  <tbody>
                    {lines.map(line => {
                      const c = line.context || {};
                      const lk = lineKeyOf(line);
                      const lf = flagsByLine[lk] || [];
                      const w = line.week || {};
                      const locked = w.status === "confirmed";
                      const wd = line.week_derived || {};
                      const st = laStatus(lf, w);
                      const teamWord = iptKey(c.ipt) ? teamName(iptKey(c.ipt)) : `No ${TEAM().toLowerCase()}`;
                      const veh = c.vehicle_short || vehLabel(c.vehicle_type) || "—";
                      const own = line.unit && line.unit !== "t" ? ` ${unitLbl(line.unit)}` : "";
                      return (
                        <RowDetails key={lk} rowKey={"la-" + lk} isOpen={laOpen(lk)} onToggle={() => laToggle(lk)} colSpan={3 + dates.length}
                          label={`Details for ${line.route_id}${line.discipline ? ", " + line.discipline : ""}`}
                          firstClass="la-stick" firstStyle={{ minWidth: 280 }}
                          rowProps={{ "data-la-line": lk }}
                          summary={<>{c.origin_name || line.route_id} <span className="text-slate-400 font-normal">→</span> {c.dest_name || "—"}</>}
                          chips={[teamWord, c.material_type || null]}
                          cells={<>
                            <td className="rd-status" data-label="Status"><RowStatus word={st.word} tone={st.tone} more={st.more} /></td>
                            {weekdaysOf(line).map(d => {
                              const k = `${lk}|${d.day_date}|p`;
                              const t = d.day_date === today;
                              const f = d.derived || {};
                              const typed = d.status === "edited" && <span className="ml-1 text-amber-700" role="img" aria-label="typed by hand">✎</span>;
                              return (
                                <td key={d.day_date} className="num" data-label={`${dayName(d.day_date)} ${dayNum(d.day_date)}`} style={t ? { background: "var(--navy-soft)" } : {}}>
                                  {/* ⭐ Editable while the week is not confirmed — this week or next,
                                      whichever bucket is open. A confirmed week's plan is read-only
                                      (L6); re-open it to change it. 10 Oct: the cell reads as a figure
                                      and becomes an input when clicked (mockup 3), so the grid reads
                                      as a table until someone types. 13 Oct (W6): in Tonnes only. */}
                                  {unitSel === "loads" ? <span className="tabular-nums">{grp(f.trips)}</span>
                                   : unitSel === "lorries" ? (c.baked ? <span className="tabular-nums">{grp(f.vehicles)}</span> : <span className="text-amber-700">—</span>)
                                   : !locked && editing === k ? (
                                    <input autoFocus className={fld + " font-semibold"} inputMode="decimal"
                                      aria-label={`${dayName(d.day_date)}'s plan (${unitLbl(line.unit)})`}
                                      value={draft[k] ?? (d.planned_qty ?? "")}
                                      onChange={e => setDraft(x => ({ ...x, [k]: e.target.value }))}
                                      onKeyDown={e => { if(e.key === "Enter" || e.key === "Escape") e.currentTarget.blur(); }}
                                      onBlur={() => { saveDay(line, d); setEditing(null); }} />
                                  ) : !locked ? (
                                    <button type="button" className="la-cell" onClick={() => setEditing(k)}
                                      aria-label={`${dayName(d.day_date)}'s plan, ${grp(draft[k] ?? d.planned_qty, 1)} ${unitLbl(line.unit)}: click to type`}>{grp(draft[k] ?? d.planned_qty, 1)}{own}</button>
                                  ) : (
                                    <span className="tabular-nums font-semibold text-slate-700">{grp(d.planned_qty, 1)}{own}</span>
                                  )}
                                  {typed}
                                </td>
                              );
                            })}
                            <td className="num font-semibold" data-label="Week">
                              {unitSel === "loads" ? grp(wd.trips)
                               : unitSel === "lorries" ? (c.baked && wd.vehicles_peak != null ? grp(wd.vehicles_peak) : "—")
                               : <>{grp(w.planned_qty, 1)} <span className="text-slate-400 font-normal text-[13px]">{unitLbl(line.unit)}</span></>}
                            </td>
                          </>}>
                          <RdItem t="Route">{line.route_id}</RdItem>
                          <RdItem t={TEAM()}>{teamWord}</RdItem>
                          <RdItem t="Discipline">{line.discipline || null}</RdItem>
                          <RdItem t="Section">{c.section_id || "None set"}</RdItem>
                          <RdItem t="Material">{c.material_type || "—"}</RdItem>
                          <RdItem t="Vehicle">{veh}</RdItem>
                          <RdItem t="Vehicle, full name">{c.vehicle_type && vehLabel(c.vehicle_type) !== veh ? vehLabel(c.vehicle_type) : null}</RdItem>
                          <RdItem t="This week">{laWeekWords(w.status)}</RdItem>
                          <RdItem t="Parent month changed" wide bad>{w.parent_changed ? "The parent month's quantity changed after this week was set. This week was deliberately not refreshed." : null}</RdItem>
                          <RdItem t="Days and week disagree" wide bad>{line.days_ne_week ? `The days add up to ${grp(line.days_sum, 1)} ${unitLbl(line.unit)}, not the week's ${grp(w.planned_qty, 1)}.` : null}</RdItem>
                          {laFlagGroups(lf).map(g => <RdItem key={g.code} t={g.word} wide bad={g.tone === "bad"}>{g.texts.map((x, i) => <div key={i}>{x}</div>)}</RdItem>)}
                          <RdItem t="By day" wide>
                            <table className="rd-days">
                              <thead><tr><th scope="col">Day</th><th scope="col">Plan ({unitLbl(line.unit)})</th><th scope="col">Tonnes</th><th scope="col">Loads</th><th scope="col">Lorries</th><th scope="col"><span className="sr-only">Typed</span></th></tr></thead>
                              <tbody>{weekdaysOf(line).map(d => { const f = d.derived || {}; return (
                                <tr key={d.day_date}><td>{dayName(d.day_date)} {dayNum(d.day_date)}</td><td>{grp(d.planned_qty, 1)}</td>
                                  <td>{f.tonnes != null ? grp(f.tonnes, 1) : "—"}</td><td>{grp(f.trips)}</td><td>{c.baked ? grp(f.vehicles) : "—"}</td>
                                  <td>{d.status === "edited" ? "typed by hand" : ""}</td></tr>); })}</tbody>
                            </table>
                          </RdItem>

        </>

            const roleLbl = { account: "ACCOUNT", commit: "COMMIT", "make-ready": "MAKE-READY", "early-warning": "EARLY WARNING" };
            return (
              <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">

                            const status = r.actual_qty != null
                              ? <span style={{ color: short ? "var(--red)" : "var(--ok-text)" }}>actual {grp(r.actual_qty, 1)} · {short ? `+${grp(r.variance, 1)} short${r.calibrated_at ? " · carried" : ""}` : "held"}</span>
                              : r.status === "confirmed" ? <span style={{ color: "var(--ok-text)" }}>confirmed</span>
                              : r.status === "edited" ? <span className="text-amber-700">edited{role === "commit" ? " · open days" : ""}</span>
                              : <span className="text-slate-400">derived ÷{weekNosOf(horizon, m).length}</span>;
                            return (
                              <td key={`${m}|${w}`} className="px-2 py-2 border-r border-slate-100 whitespace-nowrap" style={role === "commit" ? { background: "var(--navy-soft)" } : {}}>
                                <div className="font-semibold tabular-nums text-slate-800">{grp(r.planned_qty, 1)} {unitLbl(line.unit)}</div>

                </div>

          })()}

// loads zones, restrictions and months of matrix, and the human does not want the page
// slow). One fetch to /api/lookahead/geometry with the route ids the page already has;
// nothing here reads the page again. The map is created once and kept for the life of

// desk (Raken's daily-log pattern; backlog §6 item 6). It READS the same page the desk Look-ahead reads (one GET of
// /lookahead) and has no write at all: no day cell to type, no Confirm week, no Account, no fuel price, no re-check
// (D9: read-only first). The Day sheet is a one-page PDF of the chosen day (D9: yes), built by the export module from
// that same read. Every figure on the card is the server's own for that day (derived.tonnes / trips / vehicles).
const LONG_DAY = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const LONG_MONTH = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const phDayWords = (iso) => { const d = new Date(iso + "T00:00:00"); return `${LONG_DAY[d.getDay()]} ${d.getDate()} ${LONG_MONTH[d.getMonth()]}`; };
// the five weekdays of the open week: from the lines' days, else from the week's Monday (a week with no line)
const phWeekdays = (lines, cw) => {
  if(lines.length) return lines[0].days.map(d => d.day_date).filter(iso => !isWeekend(iso));
  if(!cw || !cw.from) return [];
  const out = [], d0 = new Date(cw.from + "T00:00:00");
  for(let n = 0; n < 7 && out.length < 5; n++){
    const d = new Date(d0); d.setDate(d0.getDate() + n);
    const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    if(!isWeekend(iso)) out.push(iso);
  }
  return out;
};
const PH_FIRST = 6;    // lines shown before "Show N more"

                </button>

              </div>
            </div>
          )}
          <p className="ph-note" style={{ marginTop: 12 }}>Figures are planning figures, not plated weights. To type a day's plan, confirm the week or record what moved, open the Look-ahead on a desktop.</p>
        </>
      )}

  );

// ---- 16 Oct 2026 (S7): the Simulation on the staff Dashboard -----------------------------------------------------
// The haulage simulation the user approved as an example on 16 Oct (notes/sim-example-1016/), as a Dashboard section
// (D86: here and nowhere else; never on the public map, D36 / D58). GET /api/sim/day?month=N (backend/sim.py, the one
// engine) is read the FIRST time the section is opened, with each route's line (legs=1) once a month; a scenario
// change reads the day again with the scenario as query parameters. Nothing is saved and nothing goes in the address.
// The SERVER works out every figure: whole loads, each arrival's minute, check-in, wait and departure, the busiest
// hour, the bottleneck (D85), minutes lost, late check-ins. The browser DRAWS: where each lorry is at the clock's
// minute (along its own route's line at the speeds the server sends, or in its gate's one lane) and the waiting count
// over the day. Dots, not icons (D81); the month's average day (D82); about 60 s a day at 1× (D83). Its own map, like
// CommitMap; the never-unmounted Mapbox instance is Data Management's and is not touched. Below 768 px: the table only.
const SIM_PLAY_SECONDS = 60;
const SIM_QUEUE_M = 25;                 // drawing only: a waiting lorry every 25 m back along its own road
const SIM_SPEEDS = [["0.5", "½×"], ["1", "1×"], ["2", "2×"], ["4", "4×"]];
const SIM_SC0 = () => ({ all: null, hours: {}, check_in: {}, bands: null, pour: { on: false, gate: "", start: "10:00", m3: "160", mpl: "", rate: "60" } });
const simHM = (m) => { if(m == null || !isFinite(m)) return "—"; const r = Math.round(m); return String(Math.floor(r / 60)).padStart(2, "0") + ":" + String(((r % 60) + 60) % 60).padStart(2, "0"); };
const simN1 = (n) => n == null ? "—" : (+n).toFixed(1);
// the scenario as the query the server reads (scenario_from_query); nothing else carries it
function simQS(month, sc, legs){
  const q = [`month=${month}`];
  if(sc.all) q.push(`hours=${encodeURIComponent("all=" + sc.all[0] + "-" + sc.all[1])}`);
  Object.keys(sc.hours).forEach(g => q.push(`hours=${encodeURIComponent(g + "=" + sc.hours[g][0] + "-" + sc.hours[g][1])}`));
  Object.keys(sc.check_in).forEach(g => q.push(`check_in=${encodeURIComponent(g + "=" + sc.check_in[g])}`));
  if(sc.bands != null) q.push(`bands=${sc.bands ? "on" : "off"}`);
  const p = sc.pour;
  if(p.on && p.gate){
    q.push(`pour_gate=${encodeURIComponent(p.gate)}`, `pour_start=${encodeURIComponent(p.start)}`, `pour_m3=${encodeURIComponent(p.m3)}`, `pour_rate=${encodeURIComponent(p.rate)}`);
    if(p.mpl !== "") q.push(`pour_m3_per_load=${encodeURIComponent(p.mpl)}`);
  }
  if(legs) q.push("legs=1");
  return q.join("&");
}
// drawing: metres along a leg after `el` minutes of driving, from the server's parts [a, b, metres a minute, zone, t0, t1]
function simDistAt(parts, el){
  for(const p of parts){ if(el <= p[5]) return p[0] + (el - p[4]) * p[2]; }
  return parts.length ? parts[parts.length - 1][1] : 0;
}
// drawing: the point `d` metres along the leg's line
function simPointAt(leg, d){
  const c = leg.cum, n = c.length;
  d = Math.max(0, Math.min(leg.len_m, d));
  let lo = 0, hi = n - 1;
  while(hi - lo > 1){ const m = (lo + hi) >> 1; if(c[m] <= d) lo = m; else hi = m; }
  const seg = (c[hi] - c[lo]) || 1, u = (d - c[lo]) / seg, A = leg.coords[lo], B = leg.coords[hi];
  return [A[0] + (B[0] - A[0]) * u, A[1] + (B[1] - A[1]) * u];
}
// drawing: every lorry on the road or in a gate's lane at minute t, and each gate's waiting and minutes lost so far
function simFrame(D, legs, t){
  const lanes = {}, gates = {};
  (D.gates || []).forEach(g => { gates[g.gate_id] = { w: 0, lost: 0 }; });
  for(const a of D.arrivals){
    const G = gates[a.gate] || (gates[a.gate] = { w: 0, lost: 0 });
    if(a.at <= t && t < a.start){ (lanes[a.gate] || (lanes[a.gate] = [])).push(a); G.w++; }
    if(a.at < t) G.lost += Math.max(0, Math.min(t, a.start) - a.at);
  }
  Object.keys(lanes).forEach(g => lanes[g].sort((x, y) => x.start - y.start));      // the gate's one lane, in check-in order
  const feats = []; let laden = 0, empty = 0, mixers = 0, waiting = 0;
  for(const a of D.arrivals){
    if(a.depart == null || t < a.depart || t >= a.start) continue;
    const leg = legs && legs[a.leg];
    if(!leg || !leg.coords) continue;
    let pos, k = a.kind;
    if(t < a.at){
      pos = simPointAt(leg, simDistAt(leg.parts, (t - a.depart) + (a.t_from || 0)));
      if(k === "laden") laden++; else if(k === "empty") empty++; else mixers++;
    } else {
      const q = lanes[a.gate].indexOf(a);
      pos = simPointAt(leg, leg.len_m - Math.max(0, q) * SIM_QUEUE_M); k = "wait"; waiting++;
    }
    feats.push({ type: "Feature", properties: { k }, geometry: { type: "Point", coordinates: pos } });
  }
  return { feats, laden, empty, mixers, waiting, gates };
}
const simGateName = (g) => (g.location_name || "").replace(" Rail Freight Terminal", " Terminal");
const simWord = (g) => g.arrivals === 0 ? "No arrivals" : g.check_in == null ? "No check-in time typed" : g.flag === "red" ? "Over gate capacity" : g.flag === "amber" ? "Queue likely" : "Spacing holds";
const simTone = (g) => g.flag === "red" ? "bad" : g.flag === "amber" ? "warn" : "none";

// the map: its own Mapbox instance (CommitMap's pattern), drawn from the reply and redrawn at each clock minute

                   paint: { "text-color": "#5B21B6", "text-halo-color": "#FFFFFF", "text-halo-width": 1.5 } });

      m.addLayer({ id: "sim-gates", type: "circle", source: "sim-gates", paint: { "circle-radius": 7, "circle-color": "#FFFFFF", "circle-stroke-color": "#1E293B", "circle-stroke-width": 2.5 } });
      m.addLayer({ id: "sim-gates-dot", type: "circle", source: "sim-gates", paint: { "circle-radius": 2.5, "circle-color": "#1E293B" } });
      m.addLayer({ id: "sim-gate-labels", type: "symbol", source: "sim-gates", layout: { "text-field": ["get", "name"], "text-size": 12, "text-offset": [0, 1.1], "text-anchor": "top" },

        "circle-stroke-color": ["match", ["get", "k"], "wait", tok("--red", "#DC2626"), "pour", "#FFFFFF", tok("--sim-lorry", "#2563EB")],

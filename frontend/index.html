          <label key={m} className={"text-[11px] px-1.5 py-0.5 rounded border cursor-pointer " + ((season[k] || []).includes(mi + 1) ? "bg-slate-800 text-white border-slate-800" : "border-slate-200 text-slate-600")}>
            <input type="checkbox" className="hidden" checked={(season[k] || []).includes(mi + 1)} onChange={e => set(f => {
              f.season = f.season || {}; const cur = f.season[k] || [];
              f.season[k] = e.target.checked ? [...cur, mi + 1].sort((a, b) => a - b) : cur.filter(x => x !== mi + 1);
            })} />{m}
          </label>
        ))}
      </div>
    </label>
  );
  return (
    <div data-fair-price-section="1">
      <div className="text-[15px] font-semibold text-slate-800">Fair price — the model</div>
      <p className="text-[13px] text-slate-500 mt-0.5 mb-3 max-w-3xl">{CUR()}/trip = fuel (litres from the vehicle class, tonnes carried and the live diesel index) + cycle hours × (driver + vehicle standing) + {DU()} × running, × (1 + margin). Shown on every routed line as "fair (model)" — a floor for negotiation, never a quote, never mixed with a typed rate. Seeded from public benchmarks; the file names each source. Three are assumptions to replace with your own figures. {!(doc && doc.fair_price) && <span className="text-amber-700">Showing the file's values — the live document has no fair_price block yet; Save once to store it.</span>} Saved with the page's Save button (admin token).</p>
      {offerCountry && (
        <div data-fair-country-offer={cc} className="mb-3 max-w-3xl rounded border border-amber-300 bg-amber-50 px-3 py-2 text-[13px] text-slate-700 flex flex-wrap items-center gap-2">
          <span>The file holds a set of public benchmarks for {countryName}, in {CUR()}, each with its source. The figures on this page are a different set.</span>
          <button type="button" className="btn-sec" onClick={() => upd && upd(d => { d.fair_price = JSON.parse(JSON.stringify(countryFp)); })}>Use the {countryName} set</button>
          <span className="text-slate-500">Nothing changes until you Save.</span>
        </div>
      )}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 max-w-4xl">
        {FAIR_FIELDS_FOR().map(([k, l, help]) => (
          <label key={k} className="block">
            <span className="block text-sm font-medium text-slate-700 mb-1">{l}</span>
            {/* running_eur_per_km is stored per km and shown / typed in the tenant's unit (H1) */}
            <input className={inp + " mt-1"} inputMode="decimal"
              value={k === "running_eur_per_km" ? (fp[k] == null ? "" : +(+distRate(fp[k])).toFixed(4)) : (fp[k] ?? "")}
              onChange={e => set(f => { const n = num(e.target.value); f[k] = (k === "running_eur_per_km" && typeof n === "number") ? +(+distInRate(n)).toFixed(6) : n; })} />
            <span className="block text-[13px] text-slate-500 mt-1">{help}</span>
          </label>
        ))}
        <label className="block">
          <span className="block text-sm font-medium text-slate-700 mb-1">L/100 km per tonne carried</span>
          <input className={inp + " mt-1"} inputMode="decimal" value={cons.l_per_100km_per_tonne ?? ""} onChange={e => set(f => { f.consumption = f.consumption || {}; f.consumption.l_per_100km_per_tonne = num(e.target.value); })} />
          <span className="block text-[13px] text-slate-500 mt-1">UK DfT payload study: 0.4–0.95; the low end is seeded</span>
        </label>
        <label className="block">
          <span className="block text-sm font-medium text-slate-700 mb-1">Rigid, empty L/100 km</span>
          <input className={inp + " mt-1"} inputMode="decimal" value={(cons.rigid || {}).l_per_100km_empty ?? ""} onChange={e => set(f => { f.consumption = f.consumption || {}; f.consumption.rigid = f.consumption.rigid || {}; f.consumption.rigid.l_per_100km_empty = num(e.target.value); })} />
          <span className="block text-[13px] text-slate-500 mt-1">Derived from the DESNZ 2026 factor in this document (checked against gov.uk, 9 Oct 2026)</span>
        </label>
        <label className="block">
          <span className="block text-sm font-medium text-slate-700 mb-1">Artic, empty L/100 km</span>
          <input className={inp + " mt-1"} inputMode="decimal" value={(cons.artic || {}).l_per_100km_empty ?? ""} onChange={e => set(f => { f.consumption = f.consumption || {}; f.consumption.artic = f.consumption.artic || {}; f.consumption.artic.l_per_100km_empty = num(e.target.value); })} />
          <span className="block text-[13px] text-slate-500 mt-1">ICCT 34 laden − 0.4 × 26 t</span>
        </label>
        <label className="block">
          <span className="block text-sm font-medium text-slate-700 mb-1">Winter consumption uplift %</span>
          <input className={inp + " mt-1"} inputMode="decimal" value={season.winter_consumption_uplift_pct ?? ""} onChange={e => set(f => { f.season = f.season || {}; f.season.winter_consumption_uplift_pct = num(e.target.value); })} />
          <span className="block text-[13px] text-slate-500 mt-1">US DOE: cars ~15 % at −7 °C; HGVs less</span>
        </label>
        {monthsBox("winter_months", "Winter months (uplift applies)")}
        {monthsBox("thaw_months", "Thaw months (flag: 8 t road limits may apply)")}
      </div>
      {summary && <p className="text-[11px] text-slate-400 mt-2">In use now (saved): driver {CUR()}{summary.driver_eur_per_h}/h · standing {CUR()}{summary.vehicle_standing_eur_per_h}/h · running {CUR()}{summary.running_eur_per_km == null ? "—" : (+distRate(summary.running_eur_per_km)).toFixed(3)}/{DU()} · margin {summary.margin_pct} % · {summary.l_per_100km_per_tonne} L/100 km per t · rigid {summary.rigid_l_per_100km_empty} / artic {summary.artic_l_per_100km_empty} L/100 km empty · index {summary.index_eur_per_l == null ? "missing — no fair price until the bulletin is fetched" : `${CUR()}${summary.index_eur_per_l}/L`}.</p>}
    </div>
  );
}

// 13 Oct 2026 (W12): the council colour bands a scheme reads until it types its own (backend config.COUNCIL_BREAKS_DEFAULT)
const COUNCIL_BREAKS_DEFAULT = { movements: [50, 100, 200], carbon: [50, 100, 200] };
// 15 Oct 2026: a material whose only unit is tonnes (steel, the user)
const isTonnesOnly = (c) => !!(c && Array.isArray(c.units) && c.units.length === 1 && c.units[0] === "t");

function ConfigPage({ meta, who, access }){
  const [doc, setDoc] = useState(null);
  const [orig, setOrig] = useState(null);
  const [status, setStatus] = useState(null);
  const [tab, setTab] = useState("vehicles");
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);
  const [token, setToken] = useState(() => { try { return localStorage.getItem("modus_admin_token") || ""; } catch(e){ return ""; } });
  const [raw, setRaw] = useState("");
  const [rawErr, setRawErr] = useState("");
  const [fileDoc, setFileDoc] = useState(null);

  const load = () => fetch(`${API}/config/factors`).then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => { setDoc(j.doc); setOrig(JSON.stringify(j.doc)); setStatus(j.status); setRaw(JSON.stringify(j.doc, null, 2)); setRawErr(""); setFileDoc(j.file || null); })
    .catch(e => setMsg({ ok: false, text: `Couldn't load the configuration (${e}).` }));
  useEffect(() => { load(); }, []);

  const dirty = doc && JSON.stringify(doc) !== orig;
  const upd = (fn) => setDoc(d => { const n = JSON.parse(JSON.stringify(d)); fn(n); return n; });
  const num = (v) => (v === "" || v == null ? null : (isNaN(+v) ? v : +v));
  const vehicles = doc ? Object.keys(doc.vehicles || {}).filter(k => !k.startsWith("_")) : [];
  const materials = doc ? Object.keys(doc.material_categories || {}).filter(k => !k.startsWith("_")) : [];

  const save = async () => {
    let body = doc;
    if(tab === "raw"){
      try { body = JSON.parse(raw); } catch(e){ setRawErr("Not valid JSON: " + e.message); return; }
    }
    try { localStorage.setItem("modus_admin_token", token); } catch(e){}
    setBusy(true); setMsg(null);
    const qs = token ? `?token=${encodeURIComponent(token)}` : "";
    try {
      const r = await fetch(`${API}/admin/config/factors${qs}`, { method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ doc: body, updated_by: who || null }) });
      const t = await r.text();
      if(!r.ok) throw new Error(t.slice(0, 600));
      setMsg({ ok: true, text: "Saved. Every payload, density and cycle time now reads this." });
      await load();
    } catch(e){ setMsg({ ok: false, text: "Not saved — " + e.message.replace(/^\{"detail":"|"\}$/g, "") }); }
    setBusy(false);
  };
  const reset = async () => {
    if(!confirm("Replace the live configuration with backend/factors.json? Every edit made here since the last reset is lost.")) return;
    try { localStorage.setItem("modus_admin_token", token); } catch(e){}
    setBusy(true); setMsg(null);
    const qs = new URLSearchParams({ updated_by: who || "" }); if(token) qs.set("token", token);
    try {
      const r = await fetch(`${API}/admin/config/factors/reset?${qs}`, { method: "POST" });
      if(!r.ok) throw new Error((await r.text()).slice(0, 300));
      setMsg({ ok: true, text: "Reset to the file." }); await load();
    } catch(e){ setMsg({ ok: false, text: "Reset failed — " + e.message }); }
    setBusy(false);
  };

  // 10 Oct 2026 — the UI pass (ui-review-1009, mockup 6): Configuration as a form. A section
  // list on the left, a two-thirds-width form on the right with each label above its input at
  // 14 px and the help under it, one Save bar for the page, and the dangerous actions (the
  // admin token, "Reset to file") behind More with their confirm step. The Vehicles and
  // Materials sections keep a table because a grid is the right form for them.
  const inp = "ctl ctl-sm w-full tabular-nums";
  const TABS = [["vehicles", "Vehicles"], ["materials", "Materials"], ["planning", "Planning"], ["costing", "Costing · fuel"], ["seasonal", "Seasonal restrictions"], ["mapbulletin", "Map and bulletin"], ["raw", "Everything (JSON)"]];
  // 13 Oct 2026 (W12): the scheme's council colour bands, three rising whole numbers per measure, in the tenant block.
  // A measure left blank reads COUNCIL_BREAKS_DEFAULT (backend config.COUNCIL_BREAKS_DEFAULT, held equal by parse_frontend).
  const setBreak = (d, m, i, v) => {
    d.tenant = d.tenant || {};
    const cb = d.tenant.council_breaks = d.tenant.council_breaks || {};
    const arr = (cb[m] || []).slice(0, 3); while(arr.length < 3) arr.push(null);
    arr[i] = v;
    if(arr.every(x => x == null)) delete cb[m]; else cb[m] = arr;
    if(!Object.keys(cb).length) delete d.tenant.council_breaks;
  };
  const discard = () => { if(!orig) return; const d = JSON.parse(orig); setDoc(d); setRaw(JSON.stringify(d, null, 2)); setRawErr(""); setMsg(null); };
  const tabLabel = (TABS.find(([k]) => k === tab) || [])[1] || "";

  return (
    <div className="max-w-7xl mx-auto p-6 pb-2">
      <PageHeader title="Configuration" kicker="Data"
        subtitle="Vehicles, materials, planning constants and seasonal windows — the numbers every forecast, cycle time and map figure is computed from. Changes apply on save, everywhere, for everyone."
        actions={
          <details className="row-menu" data-cfg-more="1">
            <summary className="btn-sec" style={{ width: "auto", height: "auto", padding: "7px 12px", fontWeight: 500 }} title="The admin token and the reset">More ▾</summary>
            <div className="row-menu-list" style={{ minWidth: 300 }}>
              <label className="row-menu-field"><span>Admin token · needed to save unless you signed in as an admin; remembered in this browser</span>
                <input value={token} onChange={e => setToken(e.target.value)} placeholder="Admin token" aria-label="Admin token" /></label>
              <button onClick={reset} disabled={busy} style={{ color: "var(--red)" }} title="Overwrite the live configuration with backend/factors.json">Reset to file…</button>
              <div className="row-menu-note">Reset replaces every value on this page, including the tenant block, with the file in the repository. It asks first.</div>
            </div>
          </details>}>
        {status && (
          <div className="text-sm text-slate-500 mt-1 flex flex-wrap items-center gap-x-3 gap-y-1">
            <span>Live source: <strong>{status.source === "database" ? "the configuration table" : "backend/factors.json (not yet seeded)"}</strong>
            {status.updated_at && <> · last saved {status.updated_at.replace("T", " ").replace("Z", " UTC")} by {status.updated_by || "—"}</>}</span>
            {status.differs_from_file && <StatusWord status="Pending" label="differs from the file in the repo" />}
            {dirty && <StatusWord status="edited" label="unsaved changes" />}
          </div>
        )}
      </PageHeader>

      {msg && <div className="rounded-lg border p-3 text-sm mb-4 whitespace-pre-wrap" style={{ borderColor: msg.ok ? "var(--green)" : "var(--red)", color: msg.ok ? "var(--ok-text)" : "var(--red)", background: msg.ok ? "rgba(3,158,134,.06)" : "rgba(191,46,85,.06)" }}>{msg.text}</div>}

      {!doc ? <SkeletonTable cols={["Vehicle", "Payload t", "GVW t", "kg CO₂e / km"]} rows={5} caption="Configuration · loading" /> : (
        <div className="cfg-grid">
          <nav className="cfg-nav" aria-label="Configuration sections">
            {TABS.map(([k, l]) => (
              <button key={k} type="button" onClick={() => setTab(k)} className={"cfg-nav-item" + (tab === k ? " is-on" : "")} aria-current={tab === k ? "page" : undefined}>{l}</button>
            ))}
          </nav>
          <div className="card cfg-main">
            <h3 className="text-[17px] font-semibold text-slate-800 px-6 pt-5 pb-3">{tabLabel}</h3>

          {tab === "vehicles" && (
            <div className="overflow-auto">
              <table className="tbl">
                <thead>
                  <tr>
                    {["Vehicle", "English", "Estonian", "Payload t", "GVW t", "kg CO₂e / km", "Load min", "Unload min", "Euro class", "Planning"].filter(h => h !== "Estonian" || vehLangEditable("ee")).map(h => <th key={h} scope="col" className={/t$|km$|min$/.test(h) ? "num" : ""}>{h}</th>)}
                  </tr>
                </thead>
                <tbody>
                  {vehicles.map(k => { const v = doc.vehicles[k]; const lab = v.labels || {};
                    // 14 Oct 2026 (civils materials): the row is named by the NAME being edited, never by the
                    // stored id (a mixer's id keeps its trade name; the word rule makes it "Concrete mixer …")
                    const nm = ((lab.en || "").trim() && lab.en.trim() !== k) ? lab.en.trim() : vehWord(k);
                    return (
                    <tr key={k}>
                      <td><div className="font-medium text-slate-800 leading-tight" data-cfg-vehname>{nm}</div>{v.code && <div className="text-[13px] text-slate-500 leading-tight">{v.code}</div>}</td>
                      <td className="min-w-[190px]"><input className={inp} value={(lab.en && lab.en !== k) ? lab.en : ""} placeholder={vehWord(k)} aria-label={`${nm} English name`} onChange={e => upd(d => { d.vehicles[k].labels = { ...(d.vehicles[k].labels || {}), en: e.target.value }; })} /></td>
                      {vehLangEditable("ee") && <td className="min-w-[190px]"><input className={inp} value={lab.ee || ""} placeholder={vehWord(k)} onChange={e => upd(d => { d.vehicles[k].labels = { ...(d.vehicles[k].labels || {}), ee: e.target.value }; })} /></td>}
                      <td className="num w-24"><input className={inp + " text-right"} value={v.payload_t ?? ""} aria-label={`${nm} payload t`} onChange={e => upd(d => { d.vehicles[k].payload_t = num(e.target.value); })} /></td>
                      <td className="num w-24"><input className={inp + " text-right"} value={v.gvw_t ?? ""} aria-label={`${nm} GVW t`} onChange={e => upd(d => { d.vehicles[k].gvw_t = num(e.target.value); })} /></td>
                      <td className="num w-28"><input className={inp + " text-right"} placeholder={v.fuel === "electric" ? "derived: kWh × UK grid" : ""} value={v.emissions_kg_co2e_per_km ?? ""} aria-label={`${nm} kg CO2e per km`} onChange={e => upd(d => { d.vehicles[k].emissions_kg_co2e_per_km = num(e.target.value); })} /></td>
                      <td className="num w-20"><input className={inp + " text-right"} value={v.load_minutes ?? ""} placeholder={String((doc.planning || {}).load_minutes ?? "")} aria-label={`${nm} load minutes`} onChange={e => upd(d => { const n = num(e.target.value); if(n == null) delete d.vehicles[k].load_minutes; else d.vehicles[k].load_minutes = n; })} /></td>
                      <td className="num w-20"><input className={inp + " text-right"} value={v.unload_minutes ?? ""} placeholder={String((doc.planning || {}).unload_minutes ?? "")} aria-label={`${nm} unload minutes`} onChange={e => upd(d => { const n = num(e.target.value); if(n == null) delete d.vehicles[k].unload_minutes; else d.vehicles[k].unload_minutes = n; })} /></td>
                      {/* 14 Oct 2026 (bundle G, W8): the Euro class the plan assumes for this vehicle type — optional, read only by
                          the CLP section's chart 5; "not typed" deletes the key (never a guess) */}
                      <td className="w-36"><select className={inp} value={v.euro_class || ""} aria-label={`${nm} Euro class`} data-cfg-euro={k}
                        onChange={e => upd(d => { if(e.target.value) d.vehicles[k].euro_class = e.target.value; else delete d.vehicles[k].euro_class; })}>
                        <option value="">not typed</option>{EURO_CLASSES.map(x => <option key={x} value={x}>{x}</option>)}
                      </select></td>
                      {/* 11 Oct 2026: a tick keeps the planning list's ORDER (the first is the payload fallback) and adds a
                          newly ticked vehicle at the end; until then every tick rebuilt the list in file order */}
                      <td className="text-center"><input type="checkbox" checked={!!v.planning_vehicle} aria-label={`${nm} is a planning vehicle`} onChange={e => upd(d => { d.vehicles[k].planning_vehicle = e.target.checked; const kept = (d.planning_vehicles || []).filter(x => d.vehicles[x] && d.vehicles[x].planning_vehicle); d.planning_vehicles = [...kept, ...Object.keys(d.vehicles).filter(x => !x.startsWith("_") && d.vehicles[x].planning_vehicle && !kept.includes(x))]; })} /></td>
                    </tr>
                  ); })}
                </tbody>
              </table>
              <p className="px-6 py-3 text-[13px] text-slate-500 border-t border-slate-100">
                Each vehicle is stored under a fixed id that forecast lines and routes keep, so it cannot be renamed here; the English name is what every screen and export shows. A vehicle the network is routed for cannot be removed. Blank load/unload minutes use the planning defaults. Routing dimensions are on the Everything tab. The Euro class is what the plan assumes the hauliers will send for each vehicle type, for the CLP monitoring charts; it is not a check of anyone's fleet and changes no carbon figure.
              </p>
            </div>
          )}

          {tab === "materials" && (
            <div className="overflow-auto">
              <table className="tbl">
                <thead>
                  <tr>{["Material", "Density t/m³", "Default unit", "Tonnes only", "Volume ↔ weight", "Vehicles used"].map(h => <th key={h} scope="col" className={h === "Density t/m³" ? "num" : ""}>{h}</th>)}</tr>
                </thead>
                <tbody>
                  {materials.map(k => { const c = doc.material_categories[k]; return (
                    <tr key={k} className="align-top">
                      <td className="font-medium text-slate-800">{k}</td>
                      <td className="num w-28"><input className={inp + " text-right"} value={c.density_t_per_m3 ?? ""} aria-label={`${k} density`} onChange={e => upd(d => { d.material_categories[k].density_t_per_m3 = num(e.target.value); })} /></td>
                      <td className="w-32">
                        <select className={inp} value={c.default_unit || "t"} aria-label={`${k} default unit`} disabled={isTonnesOnly(c)} onChange={e => upd(d => { d.material_categories[k].default_unit = e.target.value; })}>
                          <option value="m3">m³</option><option value="t">tonnes</option><option value="vehicles">vehicles</option>
                        </select>
                      </td>
                      {/* 15 Oct 2026 (the user: steel in tonnes only): lines of this material are typed in tonnes alone — the
                          Submit form offers nothing else and Wayscope refuses another unit; unticked, all three units */}
                      <td className="text-center"><input type="checkbox" checked={isTonnesOnly(c)} aria-label={`${k} is planned in tonnes only`} data-cfg-tonnes-only={k}
                        onChange={e => upd(d => { const m = d.material_categories[k]; if(e.target.checked){ m.units = ["t"]; m.default_unit = "t"; } else delete m.units; })} /></td>
                      <td className="text-center"><input type="checkbox" checked={c.volume_convertible !== false} aria-label={`${k} converts volume to weight`} onChange={e => upd(d => { d.material_categories[k].volume_convertible = e.target.checked; })} /></td>
                      <td style={{ whiteSpace: "normal", height: "auto", padding: "8px 12px" }}>
                        <div className="flex flex-wrap gap-x-3 gap-y-1">
                          {vehicles.map(v => (
                            <label key={v} className="flex items-center gap-1 text-[13px] text-slate-600 whitespace-nowrap">
                              <input type="checkbox" checked={(c.vehicles || []).includes(v)} onChange={e => upd(d => {
                                const cur = d.material_categories[k].vehicles || [];
                                d.material_categories[k].vehicles = e.target.checked ? [...cur, v] : cur.filter(x => x !== v);
                              })} /> {vehLabel(v)}
                            </label>
                          ))}
                        </div>
                      </td>
                    </tr>
                  ); })}
                </tbody>
              </table>
              <p className="px-6 py-3 text-[13px] text-slate-500 border-t border-slate-100">Which vehicles a material lists is advisory in Submit forecast — an unlisted vehicle is shown but disabled, never hidden.</p>
            </div>
          )}

          {tab === "planning" && (
            <div className="px-6 pb-6 max-w-xl">
              {[["working_days_per_month", "Working days a month", "Loads a day and vehicle counts divide by this. Every export prints it."],
                ["shift_hours_per_day", "Shift hours a day", "A lorry's working day. The trips it makes on a route are what fit in one driver's day of it, at most 13 hours (the 11-hour daily rest), after the break the UK drivers' hours rules require (45 min once driving passes 4½ hours or work passes 9, otherwise 30 min once work passes 6; 15 min more once work passes 12), with driving at most 9 hours. A longer shift is fine for a double-shifted lorry. A planning figure: weekly limits, night work and the day's other duties are not modelled."],
                ["avg_haul_speed_kmh", "Average haul speed, km/h", "Used only where HERE has no timing for a route. A stand-in until the route is routed."],
                ["load_minutes", "Loading time, minutes (default)", "Used when a vehicle has no figure of its own."],
                ["unload_minutes", "Unloading time, minutes (default)", "Likewise."]].map(([k, l, help]) => (

// ================================================================= Carbon planner (10 Oct 2026)
// Which planning decisions move the most carbon on haulage and bulk materials: the approved
// plan beside ONE alternative built from the controls. Every figure comes from POST
// /api/carbon/scenario (backend/carbon.py) — this page computes nothing but the display
// (distances through dist()/DU(), never a factor). Planning estimates, not a National Highways
// Carbon Tool return. Every factor shows its source, year and status on hover.
// 11 Oct 2026, plain-English pass (notes/carbon-ui-1011): the words National Highways, CLOCS, FORS
// and the Environment Agency use — "approved plan" (NH uses "baseline" for its 2019/20 year),
// "custom carbon factor (supplier EPD)", "vehicle choice", "receiving site", "disposal method";
// lorry loads beside tCO2e; sentence case at 14 px (13 px only for hints and table headers);
// status as a word.
// After the show (11 Oct 2026, items 8, 9, 11–15): what the page counts, the life-cycle modules and a
// well-to-wheel figure beside (never in) the total, each decision's lorry effect, the waste hierarchy
// step of each disposal method, a one-page summary PDF with a commentary, and who acts on the results.
// All from the server: the page still computes nothing but the display.
// 11 Oct 2026, the process layout (the user: "still confusing and very wordy — make it like a process,
// with a final target at the end"): six numbered steps, top to bottom on every screen — 1 your approved
// plan, 2 materials, 3 lorries and routes, 4 surplus material, 5 result, 6 carbon target. This replaces
// the 11 Oct "results above the controls on a phone" rule: the steps run in order, and a slim strip at
// the foot of the screen keeps the result in view while choosing. Every explanation, table and list sits
// in a native <details className="dash-more"> (closed), so it stays in the markup the render harness
// reads. Step 6 reads GET /api/carbon/target (backend/carbon_target.py); a planner or admin code sets it
// from this page's decisions (PUT: the decisions, the mode, the page state, the name typed at sign-in;
// the SERVER works every figure out), switches % / cap (PUT with the mode only) or clears it (DELETE).
// A team code reads it. Shared codes: no per-person identity until G3, so "set by" is the typed name.
const CARBON_STEPS = [
  { who: "Client", what: "Agrees the carbon target for the scheme (a planner records it in step 6) and asks the supply chain to plan against it." },
  { who: "Buyer", what: "Asks each supplier for an environmental product declaration (EPD) and enters it here as a custom carbon factor, with its reference." },
  { who: "Principal contractor", what: "Writes the decisions it commits to into the construction logistics plan and the subcontracts, then reports actual quantities in the client's own return (on National Highways schemes, the Carbon Tool)." },
];
const CARBON_STEP_TITLES = ["Your approved plan", "Materials", "Lorries and routes", "Surplus material", "Result", "Carbon target"];
// the two ways the server holds a target (carbon_target.MODE_WORDS), in its own words
const CARBON_TARGET_MODES = [["pct", "% below the approved plan"], ["cap", "Fixed tCO2e cap"]];
const CARBON_TONE = { VERIFIED: "var(--green)", DERIVED: "var(--chart-none)", ASSUMPTION: "var(--gold)" };
const CARBON_STATUS_WORD = { VERIFIED: "Verified", DERIVED: "Derived", ASSUMPTION: "Assumption" };
const CARBON_FLAG_WORDS = {
  UNBAKED: "no route distance yet, so transport is not counted (route it on Data → Routes)",
  KM_FROM_BASELINE_VEHICLE: "distance taken from the forecast vehicle's route (the chosen vehicle has no route distance yet)",
  KM_SCALED: "distance scaled by the haul distance percentage",
  ALT_ROUTE_NOT_BAKED: "that alternative route has no distance yet, so it is unchanged",
  EV_TRIP_EXCEEDS_BATTERY: "a trip needs more energy than the battery holds, so it stays diesel and is not credited",
  RETURN_NOT_BAKED: "return leg has no route distance yet: loaded leg only, left out of the benchmarks",
  RETURN_STAND_IN: "return leg of the chosen route has no distance yet, so the loaded leg stands in for it",
  ROUTE_SWAP_NOT_BAKED: "the chosen route has no distance yet, so that change is left out",
  NO_DISPOSAL_FACTOR: "no Government disposal factor for that material and method: left out, not counted as zero",
};
const CARBON_DISPOSAL_WORD = { landfill: "Landfill", closed_loop: "Recycled (closed-loop)", open_loop: "Recycled (open-loop)", combustion: "Combustion" };
const CARBON_NH_CATEGORY = { "Bulk Materials": "Bulk Materials", "Earthworks": "Earthworks", "Waste": "Waste + Waste Transport" };
const CARBON_EMPTY = { recycled: {}, epd: {}, reused: {}, vehicle: {}, electric: false, distance: {}, supplier: {}, alt: {}, disposal: {} };

function carbonLevers(st){
  const L = [];
  Object.entries(st.recycled || {}).forEach(([cat, pct]) => { if(+pct > 0) L.push({ driver: "recycled", scope: { category: cat }, pct: +pct }); });
  Object.entries(st.epd || {}).forEach(([cat, e]) => { if(e && e.kg !== "" && e.kg != null) L.push({ driver: "material", scope: { category: cat }, epd: { kg_per_t: +e.kg, source: e.source || "" } }); });
  Object.entries(st.reused || {}).forEach(([cat, on]) => { if(on && !((st.epd || {})[cat] || {}).kg) L.push({ driver: "material", scope: { category: cat }, reused: true }); });
  Object.entries(st.vehicle || {}).forEach(([cat, v]) => { if(v) L.push({ driver: "vehicle", scope: { category: cat }, vehicle: v }); });
  if(st.electric) L.push({ driver: "fuel", fuel: "electric" });
  Object.entries(st.distance || {}).forEach(([cat, pct]) => { if(+pct && +pct !== 100) L.push({ driver: "source", scope: { category: cat }, distance_pct: +pct }); });
  Object.entries(st.supplier || {}).forEach(([rid, to]) => { if(to) L.push({ driver: "source", scope: { route_id: rid }, to_route: to }); });
  Object.entries(st.alt || {}).forEach(([rid, k]) => { if(+k > 0) L.push({ driver: "route", scope: { route_id: rid }, alt_index: +k }); });
  Object.entries(st.disposal || {}).forEach(([rid, d]) => {
    if(d && (d.to_route || d.to)) L.push({ driver: "disposal", scope: { route_id: rid }, ...(d.to_route ? { to_route: d.to_route } : {}), ...(d.to ? { to: d.to } : {}) });
  });
  return L;
}

// The page state a stored target carries (ui_state) back into the controls. The server keeps it as
// sent and never reads it, so every key is checked here: an object stays an object, electric is a
// yes/no, anything else falls back to the empty state.
function carbonStateFrom(u){
  const o = { ...CARBON_EMPTY };
  Object.keys(CARBON_EMPTY).forEach(k => {
    const v = (u || {})[k];
    if(k === "electric") o[k] = !!v;
    else if(v && typeof v === "object" && !Array.isArray(v)) o[k] = v;
  });
  return o;
}

// A refusal from /api/carbon/target in words: the server's own sentence for a 400, plain words otherwise.
function carbonTargetError(status, txt){
  let d = "";
  try { const j = JSON.parse(txt); d = (j && typeof j.detail === "string") ? j.detail : ""; } catch(e){ d = ""; }
  if(status === 401) return "Sign in again to see the carbon target.";
  if(status === 403) return "Only a planner or admin code can change the carbon target.";
  return d || `The carbon target could not be reached (error ${status}). Try again.`;
}

// One numbered step card. Top level (never defined inside CarbonPage), so the inputs inside a step
// keep their focus and a <details> keeps its open state while the page re-renders.
// Its data-guide (the guide's anchor) is written at each use and passed through to the card.
function CarbonStep({ n, children, ...rest }){
  return (
    <li>
      <section className="bg-white rounded-xl border border-slate-200 p-4 sm:p-5" id={"carbon-step-" + n} data-step={n} {...rest} aria-labelledby={"carbon-step-" + n + "-h"}>
        <h2 id={"carbon-step-" + n + "-h"} className="flex items-center gap-3 text-lg font-semibold text-slate-800">
          <span className="inline-flex items-center justify-center shrink-0 text-base font-bold tabular-nums" style={{ width: 28, height: 28, borderRadius: 14, border: "1px solid var(--line)", background: "var(--surface-2)", color: "var(--ink)" }}>{n}</span>
          <span>{CARBON_STEP_TITLES[n - 1]}</span>
        </h2>
        {children}
      </section>
    </li>
  );
}

function CarbonPage({ meta, access, who, initialData, initialTarget }){
  const [st, setSt] = useState(CARBON_EMPTY);
  const [spend, setSpend] = useState("");
  const [data, setData] = useState(initialData || null);
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const [note, setNote] = useState("");
  const [pdfBusy, setPdfBusy] = useState(false);
  const [pdfErr, setPdfErr] = useState(null);     // 11 Oct 2026: the summary's own error, shown under its button
  // step 6: the scheme's carbon target, as GET /api/carbon/target returns it ({ target, status })
  const [tg, setTg] = useState(initialTarget || null);
  const [mode, setMode] = useState(() => ((initialTarget && initialTarget.target && initialTarget.target.mode) || "pct"));
  const [tLoaded, setTLoaded] = useState(!!initialTarget);
  const [tBusy, setTBusy] = useState(false);
  const [tErr, setTErr] = useState(null);
  const [tMsg, setTMsg] = useState(null);
  const alive = useRef(true);
  const levers = useMemo(() => carbonLevers(st), [JSON.stringify(st)]);
  // one call for the three verbs: GET (read), PUT (set, or switch % / cap), DELETE (clear). Each returns
  // the same payload as the GET, so the step shows what the server now holds.
  const targetCall = async (method, body, done) => {
    setTBusy(true); setTErr(null); setTMsg(null);
    try {
      const r = await fetch(`${API}/carbon/target`, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
      const txt = await r.text();
      if(!r.ok) throw new Error(carbonTargetError(r.status, txt));
      const j = JSON.parse(txt);
      if(alive.current){
        setTg(j); setTLoaded(true);
        if(j && j.target && j.target.mode) setMode(j.target.mode);
        if(done) setTMsg(done);
      }
    } catch(e){ if(alive.current) setTErr(e.message || "The carbon target could not be reached."); }
    if(alive.current) setTBusy(false);
  };
  useEffect(() => { alive.current = true; return () => { alive.current = false; }; }, []);
  useEffect(() => {
    if(initialTarget) return;
    targetCall("GET", null, null);
  }, []);
  useEffect(() => {
    if(initialData) return;
    let live = true;
    const t = setTimeout(() => {
      setBusy(true);
      fetch(`${API}/carbon/scenario`, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ alternatives: levers.length ? [{ name: "Alternative", levers }] : [],
                               spend_gbp_m: (spend === "" || isNaN(+spend)) ? null : +spend }) })
        .then(async r => { const txt = await r.text(); if(!r.ok) throw new Error(txt.replace(/^\{"detail":"|"\}$/g, "").slice(0, 400)); return JSON.parse(txt); })
        .then(j => { if(live){ setData(j); setErr(null); } })
        .catch(e => { if(live) setErr(e.message || "Couldn't compute the scenario."); })
        .finally(() => { if(live) setBusy(false); });
    }, 350);
    return () => { live = false; clearTimeout(t); };
  }, [JSON.stringify(levers), spend]);

  if(!data && err) return (
    <div className="max-w-4xl mx-auto p-6">
      <PageHeader title="Carbon planner" kicker="Plan" subtitle="Planning estimates, not a National Highways Carbon Tool return." />
      <EmptyState kind="error" title="Couldn't compute the carbon scenario" body={err} />
    </div>
  );
  if(!data) return <div className="p-8 text-center text-slate-400">Loading the carbon planner…</div>;

  const B = data.baseline || { totals: {}, by_category: [], benchmarks: {}, fleet: {} };
  const A = (data.alternatives || [])[0] || null;
  const opt = data.options || { materials: [], vehicles: [], routes: [] };
  const fx = {};
  (data.factors || []).forEach(f => { fx[f.key] = f; });
  const vehOf = {};
  (opt.vehicles || []).forEach(v => { vehOf[v.vehicle] = v; });
  // empty cells say what they mean (GOV.UK: "no data" or "not applicable", never N/A)
  const t1 = (n) => (n == null ? "no data" : grp(n, 1));
  const altCell = (fn) => (A ? fn(A) : "no alternative yet");
  const ids = (f) => { const x = f && f.ids; if(!x) return f && f.id ? ` · ${f.id}` : ""; const a = Array.isArray(x) ? x : Object.values(x); const s = a.filter(Boolean).join(", "); return s ? ` · ${s}` : ""; };
  const prov = (f) => (f ? `${f.label}: ${f.value != null ? f.value : (f.kg_per_km != null ? f.kg_per_km : "")} ${f.unit || ""} · ${f.source || "no source"} · ${f.year || "year not given"} · ${CARBON_STATUS_WORD[f.status] || f.status || "no status"}${ids(f)}` : "");
  const setK = (k, key, v) => setSt(s => ({ ...s, [k]: { ...s[k], [key]: v } }));
  const pct = (n) => (n == null ? "" : `${Math.abs(n).toFixed(1)}%`);
  // a change in words, never colour alone: "120.4 tCO2e lower", "8.2 tCO2e higher", "no change"
  const moved = (n) => (n == null ? "no data" : n < -0.0005 ? `${grp(-n, 1)} tCO2e lower` : n > 0.0005 ? `${grp(n, 1)} tCO2e higher` : "no change");
  const tone = (n) => (n < -0.0005 ? "var(--ok-text)" : n > 0.0005 ? "var(--red)" : "var(--muted)");
  const h3 = "text-base font-semibold text-slate-800";
  const hint = "text-[13px] text-slate-500";
  const lab = "block text-sm font-medium text-slate-700 mb-1";
  const inp = "border border-slate-300 rounded-md px-2 py-1 text-sm w-full tabular-nums bg-white";
  const big = "kpi-num font-bold text-[color:var(--navy-deep)] mt-3";
  const Chip = ({ s }) => (s ? <span className="inline-flex items-center gap-1.5 text-sm text-slate-700 whitespace-nowrap"><i aria-hidden="true" style={{ display: "inline-block", width: 8, height: 8, borderRadius: 4, background: CARBON_TONE[s] || "var(--chart-none)" }}></i>{CARBON_STATUS_WORD[s] || s}</span> : null);
  const lorryLine = (sc) => {
    const f = sc.fleet || {};
    return (
      <div className="text-sm text-slate-700 mt-1">
        Lorry loads (deliveries): <b className="tabular-nums">{f.trips == null ? "no data" : grp(f.trips)}</b> · lorries needed in the busiest month: <b className="tabular-nums">{f.lorries_peak == null ? "no data" : f.lorries_peak}</b>
      </div>

  const unsizedNote = (sc) => { const u = (sc.fleet || {}).unsized_lines; return u ? <div className={hint}>The busiest month leaves out {u} plan line{u === 1 ? "" : "s"} with no route distance.</div> : null; };
  // the parts of a total, for the "in full" toggles of steps 1 and 5 (a plain function, not a component)
  const breakdown = (sc) => (
    <div className="space-y-1 mt-2">
      <div className="text-sm text-slate-700 tabular-nums">Material {t1(sc.totals.material_t)} + Transport {t1(sc.totals.transport_t)} + Waste disposal {t1(sc.totals.disposal_t)}</div>

    </div>
  );
  const bm = (sc) => sc.benchmarks || {};
  const nhKpi = bm(B).nh_kpi || null;
  const natWord = (v) => (v == null ? "no data" : `${Math.abs(v).toFixed(1)}% ${v < 0 ? "below" : "above"} the national average`);
  const routesWithChoices = (opt.routes || []).filter(r => (r.suppliers || []).length || Object.values(r.alts || {}).some(a => (a || []).length > 1));
  const wasteRoutes = (opt.routes || []).filter(r => r.disposal_route || (r.destinations || []).some(x => x.disposal_route));
  const fc = data.fleet_compare || {};
  const unrouted = (B.totals.lines || 0) - (B.totals.baked_lines || 0);
  // item 9: a decision's lorry effect in words, the distance in the tenant's unit
  const loadsWord = (n) => (!n ? "" : n < 0 ? `${grp(-n)} fewer lorry loads` : `${grp(n)} more lorry loads`);
  const kmWord = (km) => (km == null || Math.abs(km) < 0.5 ? "" : `${grp(Math.abs(dist(km)), 0)} ${km < 0 ? "fewer" : "more"} lorry-${DU()}`);
  const lorryEffect = (d) => [loadsWord(d.delta_trips), kmWord(d.delta_vkm_km)].filter(Boolean).join(" · ") || `no change in lorry loads or lorry-${DU()}`;
  // item 13: the waste hierarchy step of a disposal method (from the server, for the four methods that exist)
  const step = (k) => ((data.waste_hierarchy || {})[k] || "");
  const dispWord = (k) => `${CARBON_DISPOSAL_WORD[k] || k}${step(k) ? ` · waste hierarchy: ${step(k).toLowerCase()}` : ""}`;
  // item 8: what is left out of these figures, from the server's counts
  const sw = data.scope_words || {};
  const fl0 = B.totals.flags || {};
  const leftOut = [
    unrouted > 0 ? `${unrouted} plan line${unrouted === 1 ? " has" : "s have"} no route distance yet: transport not counted (route it on Data → Routes)` : "",
    (B.totals.material_excluded_tonnes || 0) > 0 ? `${grp(B.totals.material_excluded_tonnes)} t has no Government production factor: making it is not counted` : "",
    fl0.RETURN_NOT_BAKED ? `${fl0.RETURN_NOT_BAKED} plan line${fl0.RETURN_NOT_BAKED === 1 ? " has" : "s have"} no return route distance: loaded leg only` : "",
    fl0.NO_DISPOSAL_FACTOR ? `${fl0.NO_DISPOSAL_FACTOR} plan line${fl0.NO_DISPOSAL_FACTOR === 1 ? " has" : "s have"} no Government disposal factor: disposal not counted` : "",
    B.totals.wtw_lines_out ? `${B.totals.wtw_lines_out} plan line${B.totals.wtw_lines_out === 1 ? "'s lorry has" : "s' lorries have"} no published well-to-tank row` : "",
  ].filter(Boolean);
  // the result in words: "124.2 tCO2e lower than the approved plan (79.1%)"; the lorry effect from the server
  const resultWords = A ? (A.delta_t != null && Math.abs(A.delta_t) > 0.0005 ? `${moved(A.delta_t)} than the approved plan (${pct(A.delta_pct)})` : "No change from the approved plan") : "";
  const loadsChange = A ? ([A.delta_trips ? (A.delta_trips < 0 ? `${grp(-A.delta_trips)} fewer lorry loads` : `${grp(A.delta_trips)} more lorry loads, because each lorry carries less`) : "", kmWord(A.delta_vkm_km)].filter(Boolean).join(" · ") || `No change in lorry loads or lorry-${DU()}`) : "";
  // item 11: the one-page summary — the same body as the page's read, plus the commentary; the server draws it
  // 11 Oct 2026: its failure is said under its own button (pdfErr), never in the scenario's error
  const downloadSummary = async () => {
    setPdfBusy(true); setPdfErr(null);
    try {
      const r = await fetch(`${API}/carbon/summary.pdf`, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ alternatives: levers.length ? [{ name: "Alternative", levers }] : [],
                               spend_gbp_m: (spend === "" || isNaN(+spend)) ? null : +spend, commentary: note || null }) });
      if(!r.ok){
        const txt = await r.text();
        let d = "";
        try { const j = JSON.parse(txt); d = (j && typeof j.detail === "string") ? j.detail : ""; } catch(e){ d = ""; }
        throw new Error(d || `error ${r.status}`);
      }
      const blob = await r.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "carbon-summary.pdf";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    } catch(e){ setPdfErr("The summary could not be made: " + (e.message || e)); }
    setPdfBusy(false);
  };

  // ---- step 6: the target, every figure from the server ----
  const T = (tg && tg.target) || null;
  const S = (tg && tg.status) || null;
  const canSet = !!(access && access.can_approve);
  const team = !!(S && S.scope === "team");
  // 11 Oct 2026 (the review): the target, the two figures and their verdicts in the SAME words as the
  // Dashboard, Forecasts and Submit forecast (ctTargetLine, ctProgress: the server decides "on target";
  // no margin is worked out here). A team code's figures are its own lines and are not compared.
  const ctHere = ctOk(tg);
  const p6 = ctHere ? ctProgress(tg) : [];
  // Set waits until the current target has been read: with the read failed the page cannot know there is one
  // to replace, so it would replace it without asking. A refused scenario disables it too, saying why.
  const setWhy = !tLoaded ? (tErr ? "The scheme's current carbon target did not load, so a new one cannot be set yet." : "Reading the current carbon target…")
    : busy ? "Wait for the result to update."
    : err ? `Not updated: ${err}`
    : !levers.length || !A ? "Make a choice in steps 2 to 4 first."
    : !(A.delta_t < -0.0005) ? "These decisions do not lower carbon, so they cannot be the target." : "";
  const setTarget = () => {
    if(!tLoaded) return;
    if(T && !confirm("Replace the scheme's carbon target with these decisions?")) return;
    targetCall("PUT", { mode, levers, ui_state: st, updated_by: who || null }, "Target set.");
  };
  // with no target yet the toggle only picks how the next one is held; on a saved target it switches
  // the stored one (PUT with the mode alone: the server keeps every number), after a check, and shows what it now holds
  const pickMode = (k) => {
    if(!T) { setMode(k); return; }
    if(canSet && T.mode !== k && confirm(k === "cap" ? "Hold the scheme's carbon target as a fixed tCO2e cap? Every page shows the change."
                                                    : "Hold the scheme's carbon target as % below the approved plan? Every page shows the change."))
      targetCall("PUT", { mode: k, updated_by: who || null }, k === "cap" ? "Now held as a fixed tCO2e cap." : "Now held as % below the approved plan.");
  };
  const clearTarget = () => {
    if(!confirm("Clear the scheme's carbon target?")) return;
    targetCall("DELETE", null, "Target cleared.");
  };
  // approvers only: a team code's read carries no page state (it names other teams' routes)
  const openAgreed = () => { if(!canSet || !T || !T.ui_state) return; setSt(carbonStateFrom(T.ui_state)); setTMsg("The agreed decisions are now in steps 2 to 4."); };
  // the routes where a supplier or a haul route is chosen, counted on the closed details' summary
  const chosenN = Object.values(st.supplier || {}).filter(Boolean).length + Object.values(st.alt || {}).filter(k => +k > 0).length;
  const toResult = () => { const el = document.getElementById("carbon-step-5"); if(el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "start" }); };

  return (
    <div className="max-w-4xl mx-auto p-6">
      <PageHeader title="Carbon planner" kicker="Plan"
        subtitle="From the approved plan to a carbon target, in six steps."
        actions={<button onClick={() => { setSt(CARBON_EMPTY); setSpend(""); setTMsg(null); }} className="btn-sec">Start again</button>} />
      {/* 11 Oct 2026: a refused scenario is said in step 5, in the strip at the foot and beside Set, where it is seen;
          the banner up here was off screen on the single-column page */}

      <ol className="space-y-4" aria-label="The six steps">
        {/* ---------------- 1. your approved plan ---------------- */}
        <CarbonStep n={1} data-guide="carbon-compare">
          <div className="flex items-start gap-3 mt-3" role="note">
            <span aria-hidden="true" className="inline-flex items-center justify-center font-bold shrink-0" style={{ width: 26, height: 26, borderRadius: 13, background: "var(--ink)", color: "var(--bg)" }}>!</span>
            <strong className="text-base text-slate-800">Planning estimates. Not a National Highways Carbon Tool return.</strong>
          </div>
          <div className={big} style={{ fontSize: "clamp(1.4rem, 2vw, 2rem)" }}
               title="Making the material + transport to and from site + waste disposal, in tonnes of carbon dioxide equivalent (tCO2e)">{t1(B.totals.total_t)} <span className="text-sm font-semibold text-slate-500">tCO2e</span></div>
          {lorryLine(B)}
          {leftOut.length > 0 && <p className="text-sm text-amber-700 mt-2">{leftOut[0]}{leftOut.length > 1 ? ` (and ${leftOut.length - 1} more under What this counts)` : ""}</p>}
          {ctHere && <p className="text-sm text-slate-700 mt-2">{ctTargetLine(tg)} (step 6)</p>}
          <details className="dash-more mt-3" data-guide="carbon-counts">
            <summary>What this counts</summary>
            <div>
              <p className="text-sm text-slate-600 mt-2"><strong className="tabular-nums">{B.totals.lines}</strong> plan lines (one route, material and month each), <strong className="tabular-nums">{B.totals.baked_lines}</strong> with a route distance</p>
              <dl className="grid md:grid-cols-2 gap-x-5 gap-y-3 mt-2 text-sm">
                <div><dt className="font-semibold text-slate-800">Counts</dt><dd className="text-slate-600">{sw.counts || "no data"}</dd></div>
                <div><dt className="font-semibold text-slate-800">Does not count</dt><dd className="text-slate-600">{sw.not_counted || "no data"}</dd></div>
                <div><dt className="font-semibold text-slate-800">Factors</dt><dd className="text-slate-600">{sw.factors || "no data"}</dd></div>
                <div><dt className="font-semibold text-slate-800">Left out here</dt><dd className="text-slate-600">{leftOut.length
                  ? <ul className="list-disc pl-5 space-y-1">{leftOut.map(x => <li key={x}>{x}</li>)}</ul>
                  : "Nothing: every plan line is counted in full."}</dd></div>
              </dl>
              {breakdown(B)}
              {unsizedNote(B)}
            </div>
          </details>
        </CarbonStep>

        {/* ---------------- 2. materials ---------------- */}
        <CarbonStep n={2} data-guide="carbon-levers">
          {(opt.materials || []).map(m => {
            const f = fx["material:" + m.carbon_material];
            const e = (st.epd || {})[m.category] || {};
            const bc = (B.by_category || []).find(x => x.category === m.category);
            const ac = A ? (A.by_category || []).find(x => x.category === m.category) : null;
            return (
              <div key={m.category} className="border-t border-slate-100 pt-3 mt-3">
                <div className="flex flex-wrap justify-between gap-x-3 text-sm">
                  <span className="font-semibold text-slate-800" title={`National Highways Carbon Tool category: ${bc ? (CARBON_NH_CATEGORY[bc.sheet] || bc.sheet || "no category") : "no category"}`}>{m.category}</span>
                  <span className="tabular-nums text-slate-700">{grp(m.tonnes)} t · {bc ? t1(bc.total_t) : "no data"} tCO2e{ac ? <> → <b>{t1(ac.total_t)}</b> with your choices</> : null}</span>
                </div>
                <label className="block mt-2" title={m.recycled_enabled ? "Linear blend of the Government primary and recycled (closed-loop) factors" : m.recycled_reason}>
                  <span className={lab}>Recycled content: {(st.recycled || {})[m.category] || 0}%</span>
                  <input type="range" min="0" max="100" step="5" className="w-full" disabled={!m.recycled_enabled || !!e.kg}
                    value={(st.recycled || {})[m.category] || 0} onChange={ev => setK("recycled", m.category, +ev.target.value)} />
                  {!m.recycled_enabled && <span className={"block " + hint}>Not available: {m.recycled_reason}.</span>}
                </label>
                {m.reused != null && (
                  <label className="flex items-start gap-2 mt-2 text-sm text-slate-700" title={`Uses the Government reused factor, ${m.reused} kgCO2e per tonne; lorry loads are unchanged`}>
                    <input type="checkbox" className="mt-1" checked={!!(st.reused || {})[m.category]} disabled={!!e.kg}
                      onChange={ev => setK("reused", m.category, ev.target.checked)} />
                    <span>Reused material ({m.reused} kgCO2e per tonne)</span>
                  </label>
                )}
                {e.kg ? <p className={hint + " mt-1"}>Supplier EPD in use: {e.kg} kgCO2e per tonne{e.source ? `, reference ${e.source}` : ""}, so recycled content and reuse do not apply (change it under Use a supplier EPD).</p> : null}
                <details className="dash-more mt-2">
                  <summary>Use a supplier EPD</summary>
                  <div>
                    <div className={hint + " mt-2"} title={prov(f)}>Government factor: {m.label || "no Government class"}{m.primary != null ? ` · ${m.primary} kgCO2e per tonne` : ""} {f && <Chip s={f.status} />}</div>
                    <label className="block mt-2">
                      <span className={lab}>Custom carbon factor (supplier EPD), kgCO2e per tonne</span>
                      <span className={"block " + hint + " mb-1"}>Replaces the Government factor; give the reference of the supplier's environmental product declaration (EPD)</span>
                      <input className={inp} inputMode="decimal" value={e.kg || ""} placeholder="Government factor" onChange={ev => setK("epd", m.category, { ...e, kg: ev.target.value })} />
                      {e.kg && isNaN(+e.kg) ? <span className={"block " + hint}>Type a number, with a point for decimals (for example 12.5).</span> : null}
                    </label>
                    <label className="block mt-2">
                      <span className={lab}>EPD reference (required)</span>
                      <input className={inp} value={e.source || ""} placeholder="for example, the EPD number" onChange={ev => setK("epd", m.category, { ...e, source: ev.target.value })} />
                      {e.kg && !String(e.source || "").trim() ? <span className={"block " + hint}>Add the EPD reference: the result does not update until it has one.</span> : null}
                    </label>
                  </div>
                </details>
              </div>
            );
          })}
        </CarbonStep>

        {/* ---------------- 3. lorries and routes ---------------- */}
        <CarbonStep n={3} data-guide="carbon-lorries">
          <label className="flex items-start gap-2 text-sm text-slate-700 mt-3" title={prov(fx["electricity"])}>
            <input type="checkbox" className="mt-1" checked={!!st.electric} onChange={ev => setSt(s => ({ ...s, electric: ev.target.checked }))} />
            <span><span className="font-medium">Battery electric lorries</span><span className={"block " + hint}>Where Config has an electric profile for that lorry</span></span>
          </label>
          {(opt.materials || []).map(m => (
            <div key={m.category} className="border-t border-slate-100 pt-3 mt-3">
              <div className="text-sm font-semibold text-slate-800">{m.category}</div>
              <div className="grid sm:grid-cols-2 gap-x-4">
                <label className="block mt-2">
                  <span className={lab}>Vehicle choice</span>
                  <select className={inp} value={(st.vehicle || {})[m.category] || ""} onChange={ev => setK("vehicle", m.category, ev.target.value)}>
                    <option value="">As forecast</option>
                    {(m.vehicles || []).map(v => <option key={v} value={v}>{vehLabel(v)}{(vehOf[v] || {}).fuel === "electric" ? " (scenario only)" : ""}</option>)}
                  </select>
                </label>
                <label className="block mt-2" title="Below 100% is a nearer supplier, above is farther. A typed percentage of the route distance, flagged as typed">
                  <span className={lab}>Haul distance: {(st.distance || {})[m.category] || 100}% of the planned route</span>
                  <input type="range" min="50" max="150" step="5" className="w-full" value={(st.distance || {})[m.category] || 100}
                    onChange={ev => setK("distance", m.category, +ev.target.value)} />
                </label>
              </div>
            </div>
          ))}
          {routesWithChoices.length > 0 && (
            <details className="dash-more mt-3">
              <summary>Supplier and route, route by route ({routesWithChoices.length}{chosenN ? ` · ${chosenN} chosen` : ""})</summary>
              <div>
                {routesWithChoices.map(r => {
                  const altList = Object.values(r.alts || {}).find(a => (a || []).length > 1) || [];
                  return (
                    <div key={r.route_id} className="border-t border-slate-100 pt-2 mt-2 first:border-0">
                      <div className="text-sm font-semibold text-slate-700">{r.route_id} · {r.origin_name} → {r.dest_name}</div>
                      {(r.suppliers || []).length > 0 && (
                        <label className="block mt-1"><span className={lab}>Supplier</span>
                          <select className={inp} value={(st.supplier || {})[r.route_id] || ""} onChange={ev => setK("supplier", r.route_id, ev.target.value)}>
                            <option value="">{r.origin_name} (as planned)</option>
                            {r.suppliers.map(s => <option key={s.route_id} value={s.route_id} disabled={!s.baked}>{s.origin_name} ({s.route_id}){s.baked ? "" : " — no route distance yet"}</option>)}
                          </select></label>
                      )}
                      {altList.length > 1 && (
                        <label className="block mt-1"><span className={lab}>Haul route</span>
                          <select className={inp} value={(st.alt || {})[r.route_id] || 0} onChange={ev => setK("alt", r.route_id, +ev.target.value)}>
                            {altList.map(k => <option key={k} value={k}>{k === 0 ? "As planned" : `Alternative route ${k}`}</option>)}
                          </select></label>
                      )}
                    </div>
                  );
                })}
              </div>
            </details>
          )}
          <details className="dash-more mt-3" data-guide="carbon-fleet">
            <summary>Diesel or battery electric, same tonnage</summary>
            <div>
              <p className="text-sm text-slate-600 mt-2">Battery electric is worked out as kWh per km × UK electricity, as no Government electric HGV factor exists. The +2 t weight allowance for zero-emission heavy goods vehicles (HGVs) is a draft rule and is not applied.</p>
              {!fc.lines ? (
                <p className="text-sm text-slate-600 mt-2">{fc.note || "No forecast vehicle with a route distance has an electric profile on Config."}</p>
              ) : (
                <>
                  <div className="overflow-x-auto mt-2">
                    <table className="tbl">
                      <caption><b>Lorries, loads and carbon</b> · the same plan lines run both ways</caption>
                      <thead><tr><th scope="col"></th><th scope="col" className="num">Lorries needed, busiest month</th><th scope="col" className="num">Lorry loads</th><th scope="col" className="num">kWh</th><th scope="col" className="num">tCO2e</th></tr></thead>
                      <tbody>
                        <tr><td>Diesel, as forecast</td><td className="num">{fc.diesel.lorries_peak}</td><td className="num">{grp(fc.diesel.trips)}</td><td className="num">not applicable</td><td className="num">{t1(fc.diesel.transport_t)}</td></tr>
                        <tr title={prov(fx["kwh_per_km"]) + "\n" + prov(fx["electricity"])}><td>Battery electric</td><td className="num">{fc.electric.lorries_peak}</td><td className="num">{grp(fc.electric.trips)}</td><td className="num">{grp(fc.electric.kwh)}</td><td className="num">{t1(fc.electric.transport_t)}</td></tr>
                      </tbody>
                    </table>
                  </div>
                  <div className="text-sm text-slate-600 pt-3 space-y-1">
                    {(fc.electric_profiles || []).map(p => (
                      <div key={p.vehicle}>{vehLabel(p.vehicle)}: payload {p.payload_t} t (diesel {p.twin_payload_t} t) · {p.kwh_per_km} kWh per km · battery {p.battery_kwh_usable} kWh usable · charger {p.charge_kw} kW <Chip s={p.status} /></div>
                    ))}
                    <div>Range on one charge {fc.range_per_charge_km_min == null ? "no data" : `${fmtDist(fc.range_per_charge_km_min, 0)} ${DU()}`} · {fc.charges_per_lorry_day_max ? `up to ${fc.charges_per_lorry_day_max} charge${fc.charges_per_lorry_day_max === 1 ? "" : "s"} a lorry-day${fc.minutes_per_charge_max ? `, ${fc.minutes_per_charge_max} min each` : ""}` : "no charge needed inside a shift"}{fc.infeasible_lines ? ` · ${fc.infeasible_lines} plan line${fc.infeasible_lines === 1 ? "" : "s"} left out of both columns: a trip needs more than one battery` : ""}</div>
                    <div className={hint}>The battery starts each shift full; charging time comes out of the shift. The driver attends it, so it counts as working time: it comes on top of the required break and counts toward it (the UK drivers' hours; driving at most 9 hours).</div>
                  </div>
                </>
              )}
            </div>
          </details>
        </CarbonStep>

        {/* ---------------- 4. surplus material ---------------- */}
        <CarbonStep n={4} data-guide="carbon-surplus">
          {wasteRoutes.length === 0 ? (
            <p className="text-sm text-slate-600 mt-2">No surplus material leaves site in this plan.</p>
          ) : (
            <>
              {wasteRoutes.map(r => {
                const d = (st.disposal || {})[r.route_id] || {};
                return (
                  <div key={r.route_id} className="border-t border-slate-100 pt-3 mt-3">
                    <div className="text-sm font-semibold text-slate-700">{r.route_id} · {r.origin_name} → {r.dest_name}{r.disposal_route ? ` (${(CARBON_DISPOSAL_WORD[r.disposal_route] || r.disposal_route).toLowerCase()})` : ""}</div>
                    {r.disposal_route && step(r.disposal_route) ? <div className={hint}>Waste hierarchy: {step(r.disposal_route).toLowerCase()}</div> : null}
                    <div className="grid sm:grid-cols-2 gap-x-4">
                      {(r.destinations || []).length > 0 && (
                        <label className="block mt-2"><span className={lab}>Receiving site</span>
                          <select className={inp} value={d.to_route || ""} onChange={ev => setK("disposal", r.route_id, { ...d, to_route: ev.target.value })}>
                            <option value="">{r.dest_name} (as planned)</option>
                            {r.destinations.map(x => <option key={x.route_id} value={x.route_id} disabled={!x.baked}>{x.dest_name}{x.disposal_route ? ` (${dispWord(x.disposal_route).toLowerCase()})` : ""}{x.baked ? "" : " — no route distance yet"}</option>)}
                          </select></label>
                      )}
                      {r.disposal_route && (
                        <label className="block mt-2"><span className={lab}>Disposal method</span>
                          <select className={inp} value={d.to || ""} onChange={ev => setK("disposal", r.route_id, { ...d, to: ev.target.value })}>
                            <option value="">As the site's type ({(CARBON_DISPOSAL_WORD[r.disposal_route] || r.disposal_route).toLowerCase()})</option>
                            {(r.disposal_routes || []).map(k => <option key={k} value={k}>{dispWord(k)}</option>)}
                          </select></label>
                      )}
                    </div>
                  </div>
                );
              })}
              <details className="dash-more mt-3">
                <summary>Transfer notes</summary>
                <div>
                  <p className={hint + " mt-2"} title={data.waste_hierarchy_source || ""}>The waste hierarchy step follows the disposal method used for the carbon figure. Each transfer still needs a waste transfer note (or a season ticket covering a series of transfers); Wayscope does not replace these or the duty of care.</p>
                </div>
              </details>
            </>
          )}
        </CarbonStep>

        {/* ---------------- 5. result ---------------- */}
        <CarbonStep n={5} data-guide="carbon-drivers">
          {err && <p className="text-sm font-semibold mt-2" role="alert" style={{ color: "var(--red)" }}>Not updated: {err}{A ? " The figures below are from your previous choices." : ""}</p>}
          {!A ? (
            err ? null : <p className="text-sm text-slate-600 mt-2">Make a choice in steps 2 to 4 to see the result. The approved plan stays as it is.</p>
          ) : (
            <>
              <div className={big} style={{ fontSize: "clamp(1.4rem, 2vw, 2rem)" }}>{t1(A.totals.total_t)} <span className="text-sm font-semibold text-slate-500">tCO2e</span>{busy && <span className={hint + " font-normal"}> updating…</span>}</div>
              <p className="text-sm font-semibold mt-1 tabular-nums" style={{ color: tone(A.delta_t) }}>{resultWords}</p>
              <p className="text-sm text-slate-700 tabular-nums">{loadsChange}</p>
              <h3 className={h3 + " mt-4"}>Which decisions change carbon most</h3>

                <div className="mt-2 space-y-3">

                      <div className="flex justify-between gap-3 text-sm"><span className="text-slate-800">{d.label}</span>
                        <span className="tabular-nums whitespace-nowrap"><b style={{ color: tone(d.delta_t) }}>{moved(d.delta_t)}</b> ({pct(d.delta_pct)})</span></div>
                      <div className={hint + " tabular-nums"}>{lorryEffect(d)}</div>
                      <div className="h-2 rounded bg-slate-100" aria-hidden="true"><div className="h-2 rounded" style={{ width: `${Math.max(2, Math.abs(d.delta_t) / mx * 100)}%`, background: tone(d.delta_t) }} /></div>
                    </div>)); })()}

              {Object.entries((A.totals && A.totals.flags) || {}).filter(([k]) => k !== "UNBAKED").map(([k, n]) => <p key={k} className="text-sm text-amber-700 mt-2">{n} plan line{n === 1 ? "" : "s"}: {CARBON_FLAG_WORDS[k] || k}</p>)}
              {(A.lever_words || []).length > 0 && (
                <>
                  <h3 className={h3 + " mt-4"}>Your decisions</h3>
                  <ul className="list-disc pl-5 mt-1 text-sm text-slate-700 space-y-1">{A.lever_words.map(w => <li key={w}>{w}</li>)}</ul>
                </>
              )}
              <details className="dash-more mt-3">
                <summary>The result in full</summary>
                <div>
                  {breakdown(A)}
                  {lorryLine(A)}
                  {unsizedNote(A)}
                  <p className="text-sm text-slate-600 mt-2">{Math.abs(A.interaction_t || 0) < 0.0005
                    ? "The decisions do not affect each other here: together they come to the sum of each on its own."
                    : `Together, the result is ${grp(Math.abs(A.interaction_t), 1)} tCO2e ${A.interaction_t < 0 ? "lower" : "higher"} than adding up each decision on its own.`}</p>
                  {(A.totals && A.totals.flags || {}).UNBAKED ? <p className="text-sm text-amber-700 mt-2">{A.totals.flags.UNBAKED} plan line{A.totals.flags.UNBAKED === 1 ? "" : "s"}: {CARBON_FLAG_WORDS.UNBAKED}</p> : null}
                  <p className={hint + " mt-2"}>Each decision is tested on its own against the approved plan; National Highways records ideas like these in its Low Carbon Opportunities Register.</p>
                </div>
              </details>
            </>
          )}
          <details className="dash-more mt-3">
            <summary>How the plan compares</summary>
            <div>
              <div className="overflow-x-auto mt-2">
                <table className="tbl tbl-wrap">
                  <caption><b>How the plan compares</b> · against published references, never an invented limit</caption>
                  <thead><tr><th scope="col">Measure</th><th scope="col" className="num">Approved plan</th><th scope="col" className="num">Alternative</th><th scope="col">Reference</th></tr></thead>
                  <tbody>
                    <tr><td>Transport kgCO2e per tonne moved</td><td className="num">{bm(B).kg_co2e_per_t_delivered ?? "no data"}</td><td className="num">{altCell(a => bm(a).kg_co2e_per_t_delivered ?? "no data")}</td><td className={hint}>No published limit per delivery or per tonne exists</td></tr>
                    <tr><td>All-in kgCO2e per tonne (material, transport, waste disposal)</td><td className="num">{bm(B).kg_co2e_per_t_all_in ?? "no data"}</td><td className="num">{altCell(a => bm(a).kg_co2e_per_t_all_in ?? "no data")}</td><td className={hint}>Soil has no Government production factor, so earthworks carry haulage and disposal only</td></tr>
                    <tr title={prov(fx["tkm:artic"]) + "\n" + prov(fx["tkm:rigid"])}><td>kgCO2e per {TKM()}</td>

                    <tr title={(data.methods || {}).nh_tool + "\n" + prov(fx["nh_tool"])}><td>National Highways Carbon Tool method (for comparison)<div className={hint}>Tonnes × one-way distance, return added, 2024 factors with well-to-tank</div></td><td className="num">{t1(B.totals.transport_nh_t)}</td><td className="num">{altCell(a => t1(a.totals.transport_nh_t))}</td></tr>

                </table>
              </div>
              <p className="text-sm text-slate-600 pt-3">All three use Government factors. GOV.UK says to prefer the per-vehicle-km figure when the vehicle and the route distance are known, which they are here. The Carbon Tool asks only for tonnes and a one-way distance, adds the return and well-to-tank, so it reads higher. Never quote one as the other. Well-to-wheel adds producing the fuel or electricity (well-to-tank) to the same vehicle-km: it sits beside the total, never in it{B.totals.wtw_lines_out ? `, and leaves out ${B.totals.wtw_lines_out} plan line${B.totals.wtw_lines_out === 1 ? "" : "s"} whose lorry has no published well-to-tank row` : ""}.</p>
            </div>
          </details>
          <div className="mt-4" data-guide="carbon-summary">
            <details className="dash-more">
              <summary>Add a commentary (optional)</summary>
              <div>
                <p className={hint + " mt-2"}>One page: the approved plan beside the alternative, the decisions in words and ranked, what the figures count, and your commentary. Stamped "Wayscope planning estimate, DESNZ 2026 basis, not Carbon Tool figures".</p>
                <label className="block mt-2">

                  <span className={"block " + hint + " mb-1"}>Printed on the summary as typed; not saved</span>

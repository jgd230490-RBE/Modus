                      + (isActive ? "bg-white ring-1 ring-inset ring-[color:var(--red)]/40 "
                                  : "hover:bg-white ")
                      + (r.alt_index === 0 ? "" : "text-slate-500")}>
                    <td className="px-2 py-1 whitespace-nowrap">
                      {r.alt_index === 0 ? vehShort(r.profile) : ""}
                    </td>
                    <td className="px-2 py-1 whitespace-nowrap">
                      {isActive && <span style={{ color: "var(--red)" }} title="Shown on the map">● </span>}
                      {r.alt_index === 0
                        ? <span className="font-semibold" style={{ color: "var(--navy)" }}>Primary</span>
                        : `Alt ${r.alt_index}`}
                    </td>
                    <td className={cell}>{fmtDist(r.loaded_km, 1)}</td>
                    <td className={cell} title={r.return_estimated ? "Return leg not routed — assumed same as outbound" : undefined}>
                      {fmtDist(r.return_km, 1)}{r.return_estimated ? "*" : ""}
                    </td>
                    <td className={cell} title={(() => {
                      // B4: the total is the backend's, and the tooltip explains it from
                      // the backend's own parts. Nothing here re-adds them — the dashboard
                      // computing its own version of this number is how it once disagreed
                      // with the backend by 125% on an Artic Flatbed.
                      const tp = r.turnaround_parts || {};
                      const bits = [`${r.load_minutes} min load + ${r.unload_minutes} min unload`];
                      if(tp.safety_minutes) bits.push(`${tp.safety_minutes} min induction at the gates`);
                      if(tp.internal_travel_minutes) bits.push(`${tp.internal_travel_minutes} min gate to face`);
                      if(tp.internal_travel_source === "drawn_road")
                        bits.push(`internal travel comes from the drawn haul road, not a flat allowance` +
                                  (tp.internal_travel_flat_available
                                    ? ` (the ${tp.internal_travel_flat_available} min flat figure is deliberately not added on top)` : ""));
                      return bits.join(" · ");
                    })()}>
                      {Math.round((r.turnaround_hr || 0) * 60)}m
                      {(r.turnaround_parts && (r.turnaround_parts.safety_minutes
                        || r.turnaround_parts.internal_travel_minutes)) ? "‡" : ""}
                    </td>
                    <td className={cell}
                      title={r.haul_speed_applied
                        ? `Includes an assigned haul speed over ${fmtDist(r.haul_km, 1)} ${DU()} (${(r.haul_zones || []).join(", ")}). On HERE's own timing this cycle would be ${r.cycle_hr_here} h.`
                        : undefined}>
                      {r.cycle_hr} h{r.haul_speed_applied ? <span style={{ color: ZONE_HAUL }}>†</span> : null}
                    </td>
                    <td className={cell} title={(r.lorry_day && r.lorry_day.words) || undefined} data-trips-limit={(r.lorry_day && r.lorry_day.limited_by) || undefined}>{r.trips_per_day || <span className="text-slate-500">0</span>}{r.lorry_day && r.trips_per_day < r.lorry_day.trips_without_rules ? <span className="text-slate-500">§</span> : null}</td>
                    <td className={cell}>{r.tonnes_per_day}</td>
                    <td className={cell}>{r.tonnes_per_month}</td>
                    <td className={cell}>{r.co2_kg_per_trip}</td>
                    <td className="px-2 py-1 text-right whitespace-nowrap">
                      {r.alt_index !== 0 && onPromote && (
                        <button
                          onClick={(e) => { e.stopPropagation(); onPromote(r.profile, r.alt_index); }}
                          disabled={promoting === `${r.profile}|${r.alt_index}`}
                          title="Use this option as the primary route for this vehicle"
                          className="text-[10px] font-semibold px-1.5 py-0.5 rounded border border-slate-300 hover:bg-white disabled:opacity-40">
                          {promoting === `${r.profile}|${r.alt_index}` ? "…" : "Make primary"}
                        </button>
                      )}
                    </td>
                  </tr>
                  );
                })}
              </tbody>
            </table>
            <p className="text-[11px] text-slate-400 mt-2">
              Cycle = out + back + turnaround. Turnaround is the vehicle's own load and unload
              time from Config → Vehicles, plus — where gates record them — induction at each gate
              and gate-to-face travel (‡). Trips/day is what fits in a driver's day: the {data.planning.shift_hours_per_day} h
              shift less the break the UK drivers' hours rules require, with driving (out, back and gate to face) at most
              9 h; loading, unloading and check-in are other work. § = fewer than the shift alone would hold (hover for why);
              a 0 is a round trip that does not fit a driver's day, counted as one lorry a trip. A planning figure: weekly
              limits and the day's other duties are not modelled.{data.planning.shift_note ? " " + data.planning.shift_note : ""}{" "}
              t/month assumes {data.planning.working_days_per_month} working days.
              {data.rows.some(r => r.return_estimated) && " * return leg not routed — assumed to mirror the outbound."}
            </p>
            {data.rows.some(r => r.haul_speed_applied) && (
              <p className="text-[11px] mt-1" style={{ color: ZONE_HAUL }}>
                † part of this cycle runs on a temporary haul road at an <strong>assigned</strong> speed,
                not a speed HERE measured. HERE will not accept a custom speed, so the haul stretch is
                timed at <em>drawn length ÷ assigned speed</em> and substituted in. Hover the cycle for
                what the figure would be on HERE&rsquo;s own timing. It is a planning assumption, and it
                is only as good as the line somebody drew.
              </p>
            )}
            <p className="text-[11px] text-slate-400 mt-1">
              Click a row to draw that option on the map — it turns red, the vehicle's other
              options stay grey. “Make primary” swaps an alternative into first place so it
              becomes the route the network is planned around; re-routing restores HERE's ranking.
            </p>
          </div>
        )}
      </td>
    </tr>
  );
}

// Material categories a location supplies (out) or receives (in).
function CatChips({ list, dir }){
  const arr = asArray(list);
  if(!arr.length) return <span className="text-slate-500">—</span>;
  const bg = dir === "in" ? "rgba(3,158,134,.10)" : "rgba(37,99,235,.08)";
  const fg = dir === "in" ? "var(--ok-text)" : "var(--navy)";
  return (
    <span className="flex flex-wrap gap-1">
      {arr.map(c => (
        <span key={c} className="text-xs px-1.5 py-0.5 rounded-full whitespace-nowrap"
          style={{ background: bg, color: fg }}>{c}</span>
      ))}
    </span>
  );
}

// Why the analysis table can look like it ignores the vehicle. Three different faults
// present identically — a profile whose name no longer matches factors.json, a deployed
// factors.json that isn't the one you think, and vehicles that genuinely share a figure.
// This shows the resolved numbers so they can be told apart, and can put a real question
// to HERE about one route.
function Diagnostics({ token, routeId }){
  const [fx, setFx] = useState(null);
  const [cmp, setCmp] = useState(null);
  const [busy, setBusy] = useState("");
  const [err, setErr] = useState("");
  const qs = () => (token ? `?token=${encodeURIComponent(token)}` : "");

  const loadFactors = async () => {
    setBusy("factors"); setErr("");
    try {
      const r = await fetch(`${API}/admin/diagnostics/factors${qs()}`);
      if(!r.ok) throw new Error(`${r.status} — ${r.status === 403 ? "admin token rejected" : await r.text()}`);
      setFx(await r.json());
    } catch(e){ setErr(e.message); }
    setBusy("");
  };

  const probeHere = async () => {
    if(!routeId){ setErr("Pick a route on the Routes tab first."); return; }
    setBusy("probe"); setErr("");
    try {
      const p = new URLSearchParams({ probe: "true" });
      if(token) p.set("token", token);
      const r = await fetch(`${API}/admin/diagnostics/compare/${encodeURIComponent(routeId)}?${p}`);
      if(!r.ok) throw new Error(`${r.status} — ${r.status === 403 ? "admin token rejected" : await r.text()}`);
      setCmp(await r.json());
    } catch(e){ setErr(e.message); }
    setBusy("");
  };

  return (
    <div className="card p-4">
      <div className="text-sm font-semibold text-slate-700 mb-1">Diagnostics</div>
      <p className="text-[11px] text-slate-400 mb-2">
        Use these when vehicles look interchangeable — identical distances, cycle times or CO₂.
      </p>
      <div className="flex flex-wrap gap-2">
        <button onClick={loadFactors} disabled={!!busy}
          className="text-xs font-semibold px-2.5 py-1 rounded-md border border-slate-200 hover:bg-slate-50 disabled:opacity-40">
          {busy === "factors" ? "Checking…" : "Check factors.json"}
        </button>
        <button onClick={probeHere} disabled={!!busy || !routeId} title={routeId ? `Ask HERE about ${routeId}` : "Select a route first"}
          className="text-xs font-semibold px-2.5 py-1 rounded-md border border-slate-200 hover:bg-slate-50 disabled:opacity-40">
          {busy === "probe" ? "Asking HERE…" : `Probe HERE${routeId ? ` · ${routeId}` : ""}`}
        </button>
      </div>
      {err && <p className="text-xs mt-2" style={{ color: "var(--red)" }}>{err}</p>}

      {fx && (
        <div className="mt-3">
          {fx.warnings.map((w, i) => (
            <p key={i} className="text-[11px] rounded-md px-2 py-1.5 mb-1"
              style={{ background: "rgba(255,193,1,.14)", color: "#8a6d00" }}>⚠ {w}</p>
          ))}
          {!fx.warnings.length && (
            <p className="text-[11px] rounded-md px-2 py-1.5 mb-1"
              style={{ background: "rgba(3,158,134,.10)", color: "var(--ok-text)" }}>
              Every profile resolves to a distinct entry in factors.json.
            </p>
          )}
          <div className="overflow-x-auto">
            <table className="text-[11px] w-full">
              <thead className="text-slate-400">
                <tr>
                  <th className="text-left font-semibold py-1">Vehicle</th>
                  <th className="text-right font-semibold px-1">Payload</th>
                  <th className="text-right font-semibold px-1">CO₂/km</th>
                  <th className="text-right font-semibold px-1">Laden</th>
                  <th className="text-right font-semibold px-1">Tare</th>
                  {/* the UNLOADING half only. A vehicle has no route, so it has no gates
                      and therefore no induction or gate-to-face time — this figure and a
                      route's turnaround are different quantities from Phase 5a onward,
                      and the header says so rather than inviting the comparison. */}
                  <th className="text-right font-semibold px-1" title="Load + unload for this vehicle. A route's turnaround also includes gate induction and gate-to-face travel.">Load/unload</th>
                </tr>
              </thead>
              <tbody>
                {fx.vehicles.map(v => (
                  <tr key={v.profile} className="border-t border-slate-100">
                    <td className="py-1 whitespace-nowrap">
                      {!v.in_factors && <span style={{ color: "var(--red)" }} title="Not a key in factors.json — falls back to _default">⚠ </span>}
                      {vehShort(v.profile)}
                      {v.in_database && <span className="text-slate-500" title="Present in cached geometry"> ●</span>}
                    </td>
                    <td className="text-right tabular-nums px-1">{v.payload_t}t</td>
                    <td className="text-right tabular-nums px-1">{v.emissions_kg_co2e_per_km}</td>
                    <td className="text-right tabular-nums px-1">{v.gross_weight_kg ? (v.gross_weight_kg/1000)+"t" : "—"}</td>
                    <td className="text-right tabular-nums px-1">{v.tare_weight_kg ? (v.tare_weight_kg/1000)+"t" : "—"}</td>
                    <td className="text-right tabular-nums px-1">{Math.round((v.unloading_hr||0)*60)}m</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <p className="text-[11px] text-slate-400 mt-1">● = appears in cached geometry. ⚠ = name not found in factors.json.</p>
        </div>
      )}

      {cmp && (
        <div className="mt-3">
          <p className="text-[11px] mb-1" style={{ color: cmp.all_identical ? "#8a6d00" : "var(--ok-text)" }}>
            {cmp.note}
          </p>
          <div className="overflow-x-auto">
            <table className="text-[11px] w-full">
              <thead className="text-slate-400">
                <tr>
                  <th className="text-left font-semibold py-1">Vehicle</th>
                  <th className="text-right font-semibold px-1">Gross</th>
                  <th className="text-right font-semibold px-1">Live km</th>
                  <th className="text-right font-semibold px-1">Options</th>
                  <th className="text-center font-semibold px-1">HGV params</th>
                </tr>
              </thead>
              <tbody>
                {cmp.rows.map(r => (
                  <tr key={r.profile} className="border-t border-slate-100">
                    <td className="py-1 whitespace-nowrap">{vehShort(r.profile)}</td>
                    <td className="text-right tabular-nums px-1">{r.gross_weight_kg ? (r.gross_weight_kg/1000)+"t" : "—"}</td>
                    <td className="text-right tabular-nums px-1">{r.error ? "err" : (r.live_km ?? "—")}</td>
                    <td className="text-right tabular-nums px-1">{r.routes_returned ?? "—"}</td>
                    <td className="text-center px-1">
                      {r.truck_params_present === undefined ? "—"
                        : r.truck_params_present ? <span style={{ color: "var(--ok-text)" }}>✓</span>
                        : <span style={{ color: "var(--red)" }} title="No vehicle[...] params were sent — HERE routed this as a generic HGV">✗</span>}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <p className="text-[11px] text-slate-400 mt-1">
            “Options” is how many routes HERE actually returned — 1 means it found no
            meaningfully different alternative, which is common on a sparse network.
          </p>
        </div>
      )}
    </div>
  );
}

function DataManagement({ meta, who, subTab: propSubTab, onSubTab }){
  const { vehicles, materials = [], mapbox_token } = meta;
  const mapDiv = useRef(null);
  const mapObj = useRef(null);
  const routesFC = useRef({ type: "FeatureCollection", features: [] });
  const nodesFC = useRef({ type: "FeatureCollection", features: [] });
  const selFC = useRef({ type: "FeatureCollection", features: [] });
  const altFC = useRef({ type: "FeatureCollection", features: [] });
  const newFC = useRef({ type: "FeatureCollection", features: [] });   // provisional add marker
  const zonesFC = useRef({ type: "FeatureCollection", features: [] }); // saved zones (Phase 3)
  const drawFC = useRef({ type: "FeatureCollection", features: [] });  // the shape being drawn
  const geoCache = useRef({});
  const [mapReady, setMapReady] = useState(false);
  const [status, setStatus] = useState(null);
  const [summary, setSummary] = useState(null);
  const [basemap, setBasemap] = useState("mapbox://styles/mapbox/light-v11");
  const [showProfile, setShowProfile] = useState(vehicles.includes("Artic Tipper (44t)") ? "Artic Tipper (44t)" : vehicles[0]);
  // which of the baked geometries the map draws. A route now has two directions and up
  // to three HERE options each, so without a pick the map would stack six lines per route.
  const [showLeg, setShowLeg] = useState("loaded");
  const [showAlt, setShowAlt] = useState(0);
  // which Routes row has its analysis panel open (Step C)
  const [openRow, setOpenRow] = useState(null);
  // every cached option for the selected route, and which one is currently in focus.
  // Selecting a route draws all of its options; the focused one is red, the rest grey.
  const [selGeoms, setSelGeoms] = useState(null);
  const [activeGeom, setActiveGeom] = useState(null);   // {profile, leg, alt_index}
  const [promoting, setPromoting] = useState("");
  const [token, setToken] = useState(() => { try { return localStorage.getItem("modus_admin_token") || ""; } catch(e){ return ""; } });
  const [bakeBusy, setBakeBusy] = useState("");   // route id currently being (re-)baked
  const [selected, setSelected] = useState(null);

  // ---- the page: Locations | Routes | Zones ----
  //
  // 2.5b: these are three entries in the LEFT RAIL now, not a tab bar in here, so the
  // page arrives as a prop. The internal state stays because the many setSubTab() calls
  // below still need to switch page from inside — a map click that opens a node, "create
  // a route from here", the zone editor bailing out — and every one of them must tell the
  // rail as well, or the rail and the panel disagree about where you are.
  //
  // ⚠️ ONE map, shared by all three pages. Portal renders the same <DataManagement> for
  // locations/routes/zones so this component is never unmounted while moving between
  // them; remounting would tear down the Mapbox instance and lose the style, the sources
  // and the viewport. Only the right-hand panel and the bottom table swap.
  const [subTab, setSubTabState] = useState(propSubTab || "locations");
  const setSubTab = (t) => { setSubTabState(t); if(onSubTab) onSubTab(t); };
  useEffect(() => { if(propSubTab && propSubTab !== subTab) setSubTabState(propSubTab); }, [propSubTab]);
  const subTabRef = useRef(propSubTab || "locations");
  useEffect(() => { subTabRef.current = subTab; }, [subTab]);

  // The right column only matches the map's height where they sit side by side;
  // stacked on narrow screens it flows normally.
  const [isWide, setIsWide] = useState(() => {
    try { return window.matchMedia("(min-width: 1024px)").matches; } catch(e){ return true; }
  });
  useEffect(() => {
    let mq;
    try { mq = window.matchMedia("(min-width: 1024px)"); } catch(e){ return; }
    const on = () => setIsWide(mq.matches);
    mq.addEventListener ? mq.addEventListener("change", on) : mq.addListener(on);
    return () => { mq.removeEventListener ? mq.removeEventListener("change", on) : mq.removeListener(on); };
  }, []);

  // ---- reactive locations (for the route-authoring pickers) ----
  const [locs, setLocs] = useState([]);
  const featProps = (gj) => (gj.features || []).map(f => ({ ...f.properties }));

  // ---- route authoring (Phase 1b) ----
  const [rOrigin, setROrigin] = useState("");
  const [rDest, setRDest] = useState("");
  // Vehicle profiles the new route is baked for on create. Routes no longer carry a
  // material — validity is origin.supplies n dest.receives instead.
  const [rVehicles, setRVehicles] = useState(
    () => (vehicles.includes("Artic Tipper (44t)") ? ["Artic Tipper (44t)"] : vehicles.slice(0, 1)));
  const [rId, setRId] = useState("");
  const [rIdTouched, setRIdTouched] = useState(false);
  const [rIpt, setRIpt] = useState("");
  // 2.5b: the same panel edits an existing route. null = creating.
  const [editingRoute, setEditingRoute] = useState(null);
  // 2026-09-09: the vehicle set being edited, held SEPARATELY from rVehicles on purpose.
  // rVehicles drives two things -- what a new route is baked for, and what "Bake all"
  // sweeps the whole network with -- so reusing it for the edit form would silently
  // re-point the bulk-bake button at whatever the route being edited happens to carry,
  // and the button's own tooltip would then be lying about where its list came from.
  const [eVehicles, setEVehicles] = useState([]);
  const [rMaterial, setRMaterial] = useState("");
  const [routeBusy, setRouteBusy] = useState(false);
  const [routeMsg, setRouteMsg] = useState("");
  const [bakeLegs, setBakeLegs] = useState("both");   // bulk bake: both legs or laden only

  // ---- zones (Phase 3): geofencing and disruptions in one table ----
  const [zoneList, setZoneList] = useState([]);
  const [haulUse, setHaulUse] = useState({});      // Phase 4: zone_id -> routes attached
  const [zoneForm, setZoneForm] = useState(null);   // null = not editing
  const [zoneMsg, setZoneMsg] = useState("");
  const [zoneBusy, setZoneBusy] = useState(false);
  const [zoneSel, setZoneSel] = useState(null);     // highlighted zone id
  // 'view' | 'draw'. Drawing collects vertices from map clicks into drawPts; nothing is
  // sent until Save, so an abandoned draw costs nothing.
  const [zoneDraw, setZoneDraw] = useState(false);
  const [drawPts, setDrawPts] = useState([]);
  const zoneDrawRef = useRef(false);
  useEffect(() => { zoneDrawRef.current = zoneDraw; }, [zoneDraw]);
  // Phase 5a: gate placement is a third click mode. A ref rather than state for the
  // same reason the other two are — the map's click handler is registered once, at
  // init, and closes over whatever it can see then.
  const gatePlaceRef = useRef(false);

  // ---- location management (Phase 1) ----
  const [mode, setMode] = useState("view");        // 'view' | 'add' | 'edit'
  const [form, setForm] = useState(null);          // {id?, name, role, loc_type, supplies[], receives[], lat, lon}
  const [savingLoc, setSavingLoc] = useState(false);
  const [locMsg, setLocMsg] = useState("");
  // ---- Phase 5a: gates ----
  // A location may have several, each with a direction. `gateForm` is the one being
  // added or edited; `gatePlace` is on while the next map click sets its coordinate.
  const [gateList, setGateList] = useState([]);
  const [gateForm, setGateForm] = useState(null);
  const [gatePlace, setGatePlace] = useState(false);
  const [gateMsg, setGateMsg] = useState("");
  // refs so once-bound map handlers always read current values
  const modeRef = useRef("view");
  const tokenRef = useRef(token);
  const justDragged = useRef(false);
  const framedRef = useRef(false);   // 13 Oct 2026 (W1): the scheme's locations framed once, on first load
  const cbRef = useRef({});
  useEffect(() => { modeRef.current = mode; }, [mode]);
  // the token lives in one field in the header now, so persist it as it is typed
  // rather than on whichever action happened to save it before
  useEffect(() => {
    tokenRef.current = token;
    try { localStorage.setItem("modus_admin_token", token); } catch(e){}
  }, [token]);

  const fetchStatus = () =>
    Promise.all([
      fetch(`${API}/routes/status`).then(r => r.json()),
      fetch(`${API}/routes/summary`).then(r => r.json()),
    ]).then(([st, sm]) => { setStatus(st); setSummary(sm); });

  useEffect(() => { fetchStatus().catch(() => setStatus([])); }, []);

  // lean the shared map towards the active sub-tab (paint only — no layer churn)
  const applyEmphasis = (m) => {
    const E = EMPHASIS[subTabRef.current] || EMPHASIS.routes;
    try {
      m.setPaintProperty("route-line", "line-width", E.route);
      m.setPaintProperty("route-line", "line-opacity", E.routeOp);
      m.setPaintProperty("route-casing", "line-opacity", E.casingOp);
      m.setPaintProperty("node-dots", "circle-radius", E.node);
      m.setPaintProperty("node-dots", "circle-stroke-width", E.nodeStroke);
    } catch(e){}
  };

  // add sources + layers; called on first load AND after every basemap change
  const addNetworkLayers = (m) => {
    if(!m.getSource("routes")) m.addSource("routes", { type: "geojson", data: routesFC.current });
    if(!m.getSource("nodes")) m.addSource("nodes", { type: "geojson", data: nodesFC.current });
    if(!m.getSource("sel")) m.addSource("sel", { type: "geojson", data: selFC.current });
    if(!m.getSource("alts")) m.addSource("alts", { type: "geojson", data: altFC.current });
    if(!m.getSource("selnode")) m.addSource("selnode", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    if(!m.getSource("newnode")) m.addSource("newnode", { type: "geojson", data: newFC.current });
    // Phase 3 zones: the saved shapes, and the one currently being drawn
    if(!m.getSource("zones")) m.addSource("zones", { type: "geojson", data: zonesFC.current });
    if(!m.getSource("draw")) m.addSource("draw", { type: "geojson", data: drawFC.current });
    // failed routes share the source but are filtered apart, so an unroutable pair is
    // visibly impossible rather than simply absent
    if(!m.getLayer("route-casing")) m.addLayer({ id: "route-casing", type: "line", source: "routes",
      filter: ["!=", ["get", "failed"], true],
      paint: { "line-color": "#ffffff", "line-width": 5, "line-opacity": 0.85 } });
    if(!m.getLayer("route-line")) m.addLayer({ id: "route-line", type: "line", source: "routes",
      filter: ["!=", ["get", "failed"], true],
      paint: { "line-color": ROUTE_COLOR, "line-width": 3 } });
    if(!m.getLayer("route-failed")) m.addLayer({ id: "route-failed", type: "line", source: "routes",
      filter: ["==", ["get", "failed"], true],
      paint: { "line-color": FAILED_COLOR, "line-width": 2, "line-opacity": 0.9,
               "line-dasharray": [2, 2] } });
    // alternatives sit *under* the chosen line, so the primary always reads on top
    if(!m.getLayer("alt-line")) m.addLayer({ id: "alt-line", type: "line", source: "alts",
      paint: { "line-color": ALT_COLOR, "line-width": 4, "line-opacity": 0.8 } });
    if(!m.getLayer("sel-line")) m.addLayer({ id: "sel-line", type: "line", source: "sel",
      paint: { "line-color": "#DC2626", "line-width": 5 } });
    if(!m.getLayer("selnode-ring")) m.addLayer({ id: "selnode-ring", type: "circle", source: "selnode",
      paint: { "circle-radius": 11, "circle-color": "rgba(0,0,0,0)", "circle-stroke-width": 3, "circle-stroke-color": "#DC2626" } });
    if(!m.getLayer("node-dots")) m.addLayer({ id: "node-dots", type: "circle", source: "nodes",
      paint: { "circle-radius": 5, "circle-color": nodeExpr(), "circle-stroke-width": 1.5, "circle-stroke-color": "#fff" } });
    if(!m.getLayer("newnode-dot")) m.addLayer({ id: "newnode-dot", type: "circle", source: "newnode",
      paint: { "circle-radius": 8, "circle-color": "#D97706", "circle-stroke-width": 3, "circle-stroke-color": "#2563EB", "circle-opacity": 0.95 } });
    // Zone fills go on last so they sit above the routes: the whole point is seeing which
    // lines cross one. A routing zone reads red, an advisory one grey — the colour is the
    // difference between "the router avoids this" and "look at this".
    if(!m.getLayer("zone-fill")) m.addLayer({ id: "zone-fill", type: "fill", source: "zones",
      filter: ["==", ["geometry-type"], "Polygon"],
      paint: { "fill-color": ["case", ["get", "affects_routing"], ZONE_ROUTING, ZONE_ADVISORY],
               "fill-opacity": ["case", ["get", "in_force"], 0.22, 0.07] } });
    if(!m.getLayer("zone-outline")) m.addLayer({ id: "zone-outline", type: "line", source: "zones",
      paint: { "line-color": ["case", ["get", "is_haul"], ZONE_HAUL,
                              ["get", "affects_routing"], ZONE_ROUTING, ZONE_ADVISORY],
               // a haul road is a line, not an outline — it needs to read as a road
               "line-width": ["case", ["get", "selected"], 3.5, ["get", "is_haul"], 3, 2],
               // a zone that is out of its date window is dashed, not hidden — it still
               // explains a bake that happened while it applied
               "line-dasharray": ["case", ["get", "in_force"], ["literal", [1, 0]], ["literal", [2, 2]]] } });
    if(!m.getLayer("zone-label")) m.addLayer({ id: "zone-label", type: "symbol", source: "zones",
      layout: { "text-field": ["get", "name"], "text-size": 11, "symbol-placement": "point" },
      paint: { "text-color": "#334155", "text-halo-color": "#ffffff", "text-halo-width": 2 } });
    if(!m.getLayer("draw-line")) m.addLayer({ id: "draw-line", type: "line", source: "draw",
      paint: { "line-color": "#DC2626", "line-width": 2.5, "line-dasharray": [2, 1.5] } });
    if(!m.getLayer("draw-vertex")) m.addLayer({ id: "draw-vertex", type: "circle", source: "draw",
      filter: ["==", ["geometry-type"], "Point"],
      paint: { "circle-radius": 5, "circle-color": "#fff", "circle-stroke-width": 2.5, "circle-stroke-color": "#DC2626" } });
    applyEmphasis(m);   // a basemap switch resets paint, so re-lean towards the active sub-tab
  };

  // init the map once
  useEffect(() => {
    if(mapObj.current || !mapDiv.current || !window.mapboxgl) return;
    window.mapboxgl.accessToken = mapbox_token;
    const m = new window.mapboxgl.Map({ container: mapDiv.current, style: basemap, center: UK_VIEW.center, zoom: UK_VIEW.zoom });
    m.addControl(new window.mapboxgl.NavigationControl(), "top-right");
    // drag bookkeeping for moving a node
    const drag = { id: null, moved: false };
    const onMove = (e) => {
      if(!drag.id) return;
      drag.moved = true;
      const feat = nodesFC.current.features.find(f => f.properties.id === drag.id);
      if(feat){ feat.geometry.coordinates = [e.lngLat.lng, e.lngLat.lat];
        const s = m.getSource("nodes"); if(s) s.setData(nodesFC.current); }
    };
    const onUp = (e) => {
      const id = drag.id, moved = drag.moved;
      drag.id = null; drag.moved = false;
      m.off("mousemove", onMove);
      m.getCanvas().style.cursor = "";
      if(!id) return;
      if(moved){
        justDragged.current = true;
        setTimeout(() => { justDragged.current = false; }, 80);
        (cbRef.current.commitMove || (()=>{}))(id, e.lngLat.lng, e.lngLat.lat);
      } else {
        (cbRef.current.selectNode || (()=>{}))(id);
      }
    };

    m.on("load", () => {
      addNetworkLayers(m);
      // node drag (only in view/edit; add-mode clicks drop new points)
      m.on("mousedown", "node-dots", (e) => {
        if(modeRef.current === "add") return;
        e.preventDefault();
        drag.id = e.features[0].properties.id; drag.moved = false;
        m.getCanvas().style.cursor = "grabbing";
        m.on("mousemove", onMove);
        m.once("mouseup", onUp);
      });
      // unified click: add a zone vertex / place (add mode) / select node / select route.
      // Zone drawing is checked first because it takes over the map entirely — while it
      // is on, a click must never also select a route underneath the shape being drawn.
      m.on("click", (e) => {
        if(zoneDrawRef.current){ (cbRef.current.addVertex || (()=>{}))(e.lngLat.lng, e.lngLat.lat); return; }
        // Phase 5a: placing a gate takes the click before node/route selection, so a
        // gate can be dropped on top of the site it belongs to without selecting it
        if(gatePlaceRef.current){ (cbRef.current.placeGateAt || (()=>{}))(e.lngLat.lng, e.lngLat.lat); return; }
        if(modeRef.current === "add"){ (cbRef.current.placeAt || (()=>{}))(e.lngLat.lng, e.lngLat.lat); return; }
        if(justDragged.current) return;
        const box = [[e.point.x - 6, e.point.y - 6], [e.point.x + 6, e.point.y + 6]];
        const hitNode = m.queryRenderedFeatures(box, { layers: ["node-dots"] });
        if(hitNode.length) return;    // node taps are handled by mousedown/up
        const layers = ["route-line", "route-failed"].filter(l => m.getLayer(l));
        const hitRoute = m.queryRenderedFeatures(e.point, { layers });
        if(hitRoute.length) (cbRef.current.selectRoute || (()=>{}))(hitRoute[0].properties.route_id);
      });
      m.on("mouseenter", "node-dots", () => { if(modeRef.current !== "add") m.getCanvas().style.cursor = "move"; });
      m.on("mouseleave", "node-dots", () => { m.getCanvas().style.cursor = modeRef.current === "add" ? "crosshair" : ""; });
      m.on("mouseenter", "route-line", () => { if(modeRef.current === "view") m.getCanvas().style.cursor = "pointer"; });
      m.on("mouseleave", "route-line", () => { m.getCanvas().style.cursor = modeRef.current === "add" ? "crosshair" : ""; });
      setMapReady(true);
    });
    m.on("style.load", () => { addNetworkLayers(m); });  // re-add after a basemap switch
    // Mapbox measures its container on init, before the flex/grid layout has settled,
    // so nudge it to re-measure once things are laid out (and whenever the window resizes).
    const doResize = () => { try { m.resize(); } catch(e){} };
    m.on("load", doResize);
    const t1 = setTimeout(doResize, 100);
    const t2 = setTimeout(doResize, 400);
    window.addEventListener("resize", doResize);
    // 13 Oct 2026 (W5): and whenever its own container changes size (the rail collapsing, a panel opening)
    const ro = typeof ResizeObserver !== "undefined" ? new ResizeObserver(doResize) : null;
    if(ro && mapDiv.current) ro.observe(mapDiv.current);
    mapObj.current = m;
    return () => {
      clearTimeout(t1); clearTimeout(t2);
      window.removeEventListener("resize", doResize);
      if(ro) ro.disconnect();
      if(mapObj.current){ mapObj.current.remove(); mapObj.current = null; }
    };
  }, []);

  const changeStyle = (val) => {
    setBasemap(val);
    const m = mapObj.current;
    if(!m) return;
    if(val === "maaamet-ortho") m.setStyle(maaametStyle());
    else m.setStyle(val);
  };

  // load geometry for the shown profile whenever it (or the data) changes
  useEffect(() => {
    if(!mapReady) return;
    const m = mapObj.current;
    const q = new URLSearchParams({ profile: showProfile, leg: showLeg, alt_index: String(showAlt) });
    fetch(`${API}/routes/geojson?${q.toString()}`).then(r => r.json()).then(gj => {
      routesFC.current = gj;
      geoCache.current = {};
      (gj.features || []).forEach(f => { geoCache.current[f.properties.route_id] = f.geometry.coordinates; });
      if(m.getSource("routes")) m.getSource("routes").setData(gj);
      // the selection highlight is owned by the selected-options effect below, which
      // reacts to showProfile/showLeg itself — nothing to re-sync here
    }).catch(() => {});
    fetch(`${API}/locations/geojson`).then(r => r.json()).then(gj => {
      nodesFC.current = gj;
      setLocs(featProps(gj));
      if(m.getSource("nodes")) m.getSource("nodes").setData(gj);
      // 13 Oct 2026 (W1): the first time the locations arrive, frame the scheme (the map opened on UK_VIEW); a later
      // reload leaves the camera where the planner put it. A camera move never takes the page down (30 Sep).
      if(!framedRef.current){
        const pts = (gj.features || []).map(f => f.geometry && f.geometry.coordinates)
          .filter(c => Array.isArray(c) && isFinite(c[0]) && isFinite(c[1]));
        if(pts.length){ framedRef.current = true; try { m.fitBounds(boundsOf(pts), { padding: 60, maxZoom: 12, duration: 0 }); } catch(e){} }
      }
    }).catch(() => {});
  }, [mapReady, showProfile, showLeg, showAlt, status]);

  const boundsOf = (coords) => {
    const b = new window.mapboxgl.LngLatBounds();
    coords.forEach(c => b.extend(c));
    return b;
  };
  // Selecting a route pulls every option it has cached, not just the one the map is
  // showing, so the alternatives can be drawn alongside the chosen line.
  const selectRoute = (id) => {
    setSelected(id);
    setActiveGeom({ profile: showProfile, leg: showLeg, alt_index: 0 });
    setSelGeoms(null);
    const m = mapObj.current;
    const coords = geoCache.current[id];
    if(coords && m) { try { m.fitBounds(boundsOf(coords), { padding: 60, maxZoom: 13, duration: 700 }); } catch(e){} }
    fetch(`${API}/routes/${encodeURIComponent(id)}/geometries`)
      .then(r => r.json())
      .then(gj => setSelGeoms(gj))
      .catch(() => setSelGeoms({ type: "FeatureCollection", features: [] }));
  };

  // Focus a specific option — used by the analysis rows, so clicking a vehicle line
  // shows that vehicle's actual road rather than whatever the map selector is on.
  const focusGeom = (profile, alt_index, leg) =>
    setActiveGeom({ profile, alt_index, leg: leg || showLeg });

  const sameGeom = (f, a) => a && f.properties.vehicle_profile === a.profile
    && f.properties.leg === a.leg && f.properties.alt_index === a.alt_index;

  // paint the selected route's options: focused one red, its siblings grey
  useEffect(() => {
    const m = mapObj.current; if(!m || !mapReady) return;
    const selSrc = m.getSource("sel"), altSrc = m.getSource("alts");
    if(!selSrc || !altSrc) return;

    if(!selected || !selGeoms){
      // nothing selected — fall back to the plain highlight from the shown geometry
      const coords = selected ? geoCache.current[selected] : null;
      selFC.current = coords
        ? { type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: coords } }
        : { type: "FeatureCollection", features: [] };
      altFC.current = { type: "FeatureCollection", features: [] };
      selSrc.setData(selFC.current); altSrc.setData(altFC.current);
      return;
    }

    const feats = selGeoms.features || [];
    // only the focused vehicle's options for the shown direction — drawing every
    // vehicle's alternatives at once would be a thicket, not information
    const prof = (activeGeom && activeGeom.profile) || showProfile;
    const leg = (activeGeom && activeGeom.leg) || showLeg;
    const mine = feats.filter(f => f.properties.vehicle_profile === prof && f.properties.leg === leg);
    const focused = mine.find(f => sameGeom(f, activeGeom))
                 || mine.find(f => f.properties.alt_index === 0);

    selFC.current = focused
      ? { type: "FeatureCollection", features: [focused] }
      : { type: "FeatureCollection", features: [] };
    altFC.current = { type: "FeatureCollection",
                      features: mine.filter(f => f !== focused) };
    selSrc.setData(selFC.current); altSrc.setData(altFC.current);
  }, [selected, selGeoms, activeGeom, showProfile, showLeg, mapReady]);

  // clearing the selection clears its options too
  useEffect(() => {
    if(!selected){ setSelGeoms(null); setActiveGeom(null); }
  }, [selected]);

  const promoteAlt = async (profile, alt_index, leg) => {
    if(!selected) return;
    const key = `${profile}|${alt_index}`;
    setPromoting(key);
    try {
      const p = new URLSearchParams({ profile, alt_index: String(alt_index), leg: leg || showLeg });
      if(tokenRef.current) p.set("token", tokenRef.current);
      const res = await fetch(`${API}/admin/routes/${encodeURIComponent(selected)}/promote-alt?${p}`,
        { method: "POST" });
      if(!res.ok){
        const t = await res.text();
        throw new Error(res.status === 403 ? "admin token rejected" : `${res.status} ${t.slice(0,120)}`);
      }
      const j = await res.json();
      if(j.error) throw new Error(j.error);
      const gj = await fetch(`${API}/routes/${encodeURIComponent(selected)}/geometries`).then(r => r.json());
      setSelGeoms(gj);
      setActiveGeom({ profile, leg: leg || showLeg, alt_index: 0 });
      await reloadNetwork();
      setRouteMsg(`${selected}: alternative ${alt_index} is now the primary route for ${vehShort(profile)}. Re-routing restores HERE's ranking.`);
    } catch(e){ setRouteMsg("Couldn't promote: " + e.message); }
    setPromoting("");
  };

  const refresh = async () => { await fetchStatus(); };

  // re-pull locations + status; the [status] effect then reloads route geometry
  const reloadNetwork = async () => {
    const m = mapObj.current;
    try {
      const [loc, st, sm] = await Promise.all([
        fetch(`${API}/locations/geojson`).then(r => r.json()),
        fetch(`${API}/routes/status`).then(r => r.json()),
        fetch(`${API}/routes/summary`).then(r => r.json()),
      ]);
      nodesFC.current = loc;
      setLocs(featProps(loc));
      if(m && m.getSource("nodes")) m.getSource("nodes").setData(loc);
      setStatus(st); setSummary(sm);
    } catch(e){ /* leave existing data in place */ }
  };

  // Bake one route for a set of vehicle profiles. Routes are baked individually now —
  // there is no global profile selection, so every caller states which vehicles it means.
  // Returns the profiles that failed.
  const bakeOneRoute = async (routeId, profiles) => {
    const failed = [];
    for(const prof of (profiles || [])){
      const q = new URLSearchParams({ route_id: routeId, profile: prof });
      if(tokenRef.current) q.set("token", tokenRef.current);
      try {
        const r = await fetch(`${API}/admin/bake-route?${q.toString()}`, { method: "POST" });
        const j = await r.json();
        if(j.error) failed.push(`${vehShort(prof)}: ${j.error}`);
      } catch(e){ failed.push(`${vehShort(prof)}: ${e.message}`); }
    }
    return failed;
  };

  // Re-bake routes whose geometry was just invalidated, each for the profiles it already
  // had. Moving a node used to re-bake against a globally-ticked profile list; reusing
  // what each route itself carried restores exactly what was there instead, and needs no
  // global setting to be correct.
  const rebakeAffected = async (affected) => {
    const list = (affected || []).filter(a => a && a.profiles && a.profiles.length);
    let done = 0;
    for(const a of list){
      setLocMsg(`Re-routing ${a.id} (${++done}/${list.length})…`);
      await bakeOneRoute(a.id, a.profiles);
    }
    return { rebaked: list.length, skipped: (affected || []).length - list.length };
  };

  // Routes-table action: re-bake this route for the vehicles it already has.
  const rebakeRoute = async (routeId, profiles) => {
    const profs = (profiles && profiles.length) ? profiles : [showProfile];
    setBakeBusy(routeId);
    setRouteMsg(`Re-routing ${routeId} for ${profs.map(vehShort).join(", ")}…`);
    const failed = await bakeOneRoute(routeId, profs);
    await reloadNetwork();
    if(selected === routeId){
      try {
        setSelGeoms(await fetch(`${API}/routes/${encodeURIComponent(routeId)}/geometries`).then(r => r.json()));
      } catch(e){}
    }
    setRouteMsg(failed.length ? `${routeId}: ${failed.join(" · ")}`
                              : `${routeId} re-routed for ${profs.length} vehicle(s).`);
    setBakeBusy("");
  };

  // ---- location add / edit / move / delete ----
  const startAdd = () => {
    setSubTab("locations");
    setSelected(null); setLocMsg("");
    setForm({ id: null, name: "", role: "origin", loc_type: "Quarry", supplies: [], receives: [],
      vendor: "", detail: "", lat: "", lon: "", gate_lat: "", gate_lon: "",
      // Week 1, Task D2. Blank means NOT RECORDED, which is not zero — the balance
      // still computes and `remaining` comes back unknown.
      capacity_qty: "", capacity_unit: "t", opening_qty: "", clp_cap_per_day: "", site_rules: "" });
    setMode("add");
  };
  const openEditForNode = (id) => {
    const feat = nodesFC.current.features.find(f => f.properties.id === id);
    if(!feat) return;
    const p = feat.properties;
    const supplies = asArray(p.supplies).length ? asArray(p.supplies) : asArray(p.materials);
    setSelected(null); setLocMsg("");
    setForm({ id: p.id, name: p.name || "", role: p.role || "both", loc_type: locTypeOf(p.loc_type) || "Other",
      supplies, receives: asArray(p.receives),
      lat: feat.geometry.coordinates[1], lon: feat.geometry.coordinates[0],
      // blank means no gate surveyed — routing falls back to the marker above
      vendor: p.vendor || "", detail: p.detail || "",
      gate_lat: p.gate_lat == null ? "" : p.gate_lat,
      gate_lon: p.gate_lon == null ? "" : p.gate_lon,
      capacity_qty: p.capacity_qty == null ? "" : p.capacity_qty,
      capacity_unit: p.capacity_unit || "t",
      opening_qty: p.opening_qty == null ? "" : p.opening_qty,
      clp_cap_per_day: p.clp_cap_per_day == null ? "" : p.clp_cap_per_day,
      site_rules: p.site_rules || "" });
    setMode("edit");
  };
  // Locations-table row click: centre the map on the node and open it for editing.
  const locateNode = (id) => {
    const feat = nodesFC.current.features.find(f => f.properties.id === id);
    openEditForNode(id);
    const m = mapObj.current;
    if(feat && m) m.easeTo({ center: feat.geometry.coordinates, zoom: Math.max(m.getZoom(), 11), duration: 700 });
  };
  const cancelForm = () => { setForm(null); setMode("view"); setLocMsg(""); };
  const setField = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const toggleCat = (key, cat) => setForm(f => {
    const list = f[key] || [];
    return { ...f, [key]: list.includes(cat) ? list.filter(c => c !== cat) : [...list, cat] };
  });

  // a gate only counts when both halves parse; half a coordinate is no coordinate
  const gateFrom = (f) => {
    const gLat = parseFloat(f.gate_lat), gLon = parseFloat(f.gate_lon);
    return (isFinite(gLat) && isFinite(gLon)) ? { gate_lat: gLat, gate_lon: gLon }
                                              : { gate_lat: null, gate_lon: null };
  };

  const bodyFromForm = (f, lat, lon) => ({
    name: (f.name || "").trim(), role: f.role, loc_type: f.loc_type || f.role,
    supplies: f.role === "destination" ? [] : (f.supplies || []),
    receives: f.role === "origin" ? [] : (f.receives || []),
    materials: f.role === "destination" ? [] : (f.supplies || []),
    vendor: (f.vendor || "").trim() || null,
    detail: (f.detail || "").trim() || null,
    lat, lon, ...gateFrom(f),
    // 14 Oct 2026 (bundle G, W8): the site's CLP cap; blank = none (null, never 0)
    clp_cap_per_day: (f.clp_cap_per_day === "" || f.clp_cap_per_day == null) ? null : +f.clp_cap_per_day,
    // 16 Oct 2026 (CLOCS v5 C3): the site's rules for drivers, on every route sheet that loads or delivers here
    site_rules: (f.site_rules || "").trim() || null,
  });

  // The build list's rule: the three storage fields show for Stockpile / Site /
  // Compound / Railhead, and on the other types only when the location actually
  // receives material. A Quarry that only supplies has nothing to hold.
  const showCapacity = !!form && (STORAGE_TYPES.includes(form.loc_type)
    || form.role === "destination" || form.role === "both");

  const saveLoc = async () => {
    if(!form) return;
    if(!form.name.trim()){ setLocMsg("Name is required."); return; }
    const lat = parseFloat(form.lat), lon = parseFloat(form.lon);
    if(!isFinite(lat) || !isFinite(lon)){ setLocMsg("Enter valid coordinates — click the map or type them."); return; }
    try { localStorage.setItem("modus_admin_token", token); } catch(e){}
    setSavingLoc(true); setLocMsg(form.id ? "Saving…" : "Creating…");
    const qs = token ? `?token=${encodeURIComponent(token)}` : "";
    const body = bodyFromForm(form, lat, lon);
    try {
      const url = form.id ? `${API}/admin/locations/${encodeURIComponent(form.id)}${qs}` : `${API}/admin/locations${qs}`;
      const res = await fetch(url, { method: form.id ? "PUT" : "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if(!res.ok){ const t = await res.text(); throw new Error(`${res.status} ${t.slice(0,140)}`); }
      const j = await res.json();
      if(j.error) throw new Error(j.error);
      const affected = j.affected_routes || [];
      // Week 1, Task D2. Capacity has its ONE write path — PUT
      // /api/locations/{id}/capacity — so the location PUT and this cannot disagree
      // about the same three columns. On a create it runs against the id the POST
      // just minted. A failure here is reported but does not undo the location save:
      // a location with no capacity is a valid state, a lost location is not.
      const savedId = form.id || j.id;
      if(savedId && showCapacity){
        try {
          const cr = await fetch(`${API}/locations/${encodeURIComponent(savedId)}/capacity${qs}`, {
            method: "PUT", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              capacity_qty: form.capacity_qty === "" ? null : +form.capacity_qty,
              capacity_unit: form.capacity_unit || "t",
              opening_qty: form.opening_qty === "" ? null : +form.opening_qty,
            }) });
          if(!cr.ok) throw new Error(String(cr.status));
        } catch(ce){ setLocMsg("Location saved, but the capacity didn't: " + ce.message); }
      }
      await reloadNetwork();
      if(form.id && affected.length){
        const { rebaked, skipped } = await rebakeAffected(affected);
        await reloadNetwork();
        setLocMsg(
          rebaked
            ? `Saved — re-routed ${rebaked} affected route(s)` +
              (skipped ? `. ${skipped} had no stored route to restore.` : ".")
            : `Saved. ${affected.length} route(s) touched, none had a stored route to restore.`
        );
      } else {
        setLocMsg(form.id ? "Saved." : "Location created.");
      }
      setForm(null); setMode("view");
    } catch(e){ setLocMsg("Couldn't save: " + e.message); }
    setSavingLoc(false);
  };

  // ------------------------------------------------------------------ Phase 5a
  // Gates. Loaded per location when the editor opens, written one at a time through
  // /api/admin/gates. Moving a gate moves the point HERE routes to, so a write that
  // changes lat/lon/direction/active is followed by a re-bake of the routes that use
  // it — the same contract zone and haul-road writes already have, and the same
  // rebakeAffected() helper.
  useEffect(() => { gatePlaceRef.current = gatePlace; }, [gatePlace]);

  const loadGates = async (locId) => {
    if(!locId){ setGateList([]); return; }
    try {
      const res = await fetch(`${API}/gates?location_id=${encodeURIComponent(locId)}`);
      const j = await res.json();
      setGateList(j.gates || []);
    } catch(e){ setGateList([]); setGateMsg("Couldn't load gates: " + e.message); }
  };

  useEffect(() => {
    setGateForm(null); setGatePlace(false); setGateMsg("");
    loadGates(form && form.id);
  }, [form && form.id]);

  // leaving Locations abandons a half-placed gate, so map clicks stop dropping one
  useEffect(() => { if(subTab !== "locations") setGatePlace(false); }, [subTab]);

  const newGate = () => setGateForm({
    id: null, name: "", direction: "both", lat: "", lon: "",
    safety_minutes: "", internal_travel_minutes: "", is_default: !gateList.length,
    active: true, note: "", open_from: "", open_to: "", open_days: "", access_zone_id: "" });

  const editGate = (g) => setGateForm({
    id: g.id, name: g.name || "", direction: g.direction || "both",
    lat: g.lat, lon: g.lon,
    safety_minutes: g.safety_minutes == null ? "" : g.safety_minutes,
    internal_travel_minutes: g.internal_travel_minutes == null ? "" : g.internal_travel_minutes,
    is_default: !!g.is_default, active: !!g.active, note: g.note || "",
    open_from: g.open_from || "", open_to: g.open_to || "", open_days: g.open_days || "",
    access_zone_id: g.access_zone_id || "" });

  const numOrNull = (v) => (v === "" || v == null) ? null : Number(v);

  const saveGate = async () => {
    if(!gateForm || !form || !form.id) return;
    if(!gateForm.name.trim()){ setGateMsg("Give the gate a name — it is what a refused route will say."); return; }
    const lat = parseFloat(gateForm.lat), lon = parseFloat(gateForm.lon);
    if(!isFinite(lat) || !isFinite(lon)){ setGateMsg("Place the gate on the map, or type its coordinates."); return; }
    try { localStorage.setItem("modus_admin_token", token); } catch(e){}
    const qs = token ? `?token=${encodeURIComponent(token)}` : "";
    setGateMsg(gateForm.id ? "Saving gate…" : "Creating gate…");
    const payload = {
      name: gateForm.name.trim(), direction: gateForm.direction, lat, lon,
      safety_minutes: numOrNull(gateForm.safety_minutes),
      internal_travel_minutes: numOrNull(gateForm.internal_travel_minutes),
      is_default: !!gateForm.is_default, active: !!gateForm.active,
      note: gateForm.note || null,
      // 14 Oct 2026 (bundle G, W17): blank = the scheme's shift, every day ("" clears a stored value)
      open_from: gateForm.open_from || "", open_to: gateForm.open_to || "", open_days: gateForm.open_days || "",
      // 16 Oct 2026: the haul road drawn from the public road to this gate; blank = none
      access_zone_id: gateForm.access_zone_id || null,
    };
    try {
      const url = gateForm.id
        ? `${API}/admin/gates/${encodeURIComponent(gateForm.id)}${qs}`
        : `${API}/admin/gates${qs}`;
      const res = await fetch(url, {
        method: gateForm.id ? "PATCH" : "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(gateForm.id ? payload : { ...payload, location_id: form.id }) });
      const j = await res.json();
      if(!res.ok || j.error) throw new Error(j.error || res.status);
      await loadGates(form.id);
      setGateForm(null);
      // the cost is quoted, then spent — a gate move invalidates cached geometry
      const affected = j.routes_affected || [];
      if(affected.length && confirm(
          `This change moves where routes start or end.\n\n` +
          `${affected.length} worked-out route(s) use it: ${affected.join(", ")}.\n\n` +
          `Re-route them now? Each costs HERE calls.`)){
        const { rebaked } = await rebakeAffected(affected);
        await reloadNetwork();
        setGateMsg(`Saved — re-routed ${rebaked} route(s).`);
      } else {
        setGateMsg(affected.length
          ? `Saved. ${affected.length} route(s) still hold a route worked out to the old point.`
          : "Saved.");
      }
    } catch(e){ setGateMsg("Couldn't save gate: " + e.message); }
  };

  const deleteGate = async (gid) => {
    if(!confirm(`Delete gate ${gid}? Deactivating it instead keeps the history.`)) return;
    const qs = token ? `?token=${encodeURIComponent(token)}` : "";
    try {
      const res = await fetch(`${API}/admin/gates/${encodeURIComponent(gid)}${qs}`, { method: "DELETE" });
      const j = await res.json();
      if(!res.ok || j.error) throw new Error(
        (j.error || res.status) + (j.routes ? ` (${j.routes.join(", ")})` : ""));
      await loadGates(form.id);
      setGateMsg(`Deleted ${gid}.`);
    } catch(e){ setGateMsg("Delete failed: " + e.message); }
  };

  const deleteLoc = async () => {
    if(!form || !form.id) return;
    if(!confirm(`Delete ${form.name || form.id}? This also removes any routes that use it.`)) return;
    try { localStorage.setItem("modus_admin_token", token); } catch(e){}
    setSavingLoc(true); setLocMsg("Deleting…");
    const qs = token ? `?token=${encodeURIComponent(token)}` : "";
    try {
      const res = await fetch(`${API}/admin/locations/${encodeURIComponent(form.id)}${qs}`, { method: "DELETE" });
      if(!res.ok){ const t = await res.text(); throw new Error(`${res.status} ${t.slice(0,140)}`); }
      const j = await res.json();
      if(j.error) throw new Error(j.error);
      await reloadNetwork();
      setLocMsg(`Deleted. Removed ${(j.deleted_routes || []).length} dependent route(s).`);
      setForm(null); setMode("view");
    } catch(e){ setLocMsg("Delete failed: " + e.message); }
    setSavingLoc(false);
  };

  // drag-drop commit: PUT new coords, then auto-rebake affected routes (if profiles picked)
  const commitMove = async (id, lng, lat) => {
    const feat = nodesFC.current.features.find(f => f.properties.id === id);
    const p = feat ? feat.properties : {};
    const supplies = asArray(p.supplies).length ? asArray(p.supplies) : asArray(p.materials);
    const body = {
      name: p.name || id, role: p.role || "both", loc_type: locTypeOf(p.loc_type) || p.role || "both",
      supplies, receives: asArray(p.receives), materials: supplies,
      // this body is a full replace, so omitting these would clear an operator name
      // just because someone nudged the marker
      vendor: p.vendor || null, detail: p.detail || null,
      lat: +(+lat).toFixed(6), lon: +(+lng).toFixed(6),
      // carry the existing gate through — this body is a full replace, so omitting it
      // would clear a surveyed gate just because someone nudged the marker
      gate_lat: p.gate_lat == null ? null : p.gate_lat,
      gate_lon: p.gate_lon == null ? null : p.gate_lon,
    };
    const qs = tokenRef.current ? `?token=${encodeURIComponent(tokenRef.current)}` : "";
    setLocMsg(`Moving ${p.name || id}…`);
    try {
      const res = await fetch(`${API}/admin/locations/${encodeURIComponent(id)}${qs}`, {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const j = await res.json();
      if(!res.ok || j.error) throw new Error(j.error || res.status);
      const affected = j.affected_routes || [];
      if(affected.length){
        const { rebaked, skipped } = await rebakeAffected(affected);
        await reloadNetwork();
        setLocMsg(rebaked
          ? `Moved — re-routed ${rebaked} route(s)` + (skipped ? `, ${skipped} had none stored.` : ".")
          : `Moved. ${affected.length} route(s) touched, none had a stored route to restore.`);
      } else {
        await reloadNetwork();
        setLocMsg("Moved.");
      }
    } catch(e){
      setLocMsg("Move failed: " + e.message);
      await reloadNetwork();   // snap the node back to server truth
    }
  };

  // expose the latest closures to the once-bound map handlers
  cbRef.current.placeAt = (lng, lat) => setForm(f => f ? { ...f, lat: +(+lat).toFixed(6), lon: +(+lng).toFixed(6) } : f);
  // clicking the map follows the thing you clicked to its sub-tab
  cbRef.current.selectNode = (id) => { setSubTab("locations"); openEditForNode(id); };
  cbRef.current.selectRoute = (id) => { setSubTab("routes"); selectRoute(id); };
  cbRef.current.commitMove = commitMove;
  cbRef.current.placeGateAt = (lng, lat) => {
    setGateForm(g => g ? { ...g, lat: +(+lat).toFixed(6), lon: +(+lng).toFixed(6) } : g);
    setGatePlace(false);
  };

  // ---- route authoring: derived option validity (invalid shown but disabled) ----
  const locById = useMemo(() => Object.fromEntries(locs.map(l => [l.id, l])), [locs]);
  const originOpts = useMemo(() => locs.filter(l => l.role === "origin" || l.role === "both"), [locs]);
  const destOpts = useMemo(() => locs.filter(l => l.role === "destination" || l.role === "both"), [locs]);
  const suppliesOf = (id) => asArray(locById[id] && (locById[id].supplies || locById[id].materials));
  const receivesOf = (id) => asArray(locById[id] && locById[id].receives);
  const matsFor = (oId, dId) => {
    const s = suppliesOf(oId), r = receivesOf(dId);
    return s.filter(x => r.includes(x));
  };
  const destValid = (dId) => rOrigin && dId !== rOrigin && matsFor(rOrigin, dId).length > 0;
  const validMats = useMemo(() => (rOrigin && rDest) ? matsFor(rOrigin, rDest) : [], [rOrigin, rDest, locs]);

  const nextRouteId = (rows) => {
    let max = 0;
    (rows || []).forEach(r => { const m = /^R(\d+)$/.exec(r.id || ""); if(m) max = Math.max(max, +m[1]); });
    return "R" + String(max + 1).padStart(3, "0");
  };
  // keep the (editable) id field prefilled with the next free R00n until the user edits it
  useEffect(() => { if(!rIdTouched) setRId(nextRouteId(status)); }, [status, rIdTouched]);
  // if the origin changes and the chosen destination no longer shares a material, drop it
  useEffect(() => { if(rDest && !destValid(rDest)) setRDest(""); }, [rOrigin]);

  const toggleRVehicle = (v) =>
    setRVehicles(vs => vs.includes(v) ? vs.filter(x => x !== v) : [...vs, v]);
  const toggleEVehicle = (v) =>
    setEVehicles(vs => vs.includes(v) ? vs.filter(x => x !== v) : [...vs, v]);
  // What the route being edited is baked for RIGHT NOW, so each tick-box can say whether
  // leaving it as it is costs nothing, spends HERE calls, or deletes geometry. Read from
  // `status` rather than remembered at startEditRoute, so a bake finishing underneath the
  // open form does not leave the labels describing a state that has gone.
  const editHad = React.useMemo(() => {
    if(!editingRoute) return [];
    const r = (status || []).find(x => x.id === editingRoute);
    return Object.keys((r && r.profiles) || {});
  }, [editingRoute, status]);

  // how many routes touch each location — for the Locations table's "Routes" column
  const routeCounts = useMemo(() => {
    const c = {};
    (status || []).forEach(r => {
      if(r.origin_id) c[r.origin_id] = (c[r.origin_id] || 0) + 1;
      if(r.dest_id) c[r.dest_id] = (c[r.dest_id] || 0) + 1;
    });
    return c;
  }, [status]);

  const createRoute = async () => {
    if(!rOrigin || !rDest){ setRouteMsg("Pick an origin and a destination."); return; }
    if(!destValid(rDest)){ setRouteMsg("That origin and destination share no material."); return; }
    try { localStorage.setItem("modus_admin_token", token); } catch(e){}
    setRouteBusy(true); setRouteMsg("Creating route…");
    const qs = token ? `?token=${encodeURIComponent(token)}` : "";
    try {
      const res = await fetch(`${API}/admin/routes${qs}`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ origin_id: rOrigin, dest_id: rDest,
          route_id: (rId || "").trim() || null, ipt: (rIpt || "").trim() || null }),
      });
      if(!res.ok){ const t = await res.text(); throw new Error(`${res.status} ${t.slice(0,140)}`); }
      const j = await res.json();
      if(j.error) throw new Error(j.error);
      const newId = j.id;
      // bake the new route for the vehicles picked on this panel
      const failed = [];
      if(rVehicles.length){
        for(let i = 0; i < rVehicles.length; i++){
          const prof = rVehicles[i];
          setRouteMsg(`Created ${newId} — routing ${vehLabel(prof)} (${i + 1}/${rVehicles.length})…`);
          const bqs = new URLSearchParams({ route_id: newId, profile: prof });
          if(tokenRef.current) bqs.set("token", tokenRef.current);
          try {
            const br = await fetch(`${API}/admin/bake-route?${bqs.toString()}`, { method: "POST" });
            const bj = await br.json();
            if(bj.error) failed.push(`${vehShort(prof)}: ${bj.error}`);
          } catch(e){ failed.push(`${vehShort(prof)}: ${e.message}`); }
        }
      }
      await reloadNetwork();
      setSubTab("routes");
      setRouteMsg(
        failed.length ? `Route ${newId} created — ${rVehicles.length - failed.length}/${rVehicles.length} routed. ${failed.join(" · ")}`
        : rVehicles.length ? `Route ${newId} created and routed for ${rVehicles.length} vehicle(s).`
        : `Route ${newId} created — no vehicles ticked, so it has no route yet.`
      );
      setRDest(""); setRIpt(""); setRIdTouched(false);   // next id repopulates
    } catch(e){ setRouteMsg("Couldn't create route: " + e.message); }
    setRouteBusy(false);
  };

  // 2.5b — edit a route in place. Delete-and-recreate threw away its forecasts, its
  // weeks and its gate selections and minted a new id; this keeps all of them. Moving an
  // endpoint clears the baked geometry (re-baked here for the profiles it had) and that
  // end's gate. The impact is shown BEFORE the write, because the route id survives and
  // every forecast line on it silently starts meaning a different haul.
  const startEditRoute = (r) => {
    setEditingRoute(r.id);
    setROrigin(r.origin_id || ""); setRDest(r.dest_id || "");
    setRId(r.id); setRIdTouched(true); setRIpt(r.ipt || ""); setRMaterial(r.material_category || "");
    // A route has no vehicle FIELD: its vehicles are whichever profiles have a
    // route_geometry row, which is what r.profiles is. So the tick-boxes open showing
    // what is actually cached -- including a profile whose bake errored, because that
    // row exists and dropping it is a legitimate thing to want to do here.
    setEVehicles(Object.keys(r.profiles || {}).sort());
    setSubTab("routes"); setRouteMsg("");
  };
  const cancelEditRoute = () => {
    setEditingRoute(null); setRDest(""); setRIpt(""); setRMaterial(""); setRIdTouched(false);
    setEVehicles([]); setRouteMsg("");
  };
  const saveRouteEdit = async () => {
    if(!editingRoute) return;
    if(!rOrigin || !rDest){ setRouteMsg("Pick an origin and a destination."); return; }
    if(!destValid(rDest)){ setRouteMsg("That origin and destination share no material."); return; }
    const cur = (status || []).find(r => r.id === editingRoute) || {};
    const moved = cur.origin_id !== rOrigin || cur.dest_id !== rDest;
    // The vehicle diff. `had` is what has a route_geometry row today; `eVehicles` is what
    // the tick-boxes now say. Neither is a field on the route, so this is the whole of
    // "change the vehicles on a route" -- there is nothing else to write.
    const had = Object.keys(cur.profiles || {}).sort();
    const add = eVehicles.filter(v => !had.includes(v));
    const drop = had.filter(v => !eVehicles.includes(v));
    try { localStorage.setItem("modus_admin_token", token); } catch(e){}
    const qs = token ? `?token=${encodeURIComponent(token)}` : "";
    setRouteBusy(true);
    try {
      // Say what the edit touches before touching it. Asked for whenever something is
      // DESTROYED -- an endpoint move (which clears every profile) or a dropped profile.
      // Adding a profile only spends HERE calls, so it is reported afterwards, not gated.
      if(moved || drop.length){
        const ir = await fetch(`${API}/admin/routes/${encodeURIComponent(editingRoute)}/impact${qs}`);
        const imp = ir.ok ? await ir.json() : {};
        const fv = imp.forecast_vehicles || {};
        const bits = [];
        if(moved){
          if(imp.forecast_lines) bits.push(`${imp.forecast_lines} forecast line(s) (${imp.forecast_rows} month rows) stay on this id and will now describe the NEW haul`);
          if(imp.week_rows) bits.push(`${imp.week_rows} look-ahead week row(s) likewise`);
          if((imp.baked_profiles || []).length) bits.push(`stored route for ${imp.baked_profiles.map(vehShort).join(", ")} is cleared and re-routed (HERE calls)`);
          if((imp.haul_roads || []).length) bits.push(`${imp.haul_roads.length} haul road link(s) stay attached — check they still lie on the new route`);
          bits.push("the gate selection at the moved end is cleared");
        }
        // Dropping a profile is only free if nothing reads it. forecasts.vehicle_type is
        // the key the Forecasts page looks route analysis up by, so a line naming a
        // vehicle with no geometry left reads "not baked" where its km and cycle were.
        drop.forEach(v => {
          const use = fv[v];
          const who = use ? ` — ${use.lines} forecast line(s) on this route name it${use.approved ? `, ${use.approved} of them Approved` : ""}, and will read “not routed”` : "";
          bits.push(`${vehShort(v)}: both legs and every alternative are deleted${who}`);
        });
        if(drop.length && !eVehicles.length)
          bits.push("this route will have NO routed vehicle at all — its km, cycle time and vehicle count read “not routed” everywhere, including on the map");
        if(!confirm(`${moved ? `Move ${editingRoute}'s ends` : `Change ${editingRoute}'s vehicles`}?\n\n• ${bits.join("\n• ")}\n\nContinue?`)){ setRouteBusy(false); return; }
      }
      const res = await fetch(`${API}/admin/routes/${encodeURIComponent(editingRoute)}${qs}`, {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ origin_id: rOrigin, dest_id: rDest,
          material_category: rMaterial || null, ipt: (rIpt || "").trim() || null }) });
      if(!res.ok){ const t = await res.text(); throw new Error(`${res.status} ${t.slice(0,140)}`); }
      await res.json();
      await reloadNetwork();

      // ⚠️ A move has ALREADY cleared every profile server-side, so there is nothing to
      // drop and the re-bake must use the NEW ticked set, not the old one. Restoring
      // `affected.profiles` here -- which is what this did before the vehicle diff
      // existed -- would silently bring back a profile the user had just unticked.
      const notes = [];
      const toBake = moved ? eVehicles : add;
      if(!moved && drop.length){
        for(const prof of drop){
          const p = new URLSearchParams({ route_id: editingRoute, profile: prof });
          if(tokenRef.current) p.set("token", tokenRef.current);
          const dr = await fetch(`${API}/admin/clear-geometry?${p}`, { method: "POST" });
          if(!dr.ok) notes.push(`${vehShort(prof)} not removed (${dr.status})`);
        }
        if(drop.length) notes.push(`removed ${drop.length} vehicle(s)`);
      }
      if(toBake.length){
        let n = 0;
        for(const prof of toBake){
          setRouteMsg(`${editingRoute} — routing ${vehShort(prof)} (${++n}/${toBake.length})…`);
          const failed = await bakeOneRoute(editingRoute, [prof]);
          if(failed.length) notes.push(failed.join(" · "));
        }
        notes.push(`${moved ? "re-baked" : "routed"} ${toBake.length} vehicle(s)`);
      } else if(moved){
        notes.push("no vehicles ticked — route left cleared");
      }
      await reloadNetwork();
      setRouteMsg(`Saved ${editingRoute}${notes.length ? " — " + notes.join("; ") : "."}`);
      setEditingRoute(null); setRDest(""); setRIpt(""); setRMaterial(""); setRIdTouched(false);
      setEVehicles([]);
    } catch(e){ setRouteMsg("Couldn't save: " + e.message); }
    setRouteBusy(false);
  };

  const deleteRoute = async (id) => {
    if(!confirm(`Delete route ${id}? (Its stored route goes too.)`)) return;
    try { localStorage.setItem("modus_admin_token", token); } catch(e){}
    const qs = token ? `?token=${encodeURIComponent(token)}` : "";
    try {
      const res = await fetch(`${API}/admin/routes/${encodeURIComponent(id)}${qs}`, { method: "DELETE" });
      if(!res.ok){ const t = await res.text(); throw new Error(`${res.status} ${t.slice(0,120)}`); }
      if(selected === id) setSelected(null);
      await reloadNetwork();
      setRouteMsg(`Deleted ${id}.`);
    } catch(e){ setRouteMsg("Delete failed: " + e.message); }
  };

  // 17 Oct 2026 (Route all 502s): one batch request, shared by Route all and the re-route after a
  // zone write. Render answered 502 on most batches (each ran for minutes; the lorry-limits check
  // was the time). The batch now stops itself after ~20 s, and a 502 / 503 / 504 or no answer at
  // all (a restart during a deploy) is tried again after 30, 60 and 90 s before the loop stops.
  // Finished legs are kept server-side, so a try again only resumes.
  const ROUTE_RETRY_S = [30, 60, 90];
  const postRouteBatch = async (q, say) => {
    for(let attempt = 0; ; attempt++){
      let res = null, why = "";
      try { res = await fetch(`${API}/admin/bake-routes?${q}`, { method: "POST" }); }
      catch(e){ why = "no answer"; }
      if(res && res.ok) return res.json();
      if(res && ![502, 503, 504].includes(res.status)){
        const t = await res.text();
        throw new Error(res.status === 403 ? "admin token rejected" : `${res.status} ${t.slice(0,120)}`);
      }
      if(res) why = String(res.status);
      if(attempt >= ROUTE_RETRY_S.length) throw new Error(`${why} — tried ${attempt + 1} times`);
      const wait = ROUTE_RETRY_S[attempt];
      say(`Wayscope did not answer (${why}). Trying again in ${wait} s (${attempt + 1} of ${ROUTE_RETRY_S.length})…`);
      await new Promise(r => setTimeout(r, wait * 1000));
    }
  };

  // Bulk bake. The backend endpoint /api/admin/bake-routes never went away — only its
  // UI did, when the bake panel was rehomed. That was fine while the network was already
  // baked, but a cold network needs 107 routes x 2 legs per vehicle, and the per-route
  // Bake button only uses the "Show" selector's vehicle on a route that has no geometry
  // yet. So a manual sweep is 107 clicks AND silently does one profile.
  //
  // The endpoint works in batches of legs and reports what is left, so this loops until
  // 'remaining' hits 0 rather than trying to do it in one request that would time out.
  const bulkBake = async () => {
    const profs = rVehicles.length ? rVehicles : [showProfile];
    const legLabel = bakeLegs === "loaded" ? "laden leg only" : "both legs";
    if(!confirm(
      `Route ${profs.length} vehicle profile(s) across the whole network, ${legLabel}?\n\n` +
      `${profs.map(vehShort).join(", ")}\n\n` +
      `This calls HERE once per route per leg and can take several minutes. Routes that ` +
      `already have a route are re-routed, so a promoted alternative will be reset to ` +
      `HERE's own ranking.`)) return;

    setRouteBusy(true);
    try {
      for(const prof of profs){
        // the endpoint is the authority on 'remaining'; the loop stops if it ever fails to
        // fall (a bug, not a slow batch: every batch does at least one leg). 17 Oct 2026: was a
        // cap of 200 calls, which a short batch could reach on a big network.
        let last = Infinity;
        while(true){
          const q = new URLSearchParams({ profile: prof, limit: "30" });
          if(bakeLegs === "loaded") q.set("legs", "loaded");
          if(tokenRef.current) q.set("token", tokenRef.current);
          const j = await postRouteBatch(q, setRouteMsg);
          const left = j.remaining ?? 0;
          setRouteMsg(`Routing ${vehShort(prof)} — ${left} leg(s) remaining…`);
          await reloadNetwork();
          if(left <= 0) break;
          if(left >= last) throw new Error(`${left} leg(s) left and not falling`);
          last = left;
        }
      }
      await reloadNetwork();
      setRouteMsg(`Routing the whole network finished for ${profs.map(vehShort).join(", ")}. Check the Vehicles column for anything still amber or red.`);
    } catch(e){
      setRouteMsg("Routing the whole network stopped: " + e.message + " — routes already worked out are kept, so you can run it again.");
    }
    setRouteBusy(false);
  };

  const clearRoutes = async () => {
    if(!confirm("Clear ALL routes? Locations are kept. This cannot be undone.")) return;
    if(!confirm("Really clear every route? Type-check: this removes all of them.")) return;
    try { localStorage.setItem("modus_admin_token", token); } catch(e){}
    setRouteBusy(true); setRouteMsg("Clearing all routes…");
    const qs = token ? `?token=${encodeURIComponent(token)}` : "";
    try {
      const res = await fetch(`${API}/admin/clear-routes${qs}`, { method: "POST" });
      if(!res.ok){ const t = await res.text(); throw new Error(`${res.status} ${t.slice(0,120)}`); }
      const j = await res.json();
      setSelected(null);
      await reloadNetwork();
      setRouteMsg(`Cleared ${j.cleared ?? 0} route(s). Locations kept.`);
    } catch(e){ setRouteMsg("Clear failed: " + e.message); }
    setRouteBusy(false);
  };

  // ================================================================ zones (Phase 3)
  // Drawing is hand-rolled rather than mapbox-gl-draw: clicks append vertices, Save
  // closes the ring. That keeps the "one Mapbox instance, no build step, no extra CDN"
  // architecture intact and avoids coupling to a plugin version. The cost is no
  // vertex-level editing — to change a shape you redraw it. If nudging single corners
  // becomes necessary, mapbox-gl-draw is the upgrade and it drops into this same source.
  const reloadZones = () =>
    fetch(`${API}/zones`).then(r => r.json()).then(j => {
      setZoneList(j.zones || []);
      // Phase 4: zone_id -> number of routes attached. A haul road on no route is the
      // commonest reason one "does nothing", and the table has to say so rather than
      // leaving it to be discovered after a bake that changed nothing.
      setHaulUse(j.haul_links || {});
      return j;
    });

  useEffect(() => { reloadZones().catch(() => setZoneList([])); }, []);

  const todayISO = () => new Date().toISOString().slice(0, 10);

  // a zone is in force if it is active and today falls inside its (open-ended) window
  const zoneInForce = (z) => {
    if(!z || !z.active) return false;
    const t = todayISO();
    if(z.starts_on && t < z.starts_on) return false;
    if(z.ends_on && t > z.ends_on) return false;
    return true;
  };

  const ringOf = (pts) => {
    const r = pts.map(p => [p[0], p[1]]);
    if(r.length && (r[0][0] !== r[r.length-1][0] || r[0][1] !== r[r.length-1][1])) r.push([r[0][0], r[0][1]]);
    return r;
  };

  const addVertex = (lng, lat) => setDrawPts(p => p.concat([[lng, lat]]));
  const undoVertex = () => setDrawPts(p => p.slice(0, -1));
  cbRef.current.addVertex = addVertex;

  // Phase 4: a haul road is drawn as an open line, everything else as a closed ring.
  // The difference is one condition rather than a second drawing tool, which is why the
  // hand-rolled vertex collector was worth keeping: the same clicks mean both things.
  const isHaul = (f) => !!f && f.kind === HAUL_KIND;
  const minPts = (f) => isHaul(f) ? 2 : 3;

  const blankZone = () => ({
    id: null, name: "", kind: "closure", affects_routing: true,
    starts_on: "", ends_on: "", note: "", active: true,
    speed_kph: "", haul_mode: "",
  });

  const startNewZone = () => {
    setZoneForm(blankZone()); setDrawPts([]); setZoneDraw(true);
    setZoneSel(null); setZoneMsg("Click the map to place corners — at least three. Save closes the shape.");
  };

  const startNewHaul = () => {
    setZoneForm({ ...blankZone(), kind: HAUL_KIND }); setDrawPts([]); setZoneDraw(true);
    setZoneSel(null);
    setZoneMsg("Click the map along the haul road — at least two points. It is saved as an open line, not a closed shape.");
  };

  const editZone = (z) => {
    setZoneForm({ id: z.id, name: z.name || "", kind: z.kind || "other",
                  affects_routing: !!z.affects_routing, starts_on: z.starts_on || "",
                  ends_on: z.ends_on || "", note: z.note || "", active: !!z.active,
                  speed_kph: (z.speed_kph == null ? "" : String(z.speed_kph)),
                  haul_mode: z.haul_mode || "" });
    setZoneSel(z.id);
    // load the existing shape as editable vertices. A polygon's repeated closing point is
    // dropped; a haul road has none to drop, and popping its last point would shorten the
    // road by one vertex every time it was opened.
    const c = (z.geometry && z.geometry.coordinates) || [];
    const ring = (z.geometry && z.geometry.type === "Polygon") ? (c[0] || []) : c;
    const pts = ring.slice();
    if(z.geometry && z.geometry.type === "Polygon"
       && pts.length > 1 && pts[0][0] === pts[pts.length-1][0] && pts[0][1] === pts[pts.length-1][1]) pts.pop();
    setDrawPts(pts);
    setZoneDraw(false);
    setZoneMsg("");
    const m = mapObj.current;
    if(m && pts.length) { try { m.fitBounds(boundsOf(pts), { padding: 80, maxZoom: 13, duration: 600 }); } catch(e){} }
  };

  const cancelZone = () => { setZoneForm(null); setDrawPts([]); setZoneDraw(false); setZoneMsg(""); };

  const setZField = (k, v) => setZoneForm(f => ({ ...f, [k]: v }));

  // After a zone write the backend has already CLEARED the geometry it invalidated; it
  // does not call HERE. Re-baking is this loop, which is the same /api/admin/bake-routes
  // batch loop the bulk-bake button uses — after invalidation the only legs missing
  // geometry are exactly the ones that were cleared, so it re-routes those and nothing
  // else. Doing it server-side inside the write request would block one HTTP call on
  // dozens of HERE round trips and time out on Render.
  const rebakeAfterZone = async (inval) => {

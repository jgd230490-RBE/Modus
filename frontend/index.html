    ctx.beginPath(); ctx.moveTo(px, chart.chartArea.top); ctx.lineTo(px, chart.chartArea.bottom); ctx.stroke();
    ctx.fillStyle = "#DC2626"; ctx.font = `600 ${wall ? sf : 10}px Inter, system-ui, sans-serif`; ctx.textAlign = "center";
    ctx.fillText("capacity", px, chart.chartArea.top - 4); ctx.restore();
  } };
  // 14 Oct 2026: on the big screen each bar says how full it is, in words for the two warnings (nobody hovers a TV)
  const barLabels = { id: "barLabels", afterDatasetsDraw: (chart) => {
    if(!wall) return;
    const meta = chart.getDatasetMeta(0), ctx = chart.ctx;
    ctx.save(); ctx.font = `600 ${sf + 1}px Inter, system-ui, sans-serif`; ctx.textBaseline = "middle"; ctx.textAlign = "left";
    ctx.fillStyle = tok("--ink", "#1E293B");
    meta.data.forEach((el, i) => { const b = bars[i]; if(!b) return;
      const t = `${b.pct.toFixed(0)} %` + (b.over ? " · over capacity" : b.pct >= 90 ? " · nearly full" : "");
      ctx.fillText(t, el.x + 8, el.y); });
    ctx.restore();
  } };
  const cfg = { type: "bar",
    data: { labels: bars.map(b => b.sp.name), datasets: [{ label: "% of capacity", data: bars.map(b => Math.round(b.pct * 10) / 10),
              backgroundColor: bars.map(b => b.over ? "#DC2626" : b.pct >= 90 ? "#D97706" : "#059669"), borderWidth: 0, borderRadius: 4, barPercentage: 0.7,
              maxBarThickness: fill ? Math.round(sf * 4.5) : 40 }] },
    options: { indexAxis: "y", responsive: true, maintainAspectRatio: false, layout: { padding: { top: 14, right: wall ? sf * 13 : 0 } },
      plugins: { legend: { display: false }, tooltip: { callbacks: {
        title: (items) => items.length ? bars[items[0].dataIndex].sp.name : "",
        label: (item) => { const b = bars[item.dataIndex]; const u = unitOf(b.sp); return [
          `${b.pct.toFixed(0)} % full · ${fmt(b.bal, b.sp.capacity_unit)} of ${fmt(b.sp.capacity_qty, b.sp.capacity_unit)} ${u}`,
          `in ${fmt(b.c.inbound || 0, b.sp.capacity_unit)} · out ${fmt(b.c.consumed || 0, b.sp.capacity_unit)} this week`,
          b.over ? `OVER capacity by ${fmt(-(b.c.remaining || 0), b.sp.capacity_unit)} ${u}` : `room for ${fmt(b.c.remaining == null ? 0 : b.c.remaining, b.sp.capacity_unit)} ${u} more` ]; } } } },
      scales: { x: { min: 0, max: Math.ceil(maxPct / 10) * 10, grid: { display: false }, ticks: { font: { size: wall ? sf : 10 }, callback: (v) => v + " %" } },
                y: { ticks: { font: { size: wall ? sf + 1 : 11 } } } } },
    plugins: [capLine, barLabels] };
  const c = cols.find(x => x.k === selKey);
  // 14 Oct 2026 (the design check): on a filled big screen the chart opens with its message
  const nOver = bars.filter(b => b.over).length, nNear = bars.filter(b => !b.over && b.pct >= 90).length, nRoom = bars.length - nOver - nNear;
  return (
    <div className="card p-4 stock-card">
      {fill && bars.length > 0 && <div className="chart-head" data-chart-head="1">
        <span className="ch-val kpi-num" style={nOver ? { color: "var(--red)" } : undefined}>{nOver ? `${nOver} over capacity` : "None over capacity"}</span>
        <div className="ch-note">{[nNear ? `${nNear} nearly full` : "", nRoom ? `${nRoom} with room` : "", noCap.length ? `${noCap.length} with no capacity recorded` : ""].filter(Boolean).join(" · ")}</div>
      </div>}
      <div className="flex items-baseline justify-between gap-2 flex-wrap mb-2">
        <div className="text-sm font-semibold text-slate-700 chart-title">Stockpile capacity <span className="text-slate-400 font-normal">· how full each stockpile is at the end of {c ? `${MONTHS[(c.m - 1) % 12]} week ${c.w}` : "the week"}</span><InfoTip id="dash.stock" /></div>
        <div className="flex flex-wrap gap-1">

        </div>
      </div>
      {err && <div className="text-xs mb-2" style={{ color: "var(--red)" }}>{err}</div>}
      {!data ? <div className="p-4 text-center text-slate-400 text-sm">Loading…</div>

        </div>

        <div className="grid lg:grid-cols-4 gap-4 stock-body">
          <div className={(noCap.length ? "lg:col-span-3" : "lg:col-span-4") + (fill ? " min-h-0" : "")}>
            {bars.length ? (fill ? <ChartCanvas config={cfg} size="fill" /> : <ChartCanvas config={cfg} height={Math.max(wall ? 220 : 160, 36 * bars.length + 40)} />)
                         : <div className="text-sm text-slate-400 p-4">No stockpile has a capacity recorded — set one on the Locations page to see how full it is.</div>}
          </div>

            {noCap.map(sp => { const cell = cellOf(sp) || {}; return (
              <div key={sp.location_id} className="py-1 border-t border-slate-100" title={`${sp.loc_type} · ${sp.location_id} · in ${fmt(cell.inbound || 0, sp.capacity_unit)} · out ${fmt(cell.consumed || 0, sp.capacity_unit)}`}>
                <span className="font-medium text-slate-800">{sp.name}</span> <span className="tabular-nums">{fmt(cell.balance_end || 0, sp.capacity_unit)} {unitOf(sp)}</span> <span className="text-slate-400">· max —</span>
              </div>); })}
            <div className="text-[10px] text-slate-400 mt-1">Give these a capacity on the Locations page and they join the chart.</div>
          </div>}
        </div>
      )}
    </div>
  );
}

// 12 Oct 2026 (C4, map review §2.6, mockup 9) — the monthly bulletin from the Dashboard: the PDF is fetched

// GET /api/clp/monitoring?month=N (any signed-in code), read the FIRST time the section is opened, so a closed section
// costs nothing. The SERVER (backend/clp.py) builds every chart from the module that owns its figure and decides each
// one's state: "set", or "empty" with the field to fill in, in words — never a zero. The browser draws and formats; it

const CLP_NOT_TYPED = "Not typed";
const clpN1 = (n) => n == null ? "—" : (+n).toFixed(1);
function ClpCard({ c, info, children, wide }){

// a bullet chart, one row a route or a site: a pale track to the cap, the planned figure inside it (red past the cap), an
// ink marker at the cap, and the figure in words beside it (no hover on a print or a TV). Rows with no cap are a sentence.
function clpBulletCfg(rows, valKey, nameKey, word){
  const C1 = tok("--chart-1", "#E8590C"), RED = tok("--red", "#DC2626"), INK = tok("--ink", "#1E293B");
  const fs = 11;
  const marks = { id: "clpCapMarks", afterDatasetsDraw: (chart) => {
    const meta = chart.getDatasetMeta(1), x = chart.scales.x, ctx = chart.ctx, A = chart.chartArea; if(!x || !A) return;
    ctx.save();
    meta.data.forEach((el, i) => { const r = rows[i]; if(!r) return;
      const half = (el.height || 16) / 2 + 5, px = x.getPixelForValue(r.cap);
      ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(px, el.y - half); ctx.lineTo(px, el.y + half); ctx.stroke();
      ctx.font = `600 ${fs + 1}px Inter, system-ui, sans-serif`; ctx.textBaseline = "middle"; ctx.textAlign = "left";
      ctx.fillStyle = r.over ? RED : INK;
      // 14 Oct 2026 (seen at 1366 px): the words sit in a column right of the plot, never after the bar, so a bar past its
      // cap cannot push them off the card
      // two short lines, so the column fits at 1366 px
      ctx.fillText(`${clpN1(r[valKey])} ${word}`, A.right + 12, el.y - 7);
      ctx.font = `500 ${fs}px Inter, system-ui, sans-serif`;
      ctx.fillText(`${r.pct} % of ${grp(r.cap)}` + (r.over ? " · over the cap" : ""), A.right + 12, el.y + 8);
    });
    ctx.restore();
  } };
  return { type: "bar",
    data: { labels: rows.map(r => r[nameKey]), datasets: [
      { label: "Cap a day", data: rows.map(r => r.cap), backgroundColor: tok("--surface-3", "#F3F2EF"), borderColor: tok("--grey", "#E7E5E4"),
        borderWidth: 1, borderRadius: 4, barPercentage: 0.78, maxBarThickness: 34, grouped: false, order: 2 },
      { label: `Planned ${word}`, data: rows.map(r => r[valKey]), backgroundColor: rows.map(r => r.over ? RED : C1), borderWidth: 0,
        borderRadius: 4, barPercentage: 0.5, maxBarThickness: 22, grouped: false, order: 1 }] },
    options: { indexAxis: "y", responsive: true, maintainAspectRatio: false, layout: { padding: { top: 8, right: 200 } },
      plugins: { legend: { display: false }, tooltip: { filter: (item) => item.datasetIndex === 1 } },
      scales: { x: { min: 0, grace: "8%", grid: { color: tok("--chart-grid", "rgba(100,116,139,.18)") }, ticks: { font: { size: fs } },
                     title: { display: true, text: word, font: { size: fs } } },
                y: { grid: { display: false }, ticks: { font: { size: fs + 1 }, callback: function(v){ const n = String(rows[v] ? rows[v][nameKey] : "");
                  const i = n.indexOf(" → "); return i > 0 ? [cutLabel(n.slice(0, i)), cutLabel("→ " + n.slice(i + 3))] : cutLabel(n); } } } } },
    plugins: [marks] };
}
// a 100 % stacked bar a month: each group's share of the month's loads, the share and the loads in the tooltip

function clpCouncilCfg(c){

function ClpMonitoring({ months, initial }){
  const [open, setOpen] = useState(!!initial);
  const [month, setMonth] = useState(() => (initial && initial.month) || gaMonthToday(months));
  const [data, setData] = useState(initial || null);
  const [err, setErr] = useState(false);
  useEffect(() => {
    if(!open) return;
    if(data && data.month === month) return;      // folded and opened again: the same month is not read twice
    let live = true;
    setErr(false);
    fetch(`${API}/clp/monitoring?month=${month}`).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(j => {
      if(live) setData(j);
    }).catch(() => { if(live) setErr(true); });
    return () => { live = false; };
  }, [open, month]);
  // 14 Oct 2026 (bundle G, W10): the CLP pack for the month — the same reply, printed (only the charts with data)
  const [packBusy, setPackBusy] = useState("");
  const [packErr, setPackErr] = useState(null);
  const pack = async (ext) => {
    setPackBusy(ext); setPackErr(null);
    try {
      const r = await fetch(`${API}/clp/pack.${ext}?month=${month}`);
      if(!r.ok){
        const txt = await r.text();
        let d = "";
        try { const j = JSON.parse(txt); d = (j && typeof j.detail === "string") ? j.detail : ""; } catch(e){ d = ""; }
        throw new Error(d || `error ${r.status}`);
      }
      const blob = await r.blob();
      const cd = (r.headers && r.headers.get && r.headers.get("Content-Disposition")) || "";
      const m = cd.match(/filename="([^"]+)"/);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = m ? m[1] : `wayscope-clp-pack.${ext}`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    } catch(e){ setPackErr("The CLP pack could not be made: " + (e.message || e)); }
    setPackBusy("");
  };
  const count = (months && months.count) || 60, startYear = (months && months.start_year) || 2026;
  const C = (data && data.charts) || {};
  const capped = (rows) => (rows || []).filter(r => r.cap != null);
  return (
    <details className="dash-more" data-clp="1" data-guide="dash-clp" open={open || undefined} onToggle={e => setOpen(e.currentTarget.open)}>
      <summary>CLP monitoring: caps, vehicles, councils, carbon and trips avoided</summary>
      <div className="pt-3" data-clp-body="1">
        <div className="ct-row mb-2">
          <span className="ct-line">The Construction Logistics Plan's figures from the approved plan<InfoTip id="dash.clp" /></span>
          <label className="ct-line">Month <select className="ga-sel" value={month} onChange={e => setMonth(+e.target.value)} aria-label="CLP month">
            {Array.from({ length: count }, (_, i) => i + 1).map(i => <option key={i} value={i}>{monthLabelAbs(i, startYear)}</option>)}
          </select></label>
          <span className="clp-pack" data-clp-pack="1">
            <button type="button" className="btn-sec" style={{ width: "auto", height: "auto", padding: "6px 12px" }} onClick={() => pack("pdf")} disabled={!!packBusy}>{packBusy === "pdf" ? "Making the CLP pack…" : "CLP pack (PDF)"}</button>
            <button type="button" className="btn-sec" style={{ width: "auto", height: "auto", padding: "6px 12px" }} onClick={() => pack("xlsx")} disabled={!!packBusy}>{packBusy === "xlsx" ? "Making the CLP pack…" : "CLP pack (XLSX)"}</button>
          </span>
        </div>
        {packErr && <div className="ct-line" role="alert" data-clp-pack-error="1">{packErr}</div>}
        {err && <div className="ct-line" data-clp-error="1">The CLP figures did not load.</div>}
        {!data && !err && <div className="ct-line">Loading the CLP figures…</div>}
        {data && <>
          <div className="ct-note">{data.scope_line} {data.limit}</div>
          {data.peak_words && <div className="ct-note" data-clp-peak="1">{data.peak_words}</div>}
          <div className="clp-grid">
            <ClpCard c={C.route_caps} info={<InfoTip id="clp.route_caps" />} wide>
              {capped(C.route_caps.rows).length > 0 && <ChartCanvas config={clpBulletCfg(capped(C.route_caps.rows), "movements_per_day", "route", "movements a day")} height={Math.max(150, 46 * capped(C.route_caps.rows).length + 50)} />}
              <ClpUncapped rows={C.route_caps.rows} nameKey="route" valKey="movements_per_day" word="a day" what="route" />

function BulletinMenu({ months }){
  const now = new Date();
  const cur = Math.min(months.count, Math.max(1, (now.getFullYear() - months.start_year) * 12 + now.getMonth() + 1));
  const [m, setM] = useState(cur);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const download = async () => {
    setBusy(true); setErr(null);
    try {
      const r = await fetch(`${API}/bulletin/month.pdf?month=${m}`);
      if(!r.ok){
        const txt = await r.text();
        let d = "";
        try { const j = JSON.parse(txt); d = (j && typeof j.detail === "string") ? j.detail : ""; } catch(e){ d = ""; }
        throw new Error(d || `error ${r.status}`);
      }
      const blob = await r.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `bulletin-${months.start_year + Math.floor((m - 1) / 12)}-${String((m - 1) % 12 + 1).padStart(2, "0")}.pdf`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    } catch(e){ setErr("The bulletin could not be made: " + (e.message || e)); }
    setBusy(false);
  };
  return (
    <details className="row-menu bulletin-menu">
      <summary className="btn-sec" style={{ width: "auto", height: "auto", padding: "7px 12px", fontWeight: 500 }}
               title="The month's lorry movements as a PDF and a web page, from the approved plan">Monthly bulletin ▾</summary>
      <div className="row-menu-list dash-filters">
        <label><span>Month</span><select value={m} onChange={e => setM(+e.target.value)} aria-label="Bulletin month">
          {Array.from({ length: months.count }, (_, i) => i + 1).map(i => <option key={i} value={i}>{monthLabelAbs(i, months.start_year)}</option>)}</select></label>
        <button type="button" onClick={download} disabled={busy}>{busy ? "Making the bulletin…" : "Download the PDF"}</button>
        <a href={`/bulletin/?month=${m}`} target="_blank" rel="noopener">Open the page</a>
        {err && <div className="bm-err" role="alert">{err}</div>}
      </div>
    </details>
  );
}

function guideRead(k){ try { return localStorage.getItem(GUIDE_KEY + k); } catch(e){ return null; } }
function guideWrite(k, v){ try { localStorage.setItem(GUIDE_KEY + k, v); } catch(e){} }
const guidePageKey = (page) => DATA_PAGES.includes(page) ? "data" : page;

function Guide({ page, groups, phone }){
  const key = guidePageKey(page);
  // 14 Oct 2026 (D9): on a phone a page's steps leave out what a phone does not show (desk: true), and the Look-ahead
  // has its own steps (PhoneLookAhead). `stepsOf` is the one place that choice is made (the dots, the tour).
  const stepsOf = () => (phone && GUIDE_STEPS[key + "_phone"]) ? GUIDE_STEPS[key + "_phone"] : (GUIDE_STEPS[key] || []).filter(s => !(phone && s.desk));
  const [steps, setSteps] = useState([]);
  const [i, setI] = useState(0);
  const [box, setBox] = useState(null);
  // 11 Oct 2026 (the user, options 4 + 1 + 2): nothing pops up uninvited. On a demo tenant a one-line
  // strip offers the tour (4), the tour is Google-style "Got it" bubbles, slightly transparent (1), and
  // small pulsing dots mark this page's features — hover or tap one to read its line (2).
  const [hints, setHints] = useState(false);
  const [strip, setStrip] = useState(false);
  const [dots, setDots] = useState([]);
  const [tip, setTip] = useState(null);
  const [railRight, setRailRight] = useState(240);
  // 11 Oct 2026: the strip sits 16 px off the foot, or just above an element pinned there ([data-sticky-foot]:
  // the Carbon page's result strip), so it never covers it
  const [stripBottom, setStripBottom] = useState(16);
  const build = (withWelcome) => {
    const own = stepsOf();
    if(!withWelcome) return own;
    const menu = (groups || []).map(g => `${g.group} (${g.items.map(it => it.label.toLowerCase()).join(", ")})`).join(" · ");
    const welcome = GUIDE_STEPS.welcome.map((s, n) => n === 0
      ? { ...s, body: `This is ${TENANT.name || "the demo scheme"}. Everything you see is invented, so click anything.` }
      : phone ? { ...s, title: "The tabs", body: "The tabs at the foot of the screen open the Dashboard, the Look-ahead and the Route map. More lists the pages made for a desktop." }
      : { ...s, body: `The menu on the left follows the work: ${menu}.` });
    return [...welcome, ...own];
  };
  // a page opened on a demo tenant: the strip (until this page's tour is done) and the dots (until switched off)
  useEffect(() => {
    if(!TENANT.demo_notice) return;
    setSteps([]); setTip(null);
    if(guideRead("all") === "off"){ setHints(false); setStrip(false); return; }
    setHints(true); setStrip(guideRead(key) !== "done");
  }, [key]);
  // 11 Oct 2026 (the demo bar): a page with no steps of its own (Config) replays the welcome, so the bar's Guide
  // never does nothing there once the welcome has been seen
  const startTour = () => { setTip(null); setSteps(build(guideRead("welcome") !== "done" || !stepsOf().length)); setI(0); };
  // the demo bar's Guide button and the strip's "Take the tour" run the tour (the welcome too, if never seen)
  useEffect(() => {
    const on = () => startTour();
    window.addEventListener(GUIDE_EVENT, on);
    return () => window.removeEventListener(GUIDE_EVENT, on);
  }, [key, groups, phone]);
  // the dots: one per distinct anchor of this page's steps, placed on the anchor's top-right corner and
  // re-placed every second (pages render late), on resize and on scroll; none while the tour runs
  useEffect(() => {
    if(!hints || steps.length){ setDots([]); return; }
    const own = stepsOf();
    const place = () => {
      const rail = document.querySelector('[data-guide="rail"]');
      // 14 Oct 2026 (D9): on a phone the "rail" anchor is the tab bar along the foot, so the strip starts at the edge
      if(rail){ const rr = rail.getBoundingClientRect(); setRailRight(rr.height > rr.width ? Math.round(rr.right) : 0); }
      const foot = document.querySelector('[data-sticky-foot]');
      const fr = foot && (foot.offsetWidth || foot.offsetHeight) ? foot.getBoundingClientRect() : null;
      const lift = (fr && fr.top < window.innerHeight && fr.bottom > window.innerHeight - 60) ? Math.round(window.innerHeight - fr.top) + 8 : 16;
      setStripBottom(b => (b === lift ? b : lift));
      const seen = new Set(), out = [];
      own.forEach(s => {
        if(seen.has(s.anchor) || !s.body) return; seen.add(s.anchor);
        const el = document.querySelector(`[data-guide="${s.anchor}"]`);
        if(!el || !(el.offsetWidth || el.offsetHeight)) return;
        const r = el.getBoundingClientRect();
        if(r.bottom < 0 || r.top > window.innerHeight) return;
        const wide = r.width > 400;   // a wide feature (a page header) takes its dot just inside the top-left corner
        out.push({ anchor: s.anchor, title: s.title, body: s.body, top: Math.round(wide ? r.top + 6 : Math.max(4, r.top - 4)), left: Math.round(wide ? r.left - 14 : Math.min(r.right - 8, window.innerWidth - 20)) });
      });
      setDots(prev => JSON.stringify(prev) === JSON.stringify(out) ? prev : out);
    };
    place();
    const id = setInterval(place, 1000);
    window.addEventListener("resize", place); window.addEventListener("scroll", place, true);
    return () => { clearInterval(id); window.removeEventListener("resize", place); window.removeEventListener("scroll", place, true); };
  }, [hints, key, steps.length, phone]);
  const step = steps[i];
  // measure the anchor; an anchor that is not on screen (a conditional element) falls back to the page header
  useEffect(() => {
    if(!step) return;
    const measure = () => {
      let el = document.querySelector(`[data-guide="${step.anchor}"]`);
      if(!el || !(el.offsetWidth || el.offsetHeight)) el = document.querySelector('[data-guide="page-header"]');
      if(el){ try { el.scrollIntoView({ block: "nearest" }); } catch(e){} }   // a rendered anchor below the fold
      const r = el ? el.getBoundingClientRect() : null;
      setBox(r ? { top: r.top, left: r.left, width: r.width, height: r.height } : null);
    };
    measure();
    window.addEventListener("resize", measure); window.addEventListener("scroll", measure, true);
    return () => { window.removeEventListener("resize", measure); window.removeEventListener("scroll", measure, true); };
  }, [step]);
  const finish = () => { guideWrite(key, "done"); guideWrite("welcome", "done"); setSteps([]); setStrip(false); };
  const off = () => { guideWrite("all", "off"); finish(); setHints(false); };
  const hintsEl = (hints && !step) ? (
    <>
      {strip && (
        <div className="guide-strip" role="note" style={{ left: railRight + 16, bottom: stripBottom }}>   {/* bottom-left of the page: never over the page header */}
          <span>New here? A short tour shows what this page is for.</span>
          <button type="button" className="guide-strip-go" onClick={startTour}>Take the tour</button>
          <button type="button" className="guide-x" aria-label="Hide the tips" title="Hide the tips and the dots" onClick={off}>×</button>
        </div>
      )}
      {dots.map(d => (
        <button key={d.anchor} type="button" className="guide-dot" style={{ top: d.top, left: d.left }} aria-label={`Tip: ${d.title}`}
          onMouseEnter={() => setTip(d)} onMouseLeave={() => setTip(t => (t && t.anchor === d.anchor) ? null : t)}
          onFocus={() => setTip(d)} onBlur={() => setTip(null)} onClick={() => setTip(t => (t && t.anchor === d.anchor) ? null : d)} />
      ))}
      {tip && (
        <div className="guide-tip" role="tooltip" style={{ top: tip.top + 18, left: Math.max(12, Math.min(tip.left - (tip.left > window.innerWidth / 2 ? 236 : 0), window.innerWidth - 272)) }}>
          <b>{tip.title}</b> {tip.body}
        </div>
      )}
    </>
  ) : null;
  if(!step) return hintsEl;
  const vw = window.innerWidth, vh = window.innerHeight, W = Math.min(300, vw - 24);
  let top = 80, left = Math.max(12, (vw - W) / 2), place = "none";
  if(box){
    if(box.height > vh * 0.5 && box.left + box.width + W + 24 <= vw){
      // a TALL anchor (the rail): beside it, level with its top, so the card never covers it
      left = box.left + box.width + 12; top = Math.max(12, box.top + 12); place = "side";
    } else {
      left = Math.min(Math.max(12, box.left), Math.max(12, vw - W - 12));
      top = box.top + box.height + 12; place = "below";
      if(top + 220 > vh){ top = Math.max(12, box.top - 232); place = "above"; }
    }
  }
  top = Math.min(Math.max(12, top), Math.max(12, vh - 232));   // never off the window, whatever the anchor did
  return (
    <>
      {box && <div className="guide-ring" style={{ top: box.top - 4, left: box.left - 4, width: box.width + 8, height: box.height + 8 }} />}
      <div className="guide-card" role="dialog" aria-label="Guide" data-place={place} style={{ top, left, width: W }}>
        <h4>{step.title}</h4>
        <p>{step.body}</p>
        <div className="guide-foot">
          <span className="guide-step">{i + 1} of {steps.length}</span>
          {i > 0 && <button type="button" onClick={() => setI(i - 1)}>Back</button>}
          {i < steps.length - 1
            ? <button type="button" className="guide-next" onClick={() => setI(i + 1)}>Next</button>
            : <button type="button" className="guide-next" onClick={finish}>Got it</button>}
        </div>
        <button type="button" className="guide-off" onClick={off}>Don't show again</button>
      </div>
    </>
  );
}

  useEffect(() => { if(meta && TENANT.demo_notice) tellMapBarOn(); }, [meta]);
  const setVehLang = (l) => { VEH.lang = l; try { localStorage.setItem("modus_veh_lang", l); } catch(e){} setVehLangState(l); };

  // 12 Oct 2026 (map review D31): /api/meta answers two shapes — the route list, the team list and the sections
  // only to a valid code or a staff cookie. The mount fetch runs BEFORE a fresh sign-in (no header yet), so once
  // the code is known it is fetched again (the fetch wrapper adds the header); a resume had the code at mount and
  // is not fetched twice. Everything the sign-in screen needs is in both shapes.
  // 12 Oct 2026 (the review and fix pass): the flag is set from the ANSWER's shape (m.scope), not from whether a
  // code was stored — a resumed tab with a code the server no longer accepts got the public shape, and after a fresh
  // sign-in the portal ran with no routes or teams. Only the latest fetch's answer is applied (metaSeq), so a slow
  // public answer from mount cannot land on top of the staff one fetched after sign-in.
  const metaHadCode = useRef(false);
  const metaSeq = useRef(0);
  const loadMeta = () => {
    const seq = ++metaSeq.current;
    return fetch(`${API}/meta`).then(r => r.json()).then(m => {
      if(seq !== metaSeq.current) return;
      metaHadCode.current = !!(m && m.scope === "staff");
      const vl = m && m.vehicle_labels;
      // 11 Oct 2026: `langs` is what the server OFFERS this tenant (English, plus any label language one of its vehicles still carries)
      if(vl){ VEH.labels = vl.labels || {}; VEH.fallbacks = vl.fallbacks || {}; VEH.langs = (Array.isArray(vl.langs) && vl.langs.length) ? vl.langs : ["en"]; }
      HIDDEN_VEHICLES.length = 0; (m && m.hidden_vehicles || []).forEach(v => HIDDEN_VEHICLES.push(v));
      // 10 Oct 2026 (carbon planner): a scenario-only profile (the electric variants) is tested on
      // the Carbon page and never offered on a forecast — it has no baked geometry of its own
      Object.entries((m && m.vehicle_details) || {}).forEach(([k, v]) => { if(v && v.scenario_only && !HIDDEN_VEHICLES.includes(k)) HIDDEN_VEHICLES.push(k); });
      const tn = m && m.tenant;
      if(tn){ Object.assign(TENANT, { name: tn.name || "Wayscope", team_label: tn.team_label || "Team",
                                      currency: tn.currency || "EUR", symbol: tn.currency_symbol || "€",
                                      country: tn.country || null, fuel_index_auto: !!tn.fuel_index_auto,
                                      fuel_provider: tn.fuel_provider || null,
                                      restrictions_provider: !!tn.restrictions_provider,
                                      restrictions: tn.restrictions || null,
                                      distance_unit: (tn.distance_unit === "mi" ? "mi" : "km"),
                                      demo_notice: (tn.demo_notice || null) });   // H2: the demo label
              try { document.title = (TENANT.name && TENANT.name !== "Wayscope") ? TENANT.name + " · Wayscope" : "Wayscope"; } catch(e){} }
      // 11 Oct 2026: a stored or default label language this tenant is not offered falls back to ENGLISH. Until then it
      // fell back to "eu", which a GB tenant is not offered either, so its one button was never lit.
      if(!vehLangShown(VEH.lang)){ VEH.lang = "en"; setVehLangState("en"); }
      (m && m.ipts || []).forEach(i => { if(i && i.id) TEAM_LABELS[iptKey(i.id)] = i.label || i.id; });
      setMeta(m);
    }).catch(() => { if(seq === metaSeq.current) setMetaErr(true); });
  };
  useEffect(() => { loadMeta(); }, []);
  useEffect(() => { if(role && !metaHadCode.current) loadMeta(); }, [role]);

  // `role` is now the /api/auth payload: {role, label, ipt, can_approve, ipt_locked,
  // ipt_required, demo, ipts}. Every permission the UI shows comes from it, not from a
  // client-side table.
  // G3: a login's answer carries the person's own name (via "login"); a code still carries only what was typed
  const signIn = (info, name, code) => {
    const n = ((info && info.via === "login" ? info.name : name) || "").trim();
    ACCESS.code = code || ""; ACCESS.info = info;
    if(code){ try { sessionStorage.setItem("modus_access_code", code); } catch(e){} }
    else { try { sessionStorage.removeItem("modus_access_code"); } catch(e){} authHint(true); }
    setRole(info); setWho(n); setAuthNotice("");
    try { localStorage.setItem("modus_who", n); } catch(e){}
    setView("portal");
  };
  // G3: a lead's link (HU14) signs them straight in; a browser that signed in before asks who it is
  useEffect(() => {
    if(ACCESS.code) return;   // the code path below
    if(START_LINK && START_LINK.purpose === "demo"){
      postJSON("/auth/link", { token: START_LINK.token })
        .then(info => signIn(info))
        .catch(e => { setLinkErr(e.detail || "This demo link could not be opened."); setView("linkerr"); });
      return;
    }
    if(START_LINK || !hasAuthHint()) return;
    fetch(`${API}/auth/me`).then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(j => {
        if(j && j.signed_in && j.access && j.access.via === "login"){ ACCESS.info = j.access; setRole(j.access); setWho(j.access.name || ""); setView("portal"); }
        else { authHint(false); setView("public"); }
      })
      .catch(() => setView("public"));
  }, []);
  // a session that ends while the app is open (signed out on another device, disabled, or past its time)
  useEffect(() => {
    const ended = () => {
      ACCESS.info = null; authHint(false); setRole(null); metaHadCode.current = false;
      setAuthNotice("You have been signed out. Sign in again to carry on."); setView("login");
    };
    window.addEventListener(SESSION_ENDED, ended);
    return () => window.removeEventListener(SESSION_ENDED, ended);
  }, []);
  useEffect(() => {
    if(!ACCESS.code) return;
    fetch(`${API}/auth`, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: ACCESS.code }) })
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(info => { ACCESS.info = info; setRole(info); setView("portal"); })
      .catch(e => {
        // 401 / 403: the code is no longer accepted (changed on the server), so forget it. A network
        // failure keeps it, and the next reload tries again; either way the visitor gets the public map.
        if(e === 401 || e === 403){ ACCESS.code = ""; try { sessionStorage.removeItem("modus_access_code"); } catch(x){} }
        setView("public");
      });
  }, []);
  const signOut = () => {
    ACCESS.code = ""; ACCESS.info = null;
    try { sessionStorage.removeItem("modus_access_code"); } catch(e){}
    authHint(false);
    // 12 Oct 2026 (the review and fix pass): the server swaps the 12-hour STAFF cookie for a map-only one, so the next
    // person at a shared machine gets the public map and not the staff data; the next sign-in fetches /api/meta again.
    // G3 (14 Oct 2026): /auth/signout does that AND ends a login's session on the server (the row is deleted, so the
    // cookie is dead wherever it was copied); it replaced the call to gate-signout?keep=map, which still answers.
    fetch(`${API}/auth/signout`, { method: "POST" }).catch(() => {});
    metaHadCode.current = false;
    setRole(null); setView("public");
  };
  // the bar's Guide: none on the sign-in view (it has no tour); the embedded map's tour on a map view, once the map
  // has said it is ready (never over the map password page); this app's guide on every other Portal page
  const onMap = view === "public" || (view === "portal" && page === "map");
  const barGuide = (view === "login" || view === "resume" || view === "setpw" || view === "linkerr") ? null : onMap ? (mapTour ? startMapTour : null) : replayAppGuide;

  return (
    <div className="h-full flex flex-col">
      <Header view={view} role={role} setView={setView} signOut={signOut} vehLang={vehLang} setVehLang={setVehLang} />
      {/* 11 Oct 2026: the demo bar, under the header on every view; main (flex-1 min-h-0) gives up its 26 px */}
      <DemoBar onGuide={barGuide} />
      <main className="flex-1 min-h-0 flex flex-col">
        {view === "public" && <PublicMap onLogin={() => setView("login")} />}
        {view === "login" && <Login onSignIn={signIn} onBack={() => setView("public")} savedName={who} notice={authNotice} />}
        {view === "setpw" && START_LINK && <SetPassword link={START_LINK} onSignIn={signIn} onBack={() => setView("login")} />}
        {view === "linkerr" && (
          <AuthNote title="This link no longer works" body={linkErr} action="Back to the map" onAction={() => setView("public")} />
        )}
        {view === "resume" && <div className="flex-1 flex items-center justify-center text-sm text-slate-500" role="status">Signing you back in…</div>}
        {view === "portal" && (
          <Portal role={role} who={who} meta={meta} metaErr={metaErr} vehLang={vehLang} onPage={setPage} />
        )}
      </main>
    </div>
  );
}

      {!st ? <p className="text-[14px] text-slate-500">Reading…</p> : (

            <thead><tr><th scope="col">Source</th><th scope="col">Data as at</th><th scope="col" className="num">Items</th></tr></thead>
            <tbody>{st.sources.map(s => (
              <tr key={s.key}><td>{s.name}{s.error ? <div className="text-amber-700 text-[13px]">{s.error}</div> : null}</td>
                <td>{day(s.data_date || s.fetched_at)}</td><td className="num tabular-nums">{s.count == null ? "—" : grp(s.count, 0)}</td></tr>
            ))}</tbody>
          </table>
          <p className="text-[13px] text-slate-500 mb-3">{st.kinds.map(k => `${k.label} ${grp(k.count, 0)}`).join(" · ")}</p>
          {st.credit ? <p className="text-[13px] text-slate-500 mb-3">{st.credit}</p> : null}
          {canFetch
            ? <button type="button" className="btn btn-secondary" disabled={st.state === "running"} onClick={start}>{st.fetched_at ? "Fetch again" : "Fetch now"}</button>
            : <p className="text-[13px] text-slate-500">A planner or an admin fetches it.</p>}
          {msg ? <span className="text-[13px] text-slate-600 ml-3" role="status">{msg}</span> : null}
        </>
      )}
    </div>
  );
}

function RouteMapExportMenu({ months, ipts, picked }){
  const now = new Date();
  const cur = Math.min(months.count, Math.max(1, (now.getFullYear() - months.start_year) * 12 + now.getMonth() + 1));
  const [m, setM] = useState(cur);
  const [scope, setScope] = useState("all");
  const [team, setTeam] = useState("ALL");
  const [plan, setPlan] = useState("regional");
  const [scale, setScale] = useState("");
  const [at, setAt] = useState("");
  const [noComm, setNoComm] = useState(false);     // 14 Oct 2026: the community considerations, on unless left out
  const [addColl, setAddColl] = useState(false);   // 16 Oct 2026 (CLOCS v5 C1): the collision history, off unless added
  const [opts, setOpts] = useState({ plans: [], places: [], regional_fitted: null });
  const [open, setOpen] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  useEffect(() => { if(!picked && scope === "picked") setScope("all"); }, [picked]);
  const query = () => {
    const q = new URLSearchParams({ month: String(m) });
    if(scope === "picked" && picked) q.set("routes", picked);
    if(team !== "ALL") q.set("team", team);
    return q;
  };
  const load = async () => {
    try {
      const r = await fetch(`${API}/routes/map-export/places?${query().toString()}`);
      if(r.ok){ const j = await r.json(); setOpts(j); setAt(a => (j.places || []).includes(a) ? a : ((j.places || [])[0] || "")); }
    } catch(e){ /* the download says what went wrong */ }
  };
  useEffect(() => { if(open) load(); }, [open, m, scope, team, picked]);
  const spec = (opts.plans || []).find(p => p.kind === plan) || null;
  useEffect(() => { setScale(spec && spec.default ? String(spec.default) : ""); }, [plan, opts]);
  const download = async (kind) => {
    setBusy(true); setErr(null);
    try {
      const q = query();
      q.set("plan", plan);
      if(scale) q.set("scale", scale);
      if(spec && spec.centred && at) q.set("at", at);
      if(noComm) q.set("community", "0");
      if(addColl) q.set("collisions", "1");
      const r = await fetch(`${API}/routes/map-export.${kind}?${q.toString()}`);
      if(!r.ok){
        const txt = await r.text();
        let d = "";
        try { const j = JSON.parse(txt); d = (j && typeof j.detail === "string") ? j.detail : ""; } catch(e){ d = ""; }
        throw new Error(d || `error ${r.status}`);
      }
      const blob = await r.blob();
      const cd = r.headers.get("content-disposition") || "";
      const fm = cd.match(/filename="([^"]+)"/);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = fm ? fm[1] : `route-map.${kind}`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    } catch(e){ setErr("The route map could not be made: " + (e.message || e)); }
    setBusy(false);
  };
  const noPlace = !!(spec && spec.centred && !(opts.places || []).length);
  return (
    <details className="row-menu bulletin-menu" data-route-map-export="1" onToggle={e => setOpen(e.currentTarget.open)}>
      <summary className="btn-sec" style={{ width: "auto", height: "auto", padding: "5px 10px", fontWeight: 500 }}
               title="The routes on a map at a CLP plan's scale, as a PDF or a PNG, from the approved plan">Route map (plan) ▾</summary>
      <div className="row-menu-list dash-filters">
        <label><span>Month</span><select value={m} onChange={e => setM(+e.target.value)} aria-label="Route map month">
          {Array.from({ length: months.count }, (_, i) => i + 1).map(i => <option key={i} value={i}>{monthLabelAbs(i, months.start_year)}</option>)}</select></label>
        <label><span>Routes</span><select value={scope} onChange={e => setScope(e.target.value)} aria-label="Which routes">
          <option value="all">Every route</option>
          {picked && <option value="picked">Only the route picked in the list</option>}</select></label>
        <label><span>{TEAM()}</span><select value={team} onChange={e => setTeam(e.target.value)} aria-label={TEAM()}>
          <option value="ALL">All {TEAMS()}</option>
          {(ipts || []).map(i => <option key={i.id} value={i.id}>{teamText(i.id)}</option>)}</select></label>
        <label><span>Plan</span><select value={plan} onChange={e => setPlan(e.target.value)} aria-label="Which plan">
          <option value="regional">Regional plan: the whole routes</option>
          <option value="local">Local plan: around a site, 1:2,000 to 1:3,000</option>
          <option value="site">Site plan: around a site, 1:500 to 1:1,000</option></select></label>
        <label><span>Scale</span><select value={scale} onChange={e => setScale(e.target.value)} aria-label="Scale">
          {plan === "regional" && <option value="">Fitted to the routes{opts.regional_fitted ? ` (1:${Number(opts.regional_fitted).toLocaleString("en-GB")})` : ""}</option>}
          {(spec ? spec.scales : []).map(n => <option key={n} value={String(n)}>1:{Number(n).toLocaleString("en-GB")}</option>)}</select></label>
        {spec && spec.centred && <label><span>Centred on</span><select value={at} onChange={e => setAt(e.target.value)} aria-label="Centred on">
          {(opts.places || []).map(n => <option key={n} value={n}>{n}</option>)}</select></label>}
        <label className="flex items-center gap-2" style={{ flexDirection: "row" }}><input type="checkbox" checked={noComm} onChange={e => setNoComm(e.target.checked)} data-rme-no-community="1" /> Leave out the community considerations</label>
        <label className="flex items-center gap-2" style={{ flexDirection: "row" }}><input type="checkbox" checked={addColl} onChange={e => setAddColl(e.target.checked)} data-rme-collisions="1" /> Add the collision history (killed or seriously injured only on the regional plan)</label>
        <button type="button" onClick={() => download("pdf")} disabled={busy || noPlace}>{busy ? "Drawing the map…" : "Download PDF"}</button>
        <button type="button" onClick={() => download("png")} disabled={busy || noPlace}>Download PNG</button>
        <div className="row-menu-note">Just the map, with its legend, scale and north arrow on it. Approved lines only. A planning document, not an approved CLP. The PDF prints at the stated scale on A4 at 100 %; in a Word document, use the scale bar.</div>
        {err && <div className="bm-err" role="alert">{err}</div>}
      </div>
    </details>
  );
}

// ================================================================= Header
function Header({ view, role, setView, signOut, vehLang, setVehLang }){
  return (
    <header className="brand-bar shrink-0">

// ================================================================= Appearance picker
// A 32 px half-circle button at the right of the header; a small popover with the three
// looks, a swatch each, a tick on the current one. Closes on a choice, a click outside,
// or Escape. Keyboard: the button is a real button; the items are menuitemradio.
function AppearancePicker(){
  const [theme, setTheme] = useTheme();
  const [accent, setAccent] = useAccent();
  const [open, setOpen] = useState(false);
  const box = useRef(null);
  useEffect(() => {
    if(!open) return;
    const away = (e) => { if(box.current && !box.current.contains(e.target)) setOpen(false); };
    const key = (e) => { if(e.key === "Escape") setOpen(false); };
    document.addEventListener("mousedown", away); document.addEventListener("keydown", key);
    return () => { document.removeEventListener("mousedown", away); document.removeEventListener("keydown", key); };
  }, [open]);
  return (
    <span className="appearance" ref={box}>
      <button type="button" className="appearance-btn" title="Appearance" aria-label="Appearance"
        aria-haspopup="menu" aria-expanded={open ? "true" : "false"} onClick={() => setOpen(o => !o)}>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" aria-hidden="true">
          <circle cx="8" cy="8" r="6"></circle><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor" stroke="none"></path>
        </svg>
      </button>
      {open && (
        <div className="appearance-menu" role="menu" aria-label="Appearance">
          <h6>Appearance</h6>
          {THEMES.map(([k, label, sw]) => (
            <button key={k} type="button" role="menuitemradio" aria-checked={theme === k ? "true" : "false"}
              className={"appearance-item" + (theme === k ? " is-on" : "")}
              onClick={() => { setTheme(k); setOpen(false); }}>
              <span className="swatch" style={{ "--sw-dot": sw.dot }} aria-hidden="true"><i style={{ background: sw.bar }}></i><b style={{ background: sw.page }}></b></span>
              <span className="flex-1">{label}</span>
              <span className="tick" aria-hidden="true">✓</span>
            </button>
          ))}
          {/* 13 Oct 2026 (W16): the accent, a second group (its own class, so the three looks stay three items) */}
          <h6>Accent</h6>
          {ACCENTS.map(([k, label, sw]) => (
            <button key={k} type="button" role="menuitemradio" aria-checked={accent === k ? "true" : "false"}
              className={"accent-item" + (accent === k ? " is-on" : "")} data-accent-choice={k}
              onClick={() => { setAccent(k); setOpen(false); }}>
              <span className="swatch accent-sw" aria-hidden="true"><i style={{ background: sw.btn }}></i><b style={{ background: sw.s1 }}></b><b style={{ background: sw.s2 }}></b></span>
              <span className="flex-1">{label}</span>
              <span className="tick" aria-hidden="true">✓</span>
            </button>
          ))}
        </div>
      )}
    </span>
  );
}

// ================================================================= Account menu (G3, 14 Oct 2026)
// A signed-in person's name at the right of the header; the menu says who and which team (by NAME), and lets them
// change their password. A lead's demo login has no password (they sign in by their link) and says when it ends.
function AccountMenu({ role, onSignOut }){
  const [open, setOpen] = useState(false);
  const [cur, setCur] = useState(""); const [nw, setNw] = useState(""); const [nw2, setNw2] = useState("");
  const [msg, setMsg] = useState(null); const [busy, setBusy] = useState(false);
  const box = useRef(null);
  useEffect(() => {
    if(!open) return;
    const away = (e) => { if(box.current && !box.current.contains(e.target)) setOpen(false); };
    const key = (e) => { if(e.key === "Escape") setOpen(false); };
    document.addEventListener("mousedown", away); document.addEventListener("keydown", key);
    return () => { document.removeEventListener("mousedown", away); document.removeEventListener("keydown", key); };
  }, [open]);
  const team = role.ipt ? teamName(role.ipt) : role.label;
  const demo = role.kind === "demo";
  const change = () => {
    if(nw.length < 10){ setMsg({ ok: false, t: "Use at least 10 characters. Three random words work well." }); return; }
    if(nw !== nw2){ setMsg({ ok: false, t: "The two new passwords are not the same." }); return; }
    setBusy(true); setMsg(null);
    postJSON("/auth/password", { current: cur, new: nw })
      .then(() => { setCur(""); setNw(""); setNw2(""); setMsg({ ok: true, t: "Password changed. Your other devices are signed out." }); })
      .catch(e => setMsg({ ok: false, t: e.detail || `Not changed (${e.status || "no answer"}).` }))
      .finally(() => setBusy(false));
  };
  return (
    <span className="appearance" ref={box}>
      <button type="button" className="acct-btn" aria-haspopup="menu" aria-expanded={open ? "true" : "false"}
        onClick={() => setOpen(o => !o)} title={`${role.name} · ${team}`} aria-label={`Your account: ${role.name}`}>
        <span className="truncate acct-name">{role.name}</span>
        <span className="acct-ini" aria-hidden="true">{String(role.name || "").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("")}</span>
        <span aria-hidden="true">▾</span>
      </button>
      {open && (
        <div className="appearance-menu acct-menu" role="menu" aria-label="Your account">
          <div style={{ fontWeight: 600 }}>{role.name}</div>
          <div style={{ color: "var(--popover-muted)" }}>{role.email}</div>
          <div style={{ marginTop: 4 }}>{team}{role.can_approve ? " · can approve" : ""}</div>
          {demo && role.expires_at && <div style={{ marginTop: 4, color: "var(--popover-muted)" }}>Your demo access ends {fmtWhen(role.expires_at)}.</div>}
          {!demo && (
            <>
              <h6 style={{ padding: "12px 0 0" }}>Change your password</h6>
              <input type="password" autoComplete="current-password" placeholder="Current password" aria-label="Current password" value={cur} onChange={e => setCur(e.target.value)} />
              <input type="password" autoComplete="new-password" placeholder="New password (10 characters or more)" aria-label="New password" value={nw} onChange={e => setNw(e.target.value)} />
              <input type="password" autoComplete="new-password" placeholder="New password again" aria-label="New password again" value={nw2} onChange={e => setNw2(e.target.value)}
                onKeyDown={e => e.key === "Enter" && change()} />
              {msg && <div style={{ marginTop: 6, color: msg.ok ? "var(--popover-fg)" : "#FCA5A5" }} role="status">{msg.t}</div>}
              <button type="button" className="btn-pri" style={{ marginTop: 8, width: "100%" }} disabled={busy || !cur || !nw} onClick={change}>
                {busy ? "Saving…" : "Change password"}
              </button>
            </>
          )}
          <button type="button" className="btn-sec acct-signout" style={{ marginTop: 10, width: "100%" }} onClick={() => { setOpen(false); onSignOut && onSignOut(); }}>Sign out</button>
        </div>
      )}
    </span>
  );
}
// "Wed 28 Oct 2026, 09:00" from the server's ISO time, in the browser's own time zone
function fmtWhen(iso){
  try { const d = new Date(iso); if(isNaN(d)) return iso || "";
    return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" }) + ", "
      + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }); } catch(e){ return iso || ""; }
}

// ================================================================= Login
// G3 (14 Oct 2026): the sign-in screen is email and password. "Forgot your password?" asks for a link. While the
// server still has shared codes set (until 31 Oct, D49) a small link opens the code form below, unchanged; when the
// codes are deleted on the server the link is not offered.
function Login({ onSignIn, onBack, savedName, notice }){
  const [mode, setMode] = useState("email");   // email | forgot | code
  const [codesOn, setCodesOn] = useState(false);
  useEffect(() => { fetch(`${API}/auth/me`).then(r => r.ok ? r.json() : null).then(j => setCodesOn(!!(j && j.codes))).catch(() => {}); }, []);
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [remember, setRemember] = useState(false);
  const [msg, setMsg] = useState(notice || "");
  const [pw, setPw] = useState("");
  const [name, setName] = useState(savedName || "");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [show, setShow] = useState(false);   // 11 Oct 2026: the show / hide eye on the access code
  const go = (m) => { setMode(m); setErr(""); if(m !== "email") setMsg(""); };
  const signInEmail = () => {
    if(!email.trim() || !pass){ setErr("Enter your email and password."); return; }
    setBusy(true); setErr(""); setMsg("");
    postJSON("/auth/signin", { email: email.trim(), password: pass, remember })
      .then(info => onSignIn(info))
      .catch(e => setErr((e.status === 401 || e.status === 429) && e.detail ? e.detail : `Couldn't sign in (${e.status || "no answer"}).`))
      .finally(() => setBusy(false));
  };
  const askLink = () => {
    if(!email.trim()){ setErr("Enter the email address you sign in with."); return; }
    setBusy(true); setErr(""); setMsg("");
    postJSON("/auth/forgot", { email: email.trim() })
      .then(j => setMsg(j.message || "If that address has a Wayscope login, we have sent it a link."))
      .catch(e => setErr(e.status === 429 && e.detail ? e.detail : "Couldn't send the link. Try again in a minute."))
      .finally(() => setBusy(false));
  };
  if(mode === "email" || mode === "forgot"){
    const forgot = mode === "forgot";
    return (
      <div className="flex-1 grid place-items-center px-5">
        <div className="auth-card">
          <h1>{forgot ? "Forgotten your password?" : "Staff sign in"}</h1>
          <p className="auth-sub">{forgot ? "Enter your email. We'll send you a link to choose a new password." : "Sign in with your email and password."}</p>
          {msg && <div className="auth-msg" role="status">{msg}</div>}
          <div className="field">
            <label htmlFor="auth-email">Email</label>
            <input id="auth-email" className="auth-input" type="email" value={email} autoFocus autoComplete="username"
              onChange={e => setEmail(e.target.value)} onKeyDown={e => e.key === "Enter" && (forgot ? askLink() : signInEmail())}
              placeholder="you@example.com" />
          </div>
          {!forgot && (
            <>
              <div className="field">
                <label htmlFor="auth-pass">Password</label>
                <div className="pw-wrap">
                  <input id="auth-pass" className="auth-input" type={show ? "text" : "password"} value={pass} autoComplete="current-password"
                    onChange={e => setPass(e.target.value)} onKeyDown={e => e.key === "Enter" && signInEmail()} placeholder="Password" />
                  <button type="button" className="pw-eye" onClick={() => setShow(s => !s)}
                    aria-label={show ? "Hide password" : "Show password"} aria-pressed={show} title={show ? "Hide password" : "Show password"}>
                    <PwEye show={show} />
                  </button>
                </div>
              </div>
              <label className="auth-check"><input type="checkbox" checked={remember} onChange={e => setRemember(e.target.checked)} />Keep me signed in on this device for 30 days</label>
            </>
          )}
          {err && <p className="text-sm mb-2" style={{color:"var(--red)"}} role="alert">{err}</p>}
          <button onClick={forgot ? askLink : signInEmail} disabled={busy} className="btn-pri auth-go">
            {busy ? (forgot ? "Sending…" : "Checking…") : (forgot ? "Send me a link" : "Sign in")}
          </button>
          <div className="auth-links">
            <button type="button" onClick={() => go(forgot ? "email" : "forgot")}>{forgot ? "Back to sign in" : "Forgot your password?"}</button>
            {codesOn && !forgot && <button type="button" onClick={() => go("code")}>Sign in with a team code instead</button>}
          </div>
          <button onClick={onBack} className="auth-back">
            Back to the map
          </button>
          <p className="auth-note">
            Your login belongs to your {TEAM().toLowerCase()}: you see your {TEAM().toLowerCase()}'s forecast lines. A planner sees every {TEAM().toLowerCase()} and
            approves. Ask your administrator if you do not have a login.
          </p>
        </div>
      </div>
    );
  }
  const submit = () => {
    if(!name.trim()){ setErr("Please enter your name."); return; }
    const code = pw.trim();
    if(!code){ setErr("Enter your access code."); return; }
    setBusy(true); setErr("");
    fetch(`${API}/auth`, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code }) })
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(info => onSignIn(info, name, code))
      .catch(e => setErr(e === 401 ? "That access code isn't recognised." : `Couldn't sign in (${e}).`))
      .finally(() => setBusy(false));
  };
  return (
    <div className="flex-1 grid place-items-center px-5">
      <div className="auth-card">
        <h1>Staff sign in</h1>
        <p className="auth-sub">Enter your name and access code to submit or approve forecasts.</p>
        <div className="field">
          <label htmlFor="auth-name">Your name</label>
          <input id="auth-name" className="auth-input"
            type="text" value={name} autoFocus autoComplete="name"
            onChange={e => setName(e.target.value)}
            onKeyDown={e => e.key === "Enter" && submit()}
            placeholder="Your name" />
        </div>
        <div className="field">
          <label htmlFor="auth-code">Access code</label>
          <div className="pw-wrap">
            <input id="auth-code" className="auth-input"
              type={show ? "text" : "password"} value={pw} autoComplete="current-password"
              onChange={e => setPw(e.target.value)}
              onKeyDown={e => e.key === "Enter" && submit()}
              placeholder="Access code" />
            <button type="button" className="pw-eye" onClick={() => setShow(s => !s)}
              aria-label={show ? "Hide access code" : "Show access code"} aria-pressed={show}
              title={show ? "Hide access code" : "Show access code"}>
              {show ? <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2"/><path d="M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg> : <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>}
            </button>
          </div>
        </div>
        {err && <p className="text-sm mb-2" style={{color:"var(--red)"}}>{err}</p>}
        <button onClick={submit} disabled={busy} className="btn-pri auth-go">
          {busy ? "Checking…" : "Sign in"}
        </button>
        <button onClick={() => go("email")} className="auth-back">
          Sign in with your email instead
        </button>
        <button onClick={onBack} className="auth-back">
          Back to the map
        </button>
        {/* 15 Sep — the three demo codes were printed here in full. They are opt-in on the
            server now (ALLOW_DEMO_CODES, never set on Render) and this box no longer names
            them. Nothing here should tell a reader a credential that works. */}
        <p className="auth-note">
          Your {TEAM().toLowerCase()}'s code shows only your {TEAM().toLowerCase()}'s forecast lines. The planner code sees every {TEAM().toLowerCase()} and can
          approve. Codes are checked by Wayscope — ask your planner if you do not have one.
        </p>
      </div>
    </div>
  );
}

// ================================================================= Set a password (G3, 14 Oct 2026)
// Reached from an invite (72 hours) or a reset link (60 minutes); both work once. The link is checked first, so the
// person is greeted by name; the password is checked before the link is used, so a too-short one does not waste it.
function SetPassword({ link, onSignIn, onBack }){
  const [info, setInfo] = useState(null);
  const [bad, setBad] = useState("");
  const [pw, setPw] = useState(""); const [pw2, setPw2] = useState("");
  const [remember, setRemember] = useState(false);
  const [err, setErr] = useState(""); const [busy, setBusy] = useState(false); const [show, setShow] = useState(false);
  useEffect(() => {
    postJSON("/auth/check", { token: link.token }).then(setInfo)
      .catch(e => setBad(e.detail || "This link has expired or has already been used. Ask for a new one."));
  }, []);
  const submit = () => {
    if(pw.length < 10){ setErr("Use at least 10 characters. Three random words work well."); return; }
    if(pw !== pw2){ setErr("The two passwords are not the same."); return; }
    setBusy(true); setErr("");
    postJSON("/auth/reset", { token: link.token, password: pw, remember })
      .then(info => onSignIn(info))
      .catch(e => { if(e.status === 410) setBad(e.detail); else setErr(e.detail || `Couldn't save the password (${e.status || "no answer"}).`); })
      .finally(() => setBusy(false));
  };
  if(bad) return <AuthNote title="This link no longer works" body={bad + " On the sign-in screen, \u201cForgot your password?\u201d sends a new one."}
    action="Go to sign in" onAction={onBack} />;
  if(!info) return <div className="flex-1 flex items-center justify-center text-sm text-slate-500" role="status">Checking your link…</div>;
  return (
    <div className="flex-1 grid place-items-center px-5">
      <div className="auth-card">
        <h1>{info.purpose === "invite" ? `Welcome, ${(info.name || "").split(" ")[0]}` : "Choose a new password"}</h1>
        <p className="auth-sub">{info.purpose === "invite" ? "Set a password for your Wayscope login" : "For your Wayscope login"}, {info.email}.</p>
        <div className="field">
          <label htmlFor="set-pw">New password</label>
          <div className="pw-wrap">
            <input id="set-pw" className="auth-input" type={show ? "text" : "password"} value={pw} autoFocus autoComplete="new-password"
              onChange={e => setPw(e.target.value)} placeholder="10 characters or more" />
            <button type="button" className="pw-eye" onClick={() => setShow(s => !s)}
              aria-label={show ? "Hide password" : "Show password"} aria-pressed={show} title={show ? "Hide password" : "Show password"}>
              <PwEye show={show} />
            </button>
          </div>
        </div>
        <div className="field">
          <label htmlFor="set-pw2">The same again</label>
          <input id="set-pw2" className="auth-input" type={show ? "text" : "password"} value={pw2} autoComplete="new-password"
            onChange={e => setPw2(e.target.value)} onKeyDown={e => e.key === "Enter" && submit()} />
        </div>
        <label className="auth-check"><input type="checkbox" checked={remember} onChange={e => setRemember(e.target.checked)} />Keep me signed in on this device for 30 days</label>
        {err && <p className="text-sm mb-2" style={{color:"var(--red)"}} role="alert">{err}</p>}
        <button onClick={submit} disabled={busy} className="btn-pri auth-go">{busy ? "Saving…" : "Save and sign in"}</button>
        <p className="auth-note">At least 10 characters. Three random words are easy to remember and hard to guess. Saving signs you out on every other device.</p>
      </div>
    </div>
  );
}

// ================================================================= Users (G3, 14 Oct 2026)
// Admins only (D57). Three parts: People (every login: add, change team or role, disable, send a link, extend a demo
// login), Leads (the demo requests with each lead's own login and what they opened, HU14; "Send a personal login"
// for a lead who asked before 14 Oct, D56) and Activity (every change, sign-in and demo page open, D55). An admin
// LOGIN needs nothing more (D53); signed in with the shared admin code, the admin token typed here opens it — that
// is how the first admin is added (D47). A team is always shown by its NAME.
const USER_STATUS = { active: ["Approved", "Active"], invited: ["Pending", "Invited"], disabled: ["Rejected", "Disabled"],
                      expired: ["none", "Ended"] };
function roleChoice(u){ return u.role === "team" ? "team:" + u.team : u.role; }
function describeActivity(r){
  const words = { signin: "Signed in", "signin-code": "Signed in with a shared code", "signin-refused": "Sign-in refused", "signin-locked": "Sign-in locked (too many tries)",
                  signout: "Signed out", "reset-asked": "Asked for a password link", "password-set": "Set a password",
                  "password-changed": "Changed their password", "demo-link": "Opened their demo link" };
  if(words[r.kind]) return words[r.kind];
  if(r.kind === "page") return "Opened " + (r.target || "a page");
  const p = (r.path || "").replace(/^\/api\//, "");
  const known = [[/^forecasts\/bulk$/, "Saved forecast lines"], [/^forecasts\//, "Withdrew a forecast"],
    [/^routes\/[^/]+\/status$/, "Approved, rejected or reopened a forecast"], [/^forecast-weeks\/confirm$/, "Confirmed a week"],
    [/^forecast-weeks\/actual$/, "Typed a week's actual"], [/^forecast-weeks\/reopen$/, "Reopened a week"],
    [/^forecast-weeks\/calibrate$/, "Calibrated a week"], [/^forecast-weeks$/, "Edited a week"], [/^forecast-days\/actual$/, "Typed a day's actual"],
    [/^forecast-days$/, "Edited a day"], [/^stockpiles\/consume$/, "Recorded stockpile use"], [/^carbon\/target$/, "Changed the carbon target"],
    [/^admin\/config\/factors\/reset$/, "Reset the configuration to the file"], [/^admin\/config\/factors$/, "Saved the configuration"],
    [/^admin\/users\/[^/]+\/reset$/, "Sent a login its link"], [/^admin\/users\/[^/]+$/, "Changed a login"], [/^admin\/users$/, "Added a login"],
    [/^admin\/leads\/[^/]+\/login$/, "Gave a lead a personal login"], [/^admin\/tenant\/import$/, "Imported the organisation's data"]];
  for(const [rx, w] of known){ if(rx.test(p)) return w; }
  const verb = { POST: "Added", PUT: "Changed", PATCH: "Changed", DELETE: "Removed" }[r.method] || "Changed";
  return verb + " · " + p.replace(/^admin\//, "");
}

  const teams = (data && data.teams) || [];

const PHONE_PAGES = ["dashboard", "lookahead", "map"];

          <svg className="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01" /></svg>
          <span>User guide</span><span className="pm-note">new tab</span>
        </a>
        {role && <div className="phone-more-who">{teamText(who) || "—"} · {role.ipt ? teamName(role.ipt) : role.label}</div>}

function DeskOnly({ label, onHome }){
  return (
    <div className="card desk-only" data-desk-only="1">
      <h2>{label}</h2>
      <p className="do-lead">Open on a desktop to edit this.</p>
      <p>On a phone, Wayscope shows the Dashboard, the Look-ahead and the Route map, to read. Typing, approving and setting up are done on a computer or a tablet.</p>
      <button type="button" className="btn-pri tap48" onClick={onHome}>Go to the Dashboard</button>
    </div>

// 2026-09-14 — deep links. Derived from NAV so a new page cannot be linkable-but-unknown
// or known-but-unlinkable; the two lists cannot drift.
const PAGE_IDS = new Set(NAV.flatMap(g => g.items.map(i => i.id)));
// 2026-09-15 — a hash may now carry ONE trailing "/n" after the page id, for a screen
// number: "#dashboard/3". That is how four wall displays each show a different quarter
// of the Dashboard — four browsers, four URLs, no per-screen configuration to keep in
// step. The page-id check is unchanged and still comes from NAV, so a bad suffix degrades
// to the plain page rather than to nothing.
function hashParts(){
  try {
    const raw = decodeURIComponent((window.location.hash || "").replace(/^#\/?/, "")).trim();
    const cut = raw.indexOf("/");
    const id = cut === -1 ? raw : raw.slice(0, cut);
    const rest = cut === -1 ? "" : raw.slice(cut + 1);
    return PAGE_IDS.has(id) ? { page: id, rest } : { page: null, rest: "" };
  } catch(e){ return { page: null, rest: "" }; }
}
function pageFromHash(){ return hashParts().page; }
//: 1-based screen number from "#dashboard/3", or null. Out of range is null, not a clamp:
//: a typo should show the whole board, not silently a different quarter of it.
function screenFromHash(max){
  const { page, rest } = hashParts();
  if(!page || !/^[0-9]+$/.test(rest)) return null;
  const n = parseInt(rest, 10);
  return (n >= 1 && n <= max) ? n : null;
}

// One header for every page: title, one line of purpose, actions on the right.

}

// One empty state for every page, in three kinds (10 Oct 2026, ui-review-1009 mockup 5):

// While a table loads it keeps its shape: header, then grey rows in the column widths.

// Status as a word with a dot beside it — the same four colours everywhere, never colour
// alone (10 Oct 2026, mockups 2 and 3; the chart palette is a different scale).
const STATUS_DOT = { Approved: "var(--green)", confirmed: "var(--green)", held: "var(--green)",
                     Pending: "var(--gold)", edited: "var(--gold)", Rejected: "var(--red)" };

// The applied-filter chips under a filter row: one chip per filter in force, each removable,
// one "Clear all", and the count beside them (mockup 4, the Carbon filtering pattern).
function AppliedChips({ chips, onClear, onClearAll, count }){

function Portal({ role, who, meta, metaErr, vehLang, onPage }){
  const canApprove = !!(role && role.can_approve);
  // 2026-09-14: the URL hash names the page, so the user guide can link straight at a
  // screen ("#lookahead") and a page can be bookmarked. The hash WINS over the
  // remembered page on first load; after that the two are kept in step. Unknown or
  // absent hash falls back to what was remembered, exactly as before.
  const [page, setPageState] = useState(() => {
    const h = pageFromHash();
    if(h) return h;
    try { return localStorage.getItem("modus_page") || "dashboard"; } catch(e){ return "dashboard"; }
  });
  const setPage = (p) => {
    setPageState(p);
    try { localStorage.setItem("modus_page", p); } catch(e){}
    // replace, not push: the rail is not browser history, and a back button that walked
    // back through every page you clicked would be worse than one that leaves the app.
    try { if(pageFromHash() !== p) history.replaceState(null, "", "#" + p); } catch(e){}
  };
  // 11 Oct 2026 (the demo bar): App learns the page, so the bar's Guide starts the embedded map's own tour on the
  // Route map and this app's guide elsewhere. PR #20's body[data-map-open] flag went with the header badge.
  useEffect(() => { if(onPage) onPage(page); }, [page]);
  // someone edits the hash, or follows a second link from the guide into the same tab
  useEffect(() => {
    const onHash = () => { const h = pageFromHash(); if(h && h !== page) setPageState(h); };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, [page]);
  // and put the hash on the URL for the page we actually opened with
  useEffect(() => { try { if(pageFromHash() !== page) history.replaceState(null, "", "#" + page); } catch(e){} }, []);
  const [railOpen, setRailOpen] = useState(() => { try { return localStorage.getItem("modus_rail") !== "closed"; } catch(e){ return true; } });
  // 13 Oct 2026 (W5, bundle E; the user's "3 yes"): below 768 px the rail was icons only, opening OVER the page.
  // 14 Oct 2026 (D9, the mobile shell): below 768 px there is NO rail. A bottom tab bar of four takes its place
  // (PhoneTabs: Dashboard, Look-ahead, Route map, More); "More" opens a sheet with the pages made for a desk, each of
  // which says "open on a desktop to edit this" on a phone. One breakpoint, 768 px (D9), the same as the cards.
  const NARROW_Q = "(max-width: 767px)";
  const [narrow, setNarrow] = useState(() => { try { return !!(window.matchMedia && window.matchMedia(NARROW_Q).matches); } catch(e){ return false; } });
  const [moreOpen, setMoreOpen] = useState(false);  // the phone's More sheet
  const [wallOn, setWallOn] = useState(false);      // 14 Oct 2026: the Dashboard's big screen is on
  useEffect(() => {
    if(!window.matchMedia) return;
    const mq = window.matchMedia(NARROW_Q);
    const f = (e) => { setNarrow(!!e.matches); setMoreOpen(false); };
    if(mq.addEventListener) mq.addEventListener("change", f); else if(mq.addListener) mq.addListener(f);
    return () => { if(mq.removeEventListener) mq.removeEventListener("change", f); else if(mq.removeListener) mq.removeListener(f); };
  }, []);
  useEffect(() => {
    if(!moreOpen) return;
    const k = (e) => { if(e.key === "Escape") setMoreOpen(false); };
    window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k);
  }, [moreOpen]);
  const railShown = railOpen;
  const toggleRail = () => {
    const v = !railOpen; setRailOpen(v); try { localStorage.setItem("modus_rail", v ? "open" : "closed"); } catch(e){}
  };
  // {routeId, year, toYear, discipline, sectionId} handed to the Matrix. `year` is the
  // FIRST year of the line and `toYear` the last — a line can span several since the
  // multi-year save, and reopening it on one year would hide the rest.
  const [editTarget, setEditTarget] = useState(null);
  // pending-approval count for the planner's nav badge
  const [pending, setPending] = useState(0);
  const refreshPending = () => {
    if(!canApprove) return;
    fetch(`${API}/forecasts/summary`).then(r => r.ok ? r.json() : [])
      .then(rows => setPending((rows || []).filter(r => r.status === "Pending" || r.status === "Mixed").length))
      .catch(() => {});
  };
  useEffect(() => { refreshPending(); }, [canApprove, page]);

  // a page the role cannot see falls back to the dashboard rather than a blank
  const [navQ, setNavQ] = useState("");
  const navRef = useRef(null);
  useEffect(() => {
    const onKey = (e) => { if((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")){ e.preventDefault(); if(window.matchMedia && window.matchMedia(NARROW_Q).matches){ setMoreOpen(true); return; } setRailOpen(true); setTimeout(() => navRef.current && navRef.current.focus(), 0); } };
    window.addEventListener("keydown", onKey); return () => window.removeEventListener("keydown", onKey);
  }, []);
  // G3: an item marked adminOnly (Users) shows to an admin — an admin login, or the shared admin code while codes last —
  // and, so the first admin can be added on a site with no admin code set, to a planner signed in with a shared CODE.
  // The page itself still needs an admin login or the admin token (the server checks), so this opens nothing new.
  const isAdmin = !!(role && (role.role === "admin" || (role.can_approve && role.via !== "login")));
  const visible = NAV.filter(g => !g.admin || canApprove)
    .map(g => ({ ...g, items: g.items.filter(i => !i.adminOnly || isAdmin) })).filter(g => g.items.length);
  const navMatch = (it) => !navQ || it.label.toLowerCase().includes(navQ.toLowerCase());
  const navFirst = visible.flatMap(g => g.items).find(navMatch);
  const allowed = new Set(visible.flatMap(g => g.items.map(i => i.id)));
  useEffect(() => { if(!allowed.has(page)) setPage("dashboard"); }, [canApprove, isAdmin]);
  // G3 (D51, HU14): a lead's demo login says which page it opened, so the leads list shows who looked at what. Staff
  // page opens are never sent (the server would ignore them anyway).
  useEffect(() => {
    if(!role || role.kind !== "demo") return;
    fetch(`${API}/activity`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ page }) }).catch(() => {});
  }, [page]);

  if(metaErr){
    return <div className="p-8 text-center text-slate-600">
      Couldn't reach the forecasting service. Refresh the page; if it persists, Wayscope may still be starting up.
    </div>;
  }
  if(!meta) return <div className="p-8 text-center text-slate-400">Loading…</div>;

  const editInMatrix = (target) => { setEditTarget(target); setPage("submit"); };
  const current = visible.flatMap(g => g.items).find(i => i.id === page) || { label: "" };

  // 14 Oct 2026 (D9): on a phone only these three pages show; any other page is the desk-only card. `phone` is passed
  // to the pages that change on a phone, and nothing on a phone writes (the write controls are not rendered).
  const phoneDesk = narrow && !PHONE_PAGES.includes(page);
  const pickPage = (id) => { setPage(id); setMoreOpen(false); };

  return (
    <div className={"flex-1 min-h-0 flex relative" + (narrow ? " phone-shell" : "")}>
      {!narrow && <aside data-guide="rail" className={"rail shrink-0 flex flex-col transition-[width] duration-150 " + (railShown ? "w-56" : "w-14") + (wallOn && page === "dashboard" ? " hidden" : "")}>
        <div className="flex-1 overflow-y-auto py-3">
          {railShown && (
            <label className="rail-search" title="Find a page (Ctrl K)">
              <input ref={navRef} value={navQ} onChange={e => setNavQ(e.target.value)} placeholder="Find a page…" aria-label="Find a page"
                onKeyDown={e => { if(e.key === "Enter" && navFirst){ setPage(navFirst.id); setNavQ(""); } if(e.key === "Escape") setNavQ(""); }} />
              <kbd>Ctrl K</kbd>
            </label>
          )}
          {visible.filter(g => g.items.some(navMatch)).map(g => (
            // collapsed, the group HEADINGS go but the grouping must not: a plain
            // column of nine icons reads as one undifferentiated list.
            <div key={g.group} className={"mb-3 " + (railShown ? "" : "pt-3 mt-3 border-t border-slate-100 first:border-0 first:mt-0 first:pt-0")}>
              {railShown && <div className="rail-group px-4 pb-1">{g.group}</div>}
              {g.items.filter(navMatch).map(it => {
                const active = page === it.id;
                const badge = it.id === "forecasts" && canApprove && pending > 0 ? pending : null;
                return (
                  <button key={it.id} onClick={() => setPage(it.id)} title={railShown ? undefined : it.label}
                    className={"rail-item w-full flex items-center gap-3 px-4 py-2 text-sm text-left transition " + (active ? "is-on" : "")}>
                    <NavIcon id={it.id} />
                    {railShown && <span className="truncate flex-1">{it.label}</span>}
                    {badge != null && railShown && (
                      <span className="rail-count" title={`${badge} line(s) waiting for approval`}>{badge}</span>
                    )}
                  </button>
                );
              })}
            </div>
          ))}
        </div>
        <div className="border-t border-slate-200 p-2">
          {/* 2026-09-14: the user guide had no way in. It has been served at /help/ since
              10 Sep and nothing in the app linked to it, so the only way to reach it was
              to type the URL. An ANCHOR, not a NAV entry: /help/ is a separate document,
              not a React view, and a new tab keeps the app's state. */}
          <a href={"/help/?role=" + encodeURIComponent((role && role.role) || "")} target="_blank" rel="noopener noreferrer"
             title={railShown ? "Opens in a new tab" : "User guide"}
             className="w-full flex items-center gap-3 px-2 py-1.5 mb-1 text-xs rounded text-slate-500 hover:bg-slate-50 hover:text-[color:var(--navy)] transition">
            <span className="w-4 text-center text-sm leading-none opacity-80">?</span>
            {railShown && <span className="truncate">User guide</span>}
          </a>
          <button onClick={toggleRail} className="w-full text-xs text-slate-400 hover:text-slate-700 py-1" title={railShown ? "Collapse" : "Expand"}>
            {railShown ? "‹ Collapse" : "›"}
          </button>
          {railShown && role && (
            <div className="px-2 pb-1 text-[11px] text-slate-500 truncate" title={who}>
              <span className="font-medium text-slate-700">{teamText(who) || "—"}</span> · {role.ipt ? teamName(role.ipt) : role.label}
            </div>
          )}
        </div>
      </aside>}

      <main className="flex-1 min-h-0 overflow-auto">
        {/* 14 Oct 2026 (D9): on a phone a desk page is this card, never the page itself (its write controls are
            not rendered at all, not disabled) */}
        {phoneDesk && <DeskOnly label={current.label} onHome={() => pickPage("dashboard")} />}
        {page === "dashboard" && <Dashboard meta={meta} phone={narrow} onWall={(on) => { setRailOpen(!on); setWallOn(!!on); }} onOpen={setPage} />}
        {page === "submit" && !narrow && <Matrix meta={meta} who={who} editTarget={editTarget} vehLang={vehLang} access={role} />}
        {page === "forecasts" && !narrow && <Forecasts meta={meta} who={who} access={role} onEdit={editInMatrix} onChanged={refreshPending} />}
        {page === "carbon" && !narrow && <CarbonPage meta={meta} access={role} who={who} />}
        {page === "lookahead" && !narrow && <LookAhead meta={meta} who={who} access={role} />}
        {page === "lookahead" && narrow && <PhoneLookAhead meta={meta} />}
        {/* one mounted instance across the three data pages — see the note at the top */}

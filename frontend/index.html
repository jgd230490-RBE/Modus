<!-- 13 Oct 2026 (W16): the remembered look and accent go on <html> before anything is drawn, so a reload never
     flashes the default colours while Babel compiles the app. The app applies them again (applyTheme / applyAccent). -->
<script>(function(){var d=document.documentElement;try{var t=localStorage.getItem("modus_theme"),a=localStorage.getItem("modus_accent");
d.setAttribute("data-theme",/^(ink|light|dark)$/.test(t||"")?t:"ink");d.setAttribute("data-accent",/^(orange|blue|blue-shades|orange-shades)$/.test(a||"")?a:"orange");}
catch(e){d.setAttribute("data-theme","ink");d.setAttribute("data-accent","orange");}})();</script>

<style>
  :root{
    /* Wayscope theme (29 Sep 2026): ink #1F2024 for the header and headings, blue for
       controls and links, ORANGE AS THE BRAND ACCENT ONLY (the logo and the 2 px rule
       under the header). Amber (--gold) keeps meaning WARNING — unbaked routes, a missing
       diesel index, capacity from 90 %, edited/thaw marks — and is never the brand orange.
       The variable NAMES are kept so nothing else had to change. The brand tokens mirror
       frontend/brand/theme-tokens.css. */
    --navy:#2563EB; --navy-deep:#1F2024; --blue:#3B82F6; --navy-soft:rgba(37,99,235,.08);
    --red:#DC2626; --green:#059669; --gold:#D97706; --grey:#E7E5E4;
    --ink:#1E293B; --muted:#64748B; --line:#E7E5E4; --bg:#FFFFFF;
    --brand-orange:#FF8C14; --brand-orange-from:#FF8312; --brand-orange-to:#FFA10A;
    --brand-orange-text:#C75F06; --brand-gold:#D2931F; --brand-ink:#1F2024; --brand-paper:#FFFFFF;
    /* 5 Oct 2026 — APPEARANCE (the picker at the right of the header, html[data-theme]).
       Three looks share one token set: "ink" (this block — the 29 Sep rebrand, the
       default), "light" (the same with a white header bar) and "dark" (every surface
       dark, orange as the control colour). Components read these tokens; the Tailwind
       colour utilities the app uses are remapped for dark in the DARK-REMAP block below
       (generated from the utilities actually present in this file and asserted in
       test_h1_uk). Exports (XLSX, PDF) are documents and keep the print palette. */
    --surface:#FFFFFF; --surface-2:#FAFAF9; --surface-3:#F3F2EF; --control-fg:#FFFFFF;
    --rail-bg:#FAFAF9; --rail-on:#1F2024; --action:#C2410C; --action-fg:#FFFFFF;
    /* 17 Oct 2026 (UI audit, finding 6): the Confirm week button's own pair, a text-grade green and its text
       colour, so the one irreversible action on the Look-ahead reads 5.48:1 here and 8.47:1 in the dark look
       (white on the --green token was 3.77:1 and 1.92:1). The status WORDS keep the green (open question 2). */
    --ok-btn:#047857; --ok-btn-fg:#FFFFFF;
    /* 17 Oct 2026 (UI audit, finding 6 and the 17 Oct decisions 2 and 3): the status colours as TEXT. The green reads
       3.77:1 on white and the amber 3.19:1, so a status WORD (In force, Delivered %, a chip's word, a variance, a tick)
       reads a text-grade colour instead: ok-text #047857 (5.48:1 on white, 4.77:1 on the 12 % green tint), warn-text
       #B45309 (5.02:1; the same amber text-amber-700 already is) and bad-text #B91C1C (6.47:1; 5.38:1 on the 12 % red
       tint). The green, amber and red status colours stay for fills, dots, bars, borders and the map. In the dark look
       the status colours read well as text (8.47:1 and better on the surface), so the pairs are the same values there. */
    --ok-text:#047857; --warn-text:#B45309; --bad-text:#B91C1C;
    /* 10 Oct 2026 — THE DATA PALETTE (notes/colour-system-1010.md). Colour on a chart does
       one job: slot 1 is always the PLAN (11 Oct: the brand orange, orange-led), slot 2 always
       DELIVERED (blue), slot 4 the fair-price MODEL (violet), slots 3 and 5 further
       categories, in fixed order, never cycled; --chart-none is "not yet". Validated for
       colour-blind separation and 3:1 contrast on white and on the dark surface. Status
       (--green/--gold/--red) is a separate, reserved scale and never a series colour. */
    --chart-1:#E8590C; --chart-1-soft:rgba(232,89,12,.18); --chart-2:#2563EB; --chart-3:#0D9488; --chart-4:#7C3AED; --chart-5:#A07D34; --chart-none:#A8A29E; --chart-grid:rgba(100,116,139,.18);
    --hdr-bg:#1F2024; --hdr-fg:#FFFFFF; --hdr-muted:rgba(255,255,255,.7); --hdr-rule:rgba(255,255,255,.28);
    --hdr-btn:rgba(255,255,255,.10); --hdr-btn-hover:rgba(255,255,255,.20); --hdr-on:rgba(255,255,255,.25); --hdr-border:rgba(255,255,255,.20);
    --hdr-logo:url("/brand/logo-header-on-dark.svg"); --popover-bg:#1F2024; --popover-fg:#E6E7EA; --popover-muted:#9AA1AB; --popover-line:rgba(255,255,255,.12);
    /* 13 Oct 2026 (D45, Option A, chosen by the user): the demo bar is light grey with red caps, a 3 px red rule
       and a red DEMO tag, the same in every look (the dark look keeps the light bar, so it stands out). Red is
       reserved for statuses; this warning about the data is the one exception, and it is always in words.
       Contrast: red text on the grey 5.91:1, white on the tag 6.47:1. The Guide pill is white with a grey ring. */
    --demo-bg:#F1F5F9; --demo-fg:#B91C1C; --demo-rule:#DC2626; --demo-tag-bg:#B91C1C; --demo-tag-fg:#FFFFFF;
    --demo-btn-bg:#FFFFFF; --demo-btn-fg:#1F2024; --demo-btn-hover:#E2E8F0; --demo-btn-ring:#94A3B8;
    color-scheme:light;
  }
  html[data-theme="light"]{
    --hdr-bg:#FFFFFF; --hdr-fg:#1F2024; --hdr-muted:rgba(31,32,36,.65); --hdr-rule:rgba(31,32,36,.22);
    --hdr-btn:rgba(31,32,36,.06); --hdr-btn-hover:rgba(31,32,36,.12); --hdr-on:rgba(255,140,20,.18); --hdr-border:rgba(31,32,36,.2);
    --hdr-logo:url("/brand/logo-header-on-light.svg");
  }
  html[data-theme="dark"]{
    --navy:#FF8C14; --navy-deep:#F3F4F6; --blue:#FFA10A;
    --red:#F87171; --green:#34D399; --gold:#FBBF24; --grey:#33363D;
    --ink:#E6E7EA; --muted:#9AA1AB; --line:#33363D; --bg:#141518;
    --surface:#1F2024; --surface-2:#1B1D21; --surface-3:#26282D; --control-fg:#1F2024;
    --rail-bg:#1B1D21; --rail-on:#F3F4F6; --action:#FF8C14; --action-fg:#1F2024;
    --ok-btn:#34D399; --ok-btn-fg:#1F2024;
    --ok-text:#34D399; --warn-text:#FBBF24; --bad-text:#F87171;
    --chart-1:#E8681E; --chart-1-soft:rgba(232,104,30,.22); --chart-2:#5B8FF0; --chart-3:#13A193; --chart-4:#9572EE; --chart-5:#B48E3E; --chart-none:#6B6965; --chart-grid:rgba(154,161,171,.16);
    --navy-soft:rgba(255,140,20,.14);
    color-scheme:dark;
  }
  /* ACCENTS-START — 13 Oct 2026 (W16, bundle E; D39 and the user's picks the same evening: Orange primary the default,
     the re-stepped shades). The accent is a SECOND axis, html[data-accent], beside html[data-theme]: the look decides
     the surfaces, the accent decides the control colour and the chart series. "orange" is today's look and has no block
     (it IS :root and the dark block above). The status colours (--green --gold --red) are never touched here.
     Every pair is checked in test_h1_uk (text 4.5:1, controls and chart marks 3:1) and the series by the palette check
     in parse_frontend (notes/bundle-e-plan-1013.md): the shade accents carry FOUR hues, the fifth series is grey;
     Orange shades in the Dark look keeps Orange primary's series, because no warm set with two oranges passes there.
     Slot meaning never changes: 1 = plan, 2 = delivered, 4 = the fair-price model. Because the cost chart draws 1
     beside 4, the pair 1–4 is checked as well as the neighbours: so Blue's model is gold (blue beside violet is 0.4 for a
     deuteranope) and Blue shades' is teal, and Blue shades in the Dark look draws Blue's series (no dark blue family
     keeps the plan and the model apart), as Orange shades in Dark draws Orange's. */
  :root:not([data-theme="dark"])[data-accent="blue"]{
    --navy:#2563EB; --navy-soft:rgba(37,99,235,.08); --action:#2563EB; --action-fg:#FFFFFF; --control-fg:#FFFFFF;
    --chart-1:#2563EB; --chart-1-soft:rgba(37,99,235,.18); --chart-2:#E8590C; --chart-3:#0D9488; --chart-4:#A07D34; --chart-5:#7C3AED;
  }
  :root:not([data-theme="dark"])[data-accent="blue-shades"]{
    --navy:#1D4ED8; --navy-soft:rgba(29,78,216,.08); --action:#1D4ED8; --action-fg:#FFFFFF; --control-fg:#FFFFFF;
    --chart-1:#1D4ED8; --chart-1-soft:rgba(29,78,216,.18); --chart-2:#0891B2; --chart-3:#4F46E5; --chart-4:#0D9488; --chart-5:#A8A29E;
  }
  :root:not([data-theme="dark"])[data-accent="orange-shades"]{
    --navy:#C2410C; --navy-soft:rgba(194,65,12,.08); --action:#C2410C; --action-fg:#FFFFFF; --control-fg:#FFFFFF;
    --chart-1:#E8590C; --chart-1-soft:rgba(232,89,12,.18); --chart-2:#9A3412; --chart-3:#A07D34; --chart-4:#BE185D; --chart-5:#A8A29E;
  }
  /* --navy-soft is the tint behind a chip whose text is --navy: 8 % keeps that text at 4.5:1 or better in every accent
     (the chips before 13 Oct sat on a 10 % blue tint, 4.49:1). */
  /* Blue shades in the Ink look: a navy header (white on it 10.4:1). The Light look keeps its white header. */
  html[data-theme="ink"][data-accent="blue-shades"]{ --hdr-bg:#1E3A8A; }
  html[data-theme="dark"][data-accent="blue"],html[data-theme="dark"][data-accent="blue-shades"]{
    --navy:#5B8FF0; --navy-soft:rgba(91,143,240,.08); --blue:#8FB3F5; --action:#5B8FF0; --action-fg:#141518; --control-fg:#141518;
    --chart-1:#5B8FF0; --chart-1-soft:rgba(91,143,240,.22); --chart-2:#E8681E; --chart-3:#13A193; --chart-4:#B48E3E; --chart-5:#9572EE;
  }
  /* the few Tailwind colour utilities that mean "control blue": orange in Orange shades, blue tints in the dark blue accents */
  :root:not([data-theme="dark"])[data-accent="orange-shades"] .bg-blue-50{background-color:#FFF4E6}
  :root:not([data-theme="dark"])[data-accent="orange-shades"] .border-blue-200{border-color:#FED7AA}
  :root:not([data-theme="dark"])[data-accent="orange-shades"] .border-blue-300{border-color:#FDBA74}
  :root:not([data-theme="dark"])[data-accent="orange-shades"] .text-blue-700{color:#9A3412}
  :root:not([data-theme="dark"])[data-accent="orange-shades"] .text-blue-800{color:#7C2D12}
  html[data-theme="dark"][data-accent^="blue"] .bg-blue-50{background-color:rgba(91,143,240,.14)}
  html[data-theme="dark"][data-accent^="blue"] .border-blue-200{border-color:rgba(91,143,240,.35)}
  html[data-theme="dark"][data-accent^="blue"] .border-blue-300{border-color:rgba(91,143,240,.45)}
  html[data-theme="dark"][data-accent^="blue"] .text-blue-700{color:#8FB3F5}
  html[data-theme="dark"][data-accent^="blue"] .text-blue-800{color:#A9C4F7}
  /* ACCENTS-END */
  /* CAPTIONS — 17 Oct 2026 (UI audit, finding 3, the 17 Oct decision 1): every secondary caption in the Ink and Light
     looks reads the muted text colour (#64748B: 4.76:1 on white, 4.56:1 on the rail and on a card's second surface) in
     place of Tailwind's slate-400 (#94A3B8, 2.56:1). One rule, written with :where() so it weighs as little as the utility
     it corrects and the hover utilities (hover:text-slate-700) still win; the dark look is remapped in the block below.
     On a washed surface — a selected row (.bg-blue-50: #EFF6FF, or #FFF4E6 in Orange shades), the Look-ahead's today column
     and the Horizon's commit week (an inline var(--navy-soft) wash, #EEF3FD) and the Account's short rows (an inline 5 % rose
     wash, #FCF5F6) — the muted colour reaches only 4.28–4.43:1, so the greys there step one more to slate-600 (#475569,
     6.8:1 and better). The washes are inline styles (the dark fix chose inline because .tbl th out-ranks a class), so the
     rule matches them the way the dark remap matches a filled control: [style*=]. A var() is kept verbatim in the style
     attribute, but a colour is re-serialised by the browser (rgba(191, 46, 85, 0.05)), so the rose wash is matched both ways. */
  html:where(:not([data-theme="dark"])) .text-slate-400{color:var(--muted)}
  html:where(:not([data-theme="dark"])) :where(.bg-blue-50,[style*="--navy-soft"],[style*="rgba(191, 46, 85"],[style*="rgba(191,46,85"]) .text-slate-400,html:where(:not([data-theme="dark"])) :where(.bg-blue-50,[style*="--navy-soft"],[style*="rgba(191, 46, 85"],[style*="rgba(191,46,85"]) .text-slate-500{color:#475569}
  /* CAPTIONS-END */
  /* DARK-REMAP-START — generated 5 Oct 2026 from the colour utilities in this file; test_h1_uk asserts coverage both ways
     (17 Oct 2026: every utility has a remap, and every remap has a utility — four stale lines went that day) */
  html[data-theme="dark"] .bg-amber-50{background-color:rgba(251,191,36,.12)}
  html[data-theme="dark"] .bg-amber-50\/60{background-color:rgba(251,191,36,.10)}
  html[data-theme="dark"] .bg-blue-50{background-color:rgba(255,140,20,.12)}
  html[data-theme="dark"] .bg-red-50\/70{background-color:rgba(239,68,68,.14)}
  html[data-theme="dark"] .bg-slate-100{background-color:var(--surface-3)}
  html[data-theme="dark"] .bg-slate-50{background-color:var(--surface-2)}
  html[data-theme="dark"] .bg-slate-50\/60{background-color:rgba(27,29,33,.6)}
  html[data-theme="dark"] .bg-slate-50\/70{background-color:rgba(27,29,33,.7)}
  html[data-theme="dark"] .bg-slate-800{background-color:#3A3D45}
  html[data-theme="dark"] .bg-white{background-color:var(--surface)}
  html[data-theme="dark"] .border-amber-200{border-color:rgba(251,191,36,.35)}
  html[data-theme="dark"] .border-amber-300{border-color:rgba(251,191,36,.45)}
  html[data-theme="dark"] .border-blue-200{border-color:rgba(255,140,20,.35)}
  html[data-theme="dark"] .border-blue-300{border-color:rgba(255,140,20,.45)}
  html[data-theme="dark"] .border-red-300{border-color:rgba(248,113,113,.5)}
  html[data-theme="dark"] .border-slate-100{border-color:#2A2D33}
  html[data-theme="dark"] .border-slate-200{border-color:#33363D}
  html[data-theme="dark"] .border-slate-200\/70{border-color:rgba(51,54,61,.7)}
  html[data-theme="dark"] .border-slate-300{border-color:#3D414A}
  html[data-theme="dark"] .border-slate-800{border-color:#3A3D45}
  html[data-theme="dark"] .disabled\:bg-slate-50:disabled{background-color:var(--surface-2)}
  html[data-theme="dark"] .disabled\:text-slate-500:disabled{color:#A9AFB8}
  html[data-theme="dark"] .divide-slate-100{--tw-divide-opacity:1;border-color:#2A2D33}
  html[data-theme="dark"] .divide-slate-200{--tw-divide-opacity:1;border-color:#33363D}
  html[data-theme="dark"] .hover\:bg-red-50:hover{background-color:rgba(239,68,68,.14)}
  html[data-theme="dark"] .hover\:bg-slate-100:hover{background-color:var(--surface-3)}
  html[data-theme="dark"] .hover\:bg-slate-200:hover{background-color:#2F3238}
  html[data-theme="dark"] .hover\:bg-slate-50:hover{background-color:var(--surface-2)}
  html[data-theme="dark"] .hover\:bg-white:hover{background-color:var(--surface)}
  html[data-theme="dark"] .hover\:text-slate-700:hover{color:#E6E7EA}
  html[data-theme="dark"] .text-amber-700{color:#FBBF24}
  html[data-theme="dark"] .text-amber-800{color:#FCD34D}
  html[data-theme="dark"] .text-blue-700{color:#FFB454}
  html[data-theme="dark"] .text-blue-800{color:#FFC77A}
  html[data-theme="dark"] .text-slate-400{color:#9AA1AB}
  html[data-theme="dark"] .text-slate-500{color:#A9AFB8}
  html[data-theme="dark"] .text-slate-600{color:#D5D8DE}
  html[data-theme="dark"] .text-slate-700{color:#E6E7EA}
  html[data-theme="dark"] .text-slate-800{color:#F3F4F6}
  /* 17 Oct 2026 (UI audit, finding 1): a filled control is `text-white` beside an INLINE background var(--navy) or
     var(--blue) (no utility class; the selector above this one since 7 Oct matched nothing). In the dark look that
     fill is orange (white on it 2.33:1), so the text reads the control's own text colour, as .btn-pri does. The
     Confirm week button has its own pair (--ok-btn); the haul / routing zone buttons keep their fixed colours
     (finding 7, open). */
  html[data-theme="dark"] .text-white[style*="var(--navy)"],html[data-theme="dark"] .text-white[style*="var(--blue)"]{color:var(--control-fg)}
  html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{background-color:var(--surface-3);color:var(--ink);border-color:var(--grey)}
  html[data-theme="dark"] input::placeholder,html[data-theme="dark"] textarea::placeholder{color:#6B7280}
  html[data-theme="dark"] .mapboxgl-ctrl-group{background:var(--surface-3)} html[data-theme="dark"] .mapboxgl-ctrl-group button span{filter:invert(1)}
  /* DARK-REMAP-END */
  html,body,#root{height:100%;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .brand-bar{background:var(--hdr-bg);color:var(--hdr-fg);border-bottom:2px solid var(--brand-orange);}
  .brand-lockup{height:38px;width:auto;display:block;content:var(--hdr-logo);}
  .brand-rule{width:1px;height:28px;background:var(--hdr-rule);}
  .hdr-muted{color:var(--hdr-muted);}
  .hdr-btn{background:var(--hdr-btn);color:var(--hdr-fg);} .hdr-btn:hover{background:var(--hdr-btn-hover);}
  .hdr-seg{border:1px solid var(--hdr-border);} .hdr-seg button{color:var(--hdr-muted);} .hdr-seg button:hover{background:var(--hdr-btn);}
  .hdr-seg button.is-on{background:var(--hdr-on);color:var(--hdr-fg);font-weight:600;}
  /* the Appearance picker: a 32 px icon button, a small popover (5 Oct 2026) */
  .appearance{position:relative;display:inline-flex;align-items:center;}
  .appearance-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--hdr-border);background:var(--hdr-btn);color:var(--hdr-fg);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
  .appearance-btn:hover,.appearance-btn[aria-expanded="true"]{background:var(--hdr-btn-hover);}
  .appearance-menu{position:absolute;right:0;top:40px;min-width:200px;background:var(--popover-bg);color:var(--popover-fg);border:1px solid var(--popover-line);border-radius:10px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.45);font-size:12.5px;line-height:1.4;z-index:60;}
  .appearance-menu h6{margin:0;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--popover-muted);padding:6px 10px 4px;font-weight:600;}
  .appearance-item,.accent-item{width:100%;display:flex;align-items:center;gap:10px;padding:7px 10px;border:0;background:transparent;color:var(--popover-fg);border-radius:7px;cursor:pointer;text-align:left;font:inherit;}
  .appearance-item:hover,.accent-item:hover{background:rgba(255,255,255,.06);} .appearance-item.is-on,.accent-item.is-on{background:rgba(255,140,20,.12);}
  .appearance-item .tick,.accent-item .tick{opacity:0;color:var(--brand-orange);} .appearance-item.is-on .tick,.accent-item.is-on .tick{opacity:1;}
  .swatch.accent-sw i{flex:0 0 34%;} .swatch.accent-sw b{flex:1;} .swatch.accent-sw b::after{display:none;}
  .swatch{display:inline-flex;width:34px;height:20px;border-radius:5px;overflow:hidden;border:1px solid rgba(255,255,255,.15);flex:none;}
  .swatch i{display:block;flex:0 0 30%;} .swatch b{display:block;flex:1;position:relative;} .swatch b::after{content:"";position:absolute;right:3px;bottom:3px;width:10px;height:5px;border-radius:2px;background:var(--sw-dot);}
  /* H10 (8 Oct 2026): the in-app guide — a coach-mark card, demo tenant only. In-page, no library. */
  /* 11 Oct 2026 — the guide, options 4 + 1 + 2 (the user): Google-style bubbles, slightly transparent; a light
     one-line strip that offers the tour; small pulsing dots on the features. Nothing pops up uninvited. */
  .guide-ring{position:fixed;z-index:9000;pointer-events:none;border:1.5px solid rgba(26,115,232,.55);border-radius:8px;box-shadow:0 0 0 3px rgba(26,115,232,.10);transition:top .15s,left .15s,width .15s,height .15s}
  .guide-card{position:fixed;z-index:9001;width:min(300px,calc(100vw - 24px));background:rgba(32,33,36,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:rgba(255,255,255,.86);border:0;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.22);padding:11px 13px 8px;font:13px/1.45 Inter,system-ui,sans-serif}

  /* 11 Oct 2026 — the demo bar (the user: "There is a bar with FICTIONAL DEMO SCHEME · NOTHING HERE IS REAL and a

  .demo-bar{position:relative;flex:none;height:26px;display:flex;align-items:center;justify-content:center;padding:0 12px;background:var(--demo-bg);color:var(--demo-fg);border-bottom:3px solid var(--demo-rule);font:700 14px/1 Inter,system-ui,sans-serif;letter-spacing:.06em;overflow:hidden;}

  /* 10 Oct 2026 — the UI pass (ui-review-1009, mockups 2, 4 and 5): tables at 14 px in 40 px
     rows with a caption, a sticky header and the sort shown once; the filter row and its
     applied-filter chips; buttons; status as a word with a dot; the empty-state family;
     skeleton rows while a table loads; the row menu for secondary actions. Tokens only, so the
     three looks need no remap. */
  .tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;font-variant-numeric:tabular-nums;line-height:1.25;}
  .tbl caption{caption-side:top;text-align:left;font-size:14px;color:var(--muted);padding:12px 16px 8px;}

  .tbl.compact th,.tbl.compact td{height:32px;}
  .tbl.tbl-wrap td{white-space:normal;} .tbl.tbl-wrap td.num{white-space:nowrap;}   /* 17 Oct 2026 (UI audit #15): the Carbon planner's two reference tables wrap their words instead of scrolling the Reference column off the screen */

  .fchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--grey);border-radius:999px;padding:3px 8px 3px 12px;font-size:13px;color:var(--ink);}

  .link-btn{background:none;border:0;padding:0;font:inherit;font-size:14px;color:var(--ink);text-decoration:underline;cursor:pointer;}
  .btn-pri{display:inline-block;padding:7px 14px;border-radius:6px;background:var(--action);color:var(--action-fg);font-size:14px;font-weight:600;line-height:1.3;border:0;cursor:pointer;white-space:nowrap;}

  .chip-st i{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;}
  /* 13 Oct 2026 (W16, D39): a status is a SHAPE and a word, never colour alone — the plan orange is 6.5 from the
     warning amber for full colour vision and 1.8 for a colour-blind reader. Green stays a dot; amber is a triangle,
     red a diamond (an octagon was tried: at 9 px it reads as a dot). Matched on the token the dot is painted with, so every chip-st in the app follows. */
  .chip-st i[style*="--gold"]{width:10px;height:9px;border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%);}

  .dash-card-s{font-size:13px;color:var(--muted);line-height:1.3;}
  .dash-more{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 16px;}
  .dash-more>summary{cursor:pointer;list-style:none;padding:12px 0;font-size:14px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px;}
  .dash-more>summary::-webkit-details-marker{display:none;}
  .dash-more>summary::before{content:"›";display:inline-block;width:14px;color:var(--muted);transition:transform .15s;}
  .dash-more[open]>summary::before{transform:rotate(90deg);}
  .dash-more[open]>summary{border-bottom:1px solid var(--line);}
  .dash-more>div{padding-bottom:16px;}
  .dash-more .card.overflow-hidden{border:0;}
  /* 13 Oct 2026 (W5, bundle E) — charts fill every screen. Every chart sits in a .chart-box: relatively positioned and
     used only for the chart (what Chart.js's responsive mode needs), sized by CSS, never by a fixed px prop. Two sizes:
     the default and .is-lg (the two time series a planner reads first). The big screen sizes them larger, and in
     "Rotate" / "One section" the Charts section fills the screen's height (.dash-fill). */
  .chart-box{position:relative;width:100%;min-width:0;height:clamp(200px,28vh,420px);}
  .chart-box.is-lg{height:clamp(220px,32vh,480px);}
  .chart-box>canvas{display:block;}
  .fig-val{font-size:clamp(1.1rem,1.45vw,1.7rem);}   /* a KPI figure: nowrap, never truncated, sized by clamp() */
  .chart-card{display:flex;flex-direction:column;min-width:0;}
  .chart-card>.chart-box{flex:1 1 auto;}
  /* the working view's four charts: one column, then 5 tracks (3 + 2) from 1024 px, then 3 columns from 1600 px with
     the top-routes list running down the right-hand column */
  .dash-charts{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);}
  @media (min-width:1024px){
    .dash-charts{grid-template-columns:repeat(5,minmax(0,1fr));}
    .dash-charts>.c-demand,.dash-charts>.c-cost{grid-column:span 3;} .dash-charts>.c-top,.dash-charts>.c-progress{grid-column:span 2;}
  }
  @media (min-width:1600px){
    .dash-charts{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"demand progress top" "cost cost top";}
    .dash-charts>.c-demand{grid-area:demand;} .dash-charts>.c-progress{grid-area:progress;} .dash-charts>.c-cost{grid-area:cost;}
    .dash-charts>.c-top{grid-area:top;} .dash-charts>.c-top>.chart-box{height:auto;min-height:clamp(200px,28vh,420px);}
  }
  .dash-more-charts{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);}
  @media (min-width:768px){.dash-more-charts{grid-template-columns:repeat(2,minmax(0,1fr));}}
  @media (min-width:1280px){.dash-more-charts{grid-template-columns:repeat(4,minmax(0,1fr));}}
  .dash-wall .chart-box{height:clamp(240px,30vh,560px);}
  .dash-wall .chart-box.is-lg{height:clamp(260px,34vh,620px);}
  /* the big screen, one section at a time: the page is exactly the screen's height and the Charts grid shares it */
  /* 14 Oct 2026 (the user: "the screen still don't fill up on rotate"): EVERY section fills the screen in "Rotate" and
     "One section", not only Charts. The page is the screen's height; the one section on show takes what the header and
     the big-screen bar leave; its content is sized from that height (vh), so a 1080p TV and a 4K one read the same from
     across a site office. "All sections" stays an overview that scrolls. */
  .dash-wall.dash-fill{height:100%;display:flex;flex-direction:column;}
  .dash-wall.dash-fill>[data-wall-section]:not([hidden]){flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
  .dash-wall.dash-fill>[data-wall-section]>*{flex:1 1 auto;min-height:0;}
  .dash-wall.dash-fill .wall-charts{height:100%;grid-auto-rows:minmax(0,1fr);}
  .dash-wall.dash-fill .wall-charts>.chart-card{min-height:0;}
  .dash-wall.dash-fill .wall-charts .chart-box{height:auto;min-height:0;}
  /* the TV type scale (dash-fill): hero figures ~6 % of the screen height, labels ~1.8 %, never under 13 px */
  .dash-wall.dash-fill .fig-val{font-size:clamp(2rem,min(6.4vh,3.3vw),8rem);line-height:1.05;}
  .dash-wall.dash-fill .fig-label{font-size:clamp(13px,1.8vh,30px);margin-top:.35em;}
  .dash-wall.dash-fill .fig-sub{font-size:clamp(12px,1.45vh,24px);}
  .dash-wall.dash-fill .fig-group{font-size:clamp(13px,1.9vh,32px);margin-bottom:.6em;}
  .dash-wall.dash-fill .chart-title{font-size:clamp(15px,1.9vh,32px);}
  .dash-wall.dash-fill .text-xs,.dash-wall.dash-fill table.text-xs{font-size:clamp(13px,1.5vh,26px);}
  /* 2. Figures: the four groups as a 2 × 2 grid of tiles that share the screen; each tile's figures spread over it */
  .dash-wall.dash-fill .wall-figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:clamp(12px,1.6vh,32px);}
  .dash-wall.dash-fill .wall-figs>.card{display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:clamp(14px,2.2vh,40px) clamp(16px,1.6vw,48px);}
  .dash-wall.dash-fill .wall-figs>.card>.grid{flex:1 1 auto;min-height:0;align-content:space-evenly;column-gap:clamp(16px,2vw,64px);}
  /* a group with five figures (Carbon, with the target) takes three columns, so none is cut off */
  .dash-wall.dash-fill .wall-figs>.card>.grid:has(>:nth-child(5)){grid-template-columns:repeat(3,minmax(0,1fr));}
  /* 1. Today: the figures and the day's lines on the left, the map down the whole right-hand column */
  .dash-wall.dash-fill .today-grid{grid-template-rows:minmax(0,1fr);}
  .dash-wall.dash-fill .today-grid>.card{min-height:0;overflow:hidden;}
  .dash-wall.dash-fill .today-lines{max-height:none !important;overflow:hidden;}
  .dash-wall.dash-fill .today-figs{column-gap:clamp(16px,2vw,64px);row-gap:clamp(10px,2vh,40px);}
  .dash-wall.dash-fill .today-figs .fig-val{font-size:clamp(2rem,min(7vh,3vw),8.5rem);}
  .dash-wall.dash-fill .today-map{display:flex;flex-direction:column;}
  /* 4. Stockpiles: the chart takes the card */
  .dash-wall.dash-fill .stock-card{display:flex;flex-direction:column;min-height:0;}
  .dash-wall.dash-fill .stock-body{flex:1 1 auto;min-height:0;grid-template-rows:minmax(0,1fr);}
  .dash-wall.dash-fill .stock-nocap{font-size:clamp(13px,1.6vh,26px);}
  .chart-box.is-fill{height:100%;min-height:0;}
  /* the chart's headline on a filled big screen: the number, what it is, and what it is measured against */
  .chart-head{margin:.1em 0 .5em;line-height:1.15;}
  .chart-head .ch-val{font-weight:700;color:var(--navy-deep);font-size:clamp(1.6rem,min(5.2vh,2.7vw),6.5rem);letter-spacing:-.01em;}
  .chart-head .ch-lbl{font-weight:600;color:var(--muted);font-size:clamp(14px,2vh,34px);margin-left:.45em;}
  .chart-head .ch-note{color:var(--muted);font-size:clamp(13px,1.6vh,28px);margin-top:.2em;}
  /* the rotation: a thin line that fills while a section is on show, and what comes next (no motion if reduced) */
  .dash-rot{position:relative;display:inline-block;width:120px;height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden;vertical-align:middle;}
  .dash-rot>i{position:absolute;inset:0 auto 0 0;width:0;background:var(--action);animation:dash-rot linear forwards;}
  @keyframes dash-rot{from{width:0}to{width:100%}}
  @media (prefers-reduced-motion:reduce){.dash-rot>i{animation:none;width:100%;opacity:.35;}}
  .wall-charts{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);}
  @media (min-width:1024px){.wall-charts{grid-template-columns:repeat(2,minmax(0,1fr));}}   /* 14 Oct: four charts a section, 2 × 2 */
  .dash-filters label{display:block;padding:6px 10px;}
  .dash-filters label span{display:block;font-size:12px;color:var(--popover-muted);margin-bottom:4px;}
  /* 12 Oct 2026 (C4): the Monthly bulletin menu on the Dashboard — the 14 px floor for its words */
  .bulletin-menu label span{font-size:14px;}
  .bulletin-menu .row-menu-list a{display:block;padding:7px 10px;font-size:14px;color:var(--popover-fg);border-radius:6px;text-decoration:underline;}
  .bulletin-menu .row-menu-list a:hover{background:rgba(255,255,255,.06);}
  .bulletin-menu .bm-err{white-space:normal;max-width:260px;font-size:14px;color:#FCA5A5;padding:4px 10px;}
  .dash-filters select{width:100%;font:inherit;font-size:14px;padding:6px 8px;border-radius:6px;border:1px solid var(--popover-line);background:rgba(255,255,255,.06);color:var(--popover-fg);}
  .dash-filters select option{color:#1F2024;}
  .tbl tr.is-picked td{background:var(--chart-1-soft);}
  /* 11 Oct 2026 — the carbon target on the Dashboard, Forecasts and Submit forecast (tokens only, so every look follows) */
  .ct-strip{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;color:var(--ink);}
  .ct-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;}
  .ct-h{font-size:16px;font-weight:600;color:var(--ink);margin:0;}
  .ct-line{font-size:14px;line-height:1.5;color:var(--ink);font-variant-numeric:tabular-nums;}
  .ct-note{font-size:13px;line-height:1.45;color:var(--muted);margin-top:4px;}
  .ct-more{margin-top:6px;font-size:14px;color:var(--ink);}
  .ct-more>summary{cursor:pointer;font-size:14px;font-weight:500;}
  .ct-more ul{margin:4px 0 0 18px;list-style:disc;}
  /* 11 Oct 2026 — the Gate arrivals panel on the Dashboard (tokens only; 14 px table text; the .ct-* family's strip) */
  .ga-strip{margin-top:12px;}
  /* 14 Oct 2026: the gate chart (arrivals against capacity) and its key; the table folds under it */
  .ga-chart{margin-top:10px;}
  .ga-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:4px;}
  .ga-head-v{font-size:18px;font-weight:700;color:var(--ink);}
  .ga-key{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13px;color:var(--muted);}
  .ga-key i{display:inline-block;vertical-align:middle;margin-left:8px;}
  .ga-key i:first-child{margin-left:0;}
  .ga-key-bar{width:16px;height:10px;border-radius:2px;background:var(--chart-1);}
  .ga-key-cap{width:3px;height:14px;background:var(--ink);margin-left:0 !important;}
  .ga-key-track{width:18px;height:12px;border-radius:2px;background:var(--surface-3);box-shadow:inset 0 0 0 1px var(--grey);}
  .ga-key-red{width:16px;height:10px;border-radius:2px;background:var(--red);}
  .ga-key-gold{width:16px;height:10px;border-radius:2px;background:var(--gold);}
  /* 14 Oct 2026 (bundle G, W7): CLP monitoring — two columns from 1280 px, a wide card spans both */
  .clp-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:10px;}
  @media (min-width:1280px){.clp-grid{grid-template-columns:repeat(2,minmax(0,1fr));}.clp-card.clp-wide{grid-column:1 / -1;}}
  .clp-head{font-size:15px;font-weight:600;color:var(--ink);margin:2px 0 6px;}
  .clp-sub{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:2px;}
  .clp-pair{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;}
  @media (min-width:1024px){.clp-pair{grid-template-columns:repeat(2,minmax(0,1fr));}}
  .clp-note{font-size:13px;color:var(--muted);margin-top:6px;}
  .clp-src{font-size:13px;color:var(--muted);margin-top:4px;}
  .clp-how{margin-top:6px;font-size:13px;color:var(--muted);}
  /* 16 Oct 2026 (S7): the Simulation section on the staff Dashboard. Lorries are blue, mixers orange in every accent
     (the dots mean a kind of lorry, not a series), a waiting lorry is the status red with a word on its gate */
  :root{--sim-lorry:#2563EB;--sim-mixer:#E8590C;}
  html[data-theme="dark"]{--sim-lorry:#5B8FF0;--sim-mixer:#E8681E;}
  .sim-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
  .sim-chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;color:var(--muted);background:var(--surface);}
  .sim-chip-staff{color:var(--navy);background:var(--navy-soft);border-color:transparent;font-weight:600;}
  .sim-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:10px;}
  /* 17 Oct 2026 (one screen): from 1024 px the map and its timeline on the left, the clock / Gates now / scenario beside
     them; the map takes what the screen's height leaves for it, so the map, the clock and the queues fit one screen */
  @media (min-width:1024px){.sim-grid{grid-template-columns:minmax(0,1fr) 300px;align-items:start;}
    .sim-main .sim-map{height:clamp(260px,calc(100vh - 420px),680px);}}
  .sim-main{min-width:0;display:flex;flex-direction:column;gap:6px;}
  .sim-main>.sim-map-wrap{align-self:stretch;}   /* the map takes its column's width (a flex column would shrink it to nothing) */
  /* 1024–1279 px: the narrower column wraps the lines above the map, so the map gives back 40 px to keep the queues on screen */
  @media (min-width:1024px) and (max-width:1279px){.sim-main .sim-map{height:clamp(260px,calc(100vh - 460px),680px);}}
  .sim-tl-head{font-size:13px;color:var(--muted);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sim-tl-head b{color:var(--ink);font-weight:600;}
  .sim-fold{margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--surface);}
  .sim-fold>summary{cursor:pointer;padding:10px 0;font-size:15px;font-weight:600;color:var(--ink);}
  .sim-fold[open]>summary{border-bottom:1px solid var(--line);margin-bottom:6px;}
  .sim-fold>.sim-scroll{margin-bottom:12px;}
  /* 17 Oct 2026: the Simulation on the big screen (SimWall): the map large, the clock and Gates now beside it, the queue
     timeline under the map; in Rotate / One section it fills the TV (.dash-fill) */
  .sim-wall{display:grid;gap:clamp(10px,1.4vh,24px);grid-template-columns:minmax(0,1fr) clamp(280px,24vw,640px);grid-template-areas:"map side" "tl side";}
  .sim-wall-main{grid-area:map;min-width:0;min-height:0;}

  .sim-wall-tl{grid-area:tl;min-width:0;}

  .sim-wall-fill .sim-map{height:100%;}
  .sim-wall .sim-legend{font-size:clamp(12px,1.35vh,22px);}

  .sim-wall-sub{font-size:clamp(13px,1.55vh,26px);color:var(--muted);line-height:1.4;}
  .sim-wall-now{font-size:clamp(14px,2vh,34px);color:var(--ink);font-weight:600;}
  .sim-wall-gates{font-size:clamp(13px,1.7vh,28px);}

<script type="text/babel" data-presets="react">
// ---- G2, 16 Sep 2026: the tenant's own words and units ---------------------------
// TENANT mirrors /api/meta's `tenant` block into a module-level object so plain helpers
// can read it, exactly as VEH does for vehicle labels. CUR() is the currency SYMBOL every
// figure is shown with (presentation only — nothing is converted); TEAM() is the word for
// a delivery team. Both read at call time, so a component that renders before /api/meta
// lands shows the defaults and re-renders with the tenant's once App sets meta.
const TENANT = { name: "Wayscope", team_label: "Team", currency: "EUR", symbol: "€", country: null,
                 fuel_index_auto: false, fuel_provider: null, restrictions_provider: false, restrictions: null,
                 distance_unit: "km" };
const CUR = () => TENANT.symbol || "€";
const TEAM = () => TENANT.team_label || "Team";
// H1 (29 Sep 2026): the vehicle names the pickers do not offer this tenant (its country's
// `vehicle_sets[..].hide` — Rigid 7.5t for GB). They stay in `vehicles`, so a
// saved line or a baked route on one still resolves; a picker keeps such a value visible

// ---- 2026-09-02, Task F: access codes are resolved by the SERVER --------------
// The client-side LOGINS dict with plaintext codes in view-source is gone. The code is
// POSTed to /api/auth, which says what it grants (role, IPT scope, can_approve), and is
// then sent on EVERY /api request as the X-Access-Code header — the server filters on
// it. The code lives in sessionStorage for the tab only.
//
// ⚠️ Still not authentication in the Phase 6 sense: a shared code per role, no rate
// limit, no per-person identity beyond the name you type. Do not call this secure.
//
// G3 (14 Oct 2026): people sign in with their own email and password. The session is an HttpOnly cookie the page
// cannot read; it travels with every same-origin call by itself. The code above keeps working only while the
// server still has codes set (the shared codes end on 31 Oct 2026, D49).
const ACCESS = { code: "", info: null };
try { ACCESS.code = sessionStorage.getItem("modus_access_code") || ""; } catch(e){}
// one place adds the headers, so no fetch() call site can forget them. X-Wayscope says the call comes from this app:
// the server refuses a write signed in by the cookie without it (another site cannot add a header).
const _rawFetch = window.fetch.bind(window);
window.fetch = (url, opts) => {
  const u = typeof url === "string" ? url : (url && url.url) || "";
  if(u.startsWith(API)){
    const o = { ...(opts || {}) };
    o.headers = { ...(o.headers || {}), "X-Wayscope": "1", ...(ACCESS.code ? { "X-Access-Code": ACCESS.code } : {}) };
    // a login whose session has ended (signed out elsewhere, disabled, expired): back to the sign-in screen once
    return _rawFetch(url, o).then(r => {
      if(r.status === 401 && ACCESS.info && ACCESS.info.via === "login" && !u.startsWith(API + "/auth/")){
        try { window.dispatchEvent(new Event(SESSION_ENDED)); } catch(e){}
      }
      return r;
    });
  }
  return _rawFetch(url, opts);
};

// browser, and asks the server on load only then (a visitor gets the public map at once, no "Signing you back in").
const AUTH_HINT = "wayscope_signed_in";
function authHint(on){ try { if(on) localStorage.setItem(AUTH_HINT, "1"); else localStorage.removeItem(AUTH_HINT); } catch(e){} }
function hasAuthHint(){ try { return localStorage.getItem(AUTH_HINT) === "1"; } catch(e){ return false; } }
// A link from an email: #invite=…, #reset=… (set a password) or #demo=… (a lead's own link, HU14). Read ONCE, as the
// page loads, and taken off the address at once, so it is not bookmarked, shared in a screenshot or left in history.
// The link is a fragment, never sent to the server by the browser; the page posts it.
const START_LINK = (function(){
  try {
    const m = /^#(invite|reset|demo)=([A-Za-z0-9_-]{20,200})$/.exec(window.location.hash || "");
    if(!m) return null;
    history.replaceState(null, "", window.location.pathname + window.location.search);
    return { purpose: m[1], token: m[2] };
  } catch(e){ return null; }
})();
// POST a JSON body; resolve with the answer, or reject with {status, detail} (the server's own sentence when it sent one)
function postJSON(path, body){
  return fetch(`${API}${path}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) })
    .then(async r => {
      const j = await r.json().catch(() => ({}));
      if(!r.ok) throw { status: r.status, detail: (j && typeof j.detail === "string") ? j.detail : "" };
      return j;
    }, () => { throw { status: 0, detail: "" }; });
}

// Red only when that gap is shorter than the gate's typed check-in; no amber; a gate with no check-in

// totals and no hourly peak, so every figure says "if arrivals are spread evenly". A team code is

// ---- 11 Oct 2026: the carbon target on the Dashboard, Forecasts and Submit forecast ------------
// A planner sets the target on the Carbon planner. Each page reads it with ONE call,
// GET /api/carbon/target (any signed-in code; the progress is worked out on the lines that code
// can see). The SERVER works out every figure AND decides whether each one is on target
// (status.on_target_as_forecast / on_target_with_decisions: within 0.05 tCO2e either way,
// carbon_target.ON_TARGET_TOL_T, the one rule). These helpers only put its answers into words,
// the same words on all four pages (the Carbon page's step 6 uses them too): no margin, no sum.
// The figures are ALL-IN (making the material, transport and waste disposal), so where they sit
// beside the transport-only figures the page says so once. A team code reads "your team's lines"
// in the tenant's own word, never a team id. REVERSED 13 Oct 2026 (the user's 12 Oct decision): a team code
// has its OWN share of the scheme's target — the server's target_t, the target split by each team's plan with
// the agreed decisions (share_pct) — and the server's verdicts on its own lines; nothing is worked out here.
const CT_ALLIN = "All-in: making the material, transport and waste disposal";

// the server's verdict in words: "on target", or the gap's size and its side (its sign); nothing is compared here
function ctGap(on, gap){
  if(on == null || gap == null) return null;
  if(on) return "on target";
  return `${ctT(Math.abs(gap))} tCO2e ${gap > 0 ? "over" : "under"} the target`;
}

  const t = ct.target, s = ct.status, pct = `${(+t.pct_below).toFixed(1)}%`;
  if(ctTeam(ct)){
    const of = t.mode === "cap" ? `the scheme's fixed cap of ${ctT(t.cap_t)} tCO2e` : `the scheme's target (${pct} below the approved plan)`;
    if(s.target_t == null) return `Target: ${t.mode === "cap" ? `a fixed cap of ${ctT(t.cap_t)} tCO2e` : `${pct} below the approved plan`} for the whole scheme; ${ctYour()} have no share of it while the agreed decisions do not fit the plan`;
    return `Target for ${ctYour()}: ${ctT(s.target_t)} tCO2e, ${(+s.share_pct).toFixed(1)}% of ${of}`;
  }
  if(t.mode === "cap") return `Target: a fixed cap of ${ctT(t.cap_t)} tCO2e (${pct} below the approved plan when it was set)`;
  return `Target: ${pct} below the approved plan = ${ctT(s.target_t)} tCO2e`;
}
// as forecast, and with the agreed decisions, each with the server's verdict. When the decisions no longer
// apply, the second is the server's sentence, or (dash: a line with no room for it) "—" and the page prints it below
function ctProgress(ct, dash){
  const s = ct.status, on = ctTeam(ct) ? ` on ${ctYour()}` : "";
  const g1 = ctGap(s.on_target_as_forecast, s.gap_as_forecast_t), g2 = ctGap(s.on_target_with_decisions, s.gap_with_decisions_t);
  return [
    `As forecast${on}: ${ctT(s.approved_t)} tCO2e${g1 ? ", " + g1 : ""}`,
    s.invalid ? (dash ? `With the agreed decisions${on}: —` : s.invalid)
      : `With the agreed decisions${on}: ${ctT(s.with_decisions_t)} tCO2e${g2 ? ", " + g2 : ""}`,
  ];
}
function ctScopeNote(ct){
  if(!ctTeam(ct)) return null;
  return `These figures are for ${ctYour()} only, against their share of the scheme's target: the target split by each ${TEAM().toLowerCase()}'s plan with the agreed decisions. The shares add up to the target.`;
}
// a stamp as the reader's own clock dates it (the server stamps UTC): "12 Oct 2026", the same on every page
function ctWhen(at){
  const d = new Date(at);
  return (!at || isNaN(d.getTime())) ? "" : `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function ctSetBy(t){
  if(!t || !t.updated_by) return null;
  const w = ctWhen(t.updated_at);
  return `Set by ${t.updated_by}${w ? ", " + w : ""}`;
}
// Submit forecast: the target beside the carbon of the cells being typed, with the plan as forecast AND
// with the agreed decisions, in the Dashboard's and Forecasts' own words
function ctCellsTarget(ct){
  if(!ct) return null;
  if(!ctOk(ct)) return `${CT_NONE} ${CT_WHO}`;
  const [p1, p2] = ctProgress(ct, true);
  return `${ctTargetLine(ct)} · ${p1} · ${p2}`;
}
// the big screen's Carbon group: one more figure in the group's own pattern. REVERSED 13 Oct 2026: a team code
// shows its own share of the target with its verdicts; "—" only while it has no share (decisions that do not fit).
function ctFig(ct, err){
  if(!ct) return { value: "—", sub: err ? "did not load" : "loading", title: err ? "The carbon target did not load." : "Loading the carbon target." };
  if(!ctOk(ct)) return { value: "—", sub: "none set yet", title: `${CT_NONE} ${CT_WHO}` };
  const t = ct.target, s = ct.status, team = ctTeam(ct);
  const how = t.mode === "cap" ? "fixed cap" : `${(+t.pct_below).toFixed(1)}% below the approved plan`;
  const v = s.target_t;
  const g1 = ctGap(s.on_target_as_forecast, s.gap_as_forecast_t), g2 = ctGap(s.on_target_with_decisions, s.gap_with_decisions_t);
  const sub = team && v == null ? `whole scheme: ${how}; no share while the agreed decisions do not fit the plan`
    : `${team ? `your share (${(+s.share_pct).toFixed(1)}%) of the scheme's ${how}` : how} · as forecast: ${g1} · ${s.invalid ? "the agreed decisions no longer fit the plan" : "with the agreed decisions: " + g2}`;
  const words = [ctTargetLine(ct), ...ctProgress(ct), ctScopeNote(ct), CT_ALLIN + ". The other carbon figures here are transport only"];
  return { value: v == null ? "—" : (Math.abs(v) >= 1e4 ? bigNum(v) : ctT(v)), sub, title: words.filter(Boolean).map(w => w.replace(/\.$/, "")).join(". ") + "." };
}

// The Dashboard's strip under the six cards. Nothing while the read is on its way.

// The Forecasts page's line under its header: what the approved plan comes to, and what the

    const routeRows = Object.values(rAgg).map(a => ({

      plannedU: per(a.planned, a.t, a.trips, a.bkm), fairU: per(a.fair, a.t, a.trips, a.bkm),
      fairPerT: (a.fair != null && a.t > 0) ? a.fair / a.t : null, flags: [...a.flags],
      deliveredPct: (a.actualT != null && a.t > 0) ? a.actualT * 100 / a.t : null,
    }));
    let peakIdx = 0; for(let i = 1; i < n; i++) if(tonnesM[i] > tonnesM[peakIdx]) peakIdx = i;
    let fleetIdx = 0; for(let i = 1; i < n; i++) if(vehM[i] > vehM[fleetIdx]) fleetIdx = i;
    return {
      lo, hi, labels, mats, demand, tripsM, co2M, tonnesM, plannedM, fairM, vehM, actualM, split, routeRows,
      kpis: { totT: T.t, totTrips: T.trips, totKm: T.km, totCo2: T.co2, totTkm: T.tkm,

              peakFleet: vehM.some(x => x > 0) ? vehM[fleetIdx] : 0, peakFleetMonth: vehM.some(x => x > 0) ? labels[fleetIdx] : "—",
              planned: per(T.plannedN ? T.planned : null, T.plannedT, T.plannedTrips, T.plannedKm), plannedN: T.plannedN, targetN: T.targetN,

      lines: narrowed.length, baked: T.baked, unbakedRoutes: routeRows.filter(r => !r.baked).length,

  }, [data, status, material, vehicle, ipt, discipline, fromM, toM, unit, factors, months, lineKey]);

  if(err) return <div className="p-8 text-center text-slate-500">Couldn't load the forecast figures.</div>;
  if(!data || !D) return <div className="p-8 text-center text-slate-400">Loading dashboard…</div>;

  const sortedRoutes = [...D.routeRows].sort((a, b) => {
    const dir = sortDir === "asc" ? 1 : -1;
    const av = a[sortKey], bv = b[sortKey];

  const setSort = (k) => { if(sortKey === k) setSortDir(d => d === "asc" ? "desc" : "asc"); else { setSortKey(k); setSortDir("desc"); } };

  // 13 Oct 2026 (W6): the switch picks the quantity column; the Sort by list keeps every old header's sort

  // 14 Oct 2026: on the big screen the chart text follows the screen's height (13 px at 1080p … 29 px on a 4K TV at

  const fill = wall && wallLayout !== "all";

  const C1 = tok("--chart-1", "#E8590C"), C1S = tok("--chart-1-soft", "rgba(232,89,12,.18)"), C2 = tok("--chart-2", "#2563EB"), C4 = tok("--chart-4", "#7C3AED");

  // 13 Oct 2026 (W16): a 2 px gap in the surface colour between stacked segments (every accent), and the series named

  const demandCfg = { type: "bar", data: { labels: D.labels, datasets: D.mats.map((m, i) => ({ label: m, data: D.demand[m], backgroundColor: colorOf(i), stack: "s", borderWidth: { top: 2 }, borderColor: SURF, borderSkipped: "start" })) },
                      options: { ...stackedOpts, plugins: { ...stackedOpts.plugins, ...named } } };
  // planned tonnes as bars, what has been reported delivered as a line over them
  const tripsCfg  = { type: "bar", data: { labels: D.labels, datasets: [{ label: "Trips", data: D.tripsM, backgroundColor: C1, borderWidth: 0 }] }, options: { ...commonOpts, ...barScales } };

  const fleetCfg  = { type: "bar", data: { labels: D.labels, datasets: [{ label: "Vehicles", data: D.vehM, backgroundColor: C1, borderWidth: 0 }] }, options: { ...commonOpts, ...barScales } };

  const Card = ({ label, value, sub, info, tone }) => (

  const applied = [

  ].filter(Boolean);
  const clearOne = (k) => ({ status: () => setStatus("Approved"), ipt: () => setIpt("All"), discipline: () => setDiscipline("All"), unit: () => setUnit("t"),

  const clearAll = () => { setStatus("Approved"); setIpt("All"); setDiscipline("All"); setUnit("t"); setMaterial("All"); setVehicle("All"); setLineKey(null); };

  return (
    // 13 Oct 2026 (W5): the working view is up to 1680 px wide (it was 1280, max-w-7xl), so a 1920 px screen uses its
    // width; the big screen in "Rotate" / "One section" on the Charts section fills the screen's height (.dash-fill).
    <div className={"mx-auto p-5 space-y-5 " + (wall ? "dash-wall max-w-none" + (fill ? " dash-fill" : "") : "max-w-[1680px]")}>
      {/* 13 Oct 2026 (W3): the date range is shown ONCE, in the kicker; the scope is shown by the filter
          chips under the header (the old subtitle repeated both) */}
      {/* 14 Oct 2026: on a filled big screen the page header folds into the big-screen bar (range, updated, clock,

      {!fill && <PageHeader title="Dashboard" kicker={`${rangeLabel} · ${status === "All" ? "all forecasts" : status.toLowerCase()}`}
        actions={<div className="flex flex-wrap gap-2 items-center">
          {!wall && <>
            <select className={sel} value={fromM} onChange={e => setFromM(+e.target.value)} aria-label="From month">{Array.from({ length: months.count }, (_, i) => i + 1).map(i => <option key={i} value={i}>{monthLabelAbs(i, months.start_year)}</option>)}</select>
            <span className="self-center text-slate-400 text-sm">→</span>
            <select className={sel} value={toM} onChange={e => setToM(+e.target.value)} aria-label="To month">{Array.from({ length: months.count }, (_, i) => i + 1).map(i => <option key={i} value={i}>{monthLabelAbs(i, months.start_year)}</option>)}</select>
            {/* 17 Oct 2026 (D114): one click between this month ± 6 (the default) and the whole programme */}
            {(Math.min(fromM, toM) === 1 && Math.max(fromM, toM) === months.count)
              ? <button type="button" className="btn-sec dash-range-btn" style={{ width: "auto", height: "auto", padding: "7px 12px", fontWeight: 500 }}

                  title="Show this month and six months either side">This month ± 6</button>
              : <button type="button" className="btn-sec dash-range-btn" style={{ width: "auto", height: "auto", padding: "7px 12px", fontWeight: 500 }}

            <details className="row-menu">

                <label><span>Vehicle</span><select value={vehicle} onChange={e => setVehicle(e.target.value)}><option>All</option>{vehicles.filter(v => vehShown(v, vehicle)).map(v => <option key={v} value={v}>{vehLabel(v)}</option>)}</select></label>
              </div>
            </details>
            <BulletinMenu months={months} />
          </>}
          {/* 14 Oct 2026 (D9): no big screen from a phone (a site-office TV is not a phone) */}
          {!phone && <button type="button" data-guide="dash-wall" onClick={toggleWall} className={wall ? "btn-sec" : "btn-pri"}
                  title={wall ? "Back to the working view (Esc)" : "Fullscreen, larger type, filters and the table hidden, refreshed every 5 minutes"}>{wall ? "Exit big screen" : "Big screen"}</button>}
        </div>}>
        {/* coverage: what the totals include and exclude — the old amber box, moved to where the numbers are read */}
        <div className="text-xs text-slate-500 mt-2 flex flex-wrap gap-x-3 gap-y-1">
          <span><strong className="tabular-nums">{D.baked}</strong> of <strong className="tabular-nums">{D.lines}</strong> forecast months have a route{D.lines > D.baked ? <span className="text-amber-700"> · {DU()}, CO₂e and fair {CUR()} leave out the {D.lines - D.baked} not routed yet ({D.unbakedRoutes} route{D.unbakedRoutes === 1 ? "" : "s"}): route them on Data → Routes</span> : null}<InfoTip id="dash.coverage" /></span>
          <span>· diesel<InfoTip id="dash.diesel" /> {cost.index_eur_per_l != null ? <strong>{CUR()}{(+cost.index_eur_per_l).toFixed(3)}/L</strong> : <span className="text-amber-700">index unavailable — no fair price</span>}{cost.index_bulletin_date ? ` (${cost.index_source === "manual" ? "typed" : "published"} ${longDate(String(cost.index_bulletin_date).slice(0, 10))})` : ""}</span>

      {wall && <div className="dash-wallbar">

          <Fig value={K.planned ? `${CUR()} ` + eurK(K.planned.eur) : "—"} label={`planned ${CUR()}`} sub={K.planned ? `${K.plannedN} of ${D.lines} priced${K.targetN ? ` · ${K.targetN} at target` : ""}` : "no rate typed, no target set"} tone="var(--navy)"
               info={{ id: "dash.planned", value: K.planned ? [`${CUR()} ${grp(K.planned.eur)} = ${unitTriple(K.planned)}`, K.targetN ? `${K.targetN} forecast month${K.targetN === 1 ? "" : "s"} at the target rate` : ""] : "No route in view has rates typed, and no target rate is set on Config → Costing." }} />
          <Fig value={K.fair ? `${CUR()} ` + eurK(K.fair.eur) : "—"} label={`fair ${CUR()} (model)`} sub={K.fair ? `${K.fairN} of ${D.lines} lines${plannedVsFair != null ? ` · planned ${plannedVsFair >= 0 ? "+" : ""}${plannedVsFair.toFixed(0)} % vs fair` : ""}` : (cost.index_eur_per_l == null ? "no diesel index" : "no routed lines")} tone="var(--navy)"
               info={{ id: "dash.fair", value: K.fair ? [`${CUR()} ${grp(K.fair.eur)} = ${unitTriple(K.fair)}`, `Winter months add ${(((factors || {}).fair_price || {}).winter_consumption_uplift_pct) ?? 8} % fuel.`] : (cost.index_eur_per_l == null ? "No diesel price: set one on Config → Costing · fuel." : "No line in view has a route worked out for its vehicle.") }} />
          <Fig value={K.fair && K.fair.per_t != null ? `${CUR()} ` + (+K.fair.per_t).toFixed(2) : "—"} label={`fair ${CUR()} / t`} sub={K.planned && K.planned.per_t != null ? `planned ${CUR()} ${(+K.planned.per_t).toFixed(2)} / t` : "weighted over priced tonnes"}
               info={{ id: "dash.fair_per_t", value: K.fair && K.fair.per_t != null ? [`${CUR()} ${(+K.fair.per_t).toFixed(2)} per tonne = ${CUR()} ${grp(K.fair.eur)} ÷ ${grp(K.fairT || K.totT)} t`, K.planned && K.planned.per_t != null ? `Planned: ${CUR()} ${(+K.planned.per_t).toFixed(2)} per tonne, worked out the same way` : ""] : "No line the model can price yet." }} />
          <Fig value={K.fair && K.fair.per_km != null ? `${CUR()} ` + (+distRate(K.fair.per_km)).toFixed(2) : "—"} label={`fair ${CUR()} / ${DU()}`} sub={K.fair && K.fair.per_trip != null ? `${CUR()} ${grp(K.fair.per_trip)} / trip` : `on the route basis ${DU()}`}
               info={{ id: "dash.fair_per_dist", value: K.fair && K.fair.per_km != null ? [`${CUR()} ${(+distRate(K.fair.per_km)).toFixed(2)} per ${DU()}, ${CUR()} ${grp(K.fair.per_trip)} per loaded trip`, K.planned && K.planned.per_km != null ? `Planned: ${CUR()} ${(+distRate(K.planned.per_km)).toFixed(2)} per ${DU()}, ${CUR()} ${grp(K.planned.per_trip)} per trip` : ""] : "No line the model can price yet." }} />
        </Group>
        <Group title="Carbon" tone="var(--ok-text)">
          <Fig value={K.totCo2 >= 1e4 ? bigNum(K.totCo2) : K.totCo2.toFixed(1)} label="tCO₂e" sub="routed lines" tone="var(--ok-text)" info={{ id: "dash.carbon", label: "tCO₂e", value: `Exactly ${grp(K.totCo2, 1)} t CO₂e` }} />
          <Fig value={K.intensity == null ? "—" : K.intensity.toFixed(1)} label="kg / tonne" sub="over routed tonnes" info={{ id: "dash.intensity", value: K.intensity == null ? "Needs a routed line." : `${K.intensity.toFixed(2)} kg CO₂e per tonne` }} />
          <Fig value={bigNum(dist(K.totTkm))} label={TKM()} sub="route basis" info={{ id: "dash.tkm", value: `Exactly ${grp(dist(K.totTkm))} ${DU() === "mi" ? "tonne-miles" : "tonne-kilometres"}` }} />
          <Fig value={K.peakMonth} label="peak month" sub={K.peakMonthT ? `${bigNum(K.peakMonthT)} t` : "by tonnage"} info={{ id: "dash.peak_month", value: K.peakMonthT ? `${K.peakMonth}: ${grp(K.peakMonthT)} t planned` : "" }} />
          <Fig value={ctW.value} label="tCO2e target, all-in" sub={ctW.sub} info={{ id: "dash.target", value: ctW.title }} />
        </Group>
      </div>
      </WallSection>

      <WallSection show={sectionShown(2)} divider={wall && wallLayout === "all"} title={DASH_SECTIONS[2].title}>
      <div className="wall-charts">
        <div className="card p-4 chart-card c-demand">
          <div className="text-sm font-semibold text-slate-700 mb-1 chart-title">Material demand over time <span className="text-slate-400 font-normal">({unitLabel})</span><InfoTip id="dash.chart.demand" /></div>
          {fill && <ChartHead value={`${bigNum(K.totT)} t`} label="planned in view" note={K.peakMonthT ? `the busiest month is ${K.peakMonth}, ${bigNum(K.peakMonthT)} t` : null} />}
          <ChartCanvas config={demandCfg} size="lg" />
        </div>
        <div className="card p-4 chart-card">
          <div className="text-sm font-semibold text-slate-700 mb-1 chart-title">Delivered against plan <span className="text-slate-400 font-normal">(t · reported actuals)</span><InfoTip id="dash.chart.progress" /></div>
          {fill && <ChartHead value={K.deliveredPct == null ? "—" : `${K.deliveredPct.toFixed(0)} %`} label="of the plan delivered" tone="var(--chart-2)" note={K.actualT == null ? "nothing reported yet" : `${bigNum(K.actualT)} t reported of ${bigNum(K.totT)} t planned`} />}
          <ChartCanvas config={progressCfg} size="lg" />
        </div>
        <div className="card p-4 chart-card">
          <div className="text-sm font-semibold text-slate-700 mb-1 chart-title">Cost over time <span className="text-slate-400 font-normal">({CUR()} · planned vs fair)</span><InfoTip id="dash.chart.cost" /></div>
          {fill && <ChartHead value={plannedVsFair == null ? (K.planned ? `${CUR()} ${eurK(K.planned.eur)}` : "—") : `${Math.abs(plannedVsFair).toFixed(0)} % ${plannedVsFair < 0 ? "below" : "above"}`} label={plannedVsFair == null ? "planned" : "the fair-price model"} note={K.planned && K.fair ? `planned ${CUR()} ${eurK(K.planned.eur)} · the model ${CUR()} ${eurK(K.fair.eur)}` : "no planned or fair price to compare yet"} />}
          <ChartCanvas config={costCfg} />
        </div>
        <div className="card p-4 chart-card">
          <div className="text-sm font-semibold text-slate-700 mb-1 chart-title">Top routes by tonnage {!wall && <span className="text-slate-400 font-normal">· click a bar to focus</span>}<InfoTip id="dash.chart.top" /></div>
          {fill && <ChartHead value={topN[0] ? topN[0].route_id : "—"} label="carries the most" note={topN[0] && K.totT ? `${bigNum(topN[0].t)} t, ${(topN[0].t * 100 / K.totT).toFixed(0)} % of the tonnes in view` : null} />}
          <ChartCanvas config={topCfg} />
        </div>
      </div>
      </WallSection>

      <WallSection show={sectionShown(3)} divider={wall && wallLayout === "all"} title={DASH_SECTIONS[3].title}>
        <DashboardStockChart meta={meta} weekNow={week && week.today_week} wall={wall} fill={fill} tick={tick} />
      </WallSection>

      <WallSection show={sectionShown(4)} divider={wall && wallLayout === "all"} title={DASH_SECTIONS[4].title}>
      <div className="wall-charts">
        <div className="card p-4 chart-card">
          <div className="text-sm font-semibold text-slate-700 mb-1 chart-title">Trips over time<InfoTip id="dash.chart.trips" /></div>
          {fill && <ChartHead value={bigNum(K.totTrips)} label="loaded trips" note={`about ${grp(Math.round(K.totTrips / nMonths))} a month`} />}
          <ChartCanvas config={tripsCfg} />
        </div>
        <div className="card p-4 chart-card">
          <div className="text-sm font-semibold text-slate-700 mb-1 chart-title">Vehicles needed over time <span className="text-slate-400 font-normal">(routed lines)</span><InfoTip id="dash.chart.fleet" /></div>
          {fill && <ChartHead value={K.peakFleet ? grp(K.peakFleet) : "—"} label="vehicles at the peak" note={K.peakFleet ? `in ${K.peakFleetMonth}` : "needs the routes worked out"} />}
          <ChartCanvas config={fleetCfg} />
        </div>
        <div className="card p-4 chart-card">
          <div className="text-sm font-semibold text-slate-700 mb-1 chart-title">Carbon over time <span className="text-slate-400 font-normal">(tCO₂e)</span><InfoTip id="dash.chart.co2" /></div>
          {fill && <ChartHead value={`${K.totCo2 >= 1e4 ? bigNum(K.totCo2) : K.totCo2.toFixed(0)} t`} label="CO₂e" note={K.intensity == null ? null : `${K.intensity.toFixed(1)} kg for each tonne moved`} />}
          <ChartCanvas config={co2Cfg} />
        </div>
        <div className="card p-4 chart-card">
          <div className="text-sm font-semibold text-slate-700 mb-1 chart-title">Material split <span className="text-slate-400 font-normal">({unitLabel})</span><InfoTip id="dash.chart.split" /></div>
          {fill && <ChartHead value={splitTop ? `${splitTop.pct.toFixed(0)} %` : "—"} label={splitTop ? splitTop.m : ""} note="of the tonnes in view" />}
          <ChartCanvas config={splitCfg} />
        </div>
      </div>
      </WallSection>

      {/* 17 Oct 2026: the Simulation on the big screen — the month's day played once a pass; no scenario, no table */}
      <WallSection show={sectionShown(5)} divider={wall && wallLayout === "all"} title={DASH_SECTIONS[5].title}>
        <SimWall meta={meta} month={simMonth} show={wall && sectionShown(5)} pass={simPass} loop={wallLayout !== "rotate"} fill={fill} tick={tick} />
      </WallSection>
        </>
      )}


      {/* 13 Oct 2026 (W3): the method paragraph moved to the cards' info boxes and the technical guide (T1, T3) */}
      {!wall && <p className="text-xs text-slate-400 px-1">Planning estimates and typed actuals — no live tracking. Each figure's <span aria-hidden="true">ⓘ</span> says how it is worked out; the formulas are in the <a href={TECH_URL("t1-figures")} target="_blank" rel="noopener noreferrer" className="underline">technical guide</a>.</p>}
    </div>
  );
}

// ---- 11 Sep: TODAY on the Dashboard ---------------------------------------------------
// What moves today, this week to date, last week's account, and a small map of this
// week's lines — from ONE read of /api/lookahead (bucket=commit, the week that holds
// today; Tark Tee off). Nothing is derived here: the days carry the server's tonnes,
// trips and vehicles; the account carries its own totals. Cost stays off the map (the
// map's hover shows quantity and trips only, as on the Look-ahead).
function DashboardToday({ meta, week, err, wall, fill }){
  const [todayOpen, todayToggle] = useRowOpen("today");    // 13 Oct 2026 (W6): the rows' hover title moved into details
  const lines = (week && week.commit && week.commit.lines) || [];
  const today = (week && week.today) || new Date().toISOString().slice(0, 10);
  const acct = (week && week.account) || null;
  const T = useMemo(() => {
    const out = { rows: [], t: 0, trips: 0, veh: 0, km: 0, lines: 0, confirmed: 0, reported: 0, actualT: 0,
                  wkPlanT: 0, wkToDateT: 0, wkToDateActT: 0, wkToDateReported: 0, wkToDateDays: 0, wkTrips: 0 };
    lines.forEach(l => {
      const ctx = l.context || {};
      const wd = l.week_derived || {};
      out.wkPlanT += wd.tonnes || 0; out.wkTrips += wd.trips || 0;
      (l.days || []).forEach(d => {
        const dv = d.derived || {};
        if(d.day_date <= today && (d.planned_qty || 0) > 0){
          out.wkToDateT += dv.tonnes || 0; out.wkToDateDays += 1;
          if(d.actual_qty != null){ out.wkToDateReported += 1; out.wkToDateActT += (dv.tonnes || 0) * (d.planned_qty > 0 ? d.actual_qty / d.planned_qty : 0); }
        }
        if(d.day_date !== today || !((d.planned_qty || 0) > 0 || d.actual_qty != null)) return;
        out.rows.push({ key: `${l.route_id}|${l.discipline || ""}|${l.section_id || ""}`, route_id: l.route_id, discipline: l.discipline, ipt: ctx.ipt || l.ipt,
                        origin: ctx.origin_name, dest: ctx.dest_name, material: l.material_type, vehicle: ctx.vehicle_short || vehShort(l.vehicle_type), vehicle_full: vehLabel(ctx.vehicle_type || l.vehicle_type),
                        qty: d.planned_qty, unit: l.unit, tonnes: dv.tonnes, trips: dv.trips, vehicles: dv.vehicles, km: dv.km_day,
                        status: d.status, actual: d.actual_qty, baked: !!ctx.baked, flags: ctx.flags || [] });
        out.t += dv.tonnes || 0; out.trips += dv.trips || 0; out.veh += dv.vehicles || 0; out.km += dv.km_day || 0; out.lines += 1;
        if(d.status === "confirmed") out.confirmed += 1;
        if(d.actual_qty != null) out.reported += 1;
      });
    });
    out.rows.sort((a, b) => (b.tonnes || 0) - (a.tonnes || 0));
    return out;
  }, [lines, today]);
  const cw = (week && week.commit_week) || {};
  const dayName = (iso) => { const d = new Date(iso + "T00:00:00"); return ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][d.getDay()]; };
  // 13 Oct 2026 (W3): an info box, not a hover tooltip (see Fig)
  const Big = ({ value, label, sub, info, tone }) => (
    <div className="min-w-0">
      <div className={"kpi-num font-bold whitespace-nowrap" + (fill ? " fig-val" : "")} style={{ color: tone || "var(--navy-deep)", fontSize: fill ? undefined : wall ? "clamp(1.6rem, 2.4vw, 3rem)" : "clamp(1.3rem, 1.8vw, 2rem)", lineHeight: 1.1 }}>{value}</div>
      <div className="text-xs font-semibold uppercase tracking-wide text-slate-500 mt-0.5 fig-label">{label}{info && <InfoTip id={info.id} value={info.value} />}</div>
      {sub && <div className="text-xs text-slate-500 fig-sub">{sub}</div>}
    </div>
  );
  const Bar = ({ pct, tone }) => (
    <div className="h-2 rounded-full bg-slate-100 overflow-hidden mt-1.5"><div className="h-2 rounded-full" style={{ width: `${Math.max(0, Math.min(100, pct || 0))}%`, background: tone || "var(--green)" }} /></div>
  );
  const acctReportedPlanT = acct ? (acct.rows || []).filter(r => r.actual_qty != null).reduce((s, r) => s + (r.planned_t || 0), 0) : 0;
  const acctPct = acct && acct.reported > 0 && acctReportedPlanT > 0 ? acct.actual_t * 100 / acctReportedPlanT : null;
  const wkPct = T.wkToDateT > 0 && T.wkToDateReported > 0 ? T.wkToDateActT * 100 / T.wkToDateT : null;
  // 13 Oct 2026 (W6): one status a row, a word and an icon; what each word means is in the row's details
  const todayStatus = (s, actual) => actual != null ? { word: "reported", tone: "ok", say: "An actual has been typed for today" }
    : s === "confirmed" ? { word: "confirmed", tone: "ok", say: "Confirmed on the Look-ahead" }
    : s === "edited" ? { word: "edited", tone: "warn", say: "Edited on the Look-ahead, not yet confirmed" }
    : { word: "planned", tone: "none", say: "Derived from the week, not yet confirmed on the Look-ahead" };
  return (
    <div className="grid lg:grid-cols-5 gap-3 today-grid">
      <div className="card p-4 lg:col-span-2 flex flex-col">
        <div className="flex items-baseline justify-between gap-2 flex-wrap">
          <div className="text-xs font-semibold uppercase tracking-wide fig-group" style={{ color: "var(--navy)" }}>Today · {dayName(today)} {longDate(today)}<InfoTip id="dash.today" /></div>
          <div className="text-xs text-slate-500">{cw.from ? `week ${cw.week_index} · ${longDate(cw.from)} – ${longDate(cw.to)}` : ""}</div>
        </div>
        {err && <div className="text-xs mt-2" style={{ color: "var(--red)" }}>{err}</div>}
        {!week && !err && <div className="text-sm text-slate-400 mt-3">Loading this week…</div>}
        {week && <>
          <div className={"grid grid-cols-2 gap-x-4 gap-y-3 mt-3" + (fill ? " today-figs" : " xl:grid-cols-4")}>
            <Big value={T.lines ? bigNum(T.t) : "—"} label="tonnes" sub={T.lines ? `today · ${T.lines} line${T.lines === 1 ? "" : "s"} · ${T.confirmed} confirmed` : (lines.length ? "nothing planned today" : "no lines this week")}
                 info={{ id: "dash.today_t", value: T.lines ? `${grp(T.t)} t planned for today across ${T.lines} line${T.lines === 1 ? "" : "s"}` : "No line has a planned quantity on today's date in the commit week." }} />
            <Big value={T.lines ? grp(T.trips) : "—"} label="trips" sub={T.lines ? `today · ${grp(dist(T.km))} ${DU()}` : "—"} info={{ id: "dash.today_trips", value: T.lines ? `${grp(T.trips)} loaded trips, ${grp(dist(T.km))} lorry-${DU()}` : "" }} />
            <Big value={T.lines ? grp(T.veh) : "—"} label="vehicles" sub={T.lines ? "on the road today" : "—"} tone="var(--navy)" info={{ id: "dash.today_veh", value: T.lines ? `${grp(T.veh)} vehicles needed today` : "" }} />
            <Big value={T.lines ? `${T.reported} / ${T.lines}` : "—"} label="reported" sub="day actuals typed today" info={{ id: "dash.today_reported" }} />
          </div>
          <div className="mt-4 grid sm:grid-cols-2 gap-x-6 gap-y-3 text-xs text-slate-600">
            <div>
              <div className="flex justify-between"><span className="font-semibold text-slate-700">This week to date<InfoTip id="dash.week_to_date" value={wkPct != null ? `${grp(T.wkToDateActT)} t reported against ${grp(T.wkToDateT)} t planned on the ${T.wkToDateReported} reported line-days up to today` : ""} /></span><span className="tabular-nums">{wkPct != null ? `${wkPct.toFixed(0)} % of plan` : `${bigNum(T.wkToDateT)} t planned`}</span></div>
              <Bar pct={wkPct != null ? wkPct : 0} />
              <div className="text-xs text-slate-500 mt-1">{bigNum(T.wkPlanT)} t · {grp(T.wkTrips)} trips planned this week{T.wkToDateReported ? ` · ${T.wkToDateReported} of ${T.wkToDateDays} line-days reported` : " · no day actuals yet"}</div>
            </div>
            <div>
              <div className="flex justify-between"><span className="font-semibold text-slate-700">Last week{acct && acct.week ? ` · W${acct.week.week_index}` : ""}<InfoTip id="dash.last_week" value={acct && acct.week ? (acct.reported ? [`${grp(acct.actual_t)} t reported against ${grp(acctReportedPlanT)} t planned on the ${acct.reported} reported lines`, `${acct.delivered} of ${acct.lines} held (≥ ${Math.round((acct.hold_band || 0.98) * 100)} %)`] : "Nothing reported for last week yet: type actuals on Look-ahead → Account.") : "No account week yet."} /></span><span className="tabular-nums">{acctPct != null ? `${acctPct.toFixed(0)} % of plan` : (acct && acct.week ? "not reported" : "—")}</span></div>
              <Bar pct={acctPct != null ? acctPct : 0} tone="var(--navy)" />
              <div className="text-xs text-slate-500 mt-1">{acct && acct.week ? `${acct.reported} of ${acct.lines} lines reported · ${acct.delivered} held to plan${acct.shortfall ? ` · ${grp(acct.shortfall)} short` : ""}` : "—"}</div>
            </div>
          </div>
          {/* 14 Oct 2026: on a filled big screen the list takes the rest of the card (busiest first; what does not fit
              is left off, never scrolled on a TV) */}
          <div className="mt-3 flex-1 overflow-auto rd-scroll today-lines" style={{ maxHeight: wall ? 260 : 190 }}>
            {T.rows.length === 0 ? <div className="text-xs text-slate-400 py-2">{lines.length ? "No deliveries planned for today." : "No confirmed lines in this week's Look-ahead."}</div> : (
            <table className="w-full text-xs rd-table rd-mini" data-rd-table="today">
              <thead className="text-slate-400"><tr><th className="text-left font-semibold py-1">Line</th><th className="text-right font-semibold py-1">t</th><th className="text-right font-semibold py-1">trips</th><th className="text-right font-semibold py-1">veh</th><th className="text-left font-semibold py-1 pl-2">Status</th></tr></thead>
              <tbody>
                {T.rows.map(r => {
                  const st = todayStatus(r.status, r.actual);
                  return (
                  <RowDetails key={r.key} rowKey={"today-" + r.key} isOpen={todayOpen(r.key)} onToggle={() => todayToggle(r.key)} colSpan={5}
                    label={`Details for ${r.route_id}`} rowProps={{ className: "border-t border-slate-100" }} firstClass="py-1 pr-2"
                    summary={<>{r.origin || "—"} → {r.dest || "—"}</>}
                    chips={[r.material, r.discipline || null]}
                    cells={<>
                      <td className="py-1 text-right tabular-nums font-semibold" data-label="t">{grp(r.tonnes)}</td>
                      <td className="py-1 text-right tabular-nums" data-label="trips">{r.trips == null ? "—" : grp(r.trips)}</td>
                      <td className="py-1 text-right tabular-nums" data-label="veh">{r.vehicles == null ? <span className="text-slate-500">—</span> : r.vehicles}</td>
                      <td className="py-1 pl-2 rd-status" data-label="Status"><RowStatus word={st.word} tone={st.tone} /></td>
                    </>}>
                    <RdItem t="Route">{r.route_id}</RdItem>
                    <RdItem t="Discipline">{r.discipline || null}</RdItem>
                    <RdItem t="Vehicle">{r.vehicle}</RdItem>
                    <RdItem t="Vehicle, full name">{r.vehicle_full && r.vehicle_full !== r.vehicle ? r.vehicle_full : null}</RdItem>
                    <RdItem t="Planned today">{`${grp(r.qty)} ${unitLbl(r.unit)}`}</RdItem>
                    <RdItem t="Reported today">{r.actual != null ? `${grp(r.actual)} ${unitLbl(r.unit)}` : "Not reported yet"}</RdItem>
                    <RdItem t={`Lorry-${DU()} today`}>{r.baked && r.km != null ? grp(dist(r.km)) : null}</RdItem>
                    <RdItem t="Status">{st.say}</RdItem>
                    <RdItem t="Route not worked out" wide>{r.baked ? null : "The route is not worked out yet, so no distance or vehicles."}</RdItem>
                  </RowDetails>
                  );
                })}
              </tbody>
            </table>)}
          </div>
        </>}
      </div>
      <div className="card p-0 overflow-hidden lg:col-span-3 today-map">
        {week ? <CommitMap meta={meta} bucket="commit" tick={0} lines={lines} title="This week's lines on the map" height={wall ? 460 : 380} flush fill={fill} />
              : <div className="p-6 text-sm text-slate-400">Loading the map…</div>}
      </div>
    </div>
  );
}

// ---- 11 Sep: stockpile capacity, a bar chart (replaces the 10 Sep stock table) ---------
// One bar per stockpile: how full it is at the end of the chosen week, as a % of its
// recorded capacity, red past 100 %. The figures are the same /stockpiles read model
// (balance = opening + typed inbound − typed consumption; a week nobody reported counts as
// nothing). A stockpile with NO capacity recorded cannot be a %, so it is listed beside
// the chart with its balance — never drawn as 0 % or as full. Pick the week with the chips.
function DashboardStockChart({ meta, weekNow, wall, fill, tick }){
  const { months } = meta;
  const [data, setData] = useState(null);
  const [err, setErr] = useState("");
  const [wk, setWk] = useState(null);
  const now = new Date();
  const thisM = Math.max(1, Math.min(months.count, (now.getFullYear() - months.start_year) * 12 + now.getMonth() + 1));
  const toM = Math.min(months.count, thisM + 1);
  useEffect(() => {
    let live = true;
    fetch(`${API}/stockpiles?from_month=${thisM}&to_month=${toM}`)
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(j => { if(live){ setData(j); setErr(""); } })
      .catch(e => { if(live) setErr(`Couldn't load stock (${e}).`); });

  }, [thisM, toM, tick]);
  const sps = (data && data.stockpiles) || [];
  const cols = [];
  sps.forEach(sp => (sp.weeks || []).forEach(w => { const k = `${w.month_index}|${w.week_index}`; if(!cols.some(c => c.k === k)) cols.push({ k, m: w.month_index, w: w.week_index }); }));
  cols.sort((a, b) => a.m - b.m || a.w - b.w);

  const cellOf = (sp) => { const c = cols.find(x => x.k === selKey); return c ? (sp.weeks || []).find(x => x.month_index === c.m && x.week_index === c.w) : null; };
  const withCap = sps.filter(sp => sp.capacity_qty != null && sp.capacity_qty > 0);

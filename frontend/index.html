      lg.coords.forEach(c => b.extend(c));
      const g = gateBy[legGate[k]];
      if(g && g.lon != null && g.lat != null) ends.push({ type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: [lg.coords[lg.coords.length - 1], [+g.lon, +g.lat]] } });
    });
    const haul = (store.haul || []).filter(h => h.coords && h.coords.length > 1).map(h => ({ type: "Feature",
      properties: { label: `${h.name} · ${h.speed_kph == null ? "no speed typed" : Math.round(speed(h.speed_kph)) + " " + SPD()}` }, geometry: { type: "LineString", coordinates: h.coords } }));
    const gpts = (D.gates || []).filter(g => g.lon != null && g.lat != null).map(g => ({ type: "Feature", properties: { name: simGateName(g) }, geometry: { type: "Point", coordinates: [+g.lon, +g.lat] } }));
    gpts.forEach(f => b.extend(f.geometry.coordinates));
    m.getSource("sim-routes").setData({ type: "FeatureCollection", features: lines });
    m.getSource("sim-ends").setData({ type: "FeatureCollection", features: ends });
    m.getSource("sim-haul").setData({ type: "FeatureCollection", features: haul });
    m.getSource("sim-gates").setData({ type: "FeatureCollection", features: gpts });
    // the "N waiting" badges, one a gate (words, never a colour alone)
    Object.values(badges.current).forEach(x => { try { x.m.remove(); } catch(e){} });
    badges.current = {};
    (D.gates || []).forEach(g => {
      if(g.lon == null || g.lat == null) return;
      const el = document.createElement("div");
      el.className = "sim-badge"; el.style.display = "none";
      badges.current[g.gate_id] = { el, m: new window.mapboxgl.Marker({ element: el, anchor: "left", offset: [7, -10] }).setLngLat([+g.lon, +g.lat]).addTo(m) };
    });
    if(!b.isEmpty() && !store.framed){ try { m.fitBounds(b, { padding: 40, maxZoom: 12, duration: 0 }); store.framed = true; } catch(e){} }
  }, [ready, store, D]);
  // the moving part
  useEffect(() => {
    const m = mapObj.current;
    if(!m || !ready || !D || !store || !frame) return;
    const f = frame;
    try { m.getSource("sim-lorries").setData({ type: "FeatureCollection", features: f.feats }); } catch(e){}
    Object.keys(badges.current).forEach(gid => {
      const x = badges.current[gid], w = (f.gates[gid] || {}).w || 0;
      x.el.style.display = w > 0 ? "" : "none";
      if(w > 0) x.el.textContent = `${w} waiting`;
    });
  }, [frame, ready]);
  return (
    <div className="sim-map-wrap">
      <div ref={div} className="sim-map" role="region" aria-label="Simulation map" />
      <div className="sim-legend" role="group" aria-label="Map key">
        <div><i className="sim-dot sim-dot-laden" aria-hidden="true"></i>Lorry, laden</div>
        <div><i className="sim-dot sim-dot-empty" aria-hidden="true"></i>Lorry, empty</div>
        {D.pour && <div><i className="sim-dot sim-dot-pour" aria-hidden="true"></i>{(D.mixer && D.mixer.vehicle_label) || "Concrete mixer"} (pour)</div>}
        <div><i className="sim-dot sim-dot-wait" aria-hidden="true"></i>Waiting at a gate (one lane, 25 m apart)</div>
        <div><i className="sim-dot sim-dot-gate" aria-hidden="true"></i>Entry gate</div>
        <div><i className="sim-line sim-line-end" aria-hidden="true"></i>Route end to its gate</div>
        <div><i className="sim-line sim-line-haul" aria-hidden="true"></i>Haul road (assigned speed)</div>
      </div>
      {mapErr && <div className="ct-note" style={{ color: "var(--red)" }}>{mapErr}</div>}
    </div>
  );
}

// the timeline: one row a gate where a lorry waits; the shaded band is lorries waiting; the red mark is the bottleneck
// (D85: the first wait longer than the gate's check-in). Click to move the clock there.
const SIM_TL_LEFT = 150;
function SimTimeline({ D, t, onSeek }){
  const box = useRef(null);
  const [W, setW] = useState(900);
  useEffect(() => {
    const f = () => { if(box.current && box.current.clientWidth) setW(box.current.clientWidth); };
    f();
    if(typeof ResizeObserver === "undefined" || !box.current) return;
    const ro = new ResizeObserver(f); ro.observe(box.current); return () => ro.disconnect();
  }, []);
  const s0 = D.window.start, s1 = D.window.end;
  const tx = (m) => SIM_TL_LEFT + (m - s0) / Math.max(1, s1 - s0) * (W - SIM_TL_LEFT - 10);
  const qg = (D.gates || []).filter(g => g.queue_start != null);
  const rowH = 32, H = 34 + Math.max(1, qg.length) * rowH + 8;
  const still = useMemo(() => {
    const parts = [];
    const iv = (D.gates[0] || {}).intervals || [];
    const same = D.gates.every(g => JSON.stringify(g.intervals) === JSON.stringify(iv));
    if(same) iv.forEach(([a, b], i) => parts.push(<rect key={"o" + i} x={tx(a)} y={18} width={Math.max(0, tx(b) - tx(a))} height={H - 26} className="sim-tl-open" />));
    const pourAt = D.arrivals.filter(a => a.kind === "pour").map(a => a.at);
    if(pourAt.length) parts.push(<rect key="pour" x={tx(pourAt[0])} y={13} height={4} width={Math.max(2, tx(pourAt[pourAt.length - 1]) - tx(pourAt[0]))} className="sim-tl-pour" />);
    for(let h = Math.ceil(s0 / 60); h <= Math.floor(s1 / 60); h++){
      const x = tx(h * 60);
      parts.push(<g key={"h" + h}><line x1={x} x2={x} y1={18} y2={H - 8} className="sim-tl-grid" /><text x={x} y={12} className="sim-tl-hour" textAnchor="middle">{String(h).padStart(2, "0")}:00</text></g>);
    }
    if(!qg.length) parts.push(<text key="none" x={SIM_TL_LEFT} y={34 + rowH / 2} className="sim-tl-ok">No lorry waits at any gate on this day.</text>);
    qg.forEach((g, i) => {
      const y0 = 34 + i * rowH, base = y0 + rowH - 6, mx = Math.max(1, g.most_waiting);
      const arr = D.arrivals.filter(a => a.gate === g.gate_id && a.wait > 0.01);
      const pts = [];
      for(let m = s0; m <= s1; m += 2){ const w = arr.filter(a => a.at <= m && m < a.start).length; pts.push(`${tx(m).toFixed(1)},${(base - w / mx * (rowH - 12)).toFixed(1)}`); }
      parts.push(<g key={g.gate_id} data-sim-tl-gate={g.gate_id}>
        <text x={4} y={base - 6} className="sim-tl-name">{simGateName(g)}</text>
        <polyline points={`${tx(s0)},${base} ${pts.join(" ")} ${tx(s1)},${base}`} className="sim-tl-wait" />
        {g.bottleneck_at != null
          ? <><line x1={tx(g.bottleneck_at)} x2={tx(g.bottleneck_at)} y1={y0 + 2} y2={base} className="sim-tl-mark" />
              <text x={tx(g.bottleneck_at) + 4} y={y0 + 11} className="sim-tl-marktext">bottleneck from {simHM(g.bottleneck_at)} · up to {g.most_waiting} waiting</text></>
          : <text x={tx(g.queue_start) + 4} y={y0 + 11} className="sim-tl-note">waits from {simHM(g.queue_start)}, none longer than the {+g.check_in} min check-in</text>}
      </g>);
    });
    return parts;
  }, [D, W]);
  const click = (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    onSeek(s0 + (e.clientX - r.left - SIM_TL_LEFT) / Math.max(1, r.width - SIM_TL_LEFT - 10) * (s1 - s0));
  };
  return (
    <div ref={box} className="sim-tl" data-sim-timeline="1">
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} onClick={click} role="img" aria-label={qg.length ? `Waiting lorries over the day at ${qg.length} gate${qg.length === 1 ? "" : "s"}` : "No lorry waits on this day"}>
        {still}
        <line x1={tx(t)} x2={tx(t)} y1={16} y2={H - 6} className="sim-tl-cursor" />
      </svg>
    </div>
  );
}

// the player: the clock, play / pause / restart / speed / jump, the map, the gates now and the timeline
function SimPlayer({ meta, D, store, scenario, open }){
  const [t, setT] = useState(D.window.start);
  const [playing, setPlaying] = useState(false);
  const [sp, setSp] = useState("1");
  const raf = useRef(null), last = useRef(null), tRef = useRef(t), spRef = useRef(1);
  tRef.current = t; spRef.current = +sp;
  const s0 = D.window.start, s1 = D.window.end;
  useEffect(() => { setT(x => Math.max(s0, Math.min(s1, x))); }, [s0, s1]);
  useEffect(() => { if(!open) setPlaying(false); }, [open]);                 // folded: nothing plays unseen
  useEffect(() => {
    if(!playing){ last.current = null; return; }
    const step = (ts) => {
      if(last.current != null){
        // the loop keeps its own time: a frame that comes before React has drawn the last one still moves the clock on
        let n = tRef.current + (ts - last.current) / 1000 * (s1 - s0) / SIM_PLAY_SECONDS * spRef.current;
        if(n >= s1){ n = s1; setPlaying(false); }
        tRef.current = n;
        setT(n);
      }
      last.current = ts;
      raf.current = requestAnimationFrame(step);
    };
    raf.current = requestAnimationFrame(step);
    return () => { if(raf.current) cancelAnimationFrame(raf.current); raf.current = null; };
  }, [playing, s0, s1]);
  const seek = (m) => { setT(Math.max(s0, Math.min(s1, m))); };
  const f = useMemo(() => simFrame(D, store ? store.legs : {}, t), [D, store, t]);
  const order = (D.gates || []).slice().sort((a, b) => (b.arrivals - a.arrivals) || (a.gate_id < b.gate_id ? -1 : 1));
  const playWord = playing ? "Pause" : (t >= s1 ? "Play again" : "Play");
  return (
    <div className="sim-play" data-sim-player="1">
      {/* 17 Oct 2026 (one screen): the map with the queue timeline under it on the left, the clock, Gates now and the
          scenario beside it; the busiest-hour table and the haul roads fold away below (SimulationPanel) */}
      <div className="sim-grid">
        <div className="sim-main">
          <SimMap meta={meta} D={D} store={store} frame={f} />
          <div className="sim-tl-head" title="Each row is a gate where a lorry waits; the shaded band is lorries waiting. The red mark is the bottleneck: the first lorry that waits longer than the gate's check-in. Click the timeline to move the clock there."><b>When queues start</b> · the red mark is the bottleneck</div>
          <SimTimeline D={D} t={t} onSeek={(m) => { setPlaying(false); seek(m); }} />
        </div>
        <div className="sim-side">
          <div className="sim-card">
            <div className="sim-clock" aria-live="off" data-sim-clock="1">{simHM(t)}</div>
            <div className="ct-note">{D.label}, an average working day · {D.window.from}–{D.window.to} plays in about {SIM_PLAY_SECONDS} s at 1×</div>
            <div className="sim-btns">
              <button type="button" className="btn-pri" onClick={() => { if(t >= s1) setT(s0); setPlaying(p => !p); }} data-sim-play="1">{playWord}</button>
              <button type="button" className="btn-sec" onClick={() => { setPlaying(false); setT(s0); }}>Restart</button>
              <label className="sim-lbl">Speed <select className="ga-sel" value={sp} onChange={e => setSp(e.target.value)} aria-label="Playback speed">
                {SIM_SPEEDS.map(([v, w]) => <option key={v} value={v}>{w}</option>)}</select></label>
            </div>
            <label className="sim-lbl sim-jump">Jump to <input type="range" min={s0} max={s1} step={5} value={Math.round(t)} onChange={e => { setPlaying(false); seek(+e.target.value); }} aria-label="Jump to a time of day" /></label>
            <div className="ct-note" data-sim-now="1">On the road now: {f.laden} laden · {f.empty} empty{f.mixers ? ` · ${f.mixers} mixer${f.mixers === 1 ? "" : "s"}` : ""} · {f.waiting} waiting at gates</div>
          </div>
          <div className="sim-card">
            <div className="sim-card-h">Gates now</div>
            <table className="sim-now"><thead><tr><th scope="col">Gate</th><th scope="col" className="num">Waiting now</th><th scope="col" className="num">Minutes lost so far</th></tr></thead>
              <tbody>{order.map(g => { const n = f.gates[g.gate_id] || { w: 0, lost: 0 };
                return <tr key={g.gate_id} className={n.w > 0 ? "sim-q" : ""} data-sim-now-gate={g.gate_id}><td>{simGateName(g)}</td><td className="num">{n.w}{n.w > 0 ? " waiting" : ""}</td><td className="num">{Math.round(n.lost)}</td></tr>; })}</tbody></table>
          </div>
          {scenario}
        </div>
      </div>
    </div>
  );
}

// the scenario, on screen only (D86): open hours, the peak bands, a pour; the holding area comes with V1
const SimScenario = React.memo(function SimScenario({ D, sc, onChange, onReset, msg }){
  const [allF, setAllF] = useState(sc.all ? sc.all[0] : D.stand_in.from);
  const [allT, setAllT] = useState(sc.all ? sc.all[1] : D.stand_in.to);
  const stood = (D.gates || []).some(g => g.open_basis === "stood_in");
  const p = sc.pour;
  // 17 Oct 2026: where a pour can go is the server's (working sites only: a compound or a site, never a landfill, a
  // stockpile, a quarry or a batching plant), busiest first; its first is the default. A site with two entry gates names both.
  const sites = D.pour_gates || [];
  const twoGates = (g) => sites.filter(x => x.location_id === g.location_id).length > 1;
  const setPour = (k, v) => onChange({ ...sc, pour: { ...p, [k]: v } });
  return (
    <div className="sim-card" data-sim-scenario="1">
      <div className="sim-card-h">Scenario <span className="sim-tag">on screen only, not saved</span></div>
      <div className="sim-ctl">
        <div className="sim-row">
          <span>Open hours, every gate</span>
          <input type="time" step={900} value={allF} onChange={e => setAllF(e.target.value)} aria-label="Every gate opens at" />
          <span>to</span>
          <input type="time" step={900} value={allT} onChange={e => setAllT(e.target.value)} aria-label="Every gate closes at" />
          <button type="button" className="btn-sec" onClick={() => onChange({ ...sc, all: [allF, allT], hours: {} })}>Apply</button>
        </div>
        {stood && <div className="ct-note">No open hours typed for {(D.gates || []).filter(g => g.open_basis === "stood_in").length === D.gates.length ? "any gate" : "some gates"}: the scheme's {D.stand_in.shift_hours} h shift stands in at {D.stand_in.from}–{D.stand_in.to}.</div>}
        <label className="sim-check"><input type="checkbox" checked={sc.bands != null ? sc.bands : !!D.bands.on} onChange={e => onChange({ ...sc, bands: e.target.checked })} />
          <span>No-delivery peak bands {(D.bands.on ? D.bands.words : gateBandWords(D.bands.typed)) || gateBandWords(PEAK_BANDS_PLACEHOLDER)}
          {(!D.bands.typed || !D.bands.typed.length) && <span className="sim-tag">example bands, none typed</span>}</span></label>
        <label className={"sim-check" + (sites.length ? "" : " sim-off")}><input type="checkbox" checked={p.on} disabled={!sites.length}
            onChange={e => onChange({ ...sc, pour: { ...p, on: e.target.checked, gate: p.gate || D.pour_default || "" } })} />
          <span>Concrete pour <span className="sim-tag">a what-if</span></span></label>
        {!sites.length && <div className="ct-note" data-sim-no-pour-site="1">No site to pour at: a pour goes to a location of type Compound or Site (Data → Locations).</div>}
        <div className={"sim-pour" + (p.on ? "" : " sim-off")}>
          <label>Gate <select className="ga-sel" value={p.gate} onChange={e => setPour("gate", e.target.value)} disabled={!p.on} aria-label="Pour gate">
            {sites.map(g => <option key={g.gate_id} value={g.gate_id}>{simGateName(g)}{twoGates(g) ? `, ${g.gate_name}` : ""}</option>)}</select></label>
          <label>Starts <input type="time" step={900} value={p.start} onChange={e => setPour("start", e.target.value)} disabled={!p.on} aria-label="Pour starts at" /></label>
          <label>Volume <input type="number" min={1} step={1} value={p.m3} onChange={e => setPour("m3", e.target.value)} disabled={!p.on} aria-label="Pour volume in cubic metres" className="sim-num" /> m³</label>
          <label>Mixer <input type="number" min={0.5} step={0.5} value={p.mpl === "" ? D.mixer.m3_per_load : p.mpl} onChange={e => setPour("mpl", e.target.value)} disabled={!p.on} aria-label="Cubic metres a mixer load" className="sim-num" /> m³ a load</label>
          <label>Pour rate <input type="number" min={5} step={5} value={p.rate} onChange={e => setPour("rate", e.target.value)} disabled={!p.on} aria-label="Pour rate in cubic metres an hour" className="sim-num" /> m³ an hour</label>
          <div className="ct-note">{D.mixer.m3_per_load} m³: the {D.mixer.vehicle_label || "concrete mixer"} legal fill.{D.pour ? ` ${D.pour.loads} mixers, one every ${simN1(D.pour.gap_minutes)} min, ${D.pour.start}–${D.pour.end}.` : ""}</div>
        </div>
        <label className="sim-check sim-off" title="Comes with holding areas (V1)"><input type="checkbox" disabled /><span>Holding area: lorries wait off the highway</span></label>
        <div className="ct-note">Comes with holding areas (V1).</div>
        {msg && <div className="sim-msg" role="alert">{msg}</div>}
        <div><button type="button" className="btn-sec" onClick={onReset}>Back to the scheme's figures</button></div>
      </div>
    </div>
  );
});
const gateBandWords = (bands) => (bands || []).length ? bands.map(b => `${b.from}–${b.to}`).join(" and ") : "";

// the busiest hour at each gate: counted by the server from the same arrivals the map plays; open hours and check-in

const SimTable = React.memo(function SimTable({ D, editable, onHours, onCheckIn, resetN }){

    <div className="overflow-auto sim-scroll" tabIndex={0} role="region" aria-label="Busiest hour at each gate"><table className="sim-table" data-sim-table="1">

        <th scope="col" className="num">Dashboard average a day</th><th scope="col">Open hours</th><th scope="col" className="num">Check-in<div className="sim-th-sub">min a lorry</div></th>

                  <span> – </span>
                  <input type="time" step={900} defaultValue={g.open_to} aria-label={`${g.location_name}, ${g.gate_name}: closes at`} onChange={e => onHours(g, null, e.target.value)} />

              {g.open_basis === "refused" && <div className="sim-sub sim-warn">{g.open_words}</div>}</td>
            <td className="num">{editable
              ? <input type="number" min={0} step={0.5} className="sim-num" key={g.gate_id + String(g.check_in) + resetN} defaultValue={g.check_in == null ? "" : g.check_in} placeholder="none"
                  aria-label={`${g.location_name}, ${g.gate_name}: check-in minutes a lorry`} onChange={e => onCheckIn(g, e.target.value)} />

              <div className="sim-sub">first wait {simHM(g.queue_start)}</div></>}
              {g.late > 0 && <div className="sim-sub sim-warn">{g.late} checked in after the last open minute ({simHM(g.last_open)}), the last done at {simHM(g.last_done)}</div>}</td>
            <td className="num">{g.most_waiting || 0}{g.most_at != null && <div className="sim-sub">at {simHM(g.most_at)}</div>}</td>

      })}</tbody>

// below 768 px: one card a gate with the figures that matter on a phone (the app's tables become cards there too)
function SimPhoneList({ D }){
  const order = (D.gates || []).slice().sort((a, b) => (b.arrivals - a.arrivals) || (a.gate_id < b.gate_id ? -1 : 1));
  return (
    <ul className="sim-plist" data-sim-table="1" aria-label="Busiest hour at each gate">
      {order.map(g => (
        <li key={g.gate_id} className="sim-pcard" data-sim-gate={g.gate_id} data-sim-flag={g.flag || "none"}>
          <div className="sim-pc-h"><b>{g.location_name}</b><RowStatus word={simWord(g)} tone={simTone(g)} /></div>
          <div className="sim-sub">{g.gate_name} · open {g.open_from ? `${g.open_from}–${g.open_to}` : "—"}{g.open_basis === "stood_in" ? " (stood in)" : ""}</div>
          <dl className="sim-pc-dl">
            <div><dt>Lorry arrivals this day</dt><dd>{g.arrivals}{g.pour ? ` (${g.pour} mixers)` : ""}</dd></div>
            <div><dt>Busiest hour</dt><dd data-sim-busy={g.busiest}>{g.busiest ? `${g.busiest} at ${g.busiest_hour}` : "—"}</dd></div>
            <div><dt>Can check in an hour</dt><dd>{simN1(g.per_hour)}</dd></div>
            <div><dt>Queue</dt><dd>{g.queue_start == null ? "No queue" : (g.bottleneck_at != null ? `bottleneck ${simHM(g.bottleneck_at)}` : `short waits from ${simHM(g.queue_start)}`)}</dd></div>
            <div><dt>Most waiting</dt><dd>{g.most_waiting || 0}{g.most_at != null ? ` at ${simHM(g.most_at)}` : ""}</dd></div>
            <div><dt>Minutes lost</dt><dd>{Math.round(g.minutes_lost || 0)}</dd></div>
          </dl>
          {g.late > 0 && <div className="sim-sub sim-warn">{g.late} checked in after the last open minute</div>}
          {g.origin_share_note && <div className="sim-sub sim-warn">{g.origin_share_note}</div>}
        </li>))}
    </ul>
  );
}

function SimulationPanel({ meta, months, phone, initial }){
  const [open, setOpen] = useState(!!initial);
  const [month, setMonth] = useState(() => (initial && initial.month) || gaMonthToday(months));
  const [sc, setSc] = useState(SIM_SC0);
  const [data, setData] = useState(initial || null);
  const [store, setStore] = useState(() => initial ? { month: initial.month, legs: initial.legs, haul: initial.haul_roads } : null);
  const [loadErr, setLoadErr] = useState(false);
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const [resetN, setResetN] = useState(0);
  const good = useRef(SIM_SC0());
  const scKey = JSON.stringify(sc);
  // the day on screen is for this month and scenario: folding and opening again, or a refused scenario put back, reads nothing
  const shown = useRef(initial ? `${initial.month}|${JSON.stringify(SIM_SC0())}` : null);
  useEffect(() => {
    if(!open) return;
    const key = `${month}|${scKey}`;
    if(data && shown.current === key) return;
    let live = true;
    const wantLines = !phone && !(store && store.month === month);
    const go = () => {
      setBusy(true);
      fetch(`${API}/sim/day?${simQS(month, sc, wantLines)}`).then(async r => {
        const j = await r.json().catch(() => ({}));
        if(!r.ok) throw { status: r.status, detail: (j && typeof j.detail === "string") ? j.detail : "" };
        return j;
      }).then(j => {
        if(!live) return;
        good.current = sc; shown.current = key;
        if(wantLines) setStore({ month, legs: j.legs, haul: j.haul_roads });
        setData(j); setLoadErr(false); setMsg(""); setBusy(false);
      }).catch(e => {
        if(!live) return;
        setBusy(false);
        if(e && e.status === 400){ setMsg(e.detail || "That scenario cannot be simulated."); setSc(good.current); setResetN(n => n + 1); }
        else setLoadErr(true);
      });
    };
    const h = setTimeout(go, data ? 300 : 0);
    return () => { live = false; clearTimeout(h); };
  }, [open, month, scKey]);
  const onHours = (g, f, t) => {
    if(f === "" || t === "") return;                        // a time still being typed
    const cur = (sc.hours[g.gate_id] || [g.open_from, g.open_to]);
    const nx = [f || cur[0], t || cur[1]];
    if(nx[1] <= nx[0]){ setMsg(`${g.location_name}: the gate must close after it opens; a window past midnight is not simulated.`); setResetN(n => n + 1); return; }
    setMsg(""); setSc(s => ({ ...s, hours: { ...s.hours, [g.gate_id]: nx } }));
  };
  const onCheckIn = (g, v) => {
    const x = String(v).trim();
    if(x !== "" && !(+x >= 0)){ setMsg("A check-in is minutes a lorry, 0 or more; empty for none."); return; }
    setMsg(""); setSc(s => ({ ...s, check_in: { ...s.check_in, [g.gate_id]: x === "" || +x === 0 ? "" : x } }));
  };
  const onScenario = (nx) => {
    if(nx.all && nx.all[1] <= nx.all[0]){ setMsg("Every gate: the closing time must be after the opening time; a window past midnight is not simulated."); return; }
    setMsg(""); setSc(nx);
  };
  const count = (months && months.count) || 60, startYear = (months && months.start_year) || 2026;
  const D = data;
  const played = D ? D.arrivals.filter(a => a.depart != null && a.depart >= D.window.start - 1e-9 && a.done <= D.window.end + 1e-9
    && store && store.legs && store.legs[a.leg] && store.legs[a.leg].coords).length : 0;
  const pourN = D && D.pour ? D.pour.loads : 0;
  const other = D ? (D.lines || []).filter(l => l.vehicle_as_planned === false) : [];
  const ok = (c) => <span className={c ? "sim-ok" : "sim-bad"} aria-hidden="true">{c ? "✓" : "✗"}</span>;
  return (
    <details className="dash-more" data-sim="1" open={open || undefined} onToggle={e => setOpen(e.currentTarget.open)}>
      <summary>Simulation: an average working day, lorry by lorry at every gate</summary>
      <div className="pt-3" data-sim-state={!D ? (loadErr ? "error" : "loading") : (D.loads > 0 ? "set" : "none")}>
        <div className="ct-row">
          <div className="sim-chips"><span className="sim-chip sim-chip-staff">Staff only · never on the public map</span><span className="sim-chip">Planning view, not a record of what happened</span>
            <span className="sim-chip">Congestion on the public road is not modelled</span><InfoTip id="dash.sim" /></div>
          <label className="ct-line">Month <select className="ga-sel" value={month} onChange={e => { setMonth(+e.target.value); }} aria-label="Simulation month">
            {Array.from({ length: count }, (_, i) => i + 1).map(i => <option key={i} value={i}>{monthLabelAbs(i, startYear)}</option>)}</select></label>
        </div>
        {loadErr && <div className="ct-line" style={{ color: "var(--red)" }}>The simulation did not load.</div>}
        {!D && !loadErr && <div className="ct-note">Working out the day…</div>}
        {D && D.loads === 0 && <EmptyState kind="none" title={`No approved lines in ${D.label}`} body="Pick another month. The simulation plays the approved lines of a month's average working day." />}
        {D && D.loads > 0 && <>
          <div className="ct-line" data-sim-lead="1">{D.label}: an average working day, {grp(D.loads)} loads ({grp(D.gate_arrivals)} lorry arrivals at the gates{pourN ? `, ${pourN} of them mixers` : ""}). Each gate's arrivals are spread evenly over its open hours{D.bands.on ? `, the no-delivery bands ${D.bands.words} taken off` : ""}; one lane at each gate.{busy ? " Working it out…" : ""}</div>
          {(D.notes || []).map((n, i) => <div key={i} className="ct-note">{n}</div>)}
          {phone
            ? <><div className="ct-note" data-sim-phone="1">The map, the playback and the what-if controls open on a desktop.</div><SimPhoneList D={D} /></>
            : <>
              <SimPlayer meta={meta} D={D} store={store} open={open} scenario={<SimScenario key={resetN} D={D} sc={sc} onChange={onScenario} onReset={() => { setMsg(""); setSc(SIM_SC0()); setResetN(n => n + 1); }} msg={msg} />} />
              <details className="sim-fold" data-sim-fold="table"><summary>Busiest hour at each gate</summary>
              <p className="ct-note">Counted from the same arrivals the map plays: laden lorries arrive at the delivery site's gate, empty lorries at the loading site's gate. Open hours and check-in minutes can be changed here for this screen only.</p>
              <SimTable D={D} editable onHours={onHours} onCheckIn={onCheckIn} resetN={resetN} />
              </details>
              {(D.haul_roads || []).length > 0 && <details className="sim-fold" data-sim-fold="haul"><summary>Haul roads</summary>
                <p className="ct-note">Lorries on each drawn haul road, both ways. No capacity is typed for a haul road, so none is flagged here.</p>
                <div className="overflow-auto sim-scroll" tabIndex={0} role="region" aria-label="Haul roads"><table className="sim-table" data-sim-haul="1"><thead><tr><th scope="col">Haul road</th><th scope="col" className="num">Assigned speed</th><th scope="col" className="num">Length</th>
                  <th scope="col" className="num">Lorries on it this day</th><th scope="col" className="num">Busiest hour</th><th scope="col" className="num">Routes</th></tr></thead>
                  <tbody>{D.haul_roads.map(h => <tr key={h.zone_id}><td><b>{h.name}</b></td><td className="num">{h.speed_kph == null ? "not typed" : `${Math.round(speed(h.speed_kph))} ${SPD()}`}</td>
                    <td className="num">{h.length_km == null ? "—" : `${fmtDist(h.length_km, 1)} ${DU()}`}</td><td className="num"><b>{h.lorries}</b></td>
                    <td className="num">{h.busiest || 0}<div className="sim-sub">{h.busiest_hour || ""}</div></td><td className="num">{(h.routes || []).length}</td></tr>)}</tbody></table></div>
              </details>}
              {D.access_roads_hidden > 0 && <p className="ct-note" data-sim-access-hidden="1">Gate access roads are not listed ({D.access_roads_hidden}): lorries still cross them at their typed speed.</p>}
              <div className="sim-checks" data-sim-checks="1">
                <div>{ok(D.checks.table_equals_arrivals && played === D.gate_arrivals)} {grp(D.loads)} loads in the day, each arriving at its gate at both ends, plus {pourN} mixer{pourN === 1 ? "" : "s"}: the table counts {grp(D.gate_arrivals)} lorry arrivals and the map plays {grp(played)} between {D.window.from} and {D.window.to}.</div>
                <div>{ok(D.checks.hours_add_up)} Each gate's hours add up to its day.</div>
                {D.checks.largest_panel_difference != null && <div>{ok(D.checks.largest_panel_difference < 1)} Leaving out the pour, every gate is within {simN1(D.checks.largest_panel_difference)} of a lorry of the Dashboard's {D.label} average: a day has whole lorries, the Dashboard a decimal average.</div>}
              </div>
              {(D.not_drawn || []).length > 0 && <div className="ct-note">Not drawn (no route worked out): {D.not_drawn.join(", ")}. Their lorries still count at the gates.</div>}
              {other.length > 0 && <div className="ct-note">Drawn on another vehicle's route (none worked out for their own): {other.map(l => `${l.route_id} (${vehLabel(l.vehicle)}, drawn as ${vehLabel(l.vehicle_drawn)})`).join("; ")}.</div>}
              <div className="ct-note">A lorry held up at a gate is not late for anything afterwards: each arrival is placed by its gate's open hours, not by the lorry's last trip. Distances in {DU() === "mi" ? "miles" : "kilometres"}.</div>
            </>}
        </>}
      </div>
    </details>
  );
}

// ---- 17 Oct 2026: the Simulation on the BIG SCREEN (the sixth section, DASH_SECTIONS "sim") -------------------------
// What a site-office TV shows (the user, 17 Oct): the month's average working day, played ONCE each time the section
// comes round in Rotate (it stays on screen for the whole day, SIM_WALL_SECONDS, whatever the rotate setting), and again
// and again in One section / All sections. The map, the clock, Gates now and the queue timeline with the bottleneck mark;
// no scenario controls and no table (nobody touches a TV). The day is the plain month: no pour, the gates' open hours as
// typed (the scheme's shift placed at 07:00 where none are typed, and the screen says so).
// The month is THIS DISPLAY's choice on the wall bar (Dashboard: SIM_WALL_MONTH_KEY in this browser's localStorage, like
// the rotate time): "this month", or — when this month has no approved lines — the next month that has (the last one
// before, failing that). It is a display setting, NOT a saved or shared scenario: D86 stands (a scenario is never saved
// and never put in the address). Its own map like the Dashboard section's (SimMap), never unmounted: a hidden section
// keeps its map, which re-measures when the section comes back. It reads its day only while shown, again on the
// 5-minute refresh, and plays only while shown.
const SIM_WALL_HOLD_S = 5;                                     // the day's last picture holds this long
const SIM_WALL_SECONDS = SIM_PLAY_SECONDS + SIM_WALL_HOLD_S;    // the section's time on screen in Rotate
const SIM_WALL_MONTH_KEY = "modus_dash_sim_month";             // per display, like modus_dash_rotate_s (D86: not a scenario)
function simWallMonth(pref, months, approved){
  const n = (months && months.count) || 60, p = parseInt(pref, 10);
  if(p >= 1 && p <= n) return p;
  const now = gaMonthToday(months), have = (approved || []).slice().sort((a, b) => a - b);
  if(!have.length || have.includes(now)) return now;
  const next = have.find(m => m > now);
  return next != null ? next : have[have.length - 1];
}
function SimWall({ meta, month, show, pass, loop, fill, tick }){
  const [D, setD] = useState(null);
  const [store, setStore] = useState(null);
  const [err, setErr] = useState(false);
  const [t, setT] = useState(0);
  const tRef = useRef(0), loaded = useRef(""), dRef = useRef(null);
  useEffect(() => {
    if(!show) return;
    const key = `${month}|${tick}`;
    if(loaded.current === key) return;
    let live = true;
    fetch(`${API}/sim/day?month=${month}&legs=1`).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(j => {
      if(!live) return;
      loaded.current = key;
      if(!dRef.current || dRef.current.month !== j.month){ tRef.current = j.window.start; setT(j.window.start); }   // a new month starts at its first lorry
      dRef.current = j;
      setStore({ month: j.month, legs: j.legs, haul: j.haul_roads }); setD(j); setErr(false);
    }).catch(() => { if(live) setErr(true); });
    return () => { live = false; };
  }, [show, month, tick]);
  // each pass starts the day again at the first lorry setting off
  useEffect(() => { if(dRef.current){ tRef.current = dRef.current.window.start; setT(dRef.current.window.start); } }, [pass]);
  useEffect(() => {
    if(!show || !D || !(D.loads > 0)) return;
    const s0 = D.window.start, s1 = D.window.end;
    let raf = null, last = null, held = null;
    const step = (ts) => {
      if(last != null){
        let n = tRef.current + (ts - last) / 1000 * (s1 - s0) / SIM_PLAY_SECONDS;
        if(n >= s1){
          n = s1;
          if(!loop){ tRef.current = n; setT(n); raf = null; return; }        // Rotate: the day once, its last picture held
          if(held == null) held = ts;
          if(ts - held >= SIM_WALL_HOLD_S * 1000){ n = s0; held = null; }    // One section / All sections: again after a hold
        }
        tRef.current = n; setT(n);
      }
      last = ts;
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => { if(raf) cancelAnimationFrame(raf); };
  }, [show, D, loop, pass]);              // a new pass plays again even after the day ended
  if(!D) return err ? <div className="ct-line" style={{ color: "var(--red)" }} data-sim-wall="error">The simulation did not load.</div>
                    : <div className="ct-note" data-sim-wall="loading">Working out the day…</div>;
  if(!(D.loads > 0)) return <div data-sim-wall="none"><EmptyState kind="none" title={`No approved lines in ${D.label}`} body="Pick another month for the Simulation on the bar above." /></div>;
  const f = simFrame(D, store ? store.legs : {}, t);
  const stood = (D.gates || []).filter(g => g.open_basis === "stood_in").length;
  const hoursWords = !stood ? "the gates' open hours as typed"
    : stood === (D.gates || []).length ? `gates open ${D.stand_in.from}–${D.stand_in.to} (stood in: no open hours typed)`
    : `the gates' open hours as typed, ${D.stand_in.from}–${D.stand_in.to} stood in where none are typed`;
  // the gates a TV has room for: any that queues first, then the busiest
  const order = (D.gates || []).slice().sort((a, b) => ((a.queue_start == null) - (b.queue_start == null)) || (b.arrivals - a.arrivals) || (a.gate_id < b.gate_id ? -1 : 1)).slice(0, 8);
  return (
    <div className={"sim-wall" + (fill ? " sim-wall-fill" : "")} data-sim-wall="1">
      <div className="sim-wall-main"><SimMap meta={meta} D={D} store={store} frame={f} /></div>
      <div className="sim-wall-side">
        <div className="sim-wall-clock" data-sim-wall-clock="1">{simHM(t)}</div>
        <div className="sim-wall-sub" data-sim-wall-sub="1">{D.label}, an average working day: {grp(D.loads)} loads · no pour · {hoursWords}</div>
        <div className="sim-wall-now" data-sim-now="1">On the road: {f.laden} laden · {f.empty} empty · {f.waiting} waiting at gates</div>
        <table className="sim-now sim-wall-gates"><thead><tr><th scope="col">Gate</th><th scope="col" className="num">Waiting now</th><th scope="col" className="num">Minutes lost</th></tr></thead>
          <tbody>{order.map(g => { const n = f.gates[g.gate_id] || { w: 0, lost: 0 };
            return <tr key={g.gate_id} className={n.w > 0 ? "sim-q" : ""} data-sim-now-gate={g.gate_id}><td>{simGateName(g)}</td><td className="num">{n.w}{n.w > 0 ? " waiting" : ""}</td><td className="num">{Math.round(n.lost)}</td></tr>; })}</tbody></table>
        <div className="sim-chips"><span className="sim-chip sim-chip-staff">Staff only · never on the public map</span><span className="sim-chip">Planning view, not a record of what happened</span></div>
      </div>
      <div className="sim-wall-tl"><SimTimeline D={D} t={t} onSeek={(m) => { tRef.current = m; setT(m); }} /></div>
    </div>
  );
}

function CommitMap({ meta, bucket, tick, lines, title, height, flush, fill }){
  const mapDiv = useRef(null);
  const mapObj = useRef(null);
  const [geo, setGeo] = useState(null);
  const [err, setErr] = useState("");
  const [ready, setReady] = useState(false);
  const ids = lines.map(l => l.route_id).filter((v, i, a) => a.indexOf(v) === i);
  const idKey = ids.join(",");
  const byRoute = useMemo(() => {
    const g = {};
    lines.forEach(l => (g[l.route_id] || (g[l.route_id] = [])).push(l));
    return g;
  }, [lines]);

  useEffect(() => {
    let live = true;
    if(!ids.length){ setGeo({ routes: [] }); return; }
    const vehicles = ids.map(id => ((byRoute[id] || [])[0] || {}).vehicle_type || "");
    fetch(`${API}/lookahead/geometry?ids=${encodeURIComponent(ids.join(","))}&vehicles=${encodeURIComponent(vehicles.join(","))}`)
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(j => { if(live){ setGeo(j); setErr(""); } })
      .catch(e => { if(live) setErr(`Couldn't load the week's routes for the map (${e}).`); });
    return () => { live = false; };
  }, [idKey, bucket, tick]);

  useEffect(() => {
    if(mapObj.current || !mapDiv.current || !window.mapboxgl) return;
    window.mapboxgl.accessToken = meta.mapbox_token;
    let m;
    try {
      m = new window.mapboxgl.Map({ container: mapDiv.current, style: "mapbox://styles/mapbox/light-v11",
                                    center: UK_VIEW.center, zoom: UK_VIEW.zoom, attributionControl: true });
    } catch(e) {
      // 11 Sep: the Dashboard mounts this too — a map that cannot start (no token, no
      // WebGL) must never take the page down with it
      setErr(`The map could not start (${e && e.message ? e.message : e}).`);
      return;
    }
    m.addControl(new window.mapboxgl.NavigationControl({ showCompass: false }), "top-right");
    m.on("load", () => {
      m.addSource("la-routes", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
      m.addSource("la-ends", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
      m.addLayer({ id: "la-routes-casing", type: "line", source: "la-routes",
                   paint: { "line-color": "#ffffff", "line-width": 6, "line-opacity": 0.9 } });
      m.addLayer({ id: "la-routes", type: "line", source: "la-routes",
                   paint: { "line-color": ["get", "color"], "line-width": 3.5 } });
      m.addLayer({ id: "la-ends", type: "circle", source: "la-ends",
                   paint: { "circle-radius": 5, "circle-color": ["get", "color"], "circle-stroke-color": "#ffffff", "circle-stroke-width": 1.5 } });
      const popup = new window.mapboxgl.Popup({ closeButton: false, closeOnClick: false, offset: 8 });
      m.on("mousemove", "la-routes", (e) => {
        m.getCanvas().style.cursor = "pointer";
        const f = e.features && e.features[0];
        if(f) popup.setLngLat(e.lngLat).setHTML(f.properties.label).addTo(m);
      });
      m.on("mouseleave", "la-routes", () => { m.getCanvas().style.cursor = ""; popup.remove(); });
      setReady(true);
    });
    mapObj.current = m;
    // 13 Oct 2026 (W5): the map watches its own container. On the Dashboard it sits in a collapsed section (and a
    // hidden big-screen section), where it starts at 0 × 0; it used to wait for a window resize the page fired on
    // open. Never removed here (the one-Mapbox rule); the observer is disconnected only if the page goes.
    if(typeof ResizeObserver !== "undefined" && mapDiv.current){
      const ro = new ResizeObserver(() => { try { if(mapDiv.current && mapDiv.current.clientWidth > 0) m.resize(); } catch(e){} });
      ro.observe(mapDiv.current);
      return () => ro.disconnect();
    }
  }, []);

  useEffect(() => {
    const m = mapObj.current;
    if(!m || !ready || !geo) return;
    const feats = [], ends = [], b = new window.mapboxgl.LngLatBounds();
    (geo.routes || []).forEach(r => {
      const ls = byRoute[r.route_id] || [];
      const color = IPT_PALETTE_C[iptKey(r.ipt || (ls[0] || {}).ipt)] || "#1F2024";
      const wk = ls.map(l => `${grp((l.week || {}).planned_qty, 0)} ${unitLbl(l.unit)} · ${grp((l.week_derived || {}).trips)} trips`).join("<br>");
      const label = `<div style="font:12px system-ui"><b>${r.route_id}</b> · ${r.origin.name} → ${r.dest.name}<br>${wk}${r.vehicle_as_planned === false ? `<br><i>drawn for ${vehLabel(r.vehicle_profile)}, not the planned vehicle</i>` : ""}</div>`;
      if(r.geometry && r.geometry.length > 1){
        feats.push({ type: "Feature", properties: { route_id: r.route_id, color, label }, geometry: { type: "LineString", coordinates: r.geometry } });
        r.geometry.forEach(c => b.extend(c));
      }
      [["origin", "#1F2024"], ["dest", "#DC2626"]].forEach(([k, c]) => {
        const e = r[k];
        if(e && e.lon != null && e.lat != null){
          ends.push({ type: "Feature", properties: { color: c, name: e.name }, geometry: { type: "Point", coordinates: [e.lon, e.lat] } });
          b.extend([e.lon, e.lat]);
        }
      });
    });
    m.getSource("la-routes").setData({ type: "FeatureCollection", features: feats });
    m.getSource("la-ends").setData({ type: "FeatureCollection", features: ends });
    // 30 Sep 2026: fitBounds throws "Invalid LngLat object: (NaN, NaN)" when the map's
    // container has no size yet (a page switch or a viewport change mid-render); uncaught
    // in an effect it unmounted the WHOLE app to a white page on the live site. Never let
    // a camera move take the page down.
    if(!b.isEmpty()) { try { m.fitBounds(b, { padding: 40, maxZoom: 12, duration: 0 }); } catch(e){} }
  }, [geo, ready, byRoute]);

  const unbaked = (geo && geo.routes || []).filter(r => !r.geometry).map(r => r.route_id);
  // 11 Sep: the Dashboard mounts this too (`flush` inside its own card, its own title
  // and height); the Look-ahead's rendering is unchanged by the defaults.
  return (
    <div className={(flush ? "" : "mt-4") + (fill ? " h-full flex flex-col min-h-0" : "")}>
      <div className={"text-sm font-semibold text-slate-700 mb-2" + (flush ? " px-4 pt-3 chart-title" : "")}>{title || "This week's movements"}</div>
      <div className={(flush ? "" : "bg-white rounded-xl border border-slate-200 overflow-hidden") + (fill ? " flex-1 flex flex-col min-h-0" : "")}>
        {/* 14 Oct 2026: on a filled big screen the map takes the whole card; its ResizeObserver follows */}
        <div ref={mapDiv} style={fill ? { flex: "1 1 auto", minHeight: 0 } : { height: height || 380 }} />
        <div className="px-3 py-2 text-[11px] text-slate-400 border-t border-slate-100 flex flex-wrap gap-x-3">
          <span>Routed loaded leg per line, coloured by {TEAM().toLowerCase()} · dark dot = origin · red dot = destination · hover a line for its week.</span>
          {unbaked.length > 0 && <span className="text-amber-700">Not drawn (no route worked out): {unbaked.join(", ")}</span>}
          {err && <span style={{ color: "var(--red)" }}>{err}</span>}
        </div>
      </div>
    </div>
  );
}


// ---- Look-ahead v2 slices 3-5: the typed planning cap and contract rates on ONE route --
// Its own save, separate from the endpoint/vehicle form above: these are planning inputs
// that touch no geometry. Nothing is seeded — an empty field means "no rate typed" and the
// Look-ahead prints "rate not set" rather than €0. The cap is a FLAG on the Look-ahead,
// never a block (brief L2). km basis decides what the per-km rate and t·km multiply.
function RoutePlanning({ route, token, onSaved }){
  const [v, setV] = useState({ max_vehicles_per_day: "", rate_eur_per_load: "", rate_eur_per_t: "", rate_eur_per_km: "", km_basis: "round_trip" });
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  useEffect(() => {
    setV({ max_vehicles_per_day: route.max_vehicles_per_day ?? "", rate_eur_per_load: route.rate_eur_per_load ?? "",
           rate_eur_per_t: route.rate_eur_per_t ?? "", rate_eur_per_km: route.rate_eur_per_km == null ? "" : +(+distRate(route.rate_eur_per_km)).toFixed(4),
           km_basis: route.km_basis || "round_trip" });
    setMsg("");
  }, [route.id]);
  const save = async () => {
    try { localStorage.setItem("modus_admin_token", token); } catch(e){}
    const qs = token ? `?token=${encodeURIComponent(token)}` : "";
    setBusy(true);
    try {
      const body = {};
      ["max_vehicles_per_day", "rate_eur_per_load", "rate_eur_per_t", "rate_eur_per_km"].forEach(k => {
        body[k] = (v[k] === "" || v[k] == null) ? null : (k === "rate_eur_per_km" ? +(+distInRate(+v[k])).toFixed(6) : +v[k]);
      });
      body.km_basis = v.km_basis;
      const res = await fetch(`${API}/admin/routes/${encodeURIComponent(route.id)}/planning${qs}`, {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if(!res.ok){ const t = await res.text(); throw new Error(`${res.status} ${t.slice(0, 140)}`); }
      await res.json();
      setMsg("Saved planning figures.");
      if(onSaved) await onSaved();
    } catch(e){ setMsg("Couldn't save: " + e.message); }
    setBusy(false);
  };
  const inp = "mt-1 w-full border border-slate-300 rounded-lg px-2.5 py-2 text-sm outline-none focus:ring-2 focus:ring-[color:var(--blue)]";
  // `rate`: a per-distance rate, shown and typed in the tenant's unit (stored per km —
  // the conversion happens in save() and in the initial state below)
  const F = ({ k, label, step, rate }) => (
    <label className="block">
      <span className="block text-sm font-medium text-slate-700 mb-1">{label}</span>
      <input className={inp} inputMode="decimal" placeholder="—" value={v[k]}
        onChange={e => setV(x => ({ ...x, [k]: e.target.value }))} />
    </label>
  );
  return (
    <div className="border-t border-slate-200 pt-3 mt-3 space-y-2">
      <div className="text-sm font-semibold text-slate-700">Planning · Look-ahead</div>
      <p className="text-[11px] text-slate-400">Typed, never seeded. Rates are SUMMED where filled (a base per load plus a per-{DU()} rate is a common haulage quote). Blank = no rate on this route: the Look-ahead then prices it at the target rate from Config (marked "target") — or prints "rate not set" when none is set either. A typed rate here is used ALONE; it is never mixed with the target.</p>
      <div className="grid grid-cols-2 gap-2">
        <F k="max_vehicles_per_day" label="Max vehicles / day (flag only)" />
        <label className="block">
          <span className="block text-sm font-medium text-slate-700 mb-1">distance basis · {CUR()}/{DU()} and {TKM()}</span>
          <select className={inp} value={v.km_basis} onChange={e => setV(x => ({ ...x, km_basis: e.target.value }))}>
            <option value="round_trip">round trip (loaded + return)</option>
            <option value="loaded">loaded leg only</option>
          </select>
        </label>
        <F k="rate_eur_per_load" label={`${CUR()} per load`} />
        <F k="rate_eur_per_t" label={`${CUR()} per tonne`} />
        <F k="rate_eur_per_km" label={`${CUR()} per ${DU()}`} rate />
      </div>
      <button onClick={save} disabled={busy}
        className="w-full py-2 rounded-lg text-sm font-semibold border disabled:opacity-50"
        style={{ borderColor: "var(--navy)", color: "var(--navy)", background: "var(--surface)" }}>{busy ? "Saving…" : "Save planning figures"}</button>
      {msg && <p className="text-xs text-slate-500">{msg}</p>}
    </div>
  );
}

// The two typed words on ONE route (why this route, the permitted diversions) with their own save, and the download.
// Words, never figures: nothing here touches the route on the map. At most SHEET_TEXT_MAX characters each — what fits
// on the one A4 page (the server refuses more, in words).
const SHEET_TEXT_MAX = 400;
async function downloadRouteSheet(routeId){
  const r = await fetch(`${API}/routes/${encodeURIComponent(routeId)}/route-sheet.pdf`);
  if(!r.ok){
    const txt = await r.text();
    let d = "";
    try { const j = JSON.parse(txt); d = (j && typeof j.detail === "string") ? j.detail : ""; } catch(e){ d = ""; }
    throw new Error(d || `error ${r.status}`);
  }
  const blob = await r.blob();
  const cd = r.headers.get("content-disposition") || "";
  const fm = cd.match(/filename="([^"]+)"/);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fm ? fm[1] : `route-sheet-${routeId}.pdf`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

    setBusy(false);

function maaametStyle(){

// Week 1: two new types.
//   Railhead  where material arrives by rail and leaves by road. An ORIGIN, like a
//              quarry or a port — map/index.html's filterByNode() and
//              network._role_for() carry the matching rule and all three must agree.
//   Stockpile  somewhere material is held. A DESTINATION by default.
const LOC_TYPES = ["Quarry", "Port", "Compound", "Site", "Railhead", "Stockpile", "Other"];
// 2026-09-02: 'Rail head' -> 'Railhead'. The backend rewrites old rows on boot and
// canonicalises on read, but this client can meet a row the backend has not touched yet
// (a stale /api/locations/geojson in the tab). Read either spelling; write only the new.
const locTypeOf = (t) => (t === "Rail head" ? "Railhead" : t);
// Types that can hold stock — the capacity fields appear for these. Mirrors
// stockpiles.STORAGE_TYPES on the backend.
const STORAGE_TYPES = ["Stockpile", "Site", "Compound", "Railhead"];
const ROLE_OPTIONS = [["origin", "Origin (supplier)"], ["destination", "Destination (site)"], ["both", "Both"]];
const ROLE_LABEL = { origin: "Origin", destination: "Destination", both: "Both" };
const asArray = (v) => Array.isArray(v) ? v : (() => { try { return JSON.parse(v || "[]"); } catch(e){ return []; } })();

// "Artic Tipper (44t)" -> "Tipper (44t)". Full name stays in the chip's tooltip.
// ---- 2026-09-02: one vehicle, several labels -----------------------------------
// VEH.lang is the label language; VEH.labels and VEH.langs come off /api/meta. vehLabel()
// changes ONLY what is shown — the string a forecast line stores, the payload it
// converts on and the emissions factor are all keyed on the canonical id, the vehicle's
// name in factors.json. A missing label falls back to that id, never to an invented name.
// 11 Oct 2026 (the EU type-approval vehicles removed from the seed): English is the
// default (it was "eu"), and VEH.langs is what the server OFFERS — English, plus any other
// label language a vehicle the tenant is offered still carries. The seed's vehicles carry
// English alone. VEH_LANGS still names the three slots, because a document saved before
// then carries labels.eu on those four entries and keeps that option for a tenant that is
// offered them; a stored "eu"/"ee" that is not offered falls back to English (App).
const VEH = { lang: "en", langs: ["en"], labels: {}, fallbacks: {} };
try { const l = localStorage.getItem("modus_veh_lang"); if(["en","eu","ee"].includes(l)) VEH.lang = l; } catch(e){}
const VEH_LANGS = [["en", "English"], ["eu", "European"], ["ee", "Estonian"]];
// 11 Oct 2026: a language is shown only when the server offers it (a vehicle carries it), AND
// G2: the local-language option is offered only where it is local — a tenant in Estonia.
// H1: the EU-string option is never offered to a GB tenant.
const vehLangShown = (k) => k === "en" || ((VEH.langs || []).includes(k) && (
     (k === "ee" && String(TENANT.country || "").toUpperCase() === "EE")
  || (k === "eu" && String(TENANT.country || "").toUpperCase() !== "GB")));
// 11 Oct 2026 (review): the Config page's Estonian label COLUMN follows the country alone. The header's
// buttons need a vehicle to carry the language (vehLangShown), but the column is where an Estonian
// organisation types its FIRST Estonian name, and gating it on what is offered left no way in but the
// raw JSON. The column only edits labels.ee; nothing a forecast stores changes.
const vehLangEditable = (k) => k === "en" || (k === "ee" && String(TENANT.country || "").toUpperCase() === "EE");
// 14 Oct 2026 (civils materials): a key used as a name passes the word rule (UK copy says lorry, never
// truck): a mixer's stored key (its trade name, never renamed) reads "Concrete mixer 8 m³ (32t)".
// The server applies the same rule (conversions.vehicle_word_rule); /api/meta's labels already carry it.
const vehWord = (v) => String(v == null ? "" : v).replace(/^\s*truck\s+mixer\b/i, "Concrete mixer");
const vehLabel = (v, lang) => { const l = (VEH.labels[v] || {})[lang || VEH.lang]; return (l && l !== v) ? l : vehWord(v || ""); };
const vehIsFallback = (v, lang) => ((VEH.fallbacks[v] || []).includes(lang || VEH.lang));
// short form for tables: the label, minus the leading 'Artic'/'Rigid' of the trade names
const vehShort = (v) => vehLabel(v).replace(/^(Artic|Rigid)\s+/, "");

// Which vehicle profiles a route is baked for, and how that went.
// A route is baked in two directions now, so a chip is only "fully baked" (solid) when
// both the laden run out and the empty run back are cached. Outbound-only shows hollow —
// enough to draw the map, not enough for a cycle time.
function VehChips({ profiles }){
  const keys = Object.keys(profiles || {}).sort();
  if(!keys.length) return <span className="text-xs text-slate-500">not routed</span>;
  return (
    <span className="flex flex-wrap gap-1">
      {keys.map(k => {
        const p = profiles[k] || {};
        const both = p.baked && p.return_baked;
        const [bg, fg] = both    ? ["rgba(3,158,134,.12)", "var(--ok-text)"]
                       : p.baked ? ["rgba(255,193,1,.16)", "#8a6d00"]
                       : p.error ? ["rgba(191,46,85,.12)", "var(--bad-text)"]
                                 : ["#f1f5f9", "#475569"];
        const alts = p.alt_count > 1 ? ` · ${p.alt_count} options` : "";
        const tip = p.error ? `${vehLabel(k)} — ${p.error}`
                  : !p.baked ? `${vehLabel(k)} · not routed`
                  : `${vehLabel(k)} · ${fmtDist(p.distance_km, 1)} ${DU()} out` +
                    (p.return_baked ? ", return routed" : ", return NOT routed") + alts;
        return (
          <span key={k} title={tip}
            className="text-xs font-semibold px-1.5 py-0.5 rounded-full whitespace-nowrap"
            style={{ background: bg, color: fg }}>
            {vehShort(k)}{p.baked && !p.return_baked ? " ↦" : ""}
          </span>
        );
      })}
    </span>
  );
}

// Step C — haul-cycle figures for one route, fetched on demand when its row is opened.
// Everything here is derived from cached geometry plus factors.json, so opening a row
// costs one cheap request and never touches HERE.
// Phase 4 — haul roads on ONE route, edited on the route itself rather than in a separate
// drawing tool. That was the explicit requirement: a haul road belongs to the routes that
// use it, and attaching it here is what makes it do anything at all.
//
// Every write clears the route's baked legs and drives the same /api/admin/bake-routes
// loop the zone writes use. It is more HERE calls than it looks: a spliced haul road costs
// two calls per leg, not one, and the count is shown before it is spent.
function HaulRoads({ routeId, haulRoads, token, onChanged }){
  const [plan, setPlan] = useState(null);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const [pick, setPick] = useState("");

  const load = () => fetch(`${API}/routes/${encodeURIComponent(routeId)}/haul-roads`)
    .then(r => r.json()).then(j => { setPlan(j); return j; });

  useEffect(() => { let live = true; load().catch(() => { if(live) setPlan(null); });
                    return () => { live = false; }; }, [routeId]);

  const attached = (plan && plan.links || []).filter(l => l.route_id === routeId);
  const byId = {};
  (haulRoads || []).forEach(z => { byId[z.id] = z; });
  const available = (haulRoads || []).filter(z => !attached.some(l => l.zone_id === z.id));

  const qs = () => (token ? `?token=${encodeURIComponent(token)}` : "");

  const run = async (fn, label) => {
    setBusy(true); setMsg(label);
    try {
      const j = await fn();
      await load();
      const inv = j.invalidated || {};
      let m = label.replace(/…$/, " — done.");
      if(inv.leg_count){
        m += ` ${inv.leg_count} routed leg(s) cleared, ${inv.here_calls} HERE call(s) to re-route.`;
        setMsg(m);
        if(onChanged) m += await onChanged(inv);
      }
      setMsg(m);
    } catch(e){ setMsg("Failed: " + e.message); }
    setBusy(false);
  };

  const post = async (url, opts) => {
    const res = await fetch(url, opts);
    if(!res.ok){ const t = await res.text(); throw new Error(`${res.status} ${t.slice(0, 160)}`); }
    return res.json();
  };

  const attach = () => {
    if(!pick) return;
    const z = byId[pick];
    run(() => post(`${API}/admin/routes/${encodeURIComponent(routeId)}/haul-roads${qs()}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ zone_id: pick, seq: null }),
    }), `Attaching ${(z && z.name) || pick}…`).then(() => setPick(""));
  };

  const detach = (zid) => {
    const z = byId[zid];
    if(!confirm(`Take ${(z && z.name) || zid} off ${routeId}?\n\nEvery routed leg of this route is cleared and re-routed.`)) return;
    run(() => post(`${API}/admin/routes/${encodeURIComponent(routeId)}/haul-roads/${encodeURIComponent(zid)}${qs()}`,
                   { method: "DELETE" }), `Detaching ${(z && z.name) || zid}…`);
  };

  const move = (i, d) => {
    const ids = attached.map(l => l.zone_id);
    const j = i + d;
    if(j < 0 || j >= ids.length) return;
    [ids[i], ids[j]] = [ids[j], ids[i]];
    run(() => post(`${API}/admin/routes/${encodeURIComponent(routeId)}/haul-roads/order${qs()}`, {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ zone_ids: ids }),
    }), "Reordering…");
  };

  const loadedPlan = (plan && plan.plan && plan.plan.loaded) || [];
  const noSpeed = loadedPlan.filter(s => !s.speed_kph);

  return (
    <div className="rounded-lg border border-slate-200 bg-white p-2.5 mb-3">
      <div className="flex items-center justify-between gap-2 mb-1.5">
        <span className="text-[11px] uppercase tracking-wide" style={{ color: ZONE_HAUL }}>
          Temporary haul roads on this route
        </span>
        {plan && plan.here_calls_per_bake != null && !!attached.length && (
          <span className="text-[10px] text-slate-400">
            routing this route again costs {plan.here_calls_per_bake} HERE call(s)
          </span>
        )}
      </div>

      {!attached.length && (
        <p className="text-[11px] text-slate-500">
          None. This route is routed by HERE end to end.
        </p>
      )}

      {!!attached.length && (
        <table className="text-[11px] w-full mb-2">
          <thead className="text-slate-400">
            <tr>
              <th className="px-1 py-0.5 text-left font-semibold">Order</th>
              <th className="px-1 py-0.5 text-left font-semibold">Road</th>
              <th className="px-1 py-0.5 text-right font-semibold">Drawn {DU()}</th>
              <th className="px-1 py-0.5 text-right font-semibold">Speed</th>
              <th className="px-1 py-0.5 text-right font-semibold">Adds</th>
              <th className="px-1 py-0.5 text-left font-semibold">Mode</th>
              <th className="px-1 py-0.5"></th>
            </tr>
          </thead>
          <tbody>
            {attached.map((l, i) => {
              const z = byId[l.zone_id] || {};
              const step = loadedPlan.find(s => s.zone_id === l.zone_id);
              const inPlan = !!step;
              return (
                <tr key={l.zone_id} className="border-t border-slate-100">
                  <td className="px-1 py-1 text-slate-400">
                    <button onClick={() => move(i, -1)} disabled={busy || i === 0}
                      title="Earlier on the outbound leg"
                      className="px-1 disabled:opacity-25 hover:text-slate-700">▲</button>
                    <button onClick={() => move(i, 1)} disabled={busy || i === attached.length - 1}
                      title="Later on the outbound leg"
                      className="px-1 disabled:opacity-25 hover:text-slate-700">▼</button>
                  </td>
                  <td className="px-1 py-1">
                    <span className="font-medium text-slate-700">{z.name || l.zone_id}</span>
                    <span className="text-slate-400"> {l.zone_id}</span>
                    {!inPlan && (
                      <span className="block text-[10px]" style={{ color: "var(--red)" }}>
                        not in force today — inactive, outside its dates, or not open to traffic,
                        so no route is threaded through it
                      </span>
                    )}
                  </td>
                  <td className="px-1 py-1 text-right tabular-nums">{z.length_km != null ? fmtDist(z.length_km, 2) : "—"}</td>
                  <td className="px-1 py-1 text-right tabular-nums">
                    {z.speed_kph ? `${(+speed(z.speed_kph)).toFixed(0)} ${SPD()}`
                                 : <span style={{ color: "var(--red)" }}>not set</span>}
                  </td>
                  <td className="px-1 py-1 text-right tabular-nums">
                    {step && step.assigned_duration_hr
                      ? `${Math.round(step.assigned_duration_hr * 60)} min`
                      : <span className="text-slate-500">—</span>}
                  </td>
                  <td className="px-1 py-1 text-slate-500">
                    {(z.haul_mode || "splice")}
                    {!z.haul_mode && <span className="text-slate-500"> (default)</span>}
                  </td>
                  <td className="px-1 py-1 text-right">
                    <button onClick={() => detach(l.zone_id)} disabled={busy}
                      className="text-[10px] font-semibold text-[color:var(--red)] hover:underline disabled:opacity-40">Detach</button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      )}

      <div className="flex items-center gap-2">
        <select value={pick} onChange={e => setPick(e.target.value)} disabled={busy || !available.length}
          className="border border-slate-200 rounded-lg px-2 py-1 text-[11px] bg-white disabled:opacity-40">
          <option value="">{available.length ? "Add a haul road…" : "No other haul roads drawn"}</option>
          {available.map(z => (
            <option key={z.id} value={z.id}>
              {z.name} · {z.length_km != null ? `${fmtDist(z.length_km, 1)} ${DU()}` : "—"}{z.speed_kph ? ` @ ${(+speed(z.speed_kph)).toFixed(0)} ${SPD()}` : " (no speed)"}
            </option>
          ))}
        </select>
        <button onClick={attach} disabled={busy || !pick}
          className="text-[11px] font-semibold px-2 py-1 rounded-md text-white disabled:opacity-40"
          style={{ background: ZONE_HAUL }}>Attach</button>
      </div>

      {!!attached.length && (
        <p className="text-[10px] text-slate-400 mt-1.5">
          Order is the outbound direction; the return leg meets them in reverse and enters each
          road from the other end. Which end is entry is worked out for each leg, so
          the order you drew a road in does not matter.
        </p>
      )}
      {!!noSpeed.length && (
        <p className="text-[10px] mt-1" style={{ color: "var(--red)" }}>
          {noSpeed.length} of these has no assigned speed, so its stretch adds distance but no time
          to the cycle. Set one on the Zones tab.
        </p>
      )}
      {!!attached.length && (
        <p className="text-[10px] text-amber-700 mt-1">
          A leg routed through a haul road comes back as a <strong>single option</strong> — there
          are no alternatives to promote on this route while a haul road is attached.
        </p>
      )}
      {msg && <p className="text-[11px] text-slate-600 mt-1.5">{msg}</p>}
    </div>
  );
}

// Phase 2.5a — road restrictions on one route (Tark Tee for EE; H1: National Highways
// planned closures for GB — the provider, its words and its match distance come from
// the API, so nothing here names either authority).
//
// Advisory, never a block: the router is not given this data. HERE has its own
// restriction model and returns its own notices, and two systems arguing about the same
// road is worse than one. This says "your route passes a weak bridge"; a human reads it.
//
// ⚠️ It deliberately makes NO tonnage judgement about a weak bridge. nominal_load comes
// back as a class like "N-13/NG-60", not tonnes, and the mapping has never been
// established here. The class and the vehicle's laden weight are shown side by side and
// the reader draws the conclusion — see backend/restrictions.check_route().
function RouteRestrictions({ routeId }){
  const [data, setData] = useState(null);
  const [err, setErr] = useState("");
  const [open, setOpen] = useState(false);

  useEffect(() => {
    let live = true;
    setData(null); setErr("");
    fetch(`${API}/routes/${encodeURIComponent(routeId)}/restrictions`)
      .then(r => r.json())
      .then(j => { if(!live) return; j.error ? setErr(j.error) : setData(j); })
      .catch(e => { if(live) setErr(e.message); });
    return () => { live = false; };
  }, [routeId]);

  const prov = (TENANT.restrictions && TENANT.restrictions.short) || "the road authority";
  if(!TENANT.restrictions) return null;          // no provider for this tenant's country
  if(err) return (
    <p className="text-[11px] text-slate-400 mb-3">
      Road restrictions unavailable — {prov} could not be reached ({err}).
    </p>
  );
  if(!data) return <p className="text-[11px] text-slate-400 mb-3">Checking road restrictions…</p>;
  if(!data.baked) return null;
  const dated = !!(TENANT.restrictions && TENANT.restrictions.dated);

  const hits = data.hits || [];
  const breaches = hits.filter(h => h.severity === "breach");
  const warns = hits.filter(h => h.severity === "warn");
  const fetchErr = data.fetch_errors && Object.keys(data.fetch_errors).length;
  const incomplete = fetchErr
    ? " ⚠️ Some layers could not be fetched, so this is not a complete check." : "";
  const expired = data.expired_or_future_excluded
    ? ` ${data.expired_or_future_excluded} record(s) outside their date window were excluded.` : "";

  if(!hits.length) return (
    <p className="text-[11px] text-slate-400 mb-3">
      {dated ? `No ${prov} planned closures (current or future) within ${data.match_m} m of this route.`
             : `No ${prov} restrictions in force within ${data.match_m} m of this route.`}{expired}{incomplete}
    </p>
  );

  // a breach is a statement of fact — two numbers in the same unit — and outranks
  // everything else in how loudly this reads
  const tone = breaches.length ? { border: "border-red-300 bg-red-50/70", head: "#B91C1C" }
             : warns.length    ? { border: "border-amber-300 bg-amber-50/60", head: "#92400E" }
                               : { border: "border-slate-200 bg-white", head: "var(--navy)" };

  return (
    <div className={"rounded-lg border p-2.5 mb-3 " + tone.border}>
      <button onClick={() => setOpen(o => !o)}
        className="w-full flex items-center justify-between gap-2 text-left">
        <span className="text-[11px] uppercase tracking-wide" style={{ color: tone.head }}>
          {dated ? "Planned closures on this route" : "Road restrictions on this route"}
          {breaches.length ? ` · ${breaches.length} EXCEEDED` : ""}
          {warns.length ? ` · ${warns.length} to check` : ""}
          {!breaches.length && !warns.length ? ` · ${hits.length} note(s)` : ""}
        </span>
        <span className="text-[10px] text-slate-400">{open ? "hide" : "show"}</span>
      </button>

      {open && (
        <table className="text-[11px] w-full mt-2">
          <thead className="text-slate-400">
            <tr>
              <th className="px-1 py-0.5 text-left font-semibold">Restriction</th>
              <th className="px-1 py-0.5 text-right font-semibold">Limit</th>
              <th className="px-1 py-0.5 text-right font-semibold">Vehicle</th>
              <th className="px-1 py-0.5 text-left font-semibold">Verdict</th>
              <th className="px-1 py-0.5 text-right font-semibold">From route</th>
              <th className="px-1 py-0.5 text-left font-semibold">Leg</th>
            </tr>
          </thead>
          <tbody>
            {hits.map((h, i) => (
              <tr key={i} className="border-t border-slate-100 align-top">
                <td className="px-1 py-1">
                  <span className="font-medium" style={{ color: h.colour || "#334155" }}>
                    {h.severity === "breach" ? "■ " : h.severity === "warn" ? "▲ " : "· "}
                    {h.headline || h.what}
                  </span>
                  <span className="block text-[10px] text-slate-400">
                    {h.road_name || (h.road_nr ? `road ${h.road_nr}` : "")}
                    {h.from || h.to ? ` · ${h.from || "open"} → ${h.to || "open"}` : ""}
                  </span>
                  {h.extra_info && (
                    <span className="block text-[10px] text-slate-500 mt-0.5">{h.extra_info}</span>
                  )}
                  {h.description && !(h.headline || "").includes(h.description) && (
                    <span className="block text-[10px] text-slate-500 mt-0.5">{h.description}{h.event_number ? ` [${h.event_number}]` : ""}</span>
                  )}
                </td>
                <td className="px-1 py-1 text-right tabular-nums whitespace-nowrap">
                  {h.limit != null
                    ? <b>{h.limit}{h.unit && h.unit !== "load class" ? ` ${h.unit}` : ""}</b>
                    : <span className="text-slate-500">—</span>}
                </td>
                <td className="px-1 py-1 text-right tabular-nums whitespace-nowrap">
                  {h.vehicle_value != null
                    ? `${h.vehicle_value} ${h.unit && h.unit !== "load class" ? h.unit : "t"}`
                    : <span className="text-slate-500">—</span>}
                </td>
                <td className="px-1 py-1 whitespace-nowrap">
                  {h.verdict === "exceeds"
                    ? <span className="font-semibold" style={{ color: "#B91C1C" }}>
                        EXCEEDS by {Math.abs(h.margin)}{h.unit ? ` ${h.unit}` : ""}
                      </span>
                    : h.verdict === "within"
                    ? <span style={{ color: "var(--ok-text)" }}>within · {h.margin}{h.unit ? ` ${h.unit}` : ""} spare</span>
                    : <span className="text-slate-400" title={h.note || ""}>not comparable</span>}
                  {h.verdict === "unknown" && h.note && (
                    <span className="block text-[10px] text-slate-400 whitespace-normal">{h.note}</span>
                  )}
                </td>
                <td className="px-1 py-1 text-right tabular-nums">{h.distance_m} m</td>
                <td className="px-1 py-1 text-slate-500 whitespace-nowrap">
                  {h.leg === "loaded" ? "laden" : "return"} · {vehShort(h.vehicle_profile)}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}

      <p className="text-[10px] text-slate-400 mt-1.5">
        Advisory only. The router is never given this data, and a match means the
        {dated ? "closure" : "restriction"} sits within {data.match_m} m of the routed line — not that it is
        necessarily on your carriageway.{dated
          ? " A planned closure counts on the Look-ahead only in the weeks its dates overlap."
          : " Mass, height and width are compared for real; a weak bridge's load class is not a tonnage and is left for a human."}
        {" "}Source: {data.attribution || (TENANT.restrictions && TENANT.restrictions.attribution) || prov}.{expired}{incomplete}
      </p>
    </div>
  );
}

// Phase 5a — which gate this route uses at each end.
//
// Null means "no explicit choice", which resolves to the location's default gate for
// the direction being travelled, then to the legacy pair, then to the marker. That
// chain is why a route that has never been touched here keeps routing exactly where it
// did before 5a. Changing a selection invalidates the cached geometry, so the re-bake
// is offered rather than performed — the same contract as a zone or haul-road write.
function RouteGates({ routeId, originId, destId, token, blockers, onChanged }){
  const [gates, setGates] = useState(null);
  const [sel, setSel] = useState({ origin_gate_id: "", dest_gate_id: "" });
  const [msg, setMsg] = useState("");

  useEffect(() => {
    let live = true;
    Promise.all([
      fetch(`${API}/gates`).then(r => r.json()),
      fetch(`${API}/routes/status`).then(r => r.json()),
    ]).then(([g, st]) => {
      if(!live) return;
      setGates(g.gates || []);
      const row = (st || []).find(x => x.id === routeId) || {};
      setSel({ origin_gate_id: row.origin_gate_id || "", dest_gate_id: row.dest_gate_id || "" });
    }).catch(e => { if(live){ setGates([]); setMsg(e.message); } });
    return () => { live = false; };
  }, [routeId]);

  const write = async (key, value) => {
    setSel(s => ({ ...s, [key]: value }));
    const qs = token ? `?token=${encodeURIComponent(token)}` : "";
    setMsg("Saving…");
    try {
      const res = await fetch(`${API}/admin/routes/${encodeURIComponent(routeId)}/gates${qs}`,
        { method: "PUT", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ [key]: value || null }) });
      const j = await res.json();
      if(!res.ok || j.error) throw new Error(j.error || res.status);
      setMsg(j.rebake_needed
        ? "Saved — this route still goes to the old gate until it is routed again. Re-route it."
        : "Saved.");
      if(j.rebake_needed && onChanged) onChanged();
    } catch(e){ setMsg("Couldn't save: " + e.message); }
  };

  if(gates === null) return null;
  const forLoc = (lid) => (gates || []).filter(g => g.location_id === lid);
  if(!forLoc(originId).length && !forLoc(destId).length && !(blockers || []).length) return null;

  const pick = (label, lid, key) => (
    <label className="block">
      <span className="block text-sm font-medium text-slate-700 mb-1">{label}</span>
      <select value={sel[key] || ""} onChange={e => write(key, e.target.value)}
        className="mt-1 w-full border border-slate-300 rounded-lg px-2 py-1.5 text-xs bg-white">
        <option value="">Default for this site</option>
        {forLoc(lid).map(g => (
          <option key={g.id} value={g.id}>
            {g.name} · {g.direction === "access" ? "in only"
              : g.direction === "egress" ? "out only" : "in + out"}
            {g.active ? "" : " · DEACTIVATED"}
          </option>
        ))}
      </select>
    </label>
  );

  return (
    <div className="mb-3 rounded-lg border border-slate-200 bg-white p-2.5">
      <div className="text-sm font-medium text-slate-700 mb-1.5">Gates</div>
      {!!(blockers || []).length && (
        <p className="text-xs mb-2 font-semibold" style={{ color: "var(--red)" }}>
          This route cannot be routed: {(blockers || []).join("; ")}.
        </p>
      )}
      <div className="grid grid-cols-2 gap-2">
        {pick("Origin gate", originId, "origin_gate_id")}
        {pick("Destination gate", destId, "dest_gate_id")}
      </div>
      <p className="text-[11px] text-slate-400 mt-1.5">
        A one-way gate is used only for the direction it serves; the other direction falls
        back to the site&rsquo;s default. Changing a gate moves where HERE routes to, so the
        stored route has to be re-routed before the distances mean anything.
      </p>
      {msg && <p className="text-[11px] text-slate-500 mt-1">{msg}</p>}
    </div>
  );
}


function RouteAnalysis({ routeId, colSpan, active, onFocus, onPromote, promoting, leg,
                        haulRoads, token, onHaulChanged, originId, destId, gateBlockers }){
  const [data, setData] = useState(null);
  const [err, setErr] = useState("");

  useEffect(() => {
    let live = true;
    setData(null); setErr("");
    fetch(`${API}/routes/${encodeURIComponent(routeId)}/analysis`)
      .then(r => r.json())
      .then(j => { if(!live) return; j.error ? setErr(j.error) : setData(j); })
      .catch(e => { if(live) setErr(e.message); });
    return () => { live = false; };
  }, [routeId]);

  const cell = "px-2 py-1 text-right tabular-nums whitespace-nowrap";
  const head = "px-2 py-1 text-right font-semibold whitespace-nowrap";

  return (
    <tr className="bg-slate-50/70">
      <td colSpan={colSpan} className="px-4 py-3">
        <RouteGates routeId={routeId} originId={originId} destId={destId} token={token}
          blockers={gateBlockers} onChanged={onHaulChanged} />
        <HaulRoads routeId={routeId} haulRoads={haulRoads} token={token} onChanged={onHaulChanged} />
        <RouteRestrictions routeId={routeId} />
        {err && <p className="text-xs" style={{ color: "var(--red)" }}>Couldn't load analysis: {err}</p>}
        {!data && !err && <p className="text-xs text-slate-400">Loading analysis…</p>}
        {data && !data.rows.length && (
          <p className="text-xs text-slate-500">
            Nothing to analyse yet — this route has no stored route. Use the
            <span className="font-semibold"> Route</span> action on this row to route it.
          </p>
        )}
        {data && !!data.rows.length && (
          <div className="overflow-x-auto">
            <table className="text-xs w-full">
              <thead className="text-slate-400">
                <tr>
                  <th className="px-2 py-1 text-left font-semibold">Vehicle</th>
                  <th className="px-2 py-1 text-left font-semibold">Option</th>
                  <th className={head}>Out {DU()}</th>
                  <th className={head}>Back {DU()}</th>
                  <th className={head}>Turn</th>
                  <th className={head}>Cycle</th>
                  <th className={head}>Trips/day</th>
                  <th className={head}>t/day</th>
                  <th className={head}>t/month</th>
                  <th className={head}>CO₂ kg/trip</th>
                  <th className="px-2 py-1"></th>
                </tr>
              </thead>
              <tbody>
                {data.rows.map((r, i) => {
                  const isActive = active && active.profile === r.profile
                    && active.alt_index === r.alt_index && active.leg === leg;
                  return (
                  <tr key={`${r.profile}-${r.alt_index}`}
                    onClick={() => onFocus && onFocus(r.profile, r.alt_index)}
                    title="Show this option on the map"
                    className={"border-t border-slate-200/70 cursor-pointer "

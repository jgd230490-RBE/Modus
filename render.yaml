# Render Blueprint for Wayscope. The service names modus-web / modus-db are kept on
# purpose: renaming a Render service changes its URL and breaks nothing useful.
#
# This creates a NEW web service (modus-web) and a NEW database (modus-db). It does not
# touch any service or database that already exists in the Render account — including
# the ones an earlier blueprint created under other names. Retire those by hand, after
# exporting anything you need from them.
#
# ⚠️ THE PLAN VALUES ARE MONEY. `standard` and `basic-256mb` are paid plans. Change them
#    to what you intend to buy BEFORE the first sync, and never move a database to a
#    smaller or free plan by editing this file — on Render a free database expires.
# 31 Oct 2026: the web service moved from `starter` (0.5 CPU, 512 MB) to `standard`
#    (Render's compute plan 1c-2g: 1 CPU, 2 GB). Changed on Render first; this file
#    matches it so a blueprint sync cannot move it back. A pilot's own web service is
#    the same plan.
services:
  - type: web
    name: modus-web
    runtime: python
    plan: standard
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: modus-db
          property: connectionString
      # Secrets: set in the Render dashboard, NOT here — this file is in the repository.
      # Listed with sync: false so a blueprint sync never wipes them. env.example
      # explains each one.
      # The DEMO's blueprint. An organisation's own deployment (a pilot) is NOT made from this file: it is made by
      # hand in Frankfurt from the steps backend/tools/new_organisation.py writes, so no client's name is ever in
      # this public repository, and it follows the pilot-release branch, not main.
      - key: ADMIN_TOKEN            # being retired: admin LOGINS do everything (27 Oct 2026); with it unset every
        sync: false                 # admin call is refused without an admin login (12 Oct 2026, C11)
      # G3 (14 Oct 2026): people sign in with their own email and password (Config → Users).
      # The eight shared codes below keep working only while they are set; delete them on
      # Render to end them (decided: Sat 31 Oct 2026). Nothing else changes when they go.
      - key: PLANNER_CODE           # shared code — retire by deleting (G3)
        sync: false
      - key: ADMIN_CODE
        sync: false
      - key: IPT1_CODE              # team access codes; the names stay IPTn by decision
        sync: false
      - key: IPT2_CODE
        sync: false
      - key: IPT3_CODE
        sync: false
      - key: IPT4_CODE
        sync: false
      - key: IPT5_CODE
        sync: false
      - key: IPT6_CODE
        sync: false
      - key: MAP_PASSWORD           # the shared password for outside map viewers
        sync: false
      - key: GATE_SECRET            # set it (the map cookie's key; without it the key leans on ADMIN_TOKEN)
        sync: false
      - key: HERE_API_KEY           # needed to bake routes
        sync: false
      - key: MAPBOX_TOKEN           # the Mapbox PUBLIC token (pk.…) for the app and PDF map
        sync: false
      - key: OS_MAPS_KEY            # 28 Oct 2026 (8b): optional — an OS Data Hub key (OS Vector Tile API) for the public map's OS map; unset = no OS line
        sync: false
      - key: GOOGLE_MAPS_API_KEY    # optional — Street View
        sync: false
      - key: GOOGLE_MAPS_URL_SIGNING_SECRET   # optional, recommended with the key above
        sync: false
      # H9 (8 Oct 2026) — demo requests from the landing page. With all four set the app
      # emails the access details through Google Workspace SMTP; with any missing it shows
      # them on screen after the form instead. env.example explains each one.
      - key: SMTP_USER              # the Google account that sends, e.g. JDavis@wayscope.co.uk
        sync: false
      - key: SMTP_PASSWORD          # that account's 16-character Google APP password
        sync: false
      - key: DEMO_FROM              # e.g. "Wayscope <JDavis@wayscope.co.uk>"
        sync: false
      - key: DEMO_NOTIFY            # where the one-line notification of each request goes
        sync: false
      - key: LANDING_URL            # optional — defaults to https://wayscope.co.uk
        sync: false
      - key: DEMO_TEAM_CODE_VAR     # optional — which team a lead's own login belongs to (IPT1_CODE → team 1); its value is never sent
        sync: false
      - key: APP_URL                # optional (G3) — the address in invite, reset and demo links; default https://app.wayscope.co.uk
        sync: false
      - key: DEMO_LEADS             # 27 Oct 2026: "1" on the DEMO only — the landing form makes a login; off everywhere else
        sync: false
      - key: FIRST_ADMIN_EMAIL      # 27 Oct 2026: a NEW deployment's first admin (invite at start-up, until any admin exists)
        sync: false
      - key: TENANT_ID              # optional — defaults to "default"
        sync: false

databases:
  - name: modus-db
    plan: basic-256mb

# 27 Oct 2026 (pilot readiness phase 2, F3 e): the app's Python libraries checked against the public advisory
# databases (PyPI / OSV) every Monday, on demand, and on any PR that changes backend/requirements.txt.
# A failure names the library, the advisory and the version that fixes it; GitHub emails the repository owner
# when a scheduled run fails. The suite (suite.yml) stays offline; this job is the one that needs the network.
name: dependency audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/requirements.txt"
      - ".github/workflows/dependency-audit.yml"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Audit backend/requirements.txt
        run: pip-audit -r backend/requirements.txt --desc on
